<style>

:root{--bg:#EEF2F7;--card:#fff;--card2:#F6F8FB;--ink:#0F2744;--muted:#566779;--line:#D5DEE8;--line2:#BCC9D7;--blue:#1E5BD8;--blue-ink:#fff;--blue-weak:#E7EFFC;--navy:#0F2744;--bar:#0F2744;--bar-line:#5E7894;

async function rpc(fn, args) {
  const res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  const body = await res.json().catch(() => null);
  if (!res.ok) {
    const msg = (body && body.message) || 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ';
    if (msg.startsWith('AUTH')) { logout(true); throw new Error('หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่'); }
    throw new Error(msg.replace(/^FORBIDDEN: /, ''));
  }
  return body;
}

  if (S.busy) return;

  try {

    if (after) after(r);
    S.toast = typeof okMsg === 'function' ? okMsg(r) : okMsg; S.toastErr = false;
    await load(); if (repScreen(S.screen) && S.rep.data) await fetchRep(); if (pdScreen(S.screen)) await loadPD(true);

  S.busy = false; render(); if (S.keepScroll) { S.keepScroll = false; return; } window.scrollTo({ top: 0, behavior: 'smooth' });
}

const fHead = (title, code) => `<div class="fh"><img src="${LOGO}" alt="Bluefalo"><div class="t">บริษัท บลูฟาโล่ จำกัด<br>${title}</div><div class="c">${code}</div></div>`;
const fSig = (role) => `<div class="sig">..........................................<br>(..........................................)<br><b>${role}</b></div>`;
const chunk = (list, n) => { const out = []; for (let i = 0; i < list.length; i += n) out.push(list.slice(i, i + n)); return out.length ? out : [[]]; };

// cols: [หัวคอลัมน์, กว้าง(mm), class]; rows: array ของ array html ที่ escape แล้ว
function fPages({ orient, title, code, n, h, cols, rows, top, sigs, numbered }) {
  const pages = chunk(rows, n);
  const cg = '<colgroup>' + cols.map((c) => `<col style="width:${c[1]}mm">`).join('') + '</colgroup>';
  const th = '<tr>' + cols.map((c) => `<th>${c[0]}</th>`).join('') + '</tr>';
  return pages.map((rs, pi) => {
    let body = '';
    for (let i = 0; i < n; i++) {
      const r = rs[i];
      const cells = numbered ? [r || numbered === 'all' ? String(pi * n + i + 1) : ''].concat(r || cols.slice(1).map(() => '')) : (r || cols.map(() => ''));
      body += `<tr style="height:${h}mm">` + cells.map((v, ci) => `<td class="${cols[ci][2] || ''}">${v}</td>`).join('') + '</tr>';
    }
    return `<div class="pg ${orient}">${fHead(title, code)}${top}
      <table>${cg}${th}${body}</table>${pages.length > 1 ? `<div class="sheet">แผ่นที่ ${pi + 1}/${pages.length}</div>` : ''}
      <div class="sigs ${sigs.length === 1 ? 'one' : ''}">${sigs.map(fSig).join('')}</div></div>`;
  });
}

// F-WI03-WHD01-02 / F-WI01-WHD01-02 STOCK CARD
// Stock card: รวมรายการเอกสารเดียวกัน (วัน + เอกสาร + ประเภท + ปลายทาง + Lot) เป็น 1 บรรทัด ตามแบบฟอร์ม
function cardRowsView(rows, lot) {
  const out = [];
  rows.forEach((m) => {
    const key = [m.day, m.doc, m.type, m.dest || '', m.lot].join('|'); const last = out[out.length - 1];
    if (last && last.key === key) { last.in += Number(m.in || 0); last.out += Number(m.out || 0); last.bal = Number(m.bal); last.ps.push(m.p); return; }
    out.push({ key, day: m.day, doc: m.doc, type: m.type, dest: m.dest, lot: m.lot, in: Number(m.in || 0), out: Number(m.out || 0), bal: Number(m.bal), ps: [m.p] });
  });
  return out.map((r) => ({ day: r.day, open: Math.round((r.bal - r.in + r.out) * 100) / 100, in: Math.round(r.in * 100) / 100, out: Math.round(r.out * 100) / 100, bal: r.bal,
    note: [r.doc, r.type === 'RECEIVE' && r.dest ? 'รับโอนจาก ' + r.dest : r.type === 'RETURN_IN' ? 'รับคืนจาก ' + r.dest : (MOVE_T[r.type] || r.type) + (r.dest && !['RETURN_VOID', 'RECEIVE_ADJ', 'RECEIVE_VOID'].includes(r.type) ? ' → ' + r.dest : ''), (lot ? '' : r.lot + ' ') + (r.ps.length > 1 ? r.ps.length + ' พาเลท' : pl(r.ps[0]))].filter(Boolean).join(' · ') }));
}
function printStockCard(d) {
  const [st, code, lot] = S.card.split('|'); const it = d.items[code] || {}; const px = st === 'PX'; const l = lot ? d.lots[lot] || {} : {};

  const w = px ? 'สารเสริม' : 'วัตถุดิบ';

  openForm('STOCK CARD ' + w + ' ' + (it.name || ''), 'portrait', fPages({ orient: 'portrait', title: 'STOCK CARD ' + w, code: px ? 'F-WI01-WHD01-02 Rev.00' : 'F-WI03-WHD01-02 Rev.00', n: 30, h: 6.5,

// "1-5, 8, G1" → ['1','2','3','4','5','8','G1']
function parsePs(txt) {
  const out = [];
  String(txt || '').toUpperCase().split(/[,\s]+/).filter(Boolean).forEach((t) => {
    const m = t.match(/^P?(\d+)-P?(\d+)$/);
    if (m) { const a = int(m[1]), b = Math.min(int(m[2]), a + 300); for (let i = a; i <= b; i++) out.push(String(i)); }
    else out.push(t.replace(/^P(?=\d)/, ''));
  });
  return out;
}

const cellText = (h) => new DOMParser().parseFromString('<body>' + String(h ?? '') + '</body>', 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
function dlCSV(name, head, rows) {
  const q = (v) => { const t = cellText(v); return /[",\n]/.test(t) || /^[=+\-@]/.test(t) ? '"' + (/^[=+\-@]/.test(t) ? "'" : '') + t.replace(/"/g, '""') + '"' : t; };
  const csv = '﻿' + [head].concat(rows).map((r) => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

async function cpDigit() {

// กระสอบสูงสุดต่อเที่ยว ใช้แนะนำจำนวนป้าย: คัน 280–301 · พ่วง 600 · รำข้าวพ่วง 580–720 · กากปาล์มพ่วง 400–550
function vehMax(it, unit) {

function retUnits() {
  const r = S.rt;
  if (r.pack === 'BULK') return [{ bags: 0 }];
  if (r.pack === 'BIGBAG') return Array.from({ length: Math.max(0, int(r.big)) }, () => ({ bags: 1 }));
  const n = int(r.n), per = int(r.per), last = int(r.last);
  const out = Array.from({ length: Math.max(0, n) }, () => ({ bags: per }));
  if (last > 0) out.push({ bags: last, scrap: true });
  return out;
}

// ยกเลิกหลายพาเลท (เปิดพาเลทเกิน / ไม่มีของจริง) · สิทธิ์ WH · ตรวจทีละพาเลทที่ server (rm_pallet_void_many) · ผู้ใช้ 5 พ.ย.
function voidManyBox(lot, units, sel) {
  const role = S.snap.me.role;

// รวมเลขพาเลทเป็นช่วง เช่น 14–20, 25
function psText(ps) {
  const n = ps.map((p) => int(p)).sort((a, b) => a - b); const out = [];
  for (let i = 0; i < n.length; i++) { let j = i; while (j + 1 < n.length && n[j + 1] === n[j] + 1) j++; out.push(j > i ? n[i] + '–' + n[j] : String(n[i])); i = j; }
  return 'P' + out.join(', P');
}

function leInit(lot) {
  const m = lot.meta || {};
  const it = S.snap.items.find((i) => i.code === lot.item);
  return { lot: lot.lot, item: lot.item, itemText: it ? it.code + ' · ' + it.name : lot.item, iq: '', store: lot.store, recv: lot.recv_day || '', supplier: lot.supplier || '', plate: lot.plate || '', province: lot.province || '', exp: lot.exp || '', mfg: lot.mfg || '', ticket: lot.ticket || '', delivery: lot.delivery || '',
    po: lot.po || '', ref: lot.ref || '', win: toLocal(lot.win), wout: toLocal(lot.wout), qci: lot.qci || 'pass', qcin: lot.qcin || '', loc: lot.loc || '',
    per: lot.per == null ? '' : String(lot.per), labels: lot.labels == null ? '' : String(lot.labels),
    vehicle: m.vehicle || '', method: m.method || '', t_start: m.t_start || '', t_end: m.t_end || '', note: m.note || '',
    plant: lot.plant || '', tdoc: lot.tdoc || '', slot: lot.slot || '', supkg: lot.supkg == null ? '' : String(Number(lot.supkg)) };
}
const LE_KEYS = { item: 'item', recv: 'recv_day', supplier: 'supplier', plate: 'plate', province: 'province', exp: 'exp', mfg: 'mfg', ticket: 'ticket', delivery: 'delivery', po: 'po', ref: 'ref_receipt',
  win: 'weigh_in', wout: 'weigh_out', loc: 'location', per: 'per', labels: 'labels', vehicle: 'vehicle', method: 'method', t_start: 't_start', t_end: 't_end', note: 'note', tdoc: 'transfer_doc', slot: 'src_lot', plant: 'plant', supkg: 'sup_kg' };
function leDiff(lot) {
  const a = leInit(lot), b = S.le, p = {};
  Object.keys(LE_KEYS).forEach((k) => { if (String(b[k] ?? '') !== String(a[k] ?? '')) p[LE_KEYS[k]] = (k === 'per' || k === 'labels') ? int(b[k]) : k === 'supkg' ? num(b[k]) : b[k]; });
  if (!p.item) delete p.item; if (!p.recv_day) delete p.recv_day;
  if (lot.source !== 'transfer') { delete p.transfer_doc; delete p.src_lot; delete p.plant; if (b.qci !== a.qci || b.qcin !== a.qcin) { p.qc_initial = b.qci; p.qc_initial_note = b.qcin; } } else { delete p.supplier; delete p.sup_kg; }
  return p;
}

// แก้จำนวนรับเข้าทั้ง Lot (พาเลทเต็ม / ถุงต่อพาเลท / ถุงพาเลทท้าย / น้ำหนัก) · สร้างพาเลทใหม่เหมือนลงของ+ชั่งออกใหม่ · rm_lot_restructure · ผู้ใช้ 5 พ.ย.
function lotRestructBox(d, lot) {
  if (lot.pack !== 'BAG' || !['wh', 'admin'].includes(S.snap.me.role)) return '';
  if (S.lr.lot !== lot.lot) S.lr = { lot: lot.lot, open: false, full: String(lot.full ?? ''), per: String(lot.per ?? ''), scrap: String(lot.scrap ?? 0),
    src: lot.wsrc === 'label' ? 'label' : lot.wsrc === 'doc' ? 'doc' : 'scale', net: lot.net == null ? '' : String(lot.net), lkg: lot.lpb == null ? '' : String(lot.lpb), reason: '' };
  const r = S.lr; const full = int(r.full), per = int(r.per), scrap = int(r.scrap);
  const n = full + (scrap > 0 ? 1 : 0), tot = full * per + scrap;
  const net = r.src === 'label' ? Math.round(num(r.lkg) * tot * 100) / 100 : num(r.net);
  const avg = tot > 0 && net > 0 ? net / tot : 0;
  const curN = d.s.units.filter((u) => u.lot === lot.lot && u.store === lot.store).length;
  const same = full === Number(lot.full || 0) && per === Number(lot.per || 0) && scrap === Number(lot.scrap || 0) && Math.abs(net - Number(lot.net || 0)) < 0.005 && curN === n;
  const valid = full >= 0 && scrap >= 0 && per >= 1 && per <= 2000 && n >= 1 && n <= 500 && net > 0 && net <= 100000 && (r.src !== 'label' || num(r.lkg) > 0);
  const ok = valid && !same && r.reason.trim().length >= 3 && !S.busy;
  const why = !valid ? 'ใส่จำนวนพาเลท/ถุง และน้ำหนักให้ครบ (ถุงต่อพาเลท 1–2000 · น้ำหนักไม่เกิน 100,000 กก.)' : same ? 'ตัวเลขเท่าเดิม' : r.reason.trim().length < 3 ? 'ใส่เหตุผลอย่างน้อย 3 ตัวอักษร' : '';
  const sup = Number(lot.supkg || 0); const dv = sup > 0 && net > 0 ? (net - sup) / sup * 100 : null;
  const inp = (k, label, extra) => `<label class="fld">${label}<input data-bind="lr.${k}" value="${esc(r[k])}" ${extra || ''} autocomplete="off"></label>`;
  const srcs = [['scale', 'ตาชั่ง (น้ำหนักสุทธิ)'], ['label', 'ตามฉลาก (กก./ถุง)']].concat(lot.source === 'transfer' ? [['doc', 'ตามใบโอน']] : [])
    .map(([id, t]) => `<button type="button" class="tg" aria-pressed="${r.src === id}" data-set="lr.src" data-val="${id}">${t}</button>`).join('');
  return `<details class="note" ${r.open ? 'open' : ''} data-lropen="1" style="display:flex;flex-direction:column;gap:8px"><summary><b>แก้จำนวนรับเข้าทั้ง Lot</b> <span class="muted smt">พาเลท / ถุง / น้ำหนัก · ตอนนี้ ${fmt(curN)} พาเลท · ${fmt(lot.bags)} ถุง · ${fmt(lot.net)} กก.</span></summary>
    <p class="muted smt" style="margin:6px 0">ใช้เมื่อใส่จำนวนตอนลงของหรือน้ำหนักชั่งผิดทั้ง Lot · ระบบจัดพาเลทใหม่ (เพิ่ม/ยกเลิกพาเลท) และเฉลี่ยน้ำหนักตามจำนวนถุง · ปรับยอดเป็นรายการ "ปรับรับเข้า" ใน Stock card · ใช้ได้เฉพาะ Lot ที่ยังไม่มีการเบิก/บด/จ่าย · <b>ป้ายต้องพิมพ์ใหม่ทุกใบ</b></p>

function viewIssue(d) {
  const t = S.iType;
  let items = d.s.items.filter((i) => i.status === 'Active');
  if (t === 'fat') items = items.filter((i) => i.unit === 'TANK');
  if (t === 'py' || t === 'flavor') items = items.filter((i) => i.store === 'PX');
  const withStock = new Set(d.live.filter((u) => u.kg > 0 && d.stOf(u) === 'ready').map((u) => (d.lots[u.lot] || {}).item));
  items = items.filter((i) => withStock.has(i.code));
  const code = items.some((i) => i.code === S.iItem) ? S.iItem : (items[0] || {}).code;
  const avStores = STORES.map((s) => s.id).filter((sid) => d.live.some((u) => u.store === sid && u.kg > 0 && d.stOf(u) === 'ready' && (d.lots[u.lot] || {}).item === code)).filter((sid) => t !== 'py' || sid === 'PX');
  const st = avStores.includes(S.iStore) ? S.iStore : avStores[0];
  const pool = d.live.filter((u) => u.store === st && u.kg > 0 && d.stOf(u) === 'ready' && (d.lots[u.lot] || {}).item === code)
    .sort((a, b) => a.lot < b.lot ? -1 : a.lot > b.lot ? 1 : pSort(a.p) - pSort(b.p));
  const picked = pool.filter((u) => S.iPick[u.id]); const src = picked.length ? picked : pool;
  const avail = sum(src); const req = num(S.iKg); let rest = req > 0 ? req : 0; const cut = {};
  src.forEach((u) => { if (rest <= 0) return; const c = Math.min(u.kg, rest); rest -= c; cut[u.id] = c; });
  const over = req > avail + 0.05; const need = t === 'manual' && !S.iRef.trim();
  S._issue = { code, store: st, picked: picked.map((u) => u.id) };
  const rows = pool.map((u) => `<tr class="${cut[u.id] ? 'cut' : ''}"><td><input type="checkbox" data-ipick="${u.id}" ${S.iPick[u.id] ? 'checked' : ''} aria-label="เลือก ${esc(tag(u))}"></td>
      <td class="mono">${esc(tag(u))}</td><td>${esc(u.loc || '-')}</td><td class="num">${u.kg < 1 ? fmt3(u.kg) : fmt(u.kg)}</td><td class="num" style="font-weight:600">${cut[u.id] ? (cut[u.id] < 1 ? fmt3(cut[u.id]) : fmt(cut[u.id])) : '–'}</td><td class="num">${u.kg - (cut[u.id] || 0) < 1 ? fmt3(Math.round((u.kg - (cut[u.id] || 0)) * 1000) / 1000) : fmt(u.kg - (cut[u.id] || 0))}</td></tr>`).join('');
  return `<div><h1>จ่ายออก</h1><p class="lead">ของที่ไม่ผ่าน Intake · ไม่เลือก Lot = ตัดเข้าก่อนออกก่อนอัตโนมัติ · เลือก Lot = ตัดเฉพาะที่เลือก</p></div>
  <div class="chips" role="group" aria-label="ประเภทการจ่าย">${ISSUE_TYPES.map(([id, l]) => `<button type="button" class="tg" aria-pressed="${t === id}" data-set="iType" data-val="${id}">${l}</button>`).join('')}</div>
  <div class="row"><div class="card" style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px">
    ${items.length ? `<label class="fld">วัตถุดิบ (ที่มียอดพร้อมจ่าย)<select data-bind="iItem">${items.map((i) => `<option value="${esc(i.code)}" ${i.code === code ? 'selected' : ''}>${esc(i.name)} (${esc(i.code)})</option>`).join('')}</select></label>` : '<p class="muted" style="margin:0">ไม่มีวัตถุดิบที่พร้อมจ่ายสำหรับประเภทนี้</p>'}
    <div class="chips" role="group" aria-label="คลังต้นทาง">จ่ายจากคลัง ${avStores.map((s) => `<button type="button" class="tg" aria-pressed="${s === st}" data-set="iStore" data-val="${s}">${s}</button>`).join('')}</div>
    <div class="grid2"><label class="fld">จำนวนที่จ่าย (กก.)<input data-bind="iKg" value="${esc(S.iKg)}" inputmode="decimal"></label>
      <label class="fld">${t === 'manual' ? 'เหตุผล (ต้องใส่)' : 'เอกสารอ้างอิง (ถ้ามี)'}<input data-bind="iRef" value="${esc(S.iRef)}" maxlength="200"></label></div>
    <div class="muted smt" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">${picked.length ? 'ตัดจาก Lot ที่เลือก ' + picked.length + ' รายการ' : 'ตัดเข้าก่อนออกก่อนอัตโนมัติ'} · พร้อมจ่าย ${fmt3(avail)} กก.${avail > 0 ? ` <button type="button" class="ghost sm" data-iall="${Math.round(avail * 1000) / 1000}">จ่ายทั้งหมด</button>` : ''}</div>
    ${over ? `<p role="alert" class="err" style="margin:0">ยอดไม่พอ ขาด ${fmt(req - avail)} กก.</p>` : ''}
    <button type="button" data-issue="1" ${S.busy || !(req > 0) || over || need || !code ? 'disabled' : ''}>บันทึกจ่ายออก</button>
  </div>
  <div class="card" style="flex:1 1 440px;min-width:0"><div class="fc"><h2>Lot ที่จ่ายได้</h2>${picked.length ? '<button type="button" class="ghost sm" data-clearpick="1">กลับไปตัดอัตโนมัติ</button>' : ''}</div>
    ${rows ? `<div class="tw"><table><thead><tr><th>เลือก</th><th>Lot · พาเลท</th><th>ช่อง</th><th class="num">มีอยู่</th><th class="num">ตัด</th><th class="num">เหลือ</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">—</p>'}
    ${residueBox(d, pool)}</div></div>
  ${viewRep(d, 'issue')}`;
}

// ตัดเศษค้าง ≤ 1 กก. ต่อพาเลท (WH/admin) → ใบ AJ ละพาเลท (admin ยกเลิกได้ที่รายงานตรวจนับ/ปรับยอด) · rm_unit_clear_residue · ผู้ใช้ 5 พ.ย.
const RESIDUE_MAX = 1;
function residueBox(d, units, card) {
  if (!S.snap || !['wh', 'admin'].includes(S.snap.me.role)) return '';
  const res = units.filter((u) => u.kg !== null && Number(u.kg) > 0 && Number(u.kg) <= RESIDUE_MAX && !String(u.id).startsWith('v'))
    .sort((a, b) => a.lot < b.lot ? -1 : a.lot > b.lot ? 1 : pSort(a.p) - pSort(b.p));
  if (!res.length) return '';
  const r = S.rs; const sel = res.filter((u) => r.sel[u.id] !== false); const kg = sel.reduce((a, u) => a + Number(u.kg), 0);
  const ok = sel.length && r.reason.trim().length >= 3 && !S.busy;
  const rows = res.map((u) => { const it = d.items[(d.lots[u.lot] || {}).item] || {};
    return `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-rssel="${esc(u.id)}" ${r.sel[u.id] !== false ? 'checked' : ''}><span class="mono">${esc(tag(u))}</span><span class="muted smt">${esc(it.name || '')} · ${esc(u.store)}${u.loc ? ' · ' + esc(u.loc) : ''}</span><b class="mono" style="margin-left:auto">${fmt3(u.kg)} กก.</b></label>`; }).join('');
  return `<div class="${card ? 'card ' : ''}note" style="display:flex;flex-direction:column;gap:8px;${card ? '' : 'margin-top:12px'}">
    <b>เศษค้าง ≤ ${RESIDUE_MAX} กก. (${res.length} พาเลท)</b>
    <span class="muted smt">ยอดเล็กมากที่เหลือจากการปัดเศษตอนจ่าย/เบิก ตัดออกให้เป็น 0 ได้ · บันทึกเป็นใบปรับยอด (AJ) ละพาเลท · admin ยกเลิกใบได้</span>
    <div style="display:flex;flex-direction:column;gap:4px">${rows}</div>
    <div class="grid2" style="align-items:end"><label class="fld">เหตุผล (ต้องใส่)<input data-bind="rs.reason" value="${esc(r.reason)}" maxlength="200" autocomplete="off" placeholder="เช่น เศษจากการจ่าย"></label>
      <div class="chips"><button type="button" data-rsdo="1" ${ok ? '' : 'disabled'}>ตัดเศษ ${fmt(sel.length)} พาเลท (${fmt3(Math.round(kg * 1000) / 1000)} กก.)</button></div></div></div>`;
}

function viewStock(d) {
  const f = S.storeF;
  const filters = [['ALL', 'ทุกคลัง']].concat(STORES.map((s) => [s.id, s.id + ' ' + s.full])).map(([id, l]) => `<button type="button" class="tg" aria-pressed="${f === id}" data-set="storeF" data-val="${id}">${l}</button>`).join('');
  const views = [['sum', 'รวม Lot'], ['lot', 'แยก Lot']].map(([id, l]) => `<button type="button" class="tg" aria-pressed="${S.view === id}" data-set="view" data-val="${id}">${l}</button>`).join('');
  const units = d.live.filter((u) => f === 'ALL' || u.store === f);
  const order = { RM: 0, 'RM-G': 1, PX: 2 };
  let table;
  if (S.view === 'sum') {
    const g = {};
    units.forEach((u) => { const code = (d.lots[u.lot] || {}).item; const k = u.store + '|' + code;
      g[k] = g[k] || { store: u.store, code, ready: 0, other: 0, pending: 0, units: 0, lots: new Set() };
      const x = g[k]; x.units++; x.lots.add(u.lot); if (u.kg === null) x.pending++; else if (d.stOf(u) === 'ready') x.ready += Number(u.kg); else x.other += Number(u.kg); });
    const rows = Object.values(g).sort((a, b) => order[a.store] - order[b.store] || ((d.items[a.code] || {}).name || '').localeCompare((d.items[b.code] || {}).name || '')).map((x) => {
      const it = d.items[x.code] || {}; const oldest = [...x.lots].sort()[0]; const low = it.rop > 0 && x.store === it.store && x.ready < it.rop;
      return `<tr><td>${spill(x.store)}</td><td><b style="font-weight:600">${esc(it.name)}</b><span class="muted mono" style="display:block;font-size:12px">${esc(x.code)}</span></td>
        <td class="num" style="font-weight:600">${fmt(x.ready)}</td><td class="num">${x.other ? fmt(x.other) : '–'}${x.pending ? ' · รอชั่ง ' + x.pending : ''}</td><td class="num">${x.lots.size}</td><td class="num">${x.units}</td>
        <td>${dmy((d.lots[oldest] || {}).recv_day)}${low ? `<span class="err" style="display:block;font-size:12px">ต่ำกว่าจุดสั่งซื้อ ${fmt(it.rop)}</span>` : ''}</td>
        <td style="white-space:nowrap"><button type="button" class="ghost sm" data-card="${esc(x.store + '|' + x.code)}">Stock card</button> <button type="button" class="ghost sm" data-ptag="${esc(x.store + '|' + x.code)}" title="F-WI03-WHD01-03">ป้าย Lot</button></td></tr>`; }).join('');
    table = `<table><thead><tr><th>คลัง</th><th>วัตถุดิบ</th><th class="num">พร้อมใช้ (กก.)</th><th class="num">รอ QC / Hold</th><th class="num">Lot</th><th class="num">หน่วย</th><th>Lot เก่าสุด</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="8" class="muted">ยังไม่มียอด</td></tr>'}</tbody></table>`;
  } else {
    const g = {};
    units.forEach((u) => { const k = u.store + '|' + u.lot; g[k] = g[k] || { store: u.store, lot: u.lot, units: 0, kg: 0, pending: false, locs: new Set() };
      const x = g[k]; x.units++; if (u.loc) x.locs.add(u.loc); if (u.kg === null) x.pending = true; else x.kg += Number(u.kg); });
    const rows = Object.values(g).sort((a, b) => order[a.store] - order[b.store] || (a.lot < b.lot ? -1 : 1)).map((x) => { const l = d.lots[x.lot] || {}; const it = d.items[l.item] || {};
      return `<tr><td>${spill(x.store)}</td><td>${esc(it.name)}</td><td class="mono">${esc(x.lot)}</td><td>${dmy(l.recv_day)}</td><td>${pill(l.status || 'ready')}</td>
        <td class="num">${x.units}</td><td class="num" style="font-weight:600">${x.pending ? 'รอชั่ง' : fmt(x.kg)}</td><td>${esc([...x.locs].join(', ') || '-')}</td><td>${l.exp ? expTag(l.exp) : ''}</td>
        <td><button type="button" class="ghost sm" data-card="${esc(x.store + '|' + l.item + '|' + x.lot)}">Stock card</button></td></tr>`; }).join('');
    table = `<table><thead><tr><th>คลัง</th><th>วัตถุดิบ</th><th>Lot</th><th>วันรับ</th><th>สถานะ</th><th class="num">หน่วย</th><th class="num">คงเหลือ (กก.)</th><th>ช่อง</th><th>หมดอายุ</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="10" class="muted">ยังไม่มียอด</td></tr>'}</tbody></table>`;
  }
  let card = '';
  if (S.card) {
    const [st, code, lot] = S.card.split('|'); const it = d.items[code] || {};
    const rows = cardRowsView(S.cardRows || [], lot).map((r) => `<tr><td>${dmy(r.day)}</td><td class="num">${fmt(r.open)}</td><td class="num">${r.in ? fmt(r.in) : ''}</td><td class="num">${r.out ? fmt(r.out) : ''}</td><td class="num" style="font-weight:600">${fmt(r.bal)}</td><td class="smt">${esc(r.note)}</td></tr>`).join('');
    card = `<div class="card"><div class="fc"><h2>Stock card · ${esc(it.name)} (${esc(st)})${lot ? ' · Lot ' + esc(lot) : ''}</h2>
        <span class="chips"><span class="fcode">${st === 'PX' ? 'F-WI01-WHD01-02' : 'F-WI03-WHD01-02'} Rev.00</span><button type="button" class="sm" data-pf="card" ${S.cardRows === null ? 'disabled' : ''}>พิมพ์ Stock card</button></span></div>
      ${S.cardRows === null ? '<p class="muted">กำลังโหลด…</p>' : `<div class="tw"><table><thead><tr><th>วันที่</th><th class="num">ยอดยกมา</th><th class="num">รับเข้า</th><th class="num">จ่ายออก</th><th class="num">คงเหลือ</th><th>หมายเหตุ</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="muted">ยังไม่มีรายการ</td></tr>'}</tbody></table></div>`}</div>`;
  }
  return `<div><h1>คงเหลือและ Stock card</h1><p class="lead">ยอดจากระบบนี้เท่านั้น · หน่วยกิโลกรัม</p></div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><div class="chips" role="group" aria-label="กรองคลัง">${filters}</div><div class="chips" role="group" aria-label="มุมมอง" style="margin-left:auto">${views}</div></div>

    <div><button type="button" class="ghost sm" data-go="stockrep">รายงานคงเหลือรายวัน / รายเดือน →</button></div>`;
}

// ปรับยอดจากผลตรวจนับ (admin) · ใส่จำนวนถุงที่นับได้ ระบบคิด กก. ตามน้ำหนักเฉลี่ยของพาเลทให้ (แก้ได้) · 0 = ไม่พบของ
function adjPanel(d, u) {
  const a = S.adj; const per = u.bags > 0 && u.kg > 0 ? u.kg / u.bags : 0;
  const kg = a.kg !== '' ? num(a.kg) : a.bags !== '' && per ? Math.round(int(a.bags) * per * 100) / 100 : NaN;
  const dk = isNaN(kg) ? null : Math.round((kg - Number(u.kg)) * 100) / 100;
  const ok = !isNaN(kg) && kg >= 0 && a.reason.trim().length >= 3 && !S.busy;
  return `<tr><td colspan="6"><div class="note" style="display:flex;flex-direction:column;gap:10px">
    <b>ปรับยอด ${esc(tag(u))} · ตามระบบ ${u.bags > 0 ? fmt(u.bags) + ' ' + (u.kind === 'BIGBAG' ? 'ใบ' : 'ถุง') + ' · ' : ''}${fmt(u.kg)} กก. · ช่อง ${esc(u.loc || '-')}</b>
    <div class="grid4">${u.bags > 0 ? `<label class="fld">จำนวนที่นับได้ (${u.kind === 'BIGBAG' ? 'ใบ' : 'ถุง'})<input data-bind="adj.bags" value="${esc(a.bags)}" inputmode="numeric" placeholder="${fmt(u.bags)}"></label>` : ''}
      <label class="fld">น้ำหนักที่นับได้ (กก.)<input data-bind="adj.kg" value="${esc(a.kg)}" inputmode="decimal" placeholder="${isNaN(kg) ? fmt(u.kg) : fmt(kg)}"></label>
      <label class="fld">ช่องที่พบ<select data-bind="adj.loc">${locOpts(d, (a.loc || u.loc))}</select></label>
      <div class="fld">ไม่พบของ<button type="button" class="ghost sm" data-adjzero="1">ตั้งเป็น 0</button></div></div>
    <div class="grid2"><label class="fld">เหตุผล (ต้องใส่)<input data-bind="adj.reason" value="${esc(a.reason)}" maxlength="200" autocomplete="off" placeholder="เช่น นับได้ 39 ถุง ถุงขาด 1"></label><span></span></div>
    <div class="fc"><span class="smt">${dk === null ? '<span class="muted">ใส่จำนวนหรือน้ำหนักที่นับได้</span>' : `หลังปรับ <b>${fmt(kg)}</b> กก. · ส่วนต่าง <b class="${dk < 0 ? 'err' : ''}">${dk > 0 ? '+' : ''}${fmt(dk)}</b> กก.${kg === 0 ? ' · พาเลทนี้จะหมดยอด' : ''}`}</span>
      <span class="chips"><button type="button" data-adjdo="${u.id}" ${ok ? '' : 'disabled'}>บันทึกปรับยอด</button><button type="button" class="ghost" data-adjopen="">ปิด</button></span></div></div></td></tr>`;
}

function viewCount(d) {
  const order = d.slots;
  const units = d.live.slice().sort((a, b) => order.indexOf(a.loc) - order.indexOf(b.loc) || (a.lot < b.lot ? -1 : 1));
  const done = units.filter((u) => d.s.counted[u.id]).length; const adjOf = d.s.count_adj || {}; const admin = d.s.me.role === 'admin';
  const diff = units.filter((u) => d.s.counted[u.id] === 'diff' && !adjOf[u.id]).length;
  const rows = units.map((u) => { const c = d.s.counted[u.id];
    return `<tr><td>${esc(u.loc || '-')}</td><td class="mono">${esc(tag(u))}</td><td>${esc(d.itemOf(u).name)}</td><td>${KIND[u.kind]}</td>
      <td class="num">${u.kg === null ? fmt(u.bags) + ' ถุง (รอชั่ง)' : (u.bags > 0 ? fmt(u.bags) + ' ถุง · ' : '') + fmt(u.kg) + ' กก.'}</td>
      <td style="white-space:nowrap">${adjOf[u.id] ? `<span class="tag st-ready">ปรับยอดแล้ว ${esc(adjOf[u.id])}</span>` : `<button type="button" class="tg" aria-pressed="${c === 'ok'}" data-count="${u.id}" data-res="ok">ตรง</button> <button type="button" class="tg" aria-pressed="${c === 'diff'}" data-count="${u.id}" data-res="diff">ไม่ตรง</button>`}
        ${c === 'diff' && !adjOf[u.id] ? (admin ? ` <button type="button" class="sm" data-adjopen="${u.id}">ปรับยอด</button>` : ' <span class="muted smt">รอ admin ปรับยอด</span>') : ''}</td></tr>${S.adj.unit === u.id ? adjPanel(d, u) : ''}`; }).join('');
  return `<div class="fc"><div><h1>ตรวจนับ</h1><p class="lead">รอบ ${dmy(d.s.biz_day)} · นับแล้ว ${done} จาก ${units.length} หน่วย · ไม่ตรงรอปรับยอด ${diff} · ผลนับไม่ปรับยอดอัตโนมัติ — กด "ปรับยอด" ที่แถวไม่ตรง (admin) · ยกเลิกใบปรับยอดได้ที่รายงานท้ายหน้า</p></div>
    <div class="chips">พิมพ์ใบนับ <button type="button" class="ghost sm" data-pf="countLoc" title="F-WI03-WHD01-04">Lot + ช่องจัดเก็บ</button><button type="button" class="ghost sm" data-pf="countDaily" title="F-WI03-WHD01-01">รายรหัส</button><button type="button" class="ghost sm" data-pf="countOil" title="F-WI03-WHD01-06">น้ำมัน</button></div></div>
    <div class="card tw" style="padding:6px 8px"><table><thead><tr><th>ช่อง</th><th>Lot · พาเลท</th><th>วัตถุดิบ</th><th>แบบ</th><th class="num">ตามระบบ</th><th>ผลนับ</th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="muted">ยังไม่มีของในคลัง</td></tr>'}</tbody></table></div>
    ${viewRep(d, 'count')}`;
}

// ตัวเลือกช่องเก็บ จัดกลุ่มตามโซน เรียงเลขแบบธรรมชาติ (D2 ก่อน D10)
const natCmp = (a, b) => (/\d$/.test(a) ? 0 : 1) - (/\d$/.test(b) ? 0 : 1) || a.localeCompare(b, 'en', { numeric: true });
function locOpts(d, sel) {
  return d.zones.map((z) => z.slots.length ? `<optgroup label="${esc(z.name)}">${z.slots.slice().sort(natCmp).map((c) => `<option ${sel === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</optgroup>` : '').join('');
}
// แบ่งพาเลท (ยอดยกมาที่ลงรวมทั้ง Lot / พาเลทใหญ่) และรวมพาเลท ใน Lot เดียวกัน
function spPanel(d, u) {
  const sp = S.sp; const per = int(sp.per), n = int(sp.n); const left = u.bags - per * n; const ok = per >= 1 && n >= 1 && left >= 1 && !S.busy;
  const others = d.live.filter((x) => x.id !== u.id && x.lot === u.lot && x.store === u.store && x.kind === 'PALLET' && x.kg > 0).sort((a, b) => pSort(a.p) - pSort(b.p));
  return `<div class="note" style="display:flex;flex-direction:column;gap:10px">
    ${u.bags >= 2 ? `<b class="smt">แบ่งเป็นพาเลทใหม่</b>
    <div class="grid4"><label class="fld">ถุง/พาเลทใหม่<input data-bind="sp.per" value="${esc(sp.per)}" inputmode="numeric"></label>
      <label class="fld">จำนวนพาเลทใหม่<input data-bind="sp.n" value="${esc(sp.n)}" inputmode="numeric"></label>
      <label class="fld">ช่องเก็บพาเลทใหม่<select data-bind="sp.loc">${locOpts(d, sp.loc || u.loc)}</select></label></div>
    <div class="chips"><button type="button" class="ghost sm" data-spmax="${u.id}" ${per >= 1 ? '' : 'disabled'}>แบ่งเต็มเท่าที่ได้</button>
      <button type="button" data-spdo="${u.id}" ${ok ? '' : 'disabled'}>แบ่งพาเลท</button></div>
    <span class="smt">${per >= 1 && n >= 1 ? (left >= 1 ? `ได้พาเลทใหม่ ${n} พาเลท × ${per} ถุง (≈ ${fmt(u.kg * per / u.bags)} กก./พาเลท) · พาเลท ${esc(u.p)} เหลือ ${left} ถุง ≈ ${fmt(u.kg - Math.round(u.kg * per / u.bags * 100) / 100 * n)} กก.` : `<span class="err">ต้องเหลือในพาเลท ${esc(u.p)} อย่างน้อย 1 ถุง (มี ${fmt(u.bags)} ถุง)</span>`) : 'ใส่ถุงต่อพาเลทและจำนวนพาเลท · น้ำหนักเฉลี่ยตามถุง'}</span>` : ''}
    ${others.length ? `<b class="smt">รวมพาเลทนี้เข้ากับพาเลทอื่นใน Lot เดียวกัน</b>
    <div class="chips"><select data-bind="sp.into" aria-label="รวมเข้าพาเลท"><option value="">— เลือกพาเลทปลายทาง —</option>${others.map((x) => `<option value="${x.id}" ${sp.into === x.id ? 'selected' : ''}>พาเลท ${esc(x.p)} @${esc(x.loc || '-')} · ${fmt(x.bags)} ถุง</option>`).join('')}</select>
      <button type="button" class="ghost" data-mgdo="${u.id}" ${sp.into && !S.busy ? '' : 'disabled'}>รวมเข้าไป</button></div>` : ''}</div>`;
}
function viewLoc(d) {
  const map = d.zones.map((z) => `<div style="display:flex;flex-direction:column;gap:8px"><span class="smt" style="font-weight:600">${esc(z.name)}</span><div class="lane">
    ${z.slots.map((code) => { const us = d.live.filter((u) => u.loc === code); const kg = sum(us); const tank = code.startsWith('TANK');
      const cap = (d.s.locations.find((l) => l.code === code) || {}).cap || 4; const frac = tank ? Math.min(1, kg / 15000) : Math.min(1, us.length / cap); const st = us[0] ? STORES.find((s) => s.id === us[0].store) : null;
      const hold = us.some((u) => d.stOf(u) === 'hold'); const lab = us.length ? (tank ? fmt(kg) + ' กก.' : us.length + (cap ? '/' + cap : '') + ' หน่วย') : 'ว่าง';
      return `<button type="button" class="slot ${hold ? 'hold' : ''}" aria-pressed="${S.selSlot === code}" data-slot="${esc(code)}" aria-label="ช่อง ${esc(code)} ${lab}" style="${tank ? 'width:124px' : ''}">
        <span class="fill" aria-hidden="true" style="height:${Math.round(frac * 100)}%;background:${st ? st.color + '2e' : 'transparent'};border-top:${st && frac ? '3px solid ' + st.color : '0'}"></span>
        <span class="t"><b class="mono" style="font-size:13px">${esc(code)}</b><span style="font-size:12px">${lab}</span></span></button>`; }).join('') || '<span class="muted smt">ยังไม่มีช่อง</span>'}</div></div>`).join('');
  const inSlot = d.live.filter((u) => u.loc === S.selSlot);
  const mmIds = Object.keys(S.mm).filter((k) => S.mm[k] && d.live.some((u) => u.id === k)); const mmUnits = d.live.filter((u) => S.mm[u.id]);
  const lotsIn = [...new Set(inSlot.map((u) => u.lot))];
  const panel = inSlot.map((u) => `<div style="padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;gap:10px"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" data-mmsel="${u.id}" ${S.mm[u.id] ? 'checked' : ''} aria-label="เลือกย้าย ${esc(tag(u))}"><b class="mono" style="font-weight:600">${esc(tag(u))}</b></label>${pill(d.stOf(u))}</div>
      <span class="muted smt">${esc(d.itemOf(u).name)} (${u.store}) · ${u.kg === null ? fmt(u.bags) + ' ถุง รอชั่ง' : (u.bags > 0 ? fmt(u.bags) + ' ถุง · ' : '') + fmt(u.kg) + ' กก.'}</span>
      <label class="muted smt" style="display:flex;align-items:center;gap:8px">ย้ายไปช่อง <select data-move="${u.id}">${locOpts(d, u.loc)}</select></label>
      ${u.kind === 'PALLET' && u.kg > 0 ? `<div><button type="button" class="ghost sm" data-spopen="${u.id}" aria-expanded="${S.sp.unit === u.id}">แบ่ง / รวมพาเลท</button></div>${S.sp.unit === u.id ? spPanel(d, u) : ''}` : ''}</div>`).join('') || '<p class="muted smt">ช่องนี้ว่าง</p>';
  const lf = S.lf;
  const tableRows = d.s.locations.filter((l) => lf.zone === '__NEW' || l.zone === lf.zone).map((l) => { const us = d.live.filter((u) => u.loc === l.code); const names = [...new Set(us.map((u) => d.itemOf(u).name))];
    return `<tr><td class="mono">${esc(l.code)}</td><td>${esc((d.zones.find((z) => z.id === l.zone) || {}).name)}</td><td>${us.length ? us.length + ' หน่วย · ' + esc(names.join(', ')) : 'ว่าง'}</td><td class="num">${us.length ? fmt(sum(us)) : '–'}</td>
      <td><button type="button" class="ghost sm" data-locdel="${esc(l.code)}" ${us.length ? 'disabled title="ย้ายของออกก่อน"' : ''}>ลบ</button></td></tr>`; }).join('');
  const spl = S.spLast;
  return `${spl ? `<div class="note" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span>แบ่งแล้ว Lot ${esc(spl.lot)} · พาเลทใหม่ ${esc(spl.ps[0])}${spl.ps.length > 1 ? '–' + esc(spl.ps[spl.ps.length - 1]) : ''} (${spl.ps.length} ใบ)</span>
    <span class="chips"><button type="button" data-plabel="${esc(spl.lot)}" data-ps="${esc(spl.ps.join(','))}">พิมพ์ป้ายพาเลทใหม่</button><button type="button" class="ghost sm" data-splastx="1">ปิด</button></span></div>` : ''}<div><h1>Location</h1><p class="lead">สีตามคลัง ความสูงแถบตามความเต็มของช่อง · แตะช่องเพื่อดูและย้าย · ติ๊กหลายพาเลท (หรือทั้ง Lot) แล้วย้ายพร้อมกัน · สแกน QR ที่ปุ่ม 📷 สแกน</p></div>
    ${mmIds.length ? `<div class="note" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-color:var(--blue)"><span><b>รายการย้าย ${mmIds.length} พาเลท</b> · ${fmt(sum(mmUnits))} กก.<span class="muted smt" style="display:block">${esc(mmUnits.slice(0, 8).map((u) => tag(u) + ' @' + (u.loc || '-')).join(', '))}${mmUnits.length > 8 ? ' …' : ''}</span></span>
      <span class="chips">ย้ายไปช่อง <select data-bind="mmTo">${locOpts(d, (S.mmTo || d.slots[0]))}</select><button type="button" data-mmdo="1" ${S.busy ? 'disabled' : ''}>ย้ายทั้งหมด</button><button type="button" class="ghost" data-mmclear="1">ล้างรายการ</button></span></div>` : ''}
    <div class="row"><div class="map" style="flex:2 1 520px;min-width:0">${map}
      <div style="display:flex;flex-wrap:wrap;gap:14px;font-size:12px">${STORES.map((s) => `<span style="display:flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:14px;height:14px;border-radius:3px;background:${s.color}2e;border-top:3px solid ${s.color}"></span>${s.id} ${s.full}</span>`).join('')}
      <span style="display:flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:14px;height:14px;border:2px solid var(--bad);border-radius:3px"></span>มี Hold</span></div></div>
    <div class="card" style="flex:1 1 300px;min-width:0"><h2>ช่อง ${esc(S.selSlot)}</h2>${inSlot.length ? `<div class="chips"><button type="button" class="ghost sm" data-mmslot="${esc(S.selSlot)}">เลือกทั้งช่อง</button>${lotsIn.map((l) => `<button type="button" class="ghost sm" data-mmlot="${esc(l)}">เลือกทั้ง Lot ${esc(l)}</button>`).join('')}</div>` : ''}${panel}</div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:14px"><h2 style="margin:0">ช่องเก็บทั้งหมด (${d.s.locations.length} ช่อง) <span class="muted smt" style="font-weight:400">· ตารางแสดงเฉพาะโซนที่เลือก</span></h2>
      <form data-form="locadd" class="note" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
        <label class="fld" style="flex:1 1 200px">โซน<select data-bind="lf.zone">${d.zones.map((z) => `<option value="${esc(z.id)}" ${lf.zone === z.id ? 'selected' : ''}>${esc(z.name)}</option>`).join('')}<option value="__NEW" ${lf.zone === '__NEW' ? 'selected' : ''}>+ เพิ่มโซนใหม่</option></select></label>
        ${lf.zone === '__NEW' ? `<label class="fld" style="flex:1 1 180px">ชื่อโซนใหม่<input data-bind="lf.zoneName" value="${esc(lf.zoneName)}" maxlength="60"></label>` : ''}
        <label class="fld" style="flex:1 1 140px">รหัสช่อง<input data-bind="lf.code" value="${esc(lf.code)}" placeholder="เช่น B-07" maxlength="20" autocomplete="off"></label>
        <button type="submit">เพิ่มช่อง</button></form>
      <div class="tw"><table><thead><tr><th>ช่อง</th><th>โซน</th><th>ของในช่อง</th><th class="num">กก.</th><th></th></tr></thead><tbody>${tableRows}</tbody></table></div></div>
    ${viewRep(d, 'loc')}`;
}

function viewDocs(d) {

  const onDay = d.s.lots.filter((l) => l.recv_day === day);

    ${card('F-WI01-WHD01-01 Rev.00', 'บันทึกการรับเข้าสารเสริมประจำวัน', 'Lot ที่รับเข้าคลัง PX ในวันที่เลือก · เลขที่ใบรับ ขนาดบรรจุ น้ำหนักรวม สถานที่จัดเก็บ (A4 แนวนอน)', dayCtl, `<button type="button" data-pf="recvPX">พิมพ์ (${onDay.filter((l) => l.store === 'PX').length} รายการ)</button>`)}
    ${card('F-SP-WHD01-02 Rev.00', 'ป้ายบ่งชี้วัตถุดิบ', 'ป้ายพาเลท/Bigbag ของ Lot · พิมพ์ทั้งหมดหรือเฉพาะใบ · 2 ป้ายต่อ A4 · เลือกแบบมี/ไม่มี QR (Lot|พาเลท)',
      lotsDesc.length ? `<label class="fld">Lot<select data-bind="docLot">${lotsDesc.map((l) => `<option value="${esc(l.lot)}" ${l.lot === docLot ? 'selected' : ''}>${esc(l.lot)} · ${esc((d.items[l.item] || {}).name)}</option>`).join('')}</select></label>
      <label class="fld">ใบที่ (ว่าง = ทั้งหมด)<input data-bind="docPs" value="${esc(S.docPs)}" placeholder="เช่น 1-5, 8, 12" autocomplete="off"></label>${qrToggle()}` : '<p class="muted">ยังไม่มี Lot ที่ต้องติดป้าย</p>',
      `<div class="chips"><button type="button" data-plabel="${esc(docLot)}" data-range="1" ${docLot ? '' : 'disabled'}>พิมพ์</button><button type="button" class="ghost" data-go="recv" data-lab="${esc(docLot)}" ${docLot ? '' : 'disabled'}>เลือกใบ / ยกเลิก Lot ที่หน้ารับเข้า</button></div>`)}

function obLines(txt) {
  return String(txt || '').split(/\n/).map((s) => s.trim()).filter(Boolean).map((s) => {
    const [p, bags, kg, loc] = s.split(/[,\t]/).map((x) => (x || '').trim());
    return { p: p.toUpperCase().replace(/^P(?=\d)/, ''), bags: num(bags) || 0, kg: num(kg), loc: loc || '' };
  });
}
function obGen() {
  const o = S.ob; const n = int(o.n), b = num(o.bags), k = num(o.kgb), lb = num(o.lastBags);
  const lines = [];
  if (o.pack === 'BULK' || o.pack === 'TANK') { if (num(o.total) > 0) lines.push(`1,0,${num(o.total)}`); }
  else {
    for (let i = 1; i <= n; i++) lines.push(`${i},${o.pack === 'BIGBAG' ? 1 : b},${Math.round((o.pack === 'BIGBAG' ? 1 : b) * k * 100) / 100}`);
    if (o.pack === 'BAG' && lb > 0) lines.push(`${n + 1},${lb},${Math.round(lb * k * 100) / 100}`);
  }
  return lines.join('\n');
}

  const ds = el.dataset;
  if (ds.msel) { const o = el.value === '__other'; mOther[ds.msel + '|' + (ds.mctx || '')] = o; setPath(ds.msel, o ? '' : el.value); return true; }

    else if (ds.qe) { const r = (S.qe.r[ds.qe] = S.qe.r[ds.qe] || {}); if (ds.qek) { r.kg = el.value; r.kt = true; } else r.bags = el.value; }

    if (ds.bind === 'ik.q') { S.ik.unit = ''; S.ik.bags = ''; ncpFromIk(el.value); }

    return true;
  }

  if (ds.wo) { S.wo[ds.wo] = S.wo[ds.wo] || {}; S.wo[ds.wo][ds.k] = el.value; return true; }

  }
});

async function loadAdmin() { S.adminInfo = null; S.users = null; try { S.adminInfo = await rpc('rm_admin_info', { p_token: S.tok }); S.users = await rpc('rm_user_list', { p_token: S.tok }); } catch (err) { S.toast = err.message; S.toastErr = true; } render(); }

// BFL Hub (9 Nov 2026): opened from the Hub with ?hub=<one-time ticket> → sign in as the account the Hub names (rm_hub_login).
// Opened directly → pick name + 4-digit PIN (12 Nov 2026).
(async () => {
  const hub = new URLSearchParams(location.search).get('hub');
  if (hub) {
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* ignore */ }
    try { const r = await rpc('rm_hub_login', { p_ticket: hub }); if (!r || !r.ok) throw new Error((r && r.error) || 'Hub');
      S.tok = r.token; sessionStorage.setItem('rm_tok', r.token); }
    catch (e) { S.toast = 'เข้าจาก Hub ไม่สำเร็จ: ' + e.message; S.toastErr = true; }
  }
  if (S.tok) { try { await load(); } catch (e) { S.tok = ''; } } render();
})();
// Realtime ทุกหน้า (user 9 Nov 2026): ทุก 5 วินาทีถาม rm_stamp (ตัวนับการเขียนของตาราง rm_* — เบามาก)
// ถ้ามีข้อมูลใหม่จึงโหลดหน้าที่เปิดอยู่ใหม่ · ไม่โหลดระหว่างพิมพ์ / ระหว่างบันทึก / ตอนเปิดกล้องสแกน
let liveV = '', liveBusy = false;
setInterval(async () => {
  const a = document.activeElement || document.body; const idleScan = a.id === 'ikq' && !a.value;
  if (!S.tok || !S.snap || S.busy || liveBusy || document.hidden || S.scan.open || (isTyping(a) && !idleScan)) return;
  liveBusy = true;
  try {
    const st = await rpc('rm_stamp', { p_token: S.tok });
    const changed = liveV && st !== liveV; liveV = st;
    if (!changed || S.busy || S.scan.open) return;
    const b = document.activeElement || document.body; if (isTyping(b) && !(b.id === 'ikq' && !b.value)) { liveV = ''; return; } // พิมพ์อยู่ → รอบหน้า
    await load(); if (repScreen(S.screen) && S.rep.data) await fetchRep(); if (pdScreen(S.screen)) await loadPD(true);
    if (S.bcard.bin && S.screen === 'bins') loadBinCard(S.bcard.bin);
    render(); if (idleScan) { const n = document.getElementById('ikq'); if (n) n.focus(); }
  } catch (e) { /* ลองใหม่รอบหน้า */ } finally { liveBusy = false; }
}, 5000);
</script>
