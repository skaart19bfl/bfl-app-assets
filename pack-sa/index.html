/* pform.js — ฟอร์มรายงานการบรรจุ (F-WI06-PRD04-01 Rev.05 / F-WI07-PRD03-01 Rev.00) สร้างในมือถือ: PDF (pdf-lib) + Excel (ExcelJS)
 * v93 (14 Nov 2026, user "เริ่ม" — ฟอร์ม Export สร้างในมือถือแล้วดาวน์โหลด; decision 14 Nov "สร้างในมือถือ แล้วดาวน์โหลด")
 * Port of the main script 088_123_Packing_Form.gs (Bluefalo Production_Lot): pfBuildPages_ copied as is (same pages / rows / stops / dups),
 * pfDrawPage_ / pfDrawPagePC_ turned into one sheet model that both the PDF and the Excel are drawn from.
 * No Drive, no Apps Script: data = Supabase rows (dates as {$d: ms}), files made on the phone.
 * PF_LOGO_B64 (logo.js) is defined before this file. Works in the browser (window.PForm) and in node (module.exports) for tests. */
(function (root) {
  const PF = {
    FORM_CODE: 'F-WI06-PRD04-01 Rev.05',
    FORM_CODE_PC: 'F-WI07-PRD03-01 Rev.00',
    TYPES: { Output: 'FG', WIP: 'WIP', SEMI: 'SEMI', Hold: 'Hold', Reject: 'Reject' },
    ROWS: 20, DAY_FROM: 8, TZ: 'Asia/Bangkok',
    XLSX_FONT: 'TH SarabunPSK',
  };

  /* ---------- time in Asia/Bangkok (same as Utilities.formatDate with the project zone) ---------- */
  const DTF = new Intl.DateTimeFormat('en-GB', { timeZone: PF.TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23' });
  function fmt(t, p) {
    const o = {};
    DTF.formatToParts(new Date(t)).forEach((x) => { o[x.type] = x.value; });
    const n = (k) => Number(o[k]) % (k === 'hour' ? 24 : 1e9), pad = (v, w) => String(v).padStart(w, '0');
    const map = { yyyy: pad(n('year'), 4), MM: pad(n('month'), 2), M: String(n('month')), dd: pad(n('day'), 2), d: String(n('day')),
      HH: pad(n('hour'), 2), H: String(n('hour')), mm: pad(n('minute'), 2), ss: pad(n('second'), 2) };
    return p.replace(/yyyy|MM|M|dd|d|HH|H|mm|ss/g, (k) => map[k]);
  }
  const isD = (v) => v instanceof Date || (v !== null && typeof v === 'object' && '$d' in v);
  const ms = (v) => (v instanceof Date ? v.getTime() : isD(v) ? Number(v.$d) : 0);
  function pfTrue(v) { return v === true || v === 1 || /^(TRUE|1|Y|YES)$/i.test(String(v).trim()); }
  // Stop_Time: the main script read the sheet's display text and took the first H:MM — a date cell shows its time, so format it here
  const stopText = (v) => (isD(v) ? fmt(ms(v), 'HH:mm') : v == null ? '' : String(v));

  /* ---------- pages: pfBuildPages_ (main script) unchanged except fmt ---------- */
  function pfBuildPages(fg, recs, runs, shift, merge) {
    const num = (v) => { const n = parseInt(String(v), 10); return isNaN(n) ? 1e9 : n; };
    const be = (t) => { const d = fmt(t, 'd/M/yyyy').split('/'); return d[0] + '/' + d[1] + '/' + (+d[2] + 543); };
    const types = Object.keys(PF.TYPES);
    const rows = recs.map((x) => Object.assign({}, x, {
      RecordType: x.RecordType === 'Output' && pfTrue(x.WIP) ? 'WIP' : x.RecordType === 'Output' && x._item ? 'SEMI' : String(x.RecordType),
    })).filter((x) => types.indexOf(x.RecordType) >= 0)
      .sort((a, b) => a.t - b.t || num(a.Pallet_No) - num(b.Pallet_No) || a.c - b.c);
    rows.forEach((x) => {
      x.team = String(x.Packing_Team || '').trim();
      x.key = x.RecordType + '|' + fmt(x.t - PF.DAY_FROM * 3600e3, 'yyyyMMdd') + '|' + x.team;
      x.stop = '';
    });
    const stops = runs.filter((x) => !/เดินเครื่อง/.test(x.Process)).map((x) => x.t).sort((a, b) => a - b);
    ['Output', 'WIP', 'SEMI'].forEach((type) => {
      const out = rows.filter((x) => x.RecordType === type);
      out.forEach((x, i) => {
        const next = out.slice(i + 1).find((y) => y.t > x.t);
        let t = next && next.key === x.key ? next.t : 0;
        if (!t) {
          const until = next ? next.t : x.t + 12 * 3600e3;
          t = stops.find((s) => s > x.t && s <= until) || 0;
        }
        x.stop = t ? fmt(t, 'HH:mm') : '';
      });
    });
    rows.forEach((x) => {
      const own = String(x.Stop_Time || '').match(/(\d{1,2}):(\d{2})/);
      if (own) x.stop = ('0' + own[1]).slice(-2) + ':' + own[2];
    });
    const pack = String(fg.Packaging_Detail || '').split(/\r?\n/).map((s) => s.trim());
    const dupKey = (x) => String(x.Pallet_No).trim() === '' ? '' :
      x.RecordType + '|' + (/^(Output|WIP|SEMI)$/.test(x.RecordType) ? '' : x.key.split('|')[1]) + '|' + String(x.Pallet_No).trim();
    const cnt = {};
    rows.forEach((x) => { const k = dupKey(x); if (k) cnt[k] = (cnt[k] || 0) + 1; });
    const dupBy = {};
    Object.keys(cnt).filter((k) => cnt[k] > 1).forEach((k) => {
      const p = k.split('|'), g = types.indexOf(p[0]) + '|' + PF.TYPES[p[0]] + (p[1] ? ' ' + +p[1].slice(6) + '/' + +p[1].slice(4, 6) : '');
      (dupBy[g] = dupBy[g] || []).push(p[2]);
    });
    const dups = Object.keys(dupBy).sort().map((g) => {
      const n = dupBy[g].sort((a, b) => num(a) - num(b)), out = [];
      let from = n[0], prev = n[0];
      n.slice(1).concat([null]).forEach((v) => {
        if (v !== null && num(v) === num(prev) + 1) { prev = v; return; }
        out.push(from === prev ? from : from + '–' + prev); from = prev = v;
      });
      return g.split('|')[1] + ' #' + out.join(', ');
    });
    const groups = {};
    const inShift = (x) => !shift || fmt(x.t - PF.DAY_FROM * 3600e3, 'yyyy-MM-dd') + '|' + [0, 8, 16][Math.floor(+fmt(x.t, 'H') / 8)] === shift;
    const gk = (x) => merge ? x.key.split('|').slice(0, 2).join('|') : x.key;
    rows.filter(inShift).forEach((x) => (groups[gk(x)] = groups[gk(x)] || []).push(x));
    const keys = Object.keys(groups).sort((a, b) =>
      types.indexOf(a.split('|')[0]) - types.indexOf(b.split('|')[0]) || groups[a][0].t - groups[b][0].t);
    const span = (c) => {
      const f = c[0], l = c[c.length - 1], d1 = be(f.t), d2 = be(l.t);
      return { day: d1 === d2 ? d1 : d1.replace(/\/\d+$/, '') + ' – ' + d2, shift: fmt(f.t, 'HH:mm') + ' – ' + (l.stop || fmt(l.t, 'HH:mm')) };
    };
    const pages = [];
    keys.forEach((k) => {
      const g = groups[k], first = g[0], last = g[g.length - 1], item = first._item || fg;
      const d1 = be(first.t), d2 = be(last.t);
      const head = {
        type: PF.TYPES[first.RecordType], team: first.team,
        day: d1 === d2 ? d1 : d1.replace(/\/\d+$/, '') + ' – ' + d2,
        shift: fmt(first.t, 'HH:mm') + ' – ' + (last.stop || fmt(last.t, 'HH:mm')),
        fg: first._item ? Object.assign({}, fg, first._item) : null,
      };
      for (let i = 0; i < g.length; i += PF.ROWS) {
        const chunk = g.slice(i, i + PF.ROWS);
        pages.push(Object.assign({}, head, span(chunk), {
          team: [...new Set(chunk.map((x) => x.team).filter(String))].join(' / '),
          sup: [...new Set(chunk.map((x) => String(x.Sup_Pack || '').trim()).filter(String))].join(' / '),
          bags: chunk.reduce((s, x) => s + (Number(x.Output_Bag) || 0), 0),
          kg: chunk.reduce((s, x) => s + (Number(x.Output_Kg) || 0), 0),
          rows: chunk.map((x, j) => [
            j + 1,
            j === 0 ? item.FGID : j === 1 ? item.FG_Name : '',
            j === 0 ? fg.Lot_Number : '',
            pack[j] || '',
            j === 0 ? '/' : '',
            x.WeightInput, x.Packing_bin || '', String(x.Pallet_No), x.Output_Bag,
            fmt(x.t, 'HH:mm'), x.stop, x.Storage_Location || '',
            [j === 0 ? fg.Pack_Number : '', j === 0 && PF.TYPES[x.RecordType] !== 'FG' ? PF.TYPES[x.RecordType] : '',
              cnt[dupKey(x)] > 1 ? 'ซ้ำ' : '', String(x.Comment || '').trim()].filter(String).join(' '),
          ]),
        }));
      }
    });
    pages.dups = dups;
    return pages;
  }

  /* ---------- the export: same checks, names and message as packingFormExport ---------- */
  // o = {fg (FG_Lot row), det (FG_Detail rows), recs (Packing_Record rows of the lot), runs (Packing_Runtime rows), shift, merge, now, formType?}
  function build(o) {
    const fg = o.fg;
    if (!fg) throw new Error('ไม่พบ FG Lot นี้');
    const id = String(fg.FGLotID);
    const detRows = o.det || [];

 * Reads: anything the run has not loaded yet (a store request, a sheet tab, the jobs) stops the run; it is fetched and the run starts again.
 * Writes (write: true): the run's pkp_put / pkp_computed / job changes are applied to its own copy and kept; when the run ends they go to
 * Supabase in ONE call (pkw_commit) together with a fingerprint of every request the run read. Supabase applies them only if none of those
 * reads changed meanwhile (that is what the script lock did) — else the run starts again on fresh rows.
 * Anything else the run tries (sheet write, webhook, Drive, a non-job property) = blocked → the caller uses Apps Script as before.
 * Works in the browser and in node (tests). */
function makeLR(o) {
  // o = { src, rdCtx: async (sheets) → ctx, store: async (ticket, reqs) → [ {h, rows, v, kc?} | {jobs, v} ],
  //       commit: async (ticket, fn, reads, ops, comp, jobs) → {ok} | {ok:false, conflict}, sheetsFor: {fn: [...]},
  //       env: { Date, uuid, random } (tests only) }
  const RealDate = Date, BKK = 7 * 3600e3;
  const NAMES = ['Date', 'Math', 'SpreadsheetApp', 'PropertiesService', 'CacheService', 'LockService', 'Session', 'Logger', 'HtmlService',
    'ContentService', 'ScriptApp', 'DriveApp', 'Utilities', 'UrlFetchApp', 'console', '__LR'];
  const OK_SHEETS = { FG_Detail: 1, Packing_App_Users: 1, Product_Detail: 1, RuntimeType: 1, NCP_Detail: 1, Production_NCP_Map: 1, Production_Lot: 1, NCP: 1, Packing_Form_Export: 1 };
  const QUIET = { pkp_flush_take: 1 };   // the sheet copy: Apps Script's 5-min job does it
  const last = {}, sheetsFor = Object.assign({}, o.sheetsFor || {}), X = o.env || {};
  let factory = null, factoryFns = '';

  function compile(fns) {
    // session_: the user comes from rdCtx (checked by Apps Script); the role check stays the same
    const src = o.src.replace('function session_(token, role, pinChange) {',
      'function session_(token, role, pinChange) { const u = users_().find(function (x) { return x.id === __LR.meId && x.active; });\n' +
      "  if (!u) throw new Error('AUTH'); if (!roleOk_(u.Role, role)) throw new Error('สิทธิ์ไม่พอสำหรับรายการนี้'); return u; }\n" +
      'function session__srv(token, role, pinChange) {');
    if (src === o.src) throw new Error('LR_SRC');
    // eslint-disable-next-line no-new-func
    return new Function(...NAMES, src + '\nreturn {' + fns.map((f) => JSON.stringify(f) + ': typeof ' + f + " === 'function' ? " + f + ' : null').join(', ') + '};');
  }

  const pad = (n) => String(n).padStart(2, '0');
  function fmtDate(d, tz, f) {
    const t = new RealDate(d.getTime() + BKK);
    const m = { yyyy: t.getUTCFullYear(), MM: pad(t.getUTCMonth() + 1), dd: pad(t.getUTCDate()), HH: pad(t.getUTCHours()), mm: pad(t.getUTCMinutes()), ss: pad(t.getUTCSeconds()), H: String(t.getUTCHours()) };
    return String(f).replace(/yyyy|MM|dd|HH|mm|ss|H/g, (k) => m[k]);
  }
  const b64 = (bytes) => { let s = ''; for (const b of bytes) s += String.fromCharCode(b & 255); return typeof btoa === 'function' ? btoa(s) : Buffer.from(s, 'binary').toString('base64'); };
  function pseudoDigest(s) {   // cache keys only (the cache here is empty) — not a real MD5
    s = String(s); const out = []; let h = 2166136261;
    for (let k = 0; k < 16; k++) { for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i) + k; h = Math.imul(h, 16777619) >>> 0; } out.push(h & 255); }
    return out;
  }
  const nz = (v) => (v == null ? null : v);
  const key = (b) => JSON.stringify([b.p_tab, nz(b.p_col), nz(b.p_vals), nz(b.p_tail)]);
  const unkey = (k) => { const a = JSON.parse(k); return { p_tab: a[0], p_col: a[1], p_vals: a[2], p_tail: a[3] }; };
  const txt = (v) => (v == null ? null : typeof v === 'object' ? JSON.stringify(v) : String(v));
  const strip = (d) => { const r = {}; Object.keys(d || {}).forEach((k) => { if (d[k] !== null && d[k] !== undefined) r[k] = d[k]; }); return r; };
  const clone = (v) => JSON.parse(JSON.stringify(v));

  function Sheet(name, v, W) { this.name = name; this.v = v; this.W = W; }
  Sheet.prototype.getLastRow = function () { let n = this.v.length; while (n > 0 && this.v[n - 1].every((x) => x === '' || x == null)) n--; return n; };
  Sheet.prototype.getLastColumn = function () { return Math.max(0, ...this.v.map((r) => { let n = r.length; while (n > 0 && (r[n - 1] === '' || r[n - 1] == null)) n--; return n; })); };
  Sheet.prototype.cell = function (r, c) { const row = this.v[r - 1]; return row && row[c - 1] !== undefined ? row[c - 1] : ''; };
  Sheet.prototype.getRange = function (r, c, nr, nc) { return new Range(this, r, c, nr || 1, nc || 1); };
  Sheet.prototype.getDataRange = function () { return new Range(this, 1, 1, Math.max(this.getLastRow(), 1), Math.max(this.getLastColumn(), 1)); };
  Sheet.prototype.getName = function () { return this.name; };
  ['appendRow', 'getRangeList', 'insertRowsAfter', 'deleteRow', 'clear', 'setFrozenRows'].forEach((m) => { Sheet.prototype[m] = function () { return this.W('sheet.' + m); }; });
  function Range(sh, r, c, nr, nc) { this.sh = sh; this.r = r; this.c = c; this.nr = nr; this.nc = nc; }
  Range.prototype.getValues = function () { const out = []; for (let i = 0; i < this.nr; i++) { const row = []; for (let j = 0; j < this.nc; j++) row.push(this.sh.cell(this.r + i, this.c + j)); out.push(row); } return out; };
  Range.prototype.getValue = function () { return this.sh.cell(this.r, this.c); };
  Range.prototype.getRow = function () { return this.r; };
  Range.prototype.getA1Notation = function () { let n = this.c, c = ''; while (n > 0) { const m = (n - 1) % 26; c = String.fromCharCode(65 + m) + c; n = (n - m - 1) / 26; } return c + this.r; };
  Range.prototype.getNumRows = function () { return this.nr; };
  ['setValues', 'setValue', 'setNumberFormat', 'clearContent'].forEach((m) => { Range.prototype[m] = function () { return this.sh.W('range.' + m); }; });
  Range.prototype.createTextFinder = function (t) {
    const rg = this;
    return { matchEntireCell() { return this; }, findAll() {
      const out = [];
      rg.getValues().forEach((row, i) => row.forEach((x, j) => { if (String(x instanceof RealDate ? '' : x) === t) out.push(new Range(rg.sh, rg.r + i, rg.c + j, 1, 1)); }));
      return out;
    } };
  };

  /* ---- the rows this run has: base = as read from Supabase, cur = base + this run's own writes ---- */
  function load(S, q, res) {
    if (q.p_tab === '__jobs') { S.jobs = Object.assign({}, res.jobs || {}); S.reqs.set(key(q), res.v); return; }
    const t = S.tabs[q.p_tab] || (S.tabs[q.p_tab] = { h: res.h, kc: res.kc, rows: new Map() });
    t.h = res.h; if (res.kc != null) t.kc = res.kc;
    (res.rows || []).forEach((r) => { const d = Object.assign({}, r); delete d._k; delete d._s; t.rows.set(String(r._k), { d: d, s: r._s }); });
    S.reqs.set(key(q), res.v);
  }
  function runView(S) {   // a fresh copy of the rows for one run (its writes stay in it)
    const tabs = {};
    Object.keys(S.tabs).forEach((n) => { const t = S.tabs[n]; tabs[n] = { h: t.h, kc: t.kc, rows: new Map(Array.from(t.rows, ([k, r]) => [k, { d: r.d, s: r.s }])) }; });
    return { tabs: tabs, jobs: S.jobs ? Object.assign({}, S.jobs) : null, ops: [], comp: [], jobOps: [], hooks: [], used: new Set(), blocked: [] };
  }
  function answer(V, q) {
    const t = V.tabs[q.p_tab];
    let rows = Array.from(t.rows, ([k, r]) => ({ k: k, d: r.d, s: r.s })).sort((a, b) => a.s - b.s);
    if (q.p_col == null) { if (q.p_tail != null) rows = rows.slice(-q.p_tail); }
    else {
      const vals = (q.p_vals || []).map(String), byKey = t.kc && q.p_col === t.kc;
      rows = rows.filter((r) => vals.indexOf(byKey ? r.k : txt(r.d[q.p_col])) >= 0);
    }
    return { h: t.h, rows: rows.map((r) => Object.assign({}, r.d, { _k: r.k, _s: r.s })) };
  }
  function applyPut(V, ops) {
    let n = 0;
    ops.forEach((op) => {
      let t = V.tabs[op.tab];
      if (!t && op.op === 'ins') t = V.tabs[op.tab] = { h: null, kc: null, rows: new Map() };   // append to a tab this run did not read (a log): Supabase refuses a duplicate key
      if (!t) { V.blocked.push('put ' + op.tab + ' (not read)'); throw new Error('LR_BLOCKED'); }
      (op.rows || []).forEach((x) => {
        if (!x.k) throw new Error('PKP_KEY ' + op.tab + ' (no key)');
        const k = String(x.k), cur = t.rows.get(k);
        if (op.op === 'ins') {
          if (cur) throw new Error('PKP_DUP ' + op.tab + ' ' + k);
          let mx = 0; t.rows.forEach((r) => { if (r.s > mx) mx = r.s; });
          t.rows.set(k, { d: strip(x.d), s: mx + 1, mine: true });
        } else if (op.op === 'upd' || op.op === 'rep') {
          if (!cur) { V.blocked.push(op.op + ' ' + op.tab + ' ' + k + ' (not read)'); throw new Error('LR_BLOCKED'); }
          let d;
          if (op.op === 'upd') { d = strip(Object.assign({}, cur.d, x.set)); Object.keys(x.set || {}).forEach((c) => { if (x.set[c] === null) delete d[c]; }); }
          else d = strip(x.d);
          t.rows.set(k, { d: d, s: cur.s, mine: cur.mine });
        } else if (op.op === 'del') t.rows.delete(k);
        else throw new Error('PKP_OP ' + op.op);
        n++;
      });
    });
    V.ops.push(...clone(ops));
    return { ok: true, n: n };
  }
  function applyComp(V, b) {
    const t = V.tabs[b.p_tab]; let n = 0;
    if (!t) { V.blocked.push('computed ' + b.p_tab + ' (not read)'); throw new Error('LR_BLOCKED'); }
    (b.p_rows || []).forEach((x) => {
      const cur = t.rows.get(String(x.k)); if (!cur) return;
      const d = strip(Object.assign({}, cur.d, x.set)); Object.keys(x.set || {}).forEach((c) => { if (x.set[c] === null) delete d[c]; });
      t.rows.set(String(x.k), { d: d, s: cur.s, mine: cur.mine }); n++;
    });
    V.comp.push({ tab: b.p_tab, rows: clone(b.p_rows || []) });
    return { n: n };
  }

  function env(ctx, S, V, miss, write) {
    const off = ctx.serverNow - ctx.at;
    class SD extends RealDate {
      constructor(...a) { if (!a.length) super(RealDate.now() + off); else super(...a); }
      static now() { return RealDate.now() + off; }
    }
    const D = X.Date || SD;
    const W = (what) => { V.blocked.push(what); throw new Error('LR_BLOCKED ' + what); };
    const dec = (x) => (x && typeof x === 'object' && x.$d != null ? new D(x.$d) : x);
    const sheets = {};
    Object.keys(ctx.sheets || {}).forEach((n) => { sheets[n] = new Sheet(n, ctx.sheets[n].map((r) => r.map(dec)), W); });
    const ss = {
      getSheetByName: (n) => { if (sheets[n]) return sheets[n]; if (OK_SHEETS[n]) { miss.sheets.push(n); throw new Error('LR_MISS sheet ' + n); } miss.other.push('sheet ' + n); throw new Error('LR_SHEET ' + n); },
      insertSheet: () => W('insertSheet'), getNumSheets: () => 99, getSheets: () => Object.values(sheets)
    };
    const resp = (v) => ({ getResponseCode: () => 200, getContentText: () => JSON.stringify(v) });
    const noop = () => {};
    const read = (q) => { const k = key(q); if (!S.reqs.has(k)) { miss.store.push(q); throw new Error('LR_MISS store'); } V.used.add(k); return answer(V, q); };
    const jobsQ = { p_tab: '__jobs', p_col: null, p_vals: null, p_tail: null };
    const math = X.random ? Object.assign(Object.create(Math), { random: X.random }) : Math;
    return {
      Date: D, Math: math,
      SpreadsheetApp: { openById: () => ss, getActive: () => ss, flush: noop },
      PropertiesService: { getScriptProperties: () => ({
        getProperty: (k) => (k === 'PK_KEY' ? 'phone' : Object.prototype.hasOwnProperty.call(ctx.props, k) ? ctx.props[k] : null),   // the real key never leaves Apps Script
        getProperties: () => Object.assign({}, ctx.props), setProperty: (k) => W('prop ' + k), deleteProperty: (k) => W('prop ' + k) }) },
      CacheService: { getScriptCache: () => ({ get: () => null, getAll: () => ({}), put: noop, putAll: noop, remove: noop, removeAll: noop }) },
      LockService: { getScriptLock: () => ({ waitLock: noop, tryLock: () => true, releaseLock: noop, hasLock: () => true }), getUserLock: () => ({ tryLock: () => true, releaseLock: noop }) },
      Session: { getActiveUser: () => ({ getEmail: () => '' }), getEffectiveUser: () => ({ getEmail: () => '' }), getScriptTimeZone: () => 'Asia/Bangkok' },
      Logger: { log: noop }, HtmlService: {}, ContentService: {}, ScriptApp: {}, DriveApp: {},
      Utilities: {
        formatDate: fmtDate, getUuid: X.uuid || (() => (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'u' + Math.random().toString(36).slice(2))),
        Charset: { UTF_8: 'utf8' }, DigestAlgorithm: { MD5: 'md5', SHA_256: 'sha256' },
        computeDigest: (alg, s) => pseudoDigest(s), computeHmacSha256Signature: () => W('hmac'),
        base64Encode: b64, base64EncodeWebSafe: (b) => b64(b).replace(/\+/g, '-').replace(/\//g, '_'),
        newBlob: () => W('blob'), gzip: () => W('gzip'), ungzip: () => W('gzip'), base64Decode: () => W('b64d'), sleep: noop
      },
      UrlFetchApp: { fetch: (url, opt) => {
        const fn = String(url).split('/rpc/')[1], b = fn ? JSON.parse(opt.payload) : {};
        if (fn === 'pkp_get') return resp(read(b));
        if (fn === 'pkp_get_many') {
          const reqs = b.p_reqs.map((q) => ({ p_tab: q.tab, p_col: q.col, p_vals: q.vals, p_tail: q.tail }));
          const lack = reqs.filter((q) => !S.reqs.has(key(q)));
          if (lack.length) { miss.store.push(...lack); throw new Error('LR_MISS store'); }
          return resp(reqs.map(read));
        }
        if (fn === 'pkj_get') { if (!S.jobs) { miss.store.push(jobsQ); throw new Error('LR_MISS jobs'); } V.used.add(key(jobsQ)); return resp(Object.assign({}, V.jobs)); }
        if (write && fn === 'pkp_put') return resp(applyPut(V, b.p_ops || []));
        if (write && fn === 'pkp_computed') return resp(applyComp(V, b));
        if (write && fn === 'pkj_put') {
          if (!V.jobs) { V.blocked.push('job write before jobs read'); throw new Error('LR_BLOCKED'); }
          if (b.p_job == null) delete V.jobs[b.p_slot]; else V.jobs[b.p_slot] = String(b.p_job);
          V.jobOps.push({ slot: b.p_slot, j: b.p_job == null ? null : String(b.p_job) });
          return resp({ ok: true });
        }
        if (write && fn === 'pkh_add') { V.hooks.push(b.p_body); return resp({ ok: true }); }   // v92: a main-script call goes with the save (queued)
        if (QUIET[fn]) throw new Error('LR_QUIET ' + fn);   // swallowed by the app (sheet copy later)
        return W('fetch ' + (fn || 'webhook'));
      } },
      console: { log: noop, info: noop, warn: noop, error: noop },
      __LR: { meId: ctx.me.id }
    };
  }

  // the context from Apps Script; sheet tabs the phone already has (same hash) are not sent again
  const sheetCache = {};
  let lastTicket = null;
  async function getCtx(want) {
    const have = {};
    want.forEach((n) => { if (sheetCache[n]) have[n] = sheetCache[n].hash; });
    const c = await o.rdCtx(want, have);
    if (!c) return c;
    c.sheets = c.sheets || {};
    Object.keys(c.same || {}).forEach((n) => { if (sheetCache[n]) c.sheets[n] = sheetCache[n].v; });
    Object.keys(c.hash || {}).forEach((n) => { if (c.sheets[n] && !(c.same || {})[n]) sheetCache[n] = { hash: c.hash[n], v: c.sheets[n] }; });
    if (c.ticket) lastTicket = c.ticket;
    return c;
  }
  // fn(token, ...args) run here. Returns the same JSON the server would send. write: its saves go to Supabase in one checked call.
  async function run(fns, fn, token, args, write) {
    if (!factory || factoryFns !== fns.join(',')) { factory = compile(fns); factoryFns = fns.join(','); }
    let want = (sheetsFor[fn] || []).slice();
    let ctx = await getCtx(want);
    if (!ctx || !ctx.ticket || ctx.props.DB_PRIMARY !== '1') throw new Error('LR_OFF');
    if (write && (ctx.props.DB_JOBS !== '1' || !o.commit)) throw new Error('LR_OFF write');
    ctx.at = RealDate.now();
    const lk = fn + JSON.stringify(args);
    for (let attempt = 0; attempt < 4; attempt++) {
      const S = { tabs: {}, reqs: new Map(), jobs: null };
      let conflict = false;
      let pre = (last[lk] || []).slice();
      for (let round = 0; round < 10; round++) {
        const need = pre.filter((q, i) => !S.reqs.has(key(q)) && pre.findIndex((x) => key(x) === key(q)) === i);
        if (need.length) {
          const res = await o.store(ctx.ticket, need.map((q) => ({ tab: q.p_tab, col: nz(q.p_col), vals: nz(q.p_vals), tail: nz(q.p_tail) })));
          need.forEach((q, i) => load(S, q, res[i]));
        }
        const miss = { store: [], sheets: [], other: [] }, V = runView(S);
        const E = env(ctx, S, V, miss, write);
        let out, err = null;
        if (X.onRun) X.onRun();   // tests: replay the same ids from the start of each run
        try { const G = factory(...NAMES.map((n) => E[n])); out = G[fn](token, ...args); } catch (e) { err = e; }
        if (miss.other.length) throw new Error('LR_OTHER ' + miss.other[0]);
        if (miss.sheets.length) {
          want = Array.from(new Set(want.concat(miss.sheets)));
          sheetsFor[fn] = want;
          const c2 = await getCtx(want);
          if (!c2 || !c2.ticket) throw new Error('LR_OFF');
          c2.at = RealDate.now(); ctx = c2;
          continue;
        }
        if (miss.store.length) { pre = pre.concat(miss.store); continue; }
        if (V.blocked.length) throw new Error('LR_BLOCKED ' + V.blocked[0]);
        if (err) throw err;
        last[lk] = Array.from(S.reqs.keys()).map(unkey);
        const result = JSON.parse(JSON.stringify(out === undefined ? null : out));
        if (!V.ops.length && !V.comp.length && !V.jobOps.length && !V.hooks.length) return result;
        if (!write) throw new Error('LR_WRITE (read mode)');
        const reads = Array.from(V.used).map((k) => { const q = unkey(k); return { tab: q.p_tab, col: q.p_col, vals: q.p_vals, tail: q.p_tail, v: S.reqs.get(k) }; });
        const c = await o.commit(ctx.ticket, fn, reads, V.ops, V.comp, V.jobOps, V.hooks);
        if (c && c.ok) return result;
        if (!c || !c.conflict) throw new Error('LR_COMMIT ' + JSON.stringify(c).slice(0, 200));
        conflict = true;
        break;   // someone changed what this run read → read again and run again
      }
      if (!conflict) throw new Error('LR_LOOP');
    }
    throw new Error('LR_BUSY — มีการบันทึกพร้อมกันหลายเครื่อง ลองอีกครั้ง');
  }
  return { run, sheetsFor, ticket: () => lastTicket };
}

const PK_SRC = "/**\n * Packing Record — mobile web app (standalone Apps Script project).\n * Appends rows to Packing_Record in BFL Production-Dep. Never deletes rows. Edits to existing rows are Sup-only:\n * % ลอยน้ำ (setFloat) and moving an FG/WIP pallet to Hold (moveToHold).\n * Adds one tab (Packing_App_Users) at the end of the spreadsheet. Jobs live in Script Properties.\n */\nconst CFG = {\n  SHEET_ID: '', // BFL Production-Dep\n  FG_LOT: 'FG_Lot',\n  REC: 'Packing_Record',\n  USERS: 'Packing_App_Users',\n  PACKING_STATUS: 'packing',\n  BINS: {\n    'PACK-3': ['BIN-1', 'BIN-2', 'BIN-3', 'BIN-4', 'BIN-5', 'BIN-6'],\n    'PACK-4': ['BIN-7', 'BIN-8', 'BIN-9', 'BIN-10', 'BIN-11', 'BIN-12']\n  },\n  STORES: ['คลัง FG', 'คลัง WIP', 'คลัง SEMI', 'คลัง PD'],\n  TYPES: {\n    FG: { recordType: 'Output', wip: false, perLot: true, store: 'คลัง FG' },\n    WIP: { recordType: 'Output', wip: true, perLot: true, store: 'คลัง WIP' },\n    SEMI: { recordType: 'Output', wip: false, perLot: true, store: 'คลัง SEMI' }, // Output of a SEMI item (Pack_Item, or a SEMI lot)\n    Hold: { recordType: 'Hold', wip: false, perLot: false, store: 'คลัง PD' },\n    Reject: { recordType: 'Reject', wip: false, perLot: false, store: 'คลัง PD' }\n  },\n  TOKEN_HOURS: 14,\n  ACTIVE_LOCK_HOURS: 6,\n  MAX_BAGS: 500,\n  // Roles: team = start/stop its own jobs (one team per shift may hold jobs on several machines),\n  // sup = set jobs + Return + record for any team (leader on leave), admin = everything sup does + manage users.\n  SEED_USERS: [],\n  ROLES: ['team', 'sup', 'admin', 'viewer'], // viewer = เห็นรายงาน + Export ฟอร์มบรรจุ อย่างเดียว\n  USER_HEADERS: ['User_ID', 'Name', 'Role', 'PIN_Hash', 'Active', 'Updated_At', 'Updated_By'],\n  // Tab ข้อมูล (Sup/Admin): FG Lot is the parent; Runtime / bin receive / NCP / export are filled from the lot.\n  RUNTIME: 'Packing_Runtime', BIN: 'Packing_BinReceive', NCP: 'NCP', NCP_DETAIL: 'NCP_Detail', NCP_MAP: 'Production_NCP_Map',\n  FG_DETAIL: 'FG_Detail', PRODUCT: 'Product_Detail', PLOT: 'Production_Lot', RTYPE: 'RuntimeType', EXPORT: 'Packing_Form_Export',\n  // Bluefalo Production_Lot web app (doPost): recalc, Reject → NCP, packing form export. Script Property RECALC_URL overrides.\n  HOOK_URL: '',\n  RT_GROUPS: [['Runtime', 'เดินเครื่อง'], ['Planned-Downtime', 'หยุดตามแผน'], ['PD-Downtime', 'หยุดจากการผลิต'], ['Machine-Downtime', 'เครื่องเสีย']],\n  RT_OTHER: 'PK-อื่นๆ',\n  // Packing_Record has no unit column: a Bigbag row = Output_Bag 1 (or bigbag count) with WeightInput = kg per bigbag.\n  // ponytail: unit is read back as Bigbag when WeightInput > 50 kg (bags here are ≤ 25 kg); add a unit column if that ever overlaps.\n  BIGBAG_MIN_KG: 50,\n  UNIT_TYPES: ['WIP', 'SEMI', 'Hold'], // types Sup may pack as Bag or Bigbag\n  SEMI_BAG_KG: 20, // SEMI in bags: kg/bag when FG_Detail has none (Sup can change it); SEMI bigbag is weighed per bag\n  // FG bags/pallet when FG_Detail.Default_Bags is empty, by the first word of FG_Name (user-set 13 Oct). KOI = fish food.\n  SPECIES_BAGS: { FISH: 48, KOI: 48, DOG: 60, BIRD: 48 },\n  BACKDATE_DAYS: 31,\n  // Old material used in a later lot (SEMI / Hold of an earlier round). Each use adds its kg to Production_Lot.Old_Semi\n  // (= Total_Input) of the lot that uses it; a Hold also gets a Return row in its own lot (Hold − Return).\n  OLD: 'Old_Semi_Use',\n  OLD_HEADERS: ['UseID', 'FGLotID', 'Lot_Number', 'ProductionID', 'Src_Type', 'Src_FGLotID', 'Src_Lot_Number', 'Src_Name', 'Src_RecordID',\n    'Return_RecordID', 'Bags', 'Kg', 'Comment', 'Cancelled', 'CreatedBy', 'CreateTimestamp', 'UpdatedTimestamp'],\n  OLD_DAYS: 120,\n  // Tab รายงาน: \"แจ้งยอดแล้ว\" per FG lot (tab made on the first tick; not an AppSheet table).\n  NOTIFY: 'Lot_Notify', NOTIFY_HEADERS: ['FGLotID', 'Lot_Number', 'Notified', 'Notified_At', 'Notified_By'],\n  // หน้า ระดับอาหารในถัง (Sup, user 29 Oct): one row per bin per 4-hour round (tab made on the first save, not an AppSheet table).\n  // Saving the same round again overwrites its rows. Slot = the round's time \"HH:MM\" as text: the 4-hourly rounds below\n  // or any time the Sup picks (user 29 Oct 11:08). Rows saved before that hold the hour as a number (8) — read as \"08:00\".\n  BIN_LOG: 'Bin_Level_Log',\n  BIN_LOG_HEADERS: ['LogID', 'Production_Date', 'Slot', 'Saved_At', 'Pack_Number', 'Bin_Number', 'Level', 'Filling', 'FGLotID',\n    'Lot_Number', 'FG_Name', 'Density', 'Volume_L', 'Kg', 'Saved_By', 'UpdatedTimestamp'],\n  BIN_SLOTS: ['08:00', '12:00', '16:00', '20:00', '00:00', '04:00'],\n  // Level 0 ว่าง · 1 hopper · 2–5 = ช่วง 1–4. Volume (litres) of each part, bottom up: [hopper, ช่วง 1, 2, 3, 4].\n  // User 29 Oct: hopper 1.4 m³ · each ช่วง 4 m³ (all 12 bins the same). Density (g/L) is typed at each save.\n  BIN_VOL: [1400, 4000, 4000, 4000, 4000],\n  MAX_ORDER_TON: 5000,\n  // Pallet type (user 20 Oct): Sup sets it per job, the team can switch it per pallet (one lot may mix both) → Packing_Record.Pallet_Type\n  PALLET_TYPES: ['ไม้', 'เหล็ก'],\n  // default by FG_Detail.Form_Type (user 20 Oct): BFL = พาเลทเหล็ก · BFL-PC (also written BFLPC) = พาเลทไม้\n  PALLET_BY_FORM: { BFL: 'เหล็ก', BFLPC: 'ไม้' },\n  REQUIRED: ['RecordID', 'FGLotID', 'Lot_Number', 'Pack_Number', 'DateTimeRecords', 'RecordType', 'Pallet_No',\n    'Floating_Percent', 'Output_Bag', 'WeightInput', 'Output_Kg', 'Cancelled', 'CreateTimestamp', 'UpdatedTimestamp',\n    'CreatedBy', 'LotFGKey', 'Comment', 'NCP_Status', 'Visible', 'Packing_Team', 'Packing_bin', 'Production_Date',\n    'Stop_Time', 'Storage_Location', 'WIP', 'Sup_Pack']\n};\nconst HOUR = 3600e3;\n\n/* ---------- pure helpers (covered by check.js) ---------- */\n\n// Production day starts 08:00 Asia/Bangkok (UTC+7, no DST).\nfunction prodDateKey_(ms) { return new Date(ms + 7 * HOUR - 8 * HOUR).toISOString().slice(0, 10); }\nfunction dayDate_(key) { return new Date(key + 'T00:00:00+07:00'); }\nfunction truthy_(v) { return v === true || /^(true|y|yes|1)$/i.test(String(v == null ? '' : v).trim()); }\nfunction rowType_(r) {\n  const rt = String(r.RecordType || '').trim();\n  return rt === 'Output' ? (truthy_(r.WIP) ? 'WIP' : isSemiRow_(r) ? 'SEMI' : 'FG') : rt;\n}\n// A row is SEMI when the item packed (Pack_Item) is a SEMI item in FG_Detail. Rows without Pack_Item (before v20)\n// follow their lot: LotFGKey = Lot|LotType|FGID|PackType|Pack. Same rule in the main script and AppSheet.\nlet SEMI_ITEMS_ = null;\nfunction semiItems_() {\n  return SEMI_ITEMS_ || (SEMI_ITEMS_ = new Set(table_(CFG.FG_DETAIL).rows\n    .filter(function (r) { return String(r.LotType).trim().toUpperCase() === 'SEMI'; }).map(function (r) { return String(r.FGID).trim(); })));\n}\nfunction isSemiRow_(r) {\n  const it = String(r.Pack_Item || '').trim();\n  return it ? semiItems_().has(it) : String(r.LotFGKey || '').split('|')[1] === 'SEMI';\n}\n// The item a job of this type packs: SEMI on an FG lot = FG_Detail.SEMI_Code of the lot's FG; Hold keeps what was being packed.\nfunction itemOf_(lot, type, cur) {\n  if (type === 'SEMI' && lot.lotType !== 'SEMI' && !lot.semi) throw new Error('สินค้า ' + lot.fgid + ' ยังไม่มี SEMI_Code ใน FG_Detail');\n  const code = type === 'SEMI' && lot.lotType !== 'SEMI' ? lot.semi : type === 'Hold' && cur && cur.fgLotId === lot.id && cur.item ? cur.item : lot.fgid;\n  return code === lot.semi && lot.semi ? { item: code, name: lot.semiName, weight: lot.semiWeight, bags: lot.semiBags }\n    : { item: code, name: lot.name, weight: lot.weight, bags: lot.defBags };\n}\n// FG and WIP share one running number across the whole lot (bags and bigbags alike); Hold/Reject restart each\n// production day. Stricter than the AppSheet Valid_If (which checks FG and WIP apart), so it never conflicts with it.\nconst numGroup_ = function (t) { return t === 'WIP' ? 'FG' : t; };\nfunction usedPallets_(rows, type, atMs) {\n  const T = CFG.TYPES[type], key = numGroup_(type), day = prodDateKey_(atMs), used = new Set();\n  rows.forEach(function (r) {\n    if (truthy_(r.Cancelled) || numGroup_(rowType_(r)) !== key) return;\n    if (!T.perLot) {\n      const t = r.DateTimeRecords || r.CreateTimestamp;\n      if (!t || prodDateKey_(new Date(t).getTime()) !== day) return;\n    }\n    const n = Number(r.Pallet_No);\n    if (n > 0) used.add(n);\n  });\n  return used;\n}\n// The job's next no., stepped back over numbers whose rows were all cancelled (in the app or in AppSheet),\n// so a cancelled last pallet frees its number. Gaps left on purpose (moved to Hold, typed by Sup) have no cancelled row and stay.\nfunction nextFree_(job, rows, at) {\n  const T = CFG.TYPES[job.type], key = numGroup_(job.type), day = prodDateKey_(at), used = usedPallets_(rows, job.type, at), dead = new Set();\n  rows.forEach(function (r) {\n    if (!truthy_(r.Cancelled) || numGroup_(rowType_(r)) !== key) return;\n    const t = r.DateTimeRecords || r.CreateTimestamp;\n    if (!T.perLot && (!t || prodDateKey_(new Date(t).getTime()) !== day)) return;\n    dead.add(Number(r.Pallet_No));\n  });\n  let n = Number(job.pallet) || 1;\n  while (n > 1 && dead.has(n - 1) && !used.has(n - 1)) n--;\n  // taken meanwhile (e.g. recorded in AppSheet after the job was set): jump past the lot's last number\n  return [n, n + 1].slice(0, job.mode === 2 ? 2 : 1).some(function (x) { return used.has(x); }) ? nextPallet_(used) : n;\n}\n// admin can do everything sup can. 'view' = read reports / export forms (viewer, sup, admin). 'work' = any role but viewer\n// (team calls that write: start / stop / record / recalc / tag printed).\nfunction roleOk_(have, need) {\n  if (need === 'view') return have === 'viewer' || have === 'sup' || have === 'admin';\n  if (need === 'work') return have !== 'viewer';\n  return !need || have === need || (need === 'sup' && have === 'admin');\n}\n// Reject is not packed directly: it only comes from deciding a Hold pallet (disposeHold).\n// FG lot: FG / WIP (+ SEMI when its FG item has a SEMI_Code) / Hold. SEMI lot: SEMI / Hold.\nfunction typesFor_(lot) { return lot.lotType === 'SEMI' ? ['SEMI', 'Hold'] : ['FG', 'WIP'].concat(lot.semi ? ['SEMI'] : [], ['Hold']); }\n// Names on screen (user 3 Nov): sheet keys stay — Output+WIP flag shows as HOLD (FG รอผล QC), RecordType Hold shows as WIP (ระหว่างกระบวนการ).\n// Comment links written to the sheet (\"จาก Hold #\", \"ย้ายจาก WIP #\") keep the keys: they are parsed back (HOLD_TAG_ / MOVED_TAG_).\nfunction TN_(t) { return { WIP: 'HOLD', Hold: 'WIP' }[t] || t; }\n// A pallet's Comment as the phone shows it: the stored links read with the new names.\nfunction tnNote_(c) { return String(c || '').replace(/ย้ายจาก WIP #/g, '\\u0001').replace(/จาก Hold #/g, 'จาก WIP #').replace(/\\u0001/g, 'ย้ายจาก HOLD #'); }\nfunction unitOf_(r) { return Number(r.WeightInput) > CFG.BIGBAG_MIN_KG ? 'Bigbag' : 'Bag'; }\nfunction withWait_(note, waitMin) {\n  const n = String(note || '').trim(), w = Math.round(Number(waitMin) || 0);\n  return (w > 0 ? (n ? n + ' · ' : '') + 'รออาหาร ' + w + ' นาที' : n).slice(0, 500);\n}\n// Per-pallet value from the phone: one number for every pallet, or one value per pallet (2-pallet mode).\nfunction perPallet_(v, n, lo, hi, label) {\n  const a = Array.isArray(v) ? v : Array.from({ length: n }, function () { return v; });\n  if (a.length !== n) throw new Error(label + ' ไม่ครบทุกพาเลท');\n  return a.map(function (x) { return intIn_(x, lo, hi, label); });\n}\nfunction joinNote_() { return Array.prototype.filter.call(arguments, function (x) { return String(x || '').trim(); }).join(' · ').slice(0, 500); }\n// Pallet started under an older job version is still this team's pallet after Sup switches FG ⇄ Hold mid-pallet.\nfunction verOk_(job, ver) { return job.ver === ver || (job.okVers || []).indexOf(ver) >= 0; }\n// Bins used for a round: 1 normally, 2 when bins are mixed or the bin was changed mid-pallet (old first). Missing = the job's bins.\nfunction binsFor_(v, pack, fallback) {\n  const a = (Array.isArray(v) && v.length ? v : [].concat(fallback)).map(String), ok = CFG.BINS[pack] || [];\n  if (a.length > 2 || new Set(a).size !== a.length) throw new Error('เลือกถังได้ 1–2 ถัง');\n  a.forEach(function (b) { if (ok.length && ok.indexOf(b) < 0) throw new Error('ถังบรรจุ ' + b + ' ไม่ใช่ของ ' + pack); });\n  return a.join(' , '); // AppSheet EnumList separator\n}\nfunction nextPallet_(used) { let m = 0; used.forEach(function (n) { if (n > m) m = n; }); return m + 1; }\nfunction toObjs_(headers, values) {\n  return values.map(function (v) { const o = {}; headers.forEach(function (h, i) { o[h] = v[i]; }); return o; });\n}\n\n/* ---------- sheet access ---------- */\n\nlet SS_;\nfunction ss_() { return SS_ || (SS_ = SpreadsheetApp.openById(CFG.SHEET_ID)); }\nfunction sheet_(name) {\n  const sh = ss_().getSheetByName(name);\n  if (!sh) throw new Error('ไม่พบแท็บ ' + name);\n  return sh;\n}\nfunction headers_(sh) { return sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String); }\nfunction withLock_(fn) {\n  const l = LockService.getScriptLock();\n  l.waitLock(20000);\n  const fresh0 = DB_FRESH_;\n  try { if (localW_()) { DB_FRESH_ = true; DB_MEMO_ = {}; } return fn(); } finally {\n    DB_FRESH_ = fresh0;\n    l.releaseLock(); try { const c = CacheService.getScriptCache(); c.put('live_v', Date.now().toString(36), 21600); c.remove('pk_users'); } catch (e) { } // a write here → other phones reload (liveStamp)\n    if (DB_DIRTY_ && !DB_NOFLUSH_) { DB_DIRTY_ = false; try { pkFlush_(); } catch (e) { console.warn('sheet copy: ' + e.message); } } // copy into the sheet now (the 5-min job catches anything missed)\n  }\n}\n// Realtime (user 9 Nov 2026): every phone asks every 5 s. Reads only sheet sizes, the jobs (script properties) and the write mark above — no rows.\nfunction liveStamp(token, opt) {\n  session_(token, null, true);\n  const st = pkStamp_(true);\n  // phones that read Supabase themselves (opt.local, v87) need no start screen made ahead\n  if (!(opt && opt.local)) { try { pkWarm_(PK.POLL_MS); } catch (e) { console.warn('warm: ' + e.message); } }   // หน้าเริ่มของ Sup พร้อมไว้ให้คนถัดไป\n  return st;\n}\n/* ---------- อ่านตรงจาก Supabase (v87, user 14 Nov 2026 \"ย้ายไปดึงจาก supabase ตรงเลย\") ----------\n * The phone runs this file's own read functions (getState …) on rows it reads itself from Supabase (pkr_get), so opening a screen\n * uses no UrlFetch. rdCtx gives what is not in Supabase — the jobs (script properties), small sheet tabs, and a read ticket\n * uid.role.exp.sig signed with 'pkr|' + sha256(PK_KEY) (Supabase checks it against pk_key.key_hash; v88). PIN hashes are blanked. */\nconst RD_SHEETS_ = { FG_Detail: 1, Packing_App_Users: 1, Product_Detail: 1, RuntimeType: 1, NCP_Detail: 1, Production_NCP_Map: 1, Production_Lot: 1, NCP: 1, Packing_Form_Export: 1 };\nfunction rdCtx(token, want, have) {\n  const me = session_(token), same = {}, hash = {};\n  const all = PropertiesService.getScriptProperties().getProperties(), props = { DB_PRIMARY: all.DB_PRIMARY || '', DB_JOBS: all.DB_JOBS || '', PK_LOCAL_W: all.PK_LOCAL_W || '' };\n  if (all.DB_JOBS !== '1') Object.keys(all).forEach(function (k) { if (k.indexOf('JOB_') === 0) props[k] = all[k]; });\n  const sheets = {};\n  (want || []).forEach(function (n) {\n    if (!Object.prototype.hasOwnProperty.call(RD_SHEETS_, n) || isDb_(n) || sheets[n]) return;\n    const sh = ss_().getSheetByName(n); if (!sh) return;\n    let v = sh.getDataRange().getValues();\n    if (n === CFG.USERS) { const i = v[0].map(String).indexOf('PIN_Hash'); if (i >= 0) v = v.map(function (r, j) { if (!j) return r; r = r.slice(); r[i] = ''; return r; }); }\n    const enc = v.map(function (r) { return r.map(function (x) { return x instanceof Date ? { $d: x.getTime() } : x; }); });\n    // the phone keeps tabs it already has: only a changed tab is sent again (v90)\n    const hx = Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, JSON.stringify(enc), Utilities.Charset.UTF_8));\n    hash[n] = hx;\n    if (have && have[n] === hx) same[n] = 1; else sheets[n] = enc;\n  });\n  return { me: { id: me.id, name: me.Name, role: me.Role }, ticket: props.DB_PRIMARY === '1' ? rdTicket_(me) : null, props: props, sheets: sheets,\n    same: same, hash: hash, serverNow: Date.now() };\n}\nfunction rdTicket_(me) {\n  if (!prop_('PK_KEY')) return null;\n  const exp = Date.now() + 2 * HOUR;\n  return [me.id, me.Role, exp, pkSig_([me.id, me.Role, exp].join('|'), 'pkr|')].join('.');\n}\n/* ---------- เปิดเร็ว (user 10 Nov 2026) — แบบเดียวกับ Production ----------\n * stamp = จำนวนแถว Packing_Record / FG_Lot + UpdatedTimestamp ล่าสุดในแถวท้าย (AppSheet แก้แถวเดิม) + งานที่ตั้งไว้ + เครื่องหมายการเขียนของแอป\n * หน้าเริ่ม (getState) เก็บผลไว้ GS_TTL วิ ใช้ร่วมกันตราบที่ stamp ยังเท่าเดิม (Sup / Admin เห็นเหมือนกัน · ทีมแพคแยกตามชื่อทีม)\n * liveStamp (ทุก 5 วิ) และการเปิด Hub (__warm) คำนวณหน้าเริ่มของ Sup ไว้ล่วงหน้าเมื่อข้อมูลเปลี่ยน · รายชื่อผู้ใช้เก็บไว้ 60 วิ (การเขียนล้างทันที) */\nconst PK = { GS_TTL: 120, RD_TTL: 300, RD_MIN: 180, FRESH: 15e3, POLL_MS: 6000, WARM_MS: 25000, TAIL: 300, ED_EVERY: 5 };\nlet PK_ST_ = null;\nfunction pkStamp_(fresh) {\n  if (PK_ST_ && (!fresh || PK_ST_.fresh)) return PK_ST_.v;\n  const c = CacheService.getScriptCache();\n  if (!fresh) { const at = Number(c.get('pk_st_at') || 0), v = c.get('pk_st'); if (v && Date.now() - at < PK.FRESH) { PK_ST_ = { v: v, fresh: false }; return v; } }\n  const db = dbOn_(), n = db ? [] : [CFG.REC, CFG.FG_LOT].map(function (t) { return sheet_(t).getLastRow(); });\n  const all = PropertiesService.getScriptProperties().getProperties(); let s = '', x = 0;\n  if (db && all.DB_JOBS === '1') s = 'pkj' + (c.get('pkj_v') || '');\n  else Object.keys(all).filter(function (k) { return k.indexOf('JOB_') === 0; }).sort().forEach(function (k) { s += k + all[k]; });\n  for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0;\n  const v = (db ? 'db.' + x : n.join('.') + '.' + x + '.' + pkEdMarks_(n).join('.')) + '|' + (c.get('live_v') || '');\n  c.putAll({ pk_st: v, pk_st_at: String(Date.now()) }, 21600);\n  PK_ST_ = { v: v, fresh: true };\n  return v;\n}\n// newest UpdatedTimestamp in the last TAIL rows of Packing_Record and FG_Lot (shared for ED_EVERY s)\nfunction pkEdMarks_(lasts) {\n  const c = CacheService.getScriptCache(), hit = c.get('pk_edm'); if (hit) return hit.split('.');\n  const out = [CFG.REC, CFG.FG_LOT].map(function (t, i) {\n    try {\n      const sh = sheet_(t), last = lasts[i]; if (last < 2) return '0';\n      let col = Number(c.get('pk_edc_' + t) || 0);\n      if (!col) { col = headers_(sh).map(function (x) { return x.trim(); }).indexOf('UpdatedTimestamp') + 1 || -1; c.put('pk_edc_' + t, String(col), 21600); }\n      if (col < 1) return '0';\n      const k = Math.min(PK.TAIL, last - 1); let m = 0;\n      sh.getRange(last - k + 1, col, k, 1).getValues().forEach(function (r) { const d = r[0] instanceof Date ? r[0].getTime() : 0; if (d > m) m = d; });\n      return m.toString(36);\n    } catch (e) { return '0'; }\n  });\n  c.put('pk_edm', out.join('.'), PK.ED_EVERY);\n  return out;\n}\nfunction pkView_(me) { return me.Role === 'sup' || me.Role === 'admin' ? 'S' : me.Role === 'viewer' ? 'V' : 'T:' + me.Name; }\nfunction pkKey_(view) {\n  return 'pkgs_' + Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, pkStamp_(false) + '#' + view, Utilities.Charset.UTF_8)).slice(0, 22);\n}\n// compute the Sup start screen ahead when the data changed (one device at a time)\nfunction pkWarm_(budget) {\n  const c = CacheService.getScriptCache(), key = pkKey_('S');\n  if (c.get(key) && c.get(pkKey_('R' + prodDateKey_(Date.now()).slice(0, 7)))) return '';\n  if (c.get('pk_busy')) return '';\n  const me = Utilities.getUuid(); c.put('pk_busy', me, Math.ceil(budget / 1000) + 30); if (c.get('pk_busy') !== me) return '';\n  try {\n    if (!c.get(key)) state_({ id: '', Name: '', Role: 'sup' }, key);\n    const ym = prodDateKey_(Date.now()).slice(0, 7), rk = pkKey_('R' + ym);   // หน้าภาพรวม = รายงานเดือนนี้\n    try { if (!pkGet_(rk)) pkPut_(rk, reportRecent_(ym), PK.RD_TTL); } catch (e) { console.warn('warm report: ' + e.message); return 'S'; }\n    return 'S+R';\n  } finally { if (c.get('pk_busy') === me) c.remove('pk_busy'); }\n}\n// shared results: JSON, or gzip + base64 in ≤ 90 KB pieces when large\nfunction pkPut_(key, obj, ttl) {\n  try {\n    const c = CacheService.getScriptCache(), s = JSON.stringify(obj);\n    if (s.length < 90000) { c.put(key, '0|' + s, ttl); return; }\n    const b = Utilities.base64Encode(Utilities.gzip(Utilities.newBlob(s, 'application/json')).getBytes()), o = {}; let k = 0;\n    if (b.length > 90000 * 30) return;\n    for (let i = 0; i < b.length; i += 90000) o[key + '_' + (k++)] = b.slice(i, i + 90000);\n    c.putAll(o, ttl + 10); c.put(key, String(k) + '|', ttl);\n  } catch (e) { console.warn('cache put: ' + e.message); }\n}\nfunction pkGet_(key) {\n  try {\n    const c = CacheService.getScriptCache(), head = c.get(key); if (!head) return null;\n    const i = head.indexOf('|'), k = Number(head.slice(0, i));\n    if (!k) return JSON.parse(head.slice(i + 1));\n    const keys = []; for (let j = 0; j < k; j++) keys.push(key + '_' + j);\n    const got = c.getAll(keys); let b = '';\n    for (let j = 0; j < k; j++) { if (got[keys[j]] == null) return null; b += got[keys[j]]; }\n    return JSON.parse(Utilities.ungzip(Utilities.newBlob(Utilities.base64Decode(b), 'application/x-gzip')).getDataAsString('UTF-8'));\n  } catch (e) { console.warn('cache get: ' + e.message); return null; }\n}\n\nfunction packingLots_() {\n  const cache = CacheService.getScriptCache(), hit = cache.get('lots');\n  if (hit) return JSON.parse(hit);\n  const fgd = {};\n  table_(CFG.FG_DETAIL).rows.forEach(function (r) { fgd[String(r.FGID).trim()] = r; });\n  const lots = table_(CFG.FG_LOT).rows\n    .filter(function (r) { return String(r.Status).trim().toLowerCase() === CFG.PACKING_STATUS && !truthy_(r.Cancelled); })\n    .map(function (r) {\n      const fgid = String(r.FGID).trim(), d = fgd[fgid] || {}, lotType = String(r.LotType).trim().toUpperCase() === 'SEMI' ? 'SEMI' : 'FG';\n      const semi = lotType === 'FG' ? String(d.SEMI_Code || '').trim() : '', sd = fgd[semi] || {};\n      return { id: String(r.FGLotID), lot: String(r.Lot_Number), pack: String(r.Pack_Number), fgid: fgid,\n        name: String(r.FG_Name), weight: Number(r.StdWeight) || 0, key: String(r.LotFGKey), lotType: lotType, pid: String(r.ProductionID),\n        defBags: Number(d.Default_Bags) || speciesBags_(r.FG_Name) || 0, semi: semi, semiName: semi ? String(sd.FG_Name || semi) : '',\n        semiWeight: Number(sd.Weight) || 0, semiBags: Number(sd.Default_Bags) || 0, floatOn: floatOn_(r.FG_Name), form: String(d.Form_Type || '').trim(), ptDef: ptDefault_(d.Form_Type) };\n    });\n  cache.put('lots', JSON.stringify(lots), 60);\n  return lots;\n}\nfunction ptDefault_(form) { return CFG.PALLET_BY_FORM[String(form || '').toUpperCase().replace(/[^A-Z]/g, '')] || ''; }\n// % ลอยน้ำ is kept only for fish and koi feed (FG_Name starts with FISH / KOI, user-set 14 Oct); other lots write it blank.\nfunction floatOn_(name) { return /^\\s*(FISH|KOI)/i.test(String(name || '')); }\n// \"DOG18% …\" → 60 · \"FISH26% …\" → 48; other species (CAT) = none.\nfunction speciesBags_(name) { return CFG.SPECIES_BAGS[String(name || '').trim().toUpperCase().replace(/[^A-Z].*$/, '')] || 0; }\n// The bags Sup sets on an FG / SEMI job become that item's FG_Detail.Default_Bags, so the next lot starts from it.\nfunction rememberBags_(item, bags) {\n  const t = table_(CFG.FG_DETAIL), r = t.rows.find(function (x) { return String(x.FGID).trim() === String(item); });\n  if (!r || Number(r.Default_Bags) === bags || t.h.indexOf('Default_Bags') < 0) return;\n  setCells_(t, r, { Default_Bags: bags });\n  CacheService.getScriptCache().remove('lots');\n}\nfunction lot_(id) {\n  const l = packingLots_().find(function (x) { return x.id === String(id); });\n  if (!l) throw new Error('ล็อตนี้ไม่อยู่ในสถานะ Packing แล้ว');\n  return l;\n}\n// StdWeight from FG_Lot; SEMI lots often have none, so Sup types kg per bag.\n// Std kg/bag of the item packed: FG_Detail / StdWeight; a SEMI item without one = CFG.SEMI_BAG_KG.\nfunction stdKg_(lot, it) {\n  const w = Number(it ? it.weight : lot.weight) || 0;\n  return w || (semiItems_().has(it ? it.item : lot.fgid) ? CFG.SEMI_BAG_KG : 0);\n}\n// FG: the StdWeight (or typed when there is none). SEMI: what Sup typed, else the default — it can be changed.\nfunction weightFor_(lot, given, it) {\n  const std = stdKg_(lot, it), w = Number(given), ok = w > 0 && w <= 3000;\n  if (ok && semiItems_().has(it ? it.item : lot.fgid)) return w;\n  if (std > 0) return std;\n  if (!ok) throw new Error((it ? it.item : 'ล็อต ' + lot.lot) + ' ไม่มีน้ำหนักต่อถุง — ใส่น้ำหนักต่อถุง (kg)');\n  return w;\n}\n\n// Rows of one FG lot only: TextFinder on FGLotID, then one block read — stays fast as the sheet grows.\nfunction lotRows_(fgLotId) {\n  if (PREF_ && PREF_[String(fgLotId)]) return PREF_[String(fgLotId)]; // read once for every lot of the start screen (state_)\n  return rowsWhere_(CFG.REC, 'FGLotID', fgLotId);\n}\nfunction rowsWhere_(name, column, value) {\n  if (isDb_(name)) return dbTable_(name, column, String(value) ? [String(value)] : []);\n  return sheetWhere_(name, column, value);\n}\nfunction sheetWhere_(name, column, value) {\n  const sh = sheet_(name), h = headers_(sh), col = h.indexOf(column) + 1, last = sh.getLastRow();\n  if (!col || last < 2 || !String(value)) return { sh: sh, h: h, rows: [] };\n  const hits = sh.getRange(2, col, last - 1, 1).createTextFinder(String(value)).matchEntireCell(true).findAll();\n  if (!hits.length) return { sh: sh, h: h, rows: [] };\n  const nums = hits.map(function (r) { return r.getRow(); });\n  const a = Math.min.apply(null, nums), b = Math.max.apply(null, nums), keep = new Set(nums);\n  const all = sh.getRange(a, 1, b - a + 1, h.length).getValues(), vals = [], at = [];\n  all.forEach(function (v, i) { if (keep.has(a + i)) { vals.push(v); at.push(a + i); } });\n  const rows = toObjs_(h, vals);\n  rows.forEach(function (r, i) { r._row = at[i]; }); // sheet row, for setFloat\n  return { sh: sh, h: h, rows: rows };\n}\n// Packing_Record.Pallet_Type: added once at the end of the header row (AppSheet keeps writing its own columns; this one stays blank there).\nfunction ptCol_(lr) {\n  if (lr.h.indexOf('Pallet_Type') >= 0) return;\n  if (lr.sh && lr.sh.db) { lr.h.push('Pallet_Type'); return; }\n  lr.sh.getRange(1, lr.h.length + 1).setValue('Pallet_Type');\n  lr.h.push('Pallet_Type');\n}\nfunction appendRows_(sh, h, objs) {\n  if (sh && sh.db) return dbAppend_(sh.db, h, objs);\n  const out = objs.map(function (o) { return h.map(function (c) { return c in o ? o[c] : ''; }); });\n  sh.getRange(sh.getLastRow() + 1, 1, out.length, h.length).setValues(out);\n}\n\n/* ---------- users & sessions ---------- */\n\nfunction prop_(k, make) {\n  const p = PropertiesService.getScriptProperties();\n  let v = p.getProperty(k);\n  if (!v && make) { v = Utilities.getUuid() + Utilities.getUuid(); p.setProperty(k, v); }\n  return v;\n}\nlet SALT_;\nfunction hash_(id, pin) {\n  SALT_ = SALT_ || prop_('SALT', true);\n  return Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,\n    SALT_ + '|' + id + '|' + pin, Utilities.Charset.UTF_8));\n}\n// A PIN someone else set (setup / Admin add or reset) is stored as '!' + hash = temporary.\n// Temporary, or still a starting PIN (0000 / 1234 / 9999) = the user must set their own PIN before anything else.\nfunction tempPins_() { return CFG.SEED_USERS.map(function (s) { return s[2]; }); }\nfunction pinOk_(u, pin) { return String(u.PIN_Hash).replace(/^!/, '') === hash_(u.id, String(pin)); }\nfunction mustChange_(u) { return String(u.PIN_Hash).charAt(0) === '!' || tempPins_().some(function (p) { return pinOk_(u, p); }); }\nfunction sign_(s) { return Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(s, prop_('SECRET', true))); }\nfunction usersSheet_() {\n  let sh = ss_().getSheetByName(CFG.USERS);\n  if (!sh) {\n    sh = ss_().insertSheet(CFG.USERS, ss_().getNumSheets());\n    sh.appendRow(CFG.USER_HEADERS);\n  }\n  return sh;\n}\nfunction users_() {\n  if (isDb_(CFG.USERS)) {   // v92: the users tab lives in Supabase\n    return table_(CFG.USERS).rows.map(function (u) { u.row = u._row; u.id = String(u.User_ID); u.active = truthy_(u.Active); return u; });\n  }\n  let v = null;\n  try { const hit = CacheService.getScriptCache().get('pk_users'); if (hit) v = JSON.parse(hit); } catch (e) { }\n  if (!v) { v = usersSheet_().getDataRange().getValues().map(function (r) { return r.map(function (x) { return x instanceof Date ? x.getTime() : x; }); });\n    try { const s = JSON.stringify(v); if (s.length < 90000) CacheService.getScriptCache().put('pk_users', s, 60); } catch (e) { } }\n  const h = v.shift().map(String);\n  return toObjs_(h, v).map(function (u, i) { u.row = i + 2; u.id = String(u.User_ID); u.active = truthy_(u.Active); return u; });\n}\nfunction publicUsers_() { return users_().map(function (u) { return { id: u.id, name: u.Name, role: u.Role, active: u.active }; }); }\nfunction addUser_(sh, name, role, pin, by) {\n  const id = 'U' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);\n  if (isDb_(CFG.USERS)) { const t = table_(CFG.USERS); return appendRows_(t.sh, t.h, [{ User_ID: id, Name: name, Role: role, PIN_Hash: '!' + hash_(id, pin), Active: true, Updated_At: new Date(), Updated_By: by }]); }\n  sh.appendRow([id, name, role, '!' + hash_(id, pin), true, new Date(), by]);\n}\n// one user row ← values (Supabase or the sheet)\nfunction userSet_(u, vals) {\n  if (isDb_(CFG.USERS)) { const t = table_(CFG.USERS), r = t.rows.find(function (x) { return String(x.User_ID) === u.id; }); if (r) dbSet_(CFG.USERS, t.h, [r], vals); return; }\n  const h = CFG.USER_HEADERS;\n  Object.keys(vals).forEach(function (k) { const c = h.indexOf(k) + 1; if (c) usersSheet_().getRange(u.row, c).setValue(vals[k]); });\n}\nfunction session_(token, role, pinChange) {\n  const p = String(token || '').split('|');\n  if (p.length !== 3 || p[2] !== sign_(p[0] + '|' + p[1]) || Date.now() > Number(p[1])) throw new Error('AUTH');\n  const u = users_().find(function (x) { return x.id === p[0] && x.active; });\n  if (!u) throw new Error('AUTH');\n  if (!roleOk_(u.Role, role)) throw new Error('สิทธิ์ไม่พอสำหรับรายการนี้');\n  if (!pinChange && mustChange_(u)) throw new Error('PIN_CHANGE');\n  return u;\n}\n\n/* ---------- jobs (up to 2 per packing machine) ----------\n   Slot = the job's key: 'PACK-3' (งาน 1) or 'PACK-3-2' (งาน 2), e.g. the last lot still being sorted while the next lot packs.\n   job.pack stays the real machine (Pack_Number, bins); every job call from the phone names the slot. */\nfunction slots_(pack) { return [pack, pack + '-2']; }\nfunction slotOf_(job) { return job.slot || job.pack; } // jobs saved before 2 slots: slot = pack\n/* Jobs (v90): Script Properties JOB_<slot>, or — Script Property DB_JOBS = '1' with the store on — Supabase table pk_job (slot → the same\n * JSON text), so phones that save straight to Supabase share them. pkJobsToStore / pkJobsToProps move them (editor). */\nlet JOBS_ = null;\nfunction jobsDb_() { return dbOn_() && PropertiesService.getScriptProperties().getProperty('DB_JOBS') === '1'; }\nfunction jobsAll_() {\n  if (jobsDb_()) { if (!JOBS_) JOBS_ = dbCall_('pkj_get', {}) || {}; return JOBS_; }\n  const all = PropertiesService.getScriptProperties().getProperties(), o = {};\n  Object.keys(all).forEach(function (k) { if (k.indexOf('JOB_') === 0) o[k.slice(4)] = all[k]; });\n  return o;\n}\nfunction job_(slot) { const v = jobsAll_()[slot]; if (!v) return null; const j = JSON.parse(v); j.slot = slot; return j; }\nfunction setJob_(pack, job) {\n  if (jobsDb_()) {\n    dbCall_('pkj_put', { p_slot: pack, p_job: job ? JSON.stringify(job) : null }); JOBS_ = null;\n    try { CacheService.getScriptCache().put('pkj_v', Date.now().toString(36), 21600); } catch (e) { /* stamp only */ }\n    return;\n  }\n  const p = PropertiesService.getScriptProperties();\n  if (job) p.setProperty('JOB_' + pack, JSON.stringify(job)); else p.deleteProperty('JOB_' + pack);\n}\nfunction jobs_() {\n  const all = jobsAll_();\n  return Object.keys(all).sort().map(function (k) { const j = JSON.parse(all[k]); j.slot = k; return j; });\n}\n// editor: jobs Script Properties → Supabase, then DB_JOBS on (under the script lock: no save meanwhile)\nfunction pkJobsToStore() {\n  const l = LockService.getScriptLock(); l.waitLock(30000);\n  try {\n    if (!dbOn_()) throw new Error('store off');\n    const p = PropertiesService.getScriptProperties(), all = p.getProperties(), o = {};\n    Object.keys(all).forEach(function (k) { if (k.indexOf('JOB_') === 0) o[k.slice(4)] = all[k]; });\n    const r = Object.keys(o).map(function (k) { return dbCall_('pkj_put', { p_slot: k, p_job: o[k] }); }).length;   // pk_job is empty here (pkj_load's DELETE is refused by the API)\n    p.setProperty('DB_JOBS', '1'); JOBS_ = null;\n    return { jobs: Object.keys(o).length, store: r };\n  } finally { l.releaseLock(); }\n}\n// editor: jobs Supabase → Script Properties, then DB_JOBS off\nfunction pkJobsToProps() {\n  const l = LockService.getScriptLock(); l.waitLock(30000);\n  try {\n    const p = PropertiesService.getScriptProperties(), o = dbCall_('pkj_get', {}) || {}, all = p.getProperties();\n    Object.keys(all).forEach(function (k) { if (k.indexOf('JOB_') === 0) p.deleteProperty(k); });\n    Object.keys(o).forEach(function (k) { p.setProperty('JOB_' + k, o[k]); });\n    p.setProperty('DB_JOBS', '0'); JOBS_ = null;\n    return { jobs: Object.keys(o).length };\n  } finally { l.releaseLock(); }\n}\nfunction busy_(job) { return job && job.active && Date.now() - job.active.startAt < CFG.ACTIVE_LOCK_HOURS * HOUR; }\n// Two open jobs of one lot and type would share pallet numbers — refused.\nfunction twin_(job, type) {\n  const o = jobs_().find(function (j) { return j.slot !== job.slot && j.fgLotId === job.fgLotId && j.type === type; });\n  if (o) throw new Error('ล็อตนี้มีงาน ' + TN_(type) + ' เปิดอยู่แล้วที่ ' + o.pack + ' — ใช้งานเดิม');\n}\n// Team: only its own jobs (anti-sabotage). Sup/Admin: any job, recorded for the job's team.\nfunction myJob_(me, slot) {\n  const job = job_(slot), pack = job ? job.pack : slot;\n  if (!job) throw new Error('ไม่มีงานที่ ' + pack + ' — ติดต่อ Sup');\n  if (me.Role === 'team' && job.team !== me.Name) throw new Error('ไม่มีงานของทีม ' + me.Name + ' ที่ ' + pack + ' — ติดต่อ Sup');\n  return job;\n}\nfunction intIn_(v, lo, hi, label) {\n  const n = Number(v);\n  if (!(Math.floor(n) === n && n >= lo && n <= hi)) throw new Error(label + ' ต้องอยู่ระหว่าง ' + lo + '–' + hi);\n  return n;\n}\n\n/* ---------- web app entry & setup ---------- */\n\nfunction doGet(e) {\n  const p = e && e.parameter && e.parameter.p;\n  if (p) return palletPage_(p); // QR on the pallet tag\n  return HtmlService.createHtmlOutputFromFile('Index')\n    .setTitle('Packing Record')\n    .setFaviconUrl('https://raw.githubusercontent.com/skaart19bfl/bfl-app-assets/main/packing-logo-64.png') // app logo on GitHub (bfl-app-assets)\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL); // BFL Hub shows this app inside its page (user 9 Nov 2026)\n}\n\n// Run once from the editor: creates Packing_App_Users with the starting users and checks Packing_Record headers.\nfunction setup() {\n  const sh = usersSheet_(), have = users_().map(function (u) { return u.Name; });\n  CFG.SEED_USERS.forEach(function (s) { if (have.indexOf(s[0]) < 0) addUser_(sh, s[0], s[1], s[2], 'setup'); });\n  const h = headers_(sheet_(CFG.REC)), missing = CFG.REQUIRED.filter(function (c) { return h.indexOf(c) < 0; });\n  Logger.log(missing.length ? 'Packing_Record ขาดคอลัมน์: ' + missing.join(', ') : 'Packing_Record มีครบทุกคอลัมน์');\n}\n\n/* ---------- API (google.script.run) ---------- */\n\nfunction listLogin() {\n  return publicUsers_().filter(function (u) { return u.active; });\n}\n\nfunction login(id, pin) {\n  const cache = CacheService.getScriptCache(), k = 'fail_' + id, fails = Number(cache.get(k) || 0);\n  if (fails >= 5) throw new Error('ใส่ PIN ผิดหลายครั้ง รอ 5 นาทีแล้วลองใหม่');\n  const u = users_().find(function (x) { return x.id === String(id) && x.active; });\n  if (!u || !pinOk_(u, pin)) {\n    cache.put(k, String(fails + 1), 300);\n    throw new Error('PIN ไม่ถูกต้อง');\n  }\n  cache.remove(k);\n  const s = u.id + '|' + (Date.now() + CFG.TOKEN_HOURS * HOUR);\n  return { token: s + '|' + sign_(s), me: { id: u.id, name: u.Name, role: u.Role }, serverNow: Date.now(), mustChange: mustChange_(u) };\n}\n\n/* ---------- BFL Hub single login (user 9 Nov 2026) ----------\n * The Hub opens this app with ?hub=<one-time ticket>. Supabase (bfl-production · hub_redeem) accepts the ticket once and names the\n * Packing_App_Users id this Hub user is mapped to; we then issue our normal token. PIN login here works exactly as before. */\nconst HUB = { URL: 'https://kdytxuufvigwjccebrki.supabase.co/rest/v1/rpc/hub_redeem', KEY: 'sb_publishable_IYCMIaN7tJleWINprA42CQ_dX10sXFF', APP: 'pack' };\nfunction hubRedeem_(ticket) {\n  const t = String(ticket || ''); if (!/^[0-9a-f]{48}$/.test(t)) throw new Error('ลิงก์จาก Hub ไม่ถูกต้อง — เปิดจาก Hub ใหม่');\n  const res = UrlFetchApp.fetch(HUB.URL, { method: 'post', contentType: 'application/json', headers: { apikey: HUB.KEY, Authorization: 'Bearer ' + HUB.KEY },\n    payload: JSON.stringify({ p_ticket: t, p_app: HUB.APP }), muteHttpExceptions: true });\n  const r = res.getResponseCode() === 200 ? JSON.parse(res.getContentText()) : null;\n  if (!r || !r.ok) throw new Error('Hub ยืนยันตัวตนไม่ได้ — กลับไปที่ Hub แล้วเปิดใหม่');\n  return r;\n}\nfunction hubLogin(ticket) { return hubToken_(hubRedeem_(ticket)); }\n// v89 (14 Nov 2026): the phone redeemed the Hub ticket with Supabase itself (hub_redeem_pk); its answer is signed with\n// 'hub|' + sha256(PK_KEY), checked here — so opening from the Hub works even when the UrlFetch quota is used up.\nfunction hubLogin2(p) {\n  p = p || {};\n  const body = ['hub', HUB.APP, String(p.account), String(p.exp), String(p.at)].join('|');\n  if (!p.ok || !p.sig || String(p.sig) !== pkSig_(body, 'hub|') || !(Math.abs(Date.now() - Number(p.at)) < 5 * 60e3)) throw new Error('Hub ยืนยันตัวตนไม่ได้ — กลับไปที่ Hub แล้วเปิดใหม่');\n  return hubToken_(p);\n}\n// HMAC-SHA256 (base64url, no '=') of body with prefix + sha256-hex(PK_KEY) — Supabase signs / checks the same way with pk_key.key_hash\nfunction pkSig_(body, prefix) {\n  const k = prop_('PK_KEY'); if (!k) throw new Error('ยังไม่ได้ตั้ง PK_KEY');\n  const hx = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, k, Utilities.Charset.UTF_8).map(function (b) { return ('0' + (b & 255).toString(16)).slice(-2); }).join('');\n  return Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(body, prefix + hx)).replace(/=+$/, '');\n}\nfunction hubToken_(r) {\n  const u = users_().find(function (x) { return x.id === String(r.account) && x.active; });\n  if (!u) throw new Error('บัญชีที่ Hub ผูกไว้ไม่มีหรือปิดใช้งานในแอปนี้ — แจ้ง Admin');\n  const exp = Math.min(Number(r.exp) || 0, Date.now() + CFG.TOKEN_HOURS * HOUR);\n  if (!(exp > Date.now())) throw new Error('เซสชัน Hub หมดอายุ — login ที่ Hub ใหม่');\n  const s = u.id + '|' + exp;\n  return { token: s + '|' + sign_(s), me: { id: u.id, name: u.Name, role: u.Role }, serverNow: Date.now(), mustChange: mustChange_(u) };\n}\n\n// First login (or after Admin reset): the user sets their own 4-digit PIN.\nfunction changePin(token, pin) {\n  const me = session_(token, null, true), p = String(pin || '');\n  if (!/^\\d{4}$/.test(p)) throw new Error('PIN ต้องเป็นตัวเลข 4 หลัก');\n  if (tempPins_().indexOf(p) >= 0) throw new Error('ห้ามใช้ ' + tempPins_().join(' / ') + ' — ตั้งรหัสอื่น');\n  if (pinOk_(me, p)) throw new Error('ใช้รหัสเดิมไม่ได้ — ตั้งรหัสใหม่');\n  return withLock_(function () {\n    userSet_(me, { PIN_Hash: hash_(me.id, p), Active: true, Updated_At: new Date(), Updated_By: me.Name });\n    return true;\n  });\n}\n\nfunction getState(token) {\n  const me = session_(token), key = pkKey_(pkView_(me));\n  try { const o = pkGet_(key); if (o) { o.me = { id: me.id, name: me.Name, role: me.Role }; o.serverNow = Date.now(); return o; } } catch (e) { }\n  return state_(me, key);\n}\nfunction state_(me, key) {\n  const out = { me: { id: me.id, name: me.Name, role: me.Role }, serverNow: Date.now(), jobs: me.Role === 'viewer' ? [] : jobs_(), bins: CFG.BINS }, recent = {};\n  if (me.Role === 'sup' || me.Role === 'admin') {\n    out.stores = CFG.STORES;\n    out.users = publicUsers_();\n    prefetch_(packingLots_().map(function (l) { return l.id; }));\n    out.lots = packingLots_().map(function (l) {\n      const rows = lotRows_(l.id).rows, next = {};\n      Object.keys(CFG.TYPES).forEach(function (t) { next[t] = nextPallet_(usedPallets_(rows, t, Date.now())); });\n      const outs = rows.filter(function (r) { return r.RecordType === 'Output' && !truthy_(r.Cancelled); });\n      l.next = next;\n      l.lastBags = outs.length ? Number(outs[outs.length - 1].Output_Bag) || 0 : 0;\n      l.recent = supRecent_(rows, l.lotType);\n      out.jobs.forEach(function (j) { if (j.fgLotId === l.id) { recent[j.slot] = recent_(j, rows); j.pallet = nextFree_(j, rows, Date.now()); } });\n      return l;\n    });\n  } else {\n    out.jobs.forEach(function (j) { if (j.team === me.Name) { const rows = lotRows_(j.fgLotId).rows; recent[j.slot] = recent_(j, rows); j.pallet = nextFree_(j, rows, Date.now()); } });\n  }\n  const pl = packingLots_(); // jobs set before pallet types: the item's default (Form_Type) for the packing screen\n  if (me.Role === 'sup' || me.Role === 'admin') out.jobs.forEach(function (j) { if (jobLotGone_(j)) j.lotOff = true; });   // v93\n  out.jobs.forEach(function (j) { if (!j.ptype) { const l = pl.find(function (x) { return x.id === String(j.fgLotId); }); j.ptDef = l ? l.ptDef : ''; } });\n  out.recent = recent; // last pallets per job slot, for the start screen\n  PREF_ = null;\n  if (key) pkPut_(key, out, PK.GS_TTL);\n  return out;\n}\n\nfunction recent_(job, rows) {\n  const fmt = function (v) { return v instanceof Date ? Utilities.formatDate(v, 'Asia/Bangkok', 'HH:mm') : ''; };\n  return rows\n    .filter(function (r) { return rowType_(r) === job.type && !truthy_(r.Cancelled); })\n    .map(function (r) {\n      return { id: String(r.RecordID), no: r.Pallet_No, bags: r.Output_Bag, kg: r.Output_Kg, unit: unitOf_(r), start: fmt(r.DateTimeRecords), stop: fmt(r.Stop_Time),\n        note: tnNote_(r.Comment), t: new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime() };\n    })\n    .sort(function (a, b) { return b.t - a.t; }).slice(0, 3);\n}\n\n// All pallets of a lot for Sup to check % ลอยน้ำ (rows already read by getState — no extra sheet read).\nfunction supRecent_(rows, lotType) {\n  const fmt = function (v) { return v instanceof Date ? Utilities.formatDate(v, 'Asia/Bangkok', 'dd/MM HH:mm') : ''; };\n  const hm = function (v) { return v instanceof Date ? Utilities.formatDate(v, 'Asia/Bangkok', 'HH:mm') : ''; };\n  return rows.filter(function (r) { return !truthy_(r.Cancelled) && Number(r.Pallet_No) > 0 && ['FG', 'WIP', 'SEMI', 'Hold', 'Reject'].indexOf(rowType_(r)) >= 0; })\n    .map(function (r) {\n      const t = rowType_(r);\n      return { id: String(r.RecordID), type: t, no: Number(r.Pallet_No),\n        bags: Number(r.Output_Bag) || 0, kg: Number(r.Output_Kg) || 0, unit: unitOf_(r), float: Math.round((Number(r.Floating_Percent) || 0) * 100),\n        start: fmt(r.DateTimeRecords), stop: hm(r.Stop_Time), team: String(r.Packing_Team || ''), note: tnNote_(r.Comment).slice(0, 200),\n        t: new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime() };\n    })\n    .sort(function (a, b) { return b.t - a.t; }); // every pallet of the lot — the phone groups them by type\n}\n\n// Sup checks % ลอยน้ำ after packing and corrects one row. The phone then calls recalc for that row.\nfunction setFloat(token, fgLotId, recordId, pct) {\n  session_(token, 'sup');\n  const lot = lot_(fgLotId), v = intIn_(pct, 0, 100, '% การลอยน้ำ');\n  if (!lot.floatOn) throw new Error('ล็อตนี้ไม่เก็บ % ลอยน้ำ (เฉพาะ FISH / KOI)');\n  return withLock_(function () {\n    const lr = lotRows_(lot.id), r = lr.rows.find(function (x) { return String(x.RecordID) === String(recordId); });\n    if (!r || truthy_(r.Cancelled)) throw new Error('ไม่พบบันทึกนี้ในล็อต ' + lot.lot);\n    setCells_(lr, r, { Floating_Percent: v / 100 });\n    return { id: String(recordId), float: v };\n  });\n}\n// Sup corrects the amount of a recorded pallet: bags (kg = bags × kg/bag of the row) or, for a bigbag, its kg.\n// Reject (has an NCP row) and Hold pallets tied to a Hold decision are left to AppSheet. The phone then calls recalc for the row.\nfunction setQty(token, fgLotId, recordId, v, reason) {\n  const me = session_(token, 'sup'), why = str_(reason, 200);\n  return withLock_(function () {\n    const lr = lotRows_(fgLotId), r = lr.rows.find(function (x) { return String(x.RecordID) === String(recordId); });\n    if (!r || truthy_(r.Cancelled)) throw new Error('ไม่พบบันทึกนี้ (หรือยกเลิกแล้ว)');\n    const t = rowType_(r), label = TN_(t) + ' #' + r.Pallet_No;\n    if (['FG', 'WIP', 'SEMI', 'Hold'].indexOf(t) < 0) throw new Error('แก้ยอดได้เฉพาะพาเลท FG / HOLD / SEMI / WIP' + (t === 'Reject' ? ' — Reject ยกเลิกแล้วบันทึกใหม่ หรือแก้ใน AppSheet' : ''));\n    if (HOLD_TAG_.test(String(r.Comment || ''))) throw new Error(label + ' มาจากการตัดสิน WIP — แก้ใน AppSheet');\n    if (t === 'Hold') {\n      const key = holdKey_(r).split('|');\n      if (lr.rows.some(function (x) { const m = String(x.Comment || '').match(HOLD_TAG_); return m && !truthy_(x.Cancelled) && m[1] === key[0] && m[2] === key[1]; })) {\n        throw new Error(label + ' ตัดสินไปแล้วบางส่วน — แก้ใน AppSheet');\n      }\n    }\n    const big = unitOf_(r) === 'Bigbag', oldBags = Number(r.Output_Bag) || 0, oldKg = Number(r.Output_Kg) || 0, vals = {};\n    let note;\n    if (big) {\n      const kg = Number(v);\n      if (!(kg > 0 && kg <= 3000)) throw new Error('น้ำหนัก bigbag ต้องมากกว่า 0 และไม่เกิน 3,000 kg');\n      if (kg === oldKg) throw new Error('ยอดเท่าเดิม');\n      vals.Output_Kg = kg; vals.WeightInput = Math.round(kg / (oldBags || 1) * 100) / 100;\n      note = 'แก้ยอด ' + oldKg + '→' + kg + ' kg';\n    } else {\n      const bags = intIn_(v, 1, CFG.MAX_BAGS, 'จำนวนถุง'), w = Number(r.WeightInput) || (oldBags ? oldKg / oldBags : 0);\n      if (!(w > 0)) throw new Error(label + ' ไม่มีน้ำหนักต่อถุง — แก้ใน AppSheet');\n      if (bags === oldBags) throw new Error('ยอดเท่าเดิม');\n      vals.Output_Bag = bags; vals.Output_Kg = Math.round(bags * w * 100) / 100;\n      note = 'แก้ยอด ' + oldBags + '→' + bags + ' ถุง';\n    }\n    vals.Comment = joinNote_(r.Comment, note + ' โดย ' + me.Name, why);\n    setCells_(lr, r, vals);\n    return { id: String(r.RecordID), label: label, bags: big ? oldBags : vals.Output_Bag, kg: vals.Output_Kg, note: note };\n  });\n}\n// Writes a few columns of one existing row (+ UpdatedTimestamp). Columns missing from the sheet are skipped.\nfunction setCells_(lr, r, vals) {\n  vals.UpdatedTimestamp = new Date();\n  if (lr.sh && lr.sh.db) return dbSet_(lr.sh.db, lr.h, [r], vals);\n  Object.keys(vals).forEach(function (k) { const c = lr.h.indexOf(k) + 1; if (c) lr.sh.getRange(r._row, c).setValue(vals[k]); });\n}\n\n// Sup switches a machine's job FG/WIP/SEMI ⇄ Hold/Reject, also while the team is mid-pallet (e.g. moisture too high):\n// the pallet in progress is recorded as the new type when the team presses stop. Numbering follows the new type.\n// unit: Hold/WIP may switch to Bigbag (only between pallets). Going back restores the bag setup kept in job.prev.\nfunction switchType(token, slot, type, reason, unit) {\n  const me = session_(token, 'sup');\n  return withLock_(function () {\n    const job = job_(slot);\n    if (!job) throw new Error('ไม่มีงานที่ ' + slot);\n    twin_(job, type);\n    const lot = lot_(job.fgLotId);\n    if (typesFor_(lot).indexOf(type) < 0) throw new Error('ประเภท ' + TN_(type) + ' ใช้กับล็อตนี้ไม่ได้');\n    if (type === job.type) throw new Error('งานนี้เป็น ' + TN_(type) + ' อยู่แล้ว');\n    const toQC = !CFG.TYPES[type].perLot, now = Date.now(), big = unit === 'Bigbag' && CFG.UNIT_TYPES.indexOf(type) >= 0;\n    if (big && job.active) throw new Error('ทีมกำลังแพคพาเลทถุงอยู่ — ให้กดหยุดก่อน แล้วค่อยเปลี่ยนเป็น Bigbag');\n    const it = itemOf_(lot, type, job), itemChange = it.item !== (job.item || lot.fgid);\n    if (itemChange && job.active) throw new Error('ทีมกำลังแพค ' + (job.item || lot.fgid) + ' อยู่ — ให้กดหยุดก่อนเปลี่ยนเป็น ' + it.item);\n    if (job.active) job.okVers = (job.okVers || []).concat(job.ver);\n    if (big) {\n      if (job.unit !== 'Bigbag') job.prev = { unit: job.unit || 'Bag', weight: job.weight, bags: job.bags, mode: job.mode };\n      job.unit = 'Bigbag'; job.weight = 0; job.bags = 1; job.mode = 1; // bigbag = one pallet at a time\n    } else if (job.unit === 'Bigbag' || job.prev) {\n      // no kept setup (Hold set up on its own): StdWeight / bags of the lot's last bag pallet\n      const p = job.prev || {}, last = lotRows_(lot.id).rows.filter(function (r) { return r.RecordType === 'Output' && !truthy_(r.Cancelled) && !(Number(r.WeightInput) > CFG.BIGBAG_MIN_KG); }).pop() || {};\n      job.unit = 'Bag'; job.weight = Number(p.weight) || stdKg_(lot, it) || Number(last.WeightInput) || 0;\n      job.bags = Number(p.bags) || Number(last.Output_Bag) || 40;\n      job.mode = Number(p.mode) === 2 ? 2 : 1;\n      job.prev = null;\n    }\n    if (itemChange && !big) { // FG ⇄ SEMI: kg/bag and bags of the other item\n      const kg = stdKg_(lot, it);\n      if (!(kg > 0)) throw new Error(it.item + ' ไม่มีน้ำหนักต่อถุงใน FG_Detail — ใช้ แก้ไขงาน แล้วใส่ kg/ถุง');\n      job.weight = kg; job.bags = it.bags || job.bags; job.prev = null;\n    }\n    job.item = it.item; job.name = it.name;\n    job.backTo = toQC ? (CFG.TYPES[job.type].perLot ? job.type : job.backTo) : null;\n    job.reason = toQC ? String(reason || '').trim().slice(0, 200) : '';\n    job.type = type;\n    job.store = CFG.TYPES[type].store;\n    job.pallet = nextPallet_(usedPallets_(lotRows_(lot.id).rows, type, now));\n    job.palletDay = prodDateKey_(now);\n    job.supName = me.Name;\n    job.ver = now;\n    setJob_(slot, job);\n    return job;\n  });\n}\n\n// Sup moves an already-recorded FG/WIP pallet to Hold (e.g. moisture found too high afterwards). It gets the next Hold\n// number of its own production day; the FG/WIP number is left as a gap. A Hold job on the same lot/day skips past it.\nfunction moveToHold(token, fgLotId, recordId, reason) {\n  const me = session_(token, 'sup'), lot = lot_(fgLotId);\n  return withLock_(function () {\n    const lr = lotRows_(lot.id), r = lr.rows.find(function (x) { return String(x.RecordID) === String(recordId); });\n    if (!r || truthy_(r.Cancelled)) throw new Error('ไม่พบบันทึกนี้ในล็อต ' + lot.lot);\n    const from = rowType_(r);\n    if (!CFG.TYPES[from] || !CFG.TYPES[from].perLot) throw new Error('ย้ายได้เฉพาะพาเลท FG / HOLD / SEMI');\n    const at = new Date(r.DateTimeRecords || r.CreateTimestamp || Date.now()).getTime(), day = prodDateKey_(at);\n    const job = jobs_().find(function (j) { return j.fgLotId === lot.id && j.type === 'Hold' && j.palletDay === day; }), jobHold = !!job;\n    const no = Math.max(nextPallet_(usedPallets_(lr.rows, 'Hold', at)), jobHold ? job.pallet : 0);\n    const label = from + ' #' + r.Pallet_No;\n    setCells_(lr, r, { RecordType: 'Hold', WIP: false, Pallet_No: no, Storage_Location: CFG.TYPES.Hold.store,\n      Comment: joinNote_(r.Comment, 'ย้ายจาก ' + label, reason
