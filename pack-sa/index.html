, 'โดย ' + me.Name) });\n    if (jobHold) { job.pallet = no + 1; setJob_(job.slot, job); }\n    return { id: String(recordId), from: TN_(from) + ' #' + r.Pallet_No, pallet: no };\n  });\n}\n\n/* ---------- ย้ายพาเลทไปล็อตที่ถูก (user 12 Nov: แพคเลือก lot ผิด) ----------\n   Sup picks pallets of a lot (also ones already cancelled) → the right FG lot: each source row is cancelled (if still live) and a new row is\n   written in the right lot with its next pallet no. (FG + HOLD share numbers, SEMI its own), same bags / kg / team / machine / clock times,\n   on the pallet's own production day — or a day Sup picks (clock times kept, the date shifted). The warehouse lists the old pallet to\n   confirm its cancel and shows the new one in รับจาก PD. Links: source Comment \"ย้ายไปล็อต <lot> <type> #<n>\", new \"ย้ายจากล็อต <lot> <type> #<n> [<RecordID>]\". */\nconst MOVED_LOT_ = /ย้ายไปล็อต /;\nfunction moveList(token, fgLotId) {\n  session_(token, 'sup');\n  const lot = lotOut_(fgLotRow_(fgLotId)), fmt = function (v) { return v instanceof Date ? Utilities.formatDate(v, 'Asia/Bangkok', 'dd/MM HH:mm') : ''; };\n  const pallets = lotRows_(lot.id).rows.filter(function (r) { return Number(r.Pallet_No) > 0 && ['FG', 'WIP', 'SEMI'].indexOf(rowType_(r)) >= 0; }).map(function (r) {\n    const note = String(r.Comment || '');\n    return { id: String(r.RecordID), type: rowType_(r), no: Number(r.Pallet_No), bags: Number(r.Output_Bag) || 0, kg: Number(r.Output_Kg) || 0, unit: unitOf_(r),\n      at: fmt(r.DateTimeRecords), day: tagDay_(r), team: String(r.Packing_Team || ''), off: truthy_(r.Cancelled), moved: MOVED_LOT_.test(note),\n      held: HOLD_TAG_.test(note), t: new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime() };\n  }).sort(function (a, b) { return b.t - a.t; });\n  return { lot: lot, pallets: pallets, today: prodDateKey_(Date.now()), back: CFG.BACKDATE_DAYS };\n}\n// d = { from, to, ids[], day ('' = each pallet's own production day), reason }. A pallet already moved into this lot ([RecordID] there) is skipped, so a re-send adds nothing.\nfunction movePallets(token, d) {\n  const me = session_(token, 'sup');\n  d = d || {};\n  const why = str_(d.reason, 200), ids = (d.ids || []).map(String).slice(0, 60);\n  if (!ids.length) throw new Error('เลือกพาเลทที่จะย้าย');\n  if (!why) throw new Error('ใส่เหตุผล เช่น เลือก lot ผิด');\n  if (String(d.from) === String(d.to)) throw new Error('เลือกล็อตปลายทางที่ไม่ใช่ล็อตเดิม');\n  const day = str_(d.day, 10);\n  if (day) {\n    if (!/^\\d{4}-\\d\\d-\\d\\d$/.test(day)) throw new Error('วันที่ไม่ถูกต้อง');\n    if (day > prodDateKey_(Date.now())) throw new Error('วันที่ต้องไม่เกินวันนี้');\n    if (day < prodDateKey_(Date.now() - CFG.BACKDATE_DAYS * 24 * HOUR)) throw new Error('ย้อนหลังได้ไม่เกิน ' + CFG.BACKDATE_DAYS + ' วัน');\n  }\n  const src = fgLotRow_(d.from), dst = liveLot_(d.to), fgd = {};\n  table_(CFG.FG_DETAIL).rows.forEach(function (r) { fgd[String(r.FGID).trim()] = r; });\n  const dstFg = String(dst.FGID).trim(), dstSemi = String(dst.LotType).trim().toUpperCase() === 'SEMI';\n  const semiCode = dstSemi ? dstFg : String((fgd[dstFg] || {}).SEMI_Code || '').trim(), std = Number(dst.StdWeight) || 0;\n  return withLock_(function () {\n    const lf = lotRows_(src.FGLotID), lt = lotRows_(dst.FGLotID), done = {};\n    lt.rows.forEach(function (x) { const m = String(x.Comment || '').match(/ย้ายจากล็อต [^\\[]*\\[(\\w+)\\]/); if (m && !truthy_(x.Cancelled)) done[m[1]] = true; });\n    const todo = ids.filter(function (id) { return !done[id]; }).map(function (id) {\n      const r = lf.rows.find(function (x) { return String(x.RecordID) === id; });\n      if (!r) throw new Error('ไม่พบพาเลทที่เลือกในล็อต ' + src.Lot_Number + ' — โหลดใหม่');\n      const t = rowType_(r), label = TN_(t) + ' #' + r.Pallet_No, note = String(r.Comment || ''), w = Number(r.WeightInput) || 0;\n      if (['FG', 'WIP', 'SEMI'].indexOf(t) < 0) throw new Error('ย้ายได้เฉพาะพาเลท FG / HOLD / SEMI');\n      if (MOVED_LOT_.test(note)) throw new Error(label + ' ย้ายไปล็อตอื่นแล้ว');\n      if (HOLD_TAG_.test(note)) throw new Error(label + ' มาจากการตัดสิน WIP — แก้ใน AppSheet');\n      if (dstSemi && t !== 'SEMI') throw new Error('ล็อต ' + dst.Lot_Number + ' เป็นล็อต SEMI — ย้ายได้เฉพาะพาเลท SEMI');\n      if (t === 'SEMI' && !semiCode) throw new Error('สินค้า ' + dstFg + ' ยังไม่มี SEMI_Code ใน FG_Detail — ย้าย SEMI ไม่ได้');\n      if (t !== 'SEMI' && unitOf_(r) === 'Bag' && std && w && Math.abs(std - w) > 0.001) throw new Error(label + ' ' + w + ' kg/ถุง ไม่ตรงกับล็อต ' + dst.Lot_Number + ' (' + std + ' kg/ถุง)');\n      return r;\n    });\n    if (!todo.length) return { dup: true, moved: [], srcIds: [], ids: [], toLot: String(dst.Lot_Number) };\n    ptCol_(lt);\n    const now = new Date(), used = {}, out = [], moved = [];\n    const shiftOf = function (v, ms) { return v instanceof Date && v.getFullYear() > 2000 ? new Date(v.getTime() + ms) : v; }; // a time-only cell (AppSheet) stays\n    todo.forEach(function (r) {\n      const t = rowType_(r), g = numGroup_(t), own = tagDay_(r), dk = day || own, ms = day ? dayDate_(day).getTime() - dayDate_(own).getTime() : 0;\n      const start = shiftOf(r.DateTimeRecords instanceof Date ? r.DateTimeRecords : new Date(r.CreateTimestamp || now), ms);\n      if (!used[g]) used[g] = usedPallets_(lt.rows, t, start.getTime());\n      const no = nextPallet_(used[g]), nid = id8_();\n      used[g].add(no);\n      out.push({ RecordID: nid, FGLotID: String(dst.FGLotID), Lot_Number: String(dst.Lot_Number), Pack_Number: r.Pack_Number || dst.Pack_Number, LotFGKey: String(dst.LotFGKey || ''),\n        DateTimeRecords: start, Stop_Time: shiftOf(r.Stop_Time, ms), Production_Date: dayDate_(dk), RecordType: r.RecordType, WIP: truthy_(r.WIP),\n        Pallet_No: no, Floating_Percent: r.Floating_Percent, Output_Bag: r.Output_Bag, WeightInput: r.WeightInput, Output_Kg: r.Output_Kg,\n        Packing_Team: r.Packing_Team, Sup_Pack: r.Sup_Pack, Packing_bin: r.Packing_bin, Storage_Location: r.Storage_Location || CFG.TYPES[t].store,\n        Pack_Item: t === 'SEMI' ? semiCode : dstFg, Pallet_Type: r.Pallet_Type || '',\n        Comment: joinNote_('ย้ายจากล็อต ' + src.Lot_Number + ' ' + TN_(t) + ' #' + r.Pallet_No + ' [' + r.RecordID + ']', why, 'โดย ' + me.Name),\n        Cancelled: false, Visible: true, NCP_Status: 'None', CreatedBy: 'PackingApp:' + me.Name, CreateTimestamp: now, UpdatedTimestamp: now });\n      moved.push({ id: String(r.RecordID), nid: nid, from: TN_(t) + ' #' + r.Pallet_No, to: TN_(t) + ' #' + no, was: truthy_(r.Cancelled) });\n    });\n    appendRows_(lt.sh, lt.h, out);\n    todo.forEach(function (r, i) {\n      const tag = 'ย้ายไปล็อต ' + dst.Lot_Number + ' ' + moved[i].to;\n      setCells_(lf, r, truthy_(r.Cancelled) ? { Comment: joinNote_(r.Comment, tag, 'โดย ' + me.Name) } : { Cancelled: true, Comment: joinNote_(r.Comment, tag, why, 'โดย ' + me.Name) });\n    });\n    return { moved: moved, from: String(src.FGLotID), to: String(dst.FGLotID), toLot: String(dst.Lot_Number), toPacking: String(dst.Status).trim().toLowerCase() === CFG.PACKING_STATUS,\n      srcIds: todo.map(function (r) { return String(r.RecordID); }), ids: out.map(function (o) { return o.RecordID; }) };\n  });\n}\n// Sup cancels a pallet recorded by mistake (Cancelled TRUE, the row stays). Its number is free again if it was the last one\n// (nextFree_). A pallet tied to a Hold decision is left to AppSheet: cancelling it alone would lose or double kg.\nfunction cancelRecord(token, fgLotId, recordId, reason) {\n  const me = session_(token, 'sup'), why = str_(reason, 200);\n  if (!why) throw new Error('ใส่เหตุผลที่ยกเลิก');\n  return withLock_(function () {\n    const lr = lotRows_(fgLotId), r = lr.rows.find(function (x) { return String(x.RecordID) === String(recordId); });\n    return cancelOne_(lr, r, me, why);\n  });\n}\n// One pallet / bigbag → Cancelled (shared by cancelRecord and cancelRecords)\nfunction cancelOne_(lr, r, me, why) {\n  if (!r || truthy_(r.Cancelled)) throw new Error('ไม่พบบันทึกนี้ (หรือยกเลิกแล้ว)');\n  const t = rowType_(r), label = TN_(t) + ' #' + r.Pallet_No;\n  if (['FG', 'WIP', 'SEMI', 'Hold', 'Reject'].indexOf(t) < 0) throw new Error('ยกเลิกได้เฉพาะพาเลท FG / HOLD / SEMI / WIP / Reject');\n  if (HOLD_TAG_.test(String(r.Comment || ''))) throw new Error(label + ' มาจากการตัดสิน WIP — ยกเลิกใน AppSheet');\n  if (t === 'Hold') {\n    const key = holdKey_(r).split('|');\n    if (lr.rows.some(function (x) { const m = String(x.Comment || '').match(HOLD_TAG_); return m && !truthy_(x.Cancelled) && m[1] === key[0] && m[2] === key[1]; })) {\n      throw new Error(label + ' ตัดสินไปแล้วบางส่วน — ยกเลิกใน AppSheet');\n    }\n  }\n  setCells_(lr, r, { Cancelled: true, Comment: joinNote_(r.Comment, 'ยกเลิกโดย ' + me.Name + ' · ' + why) });\n  return { id: String(r.RecordID), label: label };\n}\n// Sup / Admin: cancel pallets of any lot — also a FINISHED one — from ข้อมูล → FG Lot → ยกเลิกพาเลท (user 14 Nov 2026).\nfunction cancelList(token, fgLotId) {\n  session_(token, 'sup');\n  const lot = lotOut_(fgLotRow_(fgLotId)), fmt = function (v) { return v instanceof Date ? Utilities.formatDate(v, 'Asia/Bangkok', 'dd/MM HH:mm') : ''; };\n  const pallets = lotRows_(lot.id).rows.filter(function (r) {\n    return !truthy_(r.Cancelled) && Number(r.Pallet_No) > 0 && ['FG', 'WIP', 'SEMI', 'Hold', 'Reject'].indexOf(rowType_(r)) >= 0;\n  }).map(function (r) {\n    return { id: String(r.RecordID), type: rowType_(r), no: Number(r.Pallet_No), bags: Number(r.Output_Bag) || 0, kg: Number(r.Output_Kg) || 0, unit: unitOf_(r),\n      at: fmt(r.DateTimeRecords), team: String(r.Packing_Team || ''), wipTag: HOLD_TAG_.test(String(r.Comment || '')), t: new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime() };\n  }).sort(function (a, b) { return b.t - a.t; });\n  return { lot: lot, pallets: pallets };\n}\n// up to 60 pallets, all or nothing: every pallet is checked before any is cancelled\nfunction cancelRecords(token, fgLotId, ids, reason) {\n  const me = session_(token, 'sup'), why = str_(reason, 200);\n  ids = (ids || []).map(String).slice(0, 60);\n  if (!ids.length) throw new Error('เลือกพาเลทที่จะยกเลิก');\n  if (!why) throw new Error('ใส่เหตุผลที่ยกเลิก');\n  return withLock_(function () {\n    const lr = lotRows_(fgLotId), rows = ids.map(function (id) { return lr.rows.find(function (x) { return String(x.RecordID) === id; }); });\n    rows.forEach(function (r) {\n      if (!r || truthy_(r.Cancelled)) throw new Error('ไม่พบพาเลท (หรือยกเลิกแล้ว) — โหลดใหม่');\n      if (HOLD_TAG_.test(String(r.Comment || ''))) throw new Error(TN_(rowType_(r)) + ' #' + r.Pallet_No + ' มาจากการตัดสิน WIP — ยกเลิกใน AppSheet');\n    });\n    const done = rows.map(function (r) { return cancelOne_(lr, r, me, why); });\n    console.log('cancelRecords ' + me.Name + ' lot ' + fgLotId + ': ' + done.map(function (x) { return x.label; }).join(', '));\n    return { n: done.length, labels: done.map(function (x) { return x.label; }) };\n  });\n}\n\nfunction saveJob(token, d) {\n  const me = session_(token, 'sup'), lot = lot_(d.fgLotId);\n  if (typesFor_(lot).indexOf(d.type) < 0) throw new Error('ประเภท ' + TN_(d.type) + ' ใช้กับล็อตนี้ไม่ได้');\n  const unit = CFG.UNIT_TYPES.indexOf(d.type) >= 0 && d.unit === 'Bigbag' ? 'Bigbag' : 'Bag';\n  const it = itemOf_(lot, d.type, d.slot ? job_(d.slot) : null);\n  const weight = unit === 'Bigbag' ? 0 : weightFor_(lot, d.weight, it); // bigbag kg is weighed per pallet at stop\n  const bins = binsFor_(d.bins, lot.pack, d.bin).split(' , ');\n  if (CFG.STORES.indexOf(d.store) < 0) throw new Error('สถานที่จัดเก็บไม่ถูกต้อง');\n  const team = users_().find(function (u) { return u.active && u.Role === 'team' && u.Name === d.team; });\n  if (!team) throw new Error('ไม่พบทีมแพค ' + d.team);\n  const mode = Number(d.mode) === 2 && unit !== 'Bigbag' ? 2 : 1; // 1 pallet = 1 bigbag\n  const pallet = intIn_(d.pallet, 1, 9999, 'เลขพาเลท');\n  const bags = unit === 'Bigbag' ? 1 : intIn_(d.bags, 1, CFG.MAX_BAGS, 'จำนวนถุง');\n  const flt = intIn_(d.float, 0, 100, '% การลอยน้ำ');\n  const ptype = CFG.PALLET_TYPES.indexOf(d.ptype) >= 0 ? d.ptype : lot.ptDef; // not picked → the default of the item's Form_Type\n  if (CFG.PALLET_TYPES.indexOf(ptype) < 0) throw new Error('เลือกประเภทพาเลท: ไม้ / เหล็ก');\n  return withLock_(function () {\n    // edit = the slot given (same machine only); new = the machine's first free slot\n    const slot = d.slot ? String(d.slot) : slots_(lot.pack).find(function (k) { return !job_(k); });\n    if (!slot) throw new Error(lot.pack + ' มีงานเปิดอยู่ครบ 2 งานแล้ว — ปิดงานใดงานหนึ่งก่อน');\n    if (slots_(lot.pack).indexOf(slot) < 0) throw new Error('งานนี้อยู่เครื่องอื่น — เลือกล็อตของเครื่องเดียวกัน หรือปิดงานแล้วสร้างใหม่');\n    const cur = job_(slot);\n    if (busy_(cur)) throw new Error('ทีม ' + cur.team + ' กำลังแพคงานนี้ที่ ' + lot.pack + ' — รอกดหยุดก่อนเปลี่ยนงาน');\n    twin_({ slot: slot, fgLotId: lot.id }, d.type);\n    const used = usedPallets_(lotRows_(lot.id).rows, d.type, Date.now());\n    const clash = [pallet, pallet + 1].slice(0, mode).filter(function (n) { return used.has(n); });\n    // the number the form suggested is taken (rows came in from AppSheet since the page loaded): next free; a number Sup typed: ask\n    const start = clash.length && d.palletAuto ? nextPallet_(used) : pallet;\n    if (clash.length && !d.palletAuto) throw new Error('พาเลท #' + clash.join(', #') + ' (' + TN_(d.type) + ') มีบันทึกแล้ว — เลขถัดไปที่ว่าง #' + nextPallet_(used));\n    const job = { pack: lot.pack, fgLotId: lot.id, lot: lot.lot, name: it.name, item: it.item, weight: weight, key: lot.key,\n      type: d.type, mode: mode, pallet: start, palletDay: prodDateKey_(Date.now()), bags: bags, float: flt,\n      unit: unit, bin: bins[0], bins: bins, store: d.store, team: team.Name, supName: me.Name, ver: Date.now(), active: null, slot: slot, ptype: ptype };\n    // FG → Hold through this form (e.g. Hold 2 bigbag) keeps a \"กลับเป็น FG\" button, like switchType\n    if (cur && cur.fgLotId === lot.id && !CFG.TYPES[d.type].perLot) {\n      job.backTo = CFG.TYPES[cur.type].perLot ? cur.type : cur.backTo || null;\n      if (job.backTo) job.prev = cur.prev || (cur.unit === 'Bigbag' ? null : { unit: cur.unit || 'Bag', weight: cur.weight, bags: cur.bags });\n      job.reason = cur.reason || '';\n    }\n    setJob_(slot, job);\n    job.palletMoved = start !== pallet;\n    if (unit === 'Bag' && (d.type === 'FG' || d.type === 'SEMI') && it.item) rememberBags_(it.item, bags);\n    return job;\n  });\n}\n\nfunction clearJob(token, slot) {\n  session_(token, 'sup');\n  return withLock_(function () {\n    const cur = job_(slot);\n    if (busy_(cur) && !jobLotGone_(cur)) throw new Error('ทีม ' + cur.team + ' กำลังแพคอยู่ — รอกดหยุดก่อนปิดงาน');\n    setJob_(slot, null);\n    return true;\n  });\n}\n\n// Best-effort: tells the server a pallet is in progress so Sup can't swap the job mid-pallet.\n// A second phone (team + Sup) can't start the same machine; Sup may take over (e.g. the team's phone died).\nfunction markStart(token, slot, ver) {\n  const me = session_(token, 'work');\n  return withLock_(function () {\n    const job = myJob_(me, slot), pack = job.pack;\n    if (job.ver !== ver) throw new Error('Sup เพิ่งเปลี่ยนงาน — โหลดหน้าใหม่แล้วกดเริ่มอีกครั้ง');\n    cancelledJob_(job);\n    if (me.Role === 'team' && busy_(job) && job.active.by && job.active.by !== me.Name) {\n      throw new Error(job.active.by + ' กำลังบันทึกแพคที่ ' + pack + ' อยู่ (เริ่ม ' + Utilities.formatDate(new Date(job.active.startAt), 'Asia/Bangkok', 'HH:mm') + ')');\n    }\n    job.active = { startAt: Date.now(), by: me.Name };\n    job.okVers = [];\n    setJob_(slot, job);\n    return true;\n  });\n}\n// The job's lot was cancelled after the job was set (e.g. in AppSheet) → refuse, so nothing lands in a cancelled lot.\n// v93: the job's FG lot is gone / cancelled (e.g. cancelled in the sheet) → nothing can be packed on it, Sup may close it mid-pallet\nfunction jobLotGone_(job) {\n  const r = job && table_(CFG.FG_LOT).rows.find(function (x) { return String(x.FGLotID) === String(job.fgLotId); });\n  return !r || truthy_(r.Cancelled);\n}\nfunction cancelledJob_(job) {\n  const r = table_(CFG.FG_LOT).rows.find(function (x) { return String(x.FGLotID) === String(job.fgLotId); });\n  if (!r || truthy_(r.Cancelled)) throw new Error('ล็อต ' + job.lot + ' ถูกยกเลิกแล้ว — แจ้ง Sup ให้ตั้งงานเป็นล็อตที่ใช้อยู่ก่อน');\n}\nfunction markCancel(token, slot) {\n  const me = session_(token, 'work');\n  return withLock_(function () {\n    const job = myJob_(me, slot);\n    job.active = null;\n    setJob_(slot, job);\n    return true;\n  });\n}\n\n// One call per stop press. p = {pack, ver, fgLotId, type, startAt, stopAt, bags, floats?, note, waitMin, ids[]}\n// bins: 1–2 bins used (bin changed mid-pallet), written to Packing_bin as \"BIN-1 , BIN-2\".\n// bags / floats: one value per pallet (2-pallet mode can differ per pallet); floats missing = the job's % ลอยน้ำ.\n// Start/stop stay the real clock times (they print on the paper form); time spent waiting for product\n// with the pallet not full is added to Comment as \"รออาหาร N นาที\".\n// Pallet numbers are assigned here, not on the phone. Re-sending the same ids is a no-op.\nfunction record(token, p) {\n  const me = session_(token, 'work');\n  DB_NOFLUSH_ = true; // the phone calls recalc next — the sheet copy happens there, so the stop button stays fast\n  const ids = (p.ids || []).map(String);\n  if (ids.length < 1 || ids.length > 2) throw new Error('ข้อมูลพาเลทไม่ถูกต้อง');\n  const bags = perPallet_(p.bags, ids.length, 1, CFG.MAX_BAGS, 'จำนวนถุง');\n  const res = withLock_(function () {\n    const job = myJob_(me, p.pack);\n    const bin = binsFor_(p.bins, job.pack, job.bins || job.bin);\n    const big = job.unit === 'Bigbag';\n    const kgs = big ? (Array.isArray(p.kgs) && p.kgs.length === ids.length ? p.kgs : []).map(function (x) {\n      const n = Number(x);\n      if (!(n > 0 && n <= 3000)) throw new Error('ใส่น้ำหนัก bigbag (kg) ทุกพาเลท');\n      return n;\n    }) : null;\n    if (big && kgs.length !== ids.length) throw new Error('ใส่น้ำหนัก bigbag (kg) ทุกพาเลท');\n    const floats = p.floats == null ? ids.map(function () { return job.float; }) : perPallet_(p.floats, ids.length, 0, 100, '% การลอยน้ำ');\n    if (!verOk_(job, p.ver) && !(job.fgLotId === p.fgLotId && job.type === p.type)) {\n      throw new Error('Sup เปลี่ยนงานระหว่างแพค — แจ้ง Sup ให้ตั้งงานล็อตเดิมก่อน แล้วกดส่งอีกครั้ง');\n    }\n    const lr = lotRows_(job.fgLotId);\n    if (lr.rows.some(function (r) { return ids.indexOf(String(r.RecordID)) >= 0; })) return { dup: true, ids: ids, pallets: [] };\n    cancelledJob_(job);\n    ptCol_(lr);\n    const T = CFG.TYPES[job.type], start = new Date(Number(p.startAt)), stop = new Date(Number(p.stopAt)), now = new Date();\n    // FG_Lot / FG_Detail may have been renamed since the job was set (FGID update 14 Oct): an item the lot no longer has → the lot's own\n    const L = packingLots_().find(function (x) { return x.id === String(job.fgLotId); }), fl = floatOn_(L ? L.name : job.name);\n    // pallet type per pallet: what the team picked on the packing screen, else the job's, else the item's default (Form_Type)\n    const ptypes = ids.map(function (_, i) { const v = Array.isArray(p.ptypes) ? String(p.ptypes[i] || '') : ''; return CFG.PALLET_TYPES.indexOf(v) >= 0 ? v : job.ptype || (L && L.ptDef) || ''; });\n    const item = !L || [L.fgid, L.semi].indexOf(job.item) >= 0 ? job.item || '' : job.type === 'SEMI' && L.semi ? L.semi : L.fgid;\n    const used = usedPallets_(lr.rows, job.type, start.getTime()), day = prodDateKey_(start.getTime());\n    if (!T.perLot && job.palletDay !== day) { job.pallet = nextPallet_(used); job.palletDay = day; }\n    job.pallet = nextFree_(job, lr.rows, start.getTime());\n    const pallets = ids.map(function (_, i) { return job.pallet + i; });\n    const clash = pallets.filter(function (n) { return used.has(n); });\n    if (clash.length) throw new Error('พาเลท #' + clash.join(', #') + ' มีบันทึกแล้ว — ให้ Sup ตั้งเลขพาเลทใหม่ แล้วกดส่งอีกครั้ง');\n    appendRows_(lr.sh, lr.h, pallets.map(function (no, i) {\n      return { RecordID: ids[i], FGLotID: job.fgLotId, Lot_Number: job.lot, Pack_Number: job.pack, LotFGKey: job.key,\n        DateTimeRecords: start, Stop_Time: stop, Production_Date: dayDate_(day), RecordType: T.recordType, WIP: T.wip,\n        Pallet_No: no, Floating_Percent: fl ? floats[i] / 100 : '', Output_Bag: big ? 1 : bags[i], WeightInput: big ? kgs[i] : job.weight,\n        Output_Kg: big ? kgs[i] : bags[i] * job.weight, Packing_Team: job.team, Sup_Pack: job.supName, Packing_bin: bin,\n        Storage_Location: job.store, Pack_Item: item, Pallet_Type: ptypes[i], Comment: withWait_(joinNote_(job.reason, p.note, me.Role === 'team' ? '' : 'บันทึกแทนทีมโดย ' + me.Name), p.waitMin),\n        Cancelled: false, Visible: true,\n        NCP_Status: 'None', CreatedBy: 'PackingApp:' + me.Name, CreateTimestamp: now, UpdatedTimestamp: now };\n    }));\n    job.pallet += pallets.length;\n    job.active = null;\n    job.okVers = [];\n    setJob_(slotOf_(job), job);\n    return { ids: ids, pallets: pallets, type: job.type, pre: { lot: job.fgLotId, bags: pallets.map(function (_, i) { return big ? 1 : bags[i]; }), w: big ? kgs : [job.weight], day: day } };\n  });\n  return preCheck_(res);\n}\n// After a stop: pallets whose pre-printed tag shows other bags / kg / day → the phone says \"fix the tag\". A failed read never fails the record.\nfunction preCheck_(res) {\n  const p = res.pre; delete res.pre;\n  if (!p || res.dup) return res;\n  try {\n    const log = tagLog_();\n    res.preBad = res.pallets.map(function (no, i) {\n      const g = log[preKey_(p.lot, res.type, no)], w = p.w[i] == null ? p.w[0] : p.w[i];\n      return g && !g.void && g.n && preCore_(g.snap) !== preSnap_(p.bags[i], w, p.day) ? { no: no, was: g.snap.split('|')[0], bags: p.bags[i] } : null;\n    }).filter(Boolean);\n  } catch (e) { /* tag log unreadable: no warning */ }\n  return res;\n}\n\n// Hold pallets still waiting for a decision (Return or Reject), across lots — newest first.\n// A decision row says \"จาก Hold #n (dd/MM)\" in Comment (pallet no + production day = the Hold row in that lot).\n// ponytail: link lives in Comment text; add a Source_RecordID column if Comments get edited by hand.\nconst HOLD_TAG_ = /จาก Hold #(\\d+) \\((\\d\\d\\/\\d\\d)\\)/;\nconst MOVED_TAG_ = /ย้ายจาก (FG|WIP|SEMI) #(\\d+)/; // written by moveToHold\nfunction holdKey_(r) { return String(r.Pallet_No) + '|' + Utilities.formatDate(new Date(r.Production_Date || r.DateTimeRecords || r.CreateTimestamp), 'Asia/Bangkok', 'dd/MM'); }\nfunction openHolds_(rows) {\n  const used = {};\n  rows.forEach(function (r) {\n    const m = String(r.Comment || '').match(HOLD_TAG_);\n    if (!m || truthy_(r.Cancelled) || String(r.RecordType) !== 'Return') return; // Reject / back-to-FG already took their part off the Hold row\n    const k = String(r.FGLotID) + '|' + m[1] + '|' + m[2];\n    used[k] = used[k] || { bags: 0, kg: 0 };\n    used[k].bags += Number(r.Output_Bag) || 0;\n    used[k].kg += Number(r.Output_Kg) || 0;\n  });\n  // Returns typed before Hold decisions existed carry no link: they use up the lot's oldest Holds first\n  // (same as FG_Lot.Current_Hold_Kg = Hold − Return).\n  const legacy = {};\n  rows.forEach(function (r) {\n    if (r.RecordType === 'Return' && !truthy_(r.Cancelled) && !HOLD_TAG_.test(String(r.Comment || ''))) legacy[r.FGLotID] = (legacy[r.FGLotID] || 0) + (Number(r.Output_Kg) || 0);\n  });\n  const tOf = function (r) { return new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime(); };\n  return rows.filter(function (r) { return r.RecordType === 'Hold' && !truthy_(r.Cancelled); }).sort(function (a, b) { return tOf(a) - tOf(b); }).map(function (r) {\n    const u = used[String(r.FGLotID) + '|' + holdKey_(r)] || { bags: 0, kg: 0 }, unit = unitOf_(r), w = Number(r.WeightInput) || 0;\n    let kg = (Number(r.Output_Kg) || 0) - u.kg, bags = (Number(r.Output_Bag) || 0) - u.bags;\n    const take = Math.min(legacy[r.FGLotID] || 0, Math.max(kg, 0));\n    if (take > 0) { legacy[r.FGLotID] -= take; kg -= take; if (unit === 'Bag' && w > 0) bags = Math.round(kg / w); }\n    const from = String(r.Comment || '').match(MOVED_TAG_);\n    return { id: String(r.RecordID), fgLotId: String(r.FGLotID), lot: String(r.Lot_Number), pack: String(r.Pack_Number), no: Number(r.Pallet_No),\n      day: holdKey_(r).split('|')[1], unit: unit, w: w, bags: bags, kg: Math.round(kg * 100) / 100, from: from ? TN_(from[1]) + ' #' + from[2] : '', semi: isSemiRow_(r),\n      note: tnNote_(r.Comment), team: String(r.Packing_Team || ''), t: tOf(r) };\n  }).filter(function (h) { return h.unit === 'Bigbag' ? h.kg > 0.001 : h.bags > 0; });\n}\n// Hold → output again in the same lot. Pallet no.: the FG/WIP/SEMI no. it was moved from (left as a gap by moveToHold) if still free,\n// else the next one.\nfunction backToFg_(all, rows, hold, open, lot, me, id, bags, w, kg, note) {\n  const m = String(hold.Comment || '').match(MOVED_TAG_);\n  const type = m ? m[1] : isSemiRow_(hold) ? 'SEMI' : 'FG', T = CFG.TYPES[type], used = usedPallets_(rows, type, Date.now());\n  const no = m && !used.has(Number(m[2])) ? Number(m[2]) : nextPallet_(used);\n  return leaveHold_(all, hold, open, lot, me, id, bags, w, kg, note, { to: type, T: T, no: no, label: 'กลับเป็น ' + TN_(type) + ' #' + no + ' โดย ' + me.Name });\n}\n// Part (or all) of a Hold pallet leaves Hold as another record type. Whole pallet with nothing decided yet = the Hold row itself\n// changes type; otherwise the Hold row shrinks by that part and a new row is added. So Hold kg is never counted twice —\n// Production_Lot Total_Output = Packed + NCP + (Hold − Return), and a Reject becomes NCP.\nfunction leaveHold_(all, hold, open, lot, me, id, bags, w, kg, note, g) {\n  const whole = open.unit === 'Bigbag' ? Math.abs(kg - (Number(hold.Output_Kg) || 0)) < 0.001 : bags === Number(hold.Output_Bag);\n  const lr = { sh: all.sh, h: all.h }, now = new Date(), T = g.T;\n  if (whole) {\n    setCells_(lr, hold, { RecordType: T.recordType, WIP: T.wip, Pallet_No: g.no, Storage_Location: T.store, NCP_Status: 'None', Comment: joinNote_(hold.Comment, g.label, note) });\n    return { ids: [String(hold.RecordID)], to: g.to, pallet: g.no, fgLotId: String(lot.FGLotID), kg: kg };\n  }\n  const left = open.unit === 'Bigbag' ? { Output_Kg: (Number(hold.Output_Kg) || 0) - kg, WeightInput: (Number(hold.Output_Kg) || 0) - kg }\n    : { Output_Bag: (Number(hold.Output_Bag) || 0) - bags, Output_Kg: ((Number(hold.Output_Bag) || 0) - bags) * w };\n  setCells_(lr, hold, Object.assign(left, { Comment: joinNote_(hold.Comment, 'ปล่อย ' + (open.unit === 'Bigbag' ? kg + ' kg' : bags + ' ถุง') + ' ' + g.label) }));\n  appendRows_(all.sh, all.h, [{ RecordID: id, FGLotID: lot.FGLotID, Lot_Number: lot.Lot_Number, Pack_Number: lot.Pack_Number, LotFGKey: lot.LotFGKey,\n    DateTimeRecords: hold.DateTimeRecords || now, Stop_Time: '', Production_Date: hold.Production_Date, RecordType: T.recordType, WIP: T.wip, Pallet_No: g.no,\n    Floating_Percent: hold.Floating_Percent, Output_Bag: bags, WeightInput: w, Output_Kg: kg, Packing_Team: hold.Packing_Team, Sup_Pack: me.Name,\n    Packing_bin: hold.Packing_bin, Storage_Location: T.store, Pack_Item: hold.Pack_Item || '', Pallet_Type: hold.Pallet_Type || '', Comment: joinNote_('จาก Hold #' + open.no + ' (' + open.day + ') · ' + g.label, note),\n    Cancelled: false, Visible: true, NCP_Status: 'None', CreatedBy: 'PackingApp:' + me.Name, CreateTimestamp: now, UpdatedTimestamp: now }]);\n  return { ids: [String(hold.RecordID), id], to: g.to, pallet: g.no, fgLotId: String(lot.FGLotID), kg: kg };\n}\nfunction holdList(token) {\n  session_(token, 'sup');\n  const lots = {};\n  table_(CFG.FG_LOT).rows.forEach(function (r) { if (!truthy_(r.Cancelled)) lots[String(r.FGLotID)] = r; });\n  const t = table_(CFG.REC), since = Date.now() - 120 * 24 * HOUR;\n  return openHolds_(t.rows.filter(function (r) { return lots[String(r.FGLotID)] && new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime() > since; }))\n    .map(function (h) { h.name = String(lots[h.fgLotId].FG_Name); h.pid = String(lots[h.fgLotId].ProductionID); return h; })\n    .sort(function (a, b) { return b.t - a.t; });\n}\n// Sup decides a Hold pallet: d = {id (new row, re-send safe), holdId, to: 'Return'|'Reject'|'FG', bags (Bag) | kg (Bigbag), note}.\n// Default is the whole remaining pallet; part of it is fine. Reject gets the next Reject no. of today (its NCP is made by recalc);\n// Return has no pallet no. FG = sorted / passed: back to output in the same lot (see backToFg_).\nfunction disposeHold(token, d) {\n  const me = session_(token, 'sup');\n  if (!str_(d.id, 20)) throw new Error('ข้อมูลไม่ครบ');\n  return withLock_(function () { return disposeHold_(me, d, table_(CFG.REC)); });\n}\n// Inside the lock (useOldSemi calls it too).\nfunction disposeHold_(me, d, all) {\n  const id = str_(d.id, 20), to = d.to === 'Reject' ? 'Reject' : d.to === 'FG' ? 'FG' : 'Return';\n  const hold = all.rows.find(function (r) { return String(r.RecordID) === String(d.holdId); });\n  if (!hold || hold.RecordType !== 'Hold' || truthy_(hold.Cancelled)) throw new Error('ไม่พบพาเลท WIP นี้');\n  const lot = liveLot_(hold.FGLotID), rows = all.rows.filter(function (r) { return String(r.FGLotID) === String(hold.FGLotID); });\n  if (rows.some(function (r) { return String(r.RecordID) === id; })) return { dup: true, ids: [id] };\n  const open = openHolds_(rows).find(function (h) { return h.id === String(d.holdId); });\n  if (!open) throw new Error('WIP #' + hold.Pallet_No + ' ตัดสินครบแล้ว');\n  let bags, w, kg;\n  if (open.unit === 'Bigbag') {\n    kg = Number(d.kg);\n    if (!(kg > 0 && kg <= open.kg + 0.001)) throw new Error('น้ำหนักต้องอยู่ระหว่าง 0–' + open.kg + ' kg');\n    bags = 1; w = kg;\n  } else {\n    bags = intIn_(d.bags, 1, open.bags, 'จำนวนถุง');\n    w = open.w; kg = bags * w;\n  }\n  if (to === 'FG') return backToFg_(all, rows, hold, open, lot, me, id, bags, w, kg, d.note);\n  if (to === 'Reject') { // numbered in the Hold pallet's production day\n    const at = new Date(hold.DateTimeRecords || hold.CreateTimestamp || Date.now()).getTime(), no = nextPallet_(usedPallets_(rows, 'Reject', at));\n    return leaveHold_(all, hold, open, lot, me, id, bags, w, kg, d.note, { to: 'Reject', T: CFG.TYPES.Reject, no: no, label: 'Reject #' + no + ' โดย ' + me.Name });\n  }\n  // Return stays a row of its own (linked by \"จาก Hold #n\"); Hold − Return is what FG_Lot / Production_Lot count.\n  const now = new Date(), day = prodDateKey_(now.getTime()), no = '';\n  appendRows_(all.sh, all.h, [{ RecordID: id, FGLotID: lot.FGLotID, Lot_Number: lot.Lot_Number, Pack_Number: lot.Pack_Number, LotFGKey: lot.LotFGKey,\n    DateTimeRecords: now, Production_Date: dayDate_(day), RecordType: to, WIP: false, Pallet_No: no, Output_Bag: bags, WeightInput: w, Output_Kg: kg,\n    Packing_Team: hold.Packing_Team, Sup_Pack: me.Name, Packing_bin: hold.Packing_bin, Pack_Item: hold.Pack_Item || '', Storage_Location: to === 'Reject' ? 'คลัง PD' : 'คลัง FG',\n    Comment: joinNote_('จาก Hold #' + open.no + ' (' + open.day + ')', d.note), Cancelled: false, Visible: true, NCP_Status: 'None',\n    CreatedBy: 'PackingApp:' + me.Name, CreateTimestamp: now, UpdatedTimestamp: now }]);\n  return { ids: [id], to: to, pallet: no, fgLotId: lot.FGLotID, kg: kg, bags: bags };\n}\n\n/* ---------- Old_Semi: SEMI / Hold of an earlier round used in this lot ---------- */\n\nfunction oldTable_() {\n  if (!isDb_(CFG.OLD) && !ss_().getSheetByName(CFG.OLD)) ss_().insertSheet(CFG.OLD, ss_().getNumSheets()).appendRow(CFG.OLD_HEADERS);\n  return table_(CFG.OLD);\n}\nconst r2_ = function (n) { return Math.round(n * 100) / 100; };\nconst recT_ = function (r) { return new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime(); };\n// SEMI packed per lot (Output rows that are SEMI) minus what was already used elsewhere. ponytail: SEMI that BFL-PC packs\n// is not recorded as used, so \"left\" is an upper bound.\nfunction semiStock_(rows, uses) {\n  const by = {};\n  rows.forEach(function (r) {\n    if (r.RecordType !== 'Output' || truthy_(r.Cancelled) || !isSemiRow_(r)) return;\n    const k = String(r.FGLotID);\n    by[k] = by[k] || { kg: 0, used: 0, bags: 0, t: 0 };\n    by[k].kg += Number(r.Output_Kg) || 0; by[k].bags += Number(r.Output_Bag) || 0; by[k].t = Math.max(by[k].t, recT_(r));\n  });\n  uses.forEach(function (u) { const b = by[String(u.Src_FGLotID)]; if (b && u.Src_Type === 'SEMI' && !truthy_(u.Cancelled)) b.used += Number(u.Kg) || 0; });\n  return by;\n}\n// Choices for lot fgLotId: Hold pallets and SEMI stock of other production lots (last OLD_DAYS days).\nfunction oldSemiSources(token, fgLotId) {\n  session_(token, 'sup');\n  const pid = String(liveLot_(fgLotId).ProductionID), lots = {}, since = Date.now() - CFG.OLD_DAYS * 24 * HOUR;\n  table_(CFG.FG_LOT).rows.forEach(function (r) { if (!truthy_(r.Cancelled) && String(r.ProductionID) !== pid) lots[String(r.FGLotID)] = r; });\n  const rows = table_(CFG.REC).rows.filter(function (r) { return lots[String(r.FGLotID)] && recT_(r) > since; });\n  const holds = openHolds_(rows).map(function (h) { h.name = String(lots[h.fgLotId].FG_Name); return h; }).sort(function (a, b) { return b.t - a.t; });\n  const st = semiStock_(rows, oldTable_().rows);\n  const semis = Object.keys(st).map(function (k) {\n    const l = lots[k], b = st[k];\n    return { id: k, lot: String(l.Lot_Number), name: String(l.FG_Name), pack: String(l.Pack_Number), pc: truthy_(l.SEMI_TRANSFER),\n      kg: r2_(b.kg), used: r2_(b.used), left: r2_(b.kg - b.used), w: b.bags ? r2_(b.kg / b.bags) : 0, t: b.t };\n  }).filter(function (x) { return x.left > 0.001; }).sort(function (a, b) { return b.t - a.t; });\n  return { holds: holds, semis: semis };\n}\n// What lot fgLotId used (for lotDetail).\nfunction oldUses_(fgLotId) {\n  if (!isDb_(CFG.OLD) && !ss_().getSheetByName(CFG.OLD)) return [];\n  return rowsWhere_(CFG.OLD, 'FGLotID', fgLotId).rows.filter(function (r) { return !truthy_(r.Cancelled); }).map(function (r) {\n    return { id: String(r.UseID), at: dt_(r.CreateTimestamp), t: ms_(r.CreateTimestamp), src: String(r.Src_Type), lot: String(r.Src_Lot_Number),\n      name: String(r.Src_Name), bags: Number(r.Bags) || 0, kg: Number(r.Kg) || 0, note: String(r.Comment || ''), by: String(r.CreatedBy || '').replace(/^PackingApp:/, '') };\n  }).sort(function (a, b) { return b.t - a.t; });\n}\nfunction addOldSemi_(pl, prow, dkg) {\n  const c = pl.h.indexOf('Old_Semi') + 1;\n  if (!c) throw new Error('Production_Lot ไม่มีคอลัมน์ Old_Semi');\n  const v = r2_(Math.max((Number(prow.Old_Semi) || 0) + dkg, 0));\n  if (pl.sh && pl.sh.db) dbSet_(pl.sh.db, pl.h, [prow], { Old_Semi: v }); else pl.sh.getRange(prow._row, c).setValue(v);\n  return v;\n}\nfunction plRow_(pl, pid) {\n  const r = pl.rows.find(function (x) { return String(x.ProductionID) === pid && !truthy_(x.Cancelled); });\n  if (!r) throw new Error('ไม่พบ Production Lot ของล็อตนี้');\n  return r;\n}\n// d = {id, fgLotId (lot that uses it), src: 'SEMI'|'Hold', srcId (SEMI: its FGLotID · Hold: the Hold RecordID), bags | kg, note}.\n// Hold = Return row \"จาก Hold #n (dd/MM) · ใช้ในล็อต X\" in its own lot (same as ตัดสิน Hold → Return), then Old_Semi += kg.\n// ponytail: Old_Semi is += / −= (keeps what was typed in AppSheet); a failure between the writes could leave it off — fix by hand.\nfunction useOldSemi(token, d) {\n  const me = session_(token, 'sup'), id = str_(d.id, 20), src = d.src === 'Hold' ? 'Hold' : 'SEMI';\n  if (!id || !d.srcId) throw new Error('ข้อมูลไม่ครบ');\n  return withLock_(function () {\n    const ot = oldTable_();\n    if (ot.rows.some(function (r) { return String(r.UseID) === id; })) return { dup: true, ids: [] };\n    const lot = liveLot_(d.fgLotId), pid = String(lot.ProductionID || '').trim();\n    if (!pid) throw new Error('FG Lot นี้ไม่มีล็อตผลิต (ProductionID)');\n    const pl = table_(CFG.PLOT), prow = plRow_(pl, pid), note = str_(d.note, 300);\n    let row, ids = [], srcLot;\n    if (src === 'Hold') {\n      const all = table_(CFG.REC), hold = all.rows.find(function (r) { return String(r.RecordID) === String(d.srcId); });\n      if (!hold) throw new Error('ไม่พบพาเลท WIP นี้');\n      srcLot = fgLotRow_(hold.FGLotID);\n      if (String(srcLot.ProductionID) === pid) throw new Error('WIP นี้อยู่ล็อตผลิตเดียวกัน — ใช้ ตัดสิน WIP → กลับเป็น FG');\n      const done = all.rows.find(function (r) { return String(r.RecordID) === id; }); // re-send after the Return row was written\n      const r = done ? { ids: [id], kg: Number(done.Output_Kg) || 0, bags: Number(done.Output_Bag) || 0 }\n        : disposeHold_(me, { id: id, holdId: d.srcId, to: 'Return', bags: d.bags, kg: d.kg, note: joinNote_('ใช้ในล็อต ' + lot.Lot_Number, note) }, all);\n      ids = r.ids;\n      row = { Src_RecordID: String(hold.RecordID), Return_RecordID: id, Bags: hold.WeightInput > CFG.BIGBAG_MIN_KG ? '' : r.bags, Kg: r.kg };\n    } else {\n      srcLot = liveLot_(d.srcId);\n      if (String(srcLot.ProductionID) === pid) throw new Error('SEMI นี้อยู่ล็อตผลิตเดียวกัน');\n      const b = semiStock_(lotRows_(srcLot.FGLotID).rows, ot.rows)[String(srcLot.FGLotID)], left = b ? r2_(b.kg - b.used) : 0, kg = Number(d.kg);\n      if (!(kg > 0 && kg <= left + 0.001)) throw new Error('น้ำหนักต้องอยู่ระหว่าง 0–' + left + ' kg (SEMI คงเหลือของล็อต ' + srcLot.Lot_Number + ')');\n      row = { Src_RecordID: '', Return_RecordID: '', Bags: d.bags ? intIn_(d.bags, 1, 5000, 'จำนวนถุง') : '', Kg: r2_(kg) };\n    }\n    const total = addOldSemi_(pl, prow, row.Kg), now = new Date();\n    appendRows_(ot.sh, ot.h, [Object.assign(row, { UseID: id, FGLotID: lot.FGLotID, Lot_Number: lot.Lot_Number, ProductionID: pid, Src_Type: src,\n      Src_FGLotID: srcLot.FGLotID, Src_Lot_Number: srcLot.Lot_Number, Src_Name: srcLot.FG_Name, Comment: note, Cancelled: false,\n      CreatedBy: 'PackingApp:' + me.Name, CreateTimestamp: now, UpdatedTimestamp: now })]);\n    return { ids: ids, srcFgLotId: String(srcLot.FGLotID), pid: pid, kg: row.Kg, oldSemi: total, lot: String(lot.Lot_Number) };\n  });\n}\n// Undo a use: Old_Semi −= kg, and a Hold's Return row is cancelled (the Hold pallet is open again).\nfunction cancelOldSemi(token, useId) {\n  const me = session_(token, 'sup');\n  return withLock_(function () {\n    const ot = oldTable_(), u = ot.rows.find(function (r) { return String(r.UseID) === String(useId); });\n    if (!u || truthy_(u.Cancelled)) throw new Error('ไม่พบรายการนี้ (หรือยกเลิกแล้ว)');\n    const pl = table_(CFG.PLOT), total = addOldSemi_(pl, plRow_(pl, String(u.ProductionID)), -(Number(u.Kg) || 0));\n    const ids = [];\n    if (String(u.Return_RecordID)) {\n      const all = table_(CFG.REC), r = all.rows.find(function (x) { return String(x.RecordID) === String(u.Return_RecordID); });\n      if (r && !truthy_(r.Cancelled)) { setCells_(all, r, { Cancelled: true, Comment: joinNote_(r.Comment, 'ยกเลิกโดย ' + me.Name) }); ids.push(String(r.RecordID)); }\n    }\n    setCells_(ot, u, { Cancelled: true, Comment: joinNote_(u.Comment, 'ยกเลิกโดย ' + me.Name) });\n    return { ids: ids, srcFgLotId: String(u.Src_FGLotID), pid: String(u.ProductionID), kg: Number(u.Kg) || 0, oldSemi: total };\n  });\n}\n\n// POST to the Bluefalo Production_Lot web app — the same bodies its AppSheet bots send.\nfunction hook_(body) {\n  if (typeof __LR !== 'undefined') { dbCall_('pkh_add', { p_body: body }); return 202; }   // v92: the phone queues it with its save\n  const r = UrlFetchApp.fetch(prop_('RECALC_URL') || CFG.HOOK_URL,\n    { method: 'post', contentType: 'application/json', muteHttpExceptions: true, payload: JSON.stringify(body) });\n  return r.getResponseCode();\n}\n\n// Called by the phone in the background after a save, so the screen never waits on it. One row at a time\n// (rows of one lot share FG_Lot totals, so no parallel calls).\n// Packing_Record rows = BOT_PK_Record_Realtime_Add body; Reject rows then also get their NCP row (RUNPACKINGREJECTTONCPBYRECORDID,\n// as the AppSheet bot does). kind 'runtime' = Packing_Runtime rows (BOT_Packing_Runtime_Recalc body).\nfunction recalc(token, ids, fgLotId, kind) {\n  const me = session_(token, 'work'), by = 'PackingApp:' + me.Name;\n  ids = (ids || []).map(String);\n  if (localW_()) { DB_FRESH_ = true; DB_MEMO_ = {}; }\n  if (dbOn_()) { try { pkFlush_(); } catch (e) { console.warn('sheet copy: ' + e.message); } }\n  const out = recalc_(me, by, ids, fgLotId, kind);\n  if (dbOn_() && kind !== 'pl' && fgLotId) { try { pkCalcBack_([String(fgLotId)]); } catch (e) { console.warn('totals back: ' + e.message); } }\n  return out;\n}\nfunction recalc_(me, by, ids, fgLotId, kind) {\n  if (kind === 'pl') { // fgLotId = ProductionID; requestID keeps doPost's 45 s duplicate filter from dropping a second use\n    return { codes: [hook_({ action: 'PRODUCTION_LOT_FINISHED', module: 'PRODUCTION_LOT_KPI', productionID: String(fgLotId), rowID: String(fgLotId),\n      requestID: ids[0] || String(Date.now()), requestedBy: by })] };\n  }\n  if (kind === 'runtime') {\n    const lot = fgLotRow_(fgLotId);\n    return { codes: ids.map(function (id) {\n      return hook_({ action: 'PACKING_RUNTIME_REALTIME', rowID: id, fgLotID: String(fgLotId), packNumber: String(lot.Pack_Number), requestedBy: by });\n    }) };\n  }\n  const codes = ids.map(function (id) { return hook_({ module: 'PACKING', action: 'REALTIME', rowID: id, scopeID: String(fgLotId || ''), requestedBy: by }); });\n  lotRows_(fgLotId).rows.forEach(function (r) {\n    if (ids.indexOf(String(r.RecordID)) < 0 || r.RecordType !== 'Reject') return;\n    codes.push(hook_({ action: truthy_(r.Cancelled) ? 'RUNCANCELPACKINGNCPBYRECORDID' : 'RUNPACKINGREJECTTONCPBYRECORDID', rowID: String(r.RecordID) }));\n  });\n  return { codes: codes };\n}\n\n/* ---------- tab ข้อมูล (Sup/Admin): FG Lot + its Runtime / bin receive / NCP / export, FG Detail ---------- */\n\nfunction table_(name) {\n  if (isDb_(name)) return dbTable_(name);\n  const sh = sheet_(name), v = sh.getDataRange().getValues(), h = v.shift().map(String), rows = toObjs_(h, v);\n  rows.forEach(function (r, i) { r._row = i + 2; });\n  return { sh: sh, h: h, rows: rows };\n}\n// Same value into one column of many scattered rows, in one call per column.\nfunction setMany_(lr, rows, vals) {\n  if (!rows.length) return;\n  vals.UpdatedTimestamp = new Date();\n  if (lr.sh && lr.sh.db) return dbSet_(lr.sh.db, lr.h, rows, vals);\n  Object.keys(vals).forEach(function (k) {\n    const c = lr.h.indexOf(k) + 1;\n    if (c) lr.sh.getRangeList(rows.map(function (r) { return lr.sh.getRange(r._row, c).getA1Notation(); })).setValue(vals[k]);\n  });\n}\n// Starts with a letter: an all-digit id (\"05130163\") becomes a number in the sheet and TextFinder can no longer find it.\nfunction id8_() { return 'abcdf'.charAt(Math.floor(Math.random() * 5)) + Utilities.getUuid().replace(/-/g, '').slice(1, 8); }\nfunction str_(v, max) { return String(v == null ? '' : v).trim().slice(0, max || 500); }\nfunction dt_(v) { return v instanceof Date ? Utilities.formatDate(v, 'Asia/Bangkok', 'dd/MM HH:mm') : ''; }\nfunction ms_(v) { return v instanceof Date ? v.getTime() : 0; }\n// Time typed on the phone (default now): not in the future, at most BACKDATE_DAYS back.\nfunction when_(v) {\n  const t = v ? new Date(Number(v) || v) : new Date(), n = Date.now();\n  if (isNaN(t.getTime())) throw new Error('เวลาไม่ถูกต้อง');\n  if (t.getTime() > n + 10 * 60e3) throw new Error('เวลาต้องไม่เกินตอนนี้');\n  if (t.getTime() < n - CFG.BACKDATE_DAYS * 24 * HOUR) throw new Error('ย้อนหลังได้ไม่เกิน ' + CFG.BACKDATE_DAYS + ' วัน');\n  return t;\n}\nfunction kg_(v, label) {\n  if (v === '' || v == null) return '';\n  const n = Number(v);\n  if (!(n >= 0 && n <= 50000)) throw new Error(label + ' ไม่ถูกต้อง');\n  return n;\n}\n// FG_Lot.Order_Ton (ตัน): blank = not set yet.\nfunction orderTon_(v) { return v === '' || v == null || isNaN(Number(v)) ? null : Number(v); }\nfunction fgLotRow_(id) {\n  const r = table_(CFG.FG_LOT).rows.find(function (x) { return String(x.FGLotID) === String(id); });\n  if (!r) throw new Error('ไม่พบ FG Lot นี้');\n  return r;\n}\nfunction liveLot_(id) {\n  const r = fgLotRow_(id);\n  if (truthy_(r.Cancelled)) throw new Error('ล็อตนี้ถูกยกเลิกแล้ว');\n  return r;\n}\nfunction lotOut_(r) {\n  const n = function (k) { return Number(r[k]) || 0; };\n  return { id: String(r.FGLotID), lot: String(r.Lot_Number), type: String(r.LotType).trim().toUpperCase() === 'SEMI' ? 'SEMI' : 'FG',\n    pack: String(r.Pack_Number), fgid: String(r.FGID), name: String(r.FG_Name), productId: String(r.ProductID), productionId: String(r.ProductionID),\n    status: String(r.Status).trim().toUpperCase(), mode: String(r.PackingMode || ''), semiPc: truthy_(r.SEMI_TRANSFER), order: orderTon_(r.Order_Ton),\n    packaging: String(r.Packaging_Detail || ''), packType: String(r.PackType || ''), weight: n('StdWeight'),\n    bags: n('Total_Output_Bag'), kg: n('Total_Output_Kg'), hold: n('Total_Hold_Kg'), ret: n('Total_Return_Kg'), reject: n('Total_Reject_Kg'),\n    last: dt_(r.Last_Record_At), cancelled: truthy_(r.Cancelled) };\n}\n\n// Pack-Runtime processes from RuntimeType, in the 4 groups (cached 10 min).\nfunction rtypes_() {\n  const cache = CacheService.getScriptCache(), hit = cache.get('rtypes');\n  if (hit) return JSON.parse(hit);\n  const rows = table_(CFG.RTYPE).rows.filter(function (r) { return String(r.Group).trim() === 'Pack-Runtime' && !truthy_(r.Cancelled) && String(r.Process).trim(); });\n  const out = CFG.RT_GROUPS.map(function (g) {\n    return { type: g[0], title: g[1], items: rows.filter(function (r) { return String(r.Type).trim() === g[0]; }).map(function (r) { return String(r.Process); }) };\n  }).filter(function (g) { return g.items.length; });\n  cache.put('rtypes', JSON.stringify(out), 600);\n  return out;\n}\n// NCP_Detail choices for a product: only what Production_NCP_Map maps to its ProductID (default first, then priority).\n// The map decides — an NCP_Detail with Active off still counts when mapped (as the main script's Reject → NCP does).\nfunction ncpOpts_(productId) {\n  const name = {};\n  table_(CFG.NCP_DETAIL).rows.forEach(function (r) { name[String(r.NCP_ID)] = String(r.NCP_Name); });\n  const maps = table_(CFG.NCP_MAP).rows.filter(function (r) { return String(r.ProductID).trim() === String(productId).trim() && truthy_(r.Active) && name[String(r.NCP_ID)]; })\n    .sort(function (a, b) { return (truthy_(b.Default_Flag) - truthy_(a.Default_Flag)) || (Number(a.Priority || 9999) - Number(b.Priority || 9999)); });\n  const list = maps.map(function (r) { return String(r.NCP_ID); });\n  return { mapped: !!maps.length, items: list.filter(function (x, i) { return list.indexOf(x) === i; }).map(function (id) { return { id: id, name: name[id] }; }) };\n}\n\nfunction dataLots(token) {\n  session_(token, 'view');\n  return table_(CFG.FG_LOT).rows.filter(function (r) { return !truthy_(r.Cancelled) && String(r.FGLotID); }).reverse().map(lotOut_);\n}\n\n// One lot with everything under it. Times sorted newest first; the phone works out durations (start → next start).\nfunction lotDetail(token, id) {\n  session_(token, 'view');\n  const k1 = String(id || '');\n  if (k1) dbPrefetch_([[CFG.FG_LOT], [CFG.RUNTIME, 'FGLotID', [k1]], [CFG.BIN, 'FGLotID', [k1]], [CFG.REC, 'FGLotID', [k1]], [CFG.OLD, 'FGLotID', [k1]],\n    [CFG.EXPORT, 'FGLotID', [k1]], [CFG.NCP], [CFG.PLOT]]);\n  const lot = lotOut_(fgLotRow_(id)), live = function (r) { return !truthy_(r.Cancelled); };\n  const byTime = function (a, b) { return b.t - a.t; };\n  const runtime = rowsWhere_(CFG.RUNTIME, 'FGLotID', lot.id).rows.filter(live).map(function (r) {\n    return { id: String(r.ID), at: dt_(r.DateTimeRecords), t: ms_(r.DateTimeRecords), proc: String(r.Process), note: String(r.Comment || ''),\n      team: String(r.Clearing_Team || ''), flush: r.FlushLine_kg, contam: r.Contaminate_kg };\n  }).sort(byTime);\n  const bins = rowsWhere_(CFG.BIN, 'FGLotID', lot.id).rows.filter(live).map(function (r) {\n    return { id: String(r.ID), at: dt_(r.DateTimeRecords), t: ms_(r.DateTimeRecords), bin: String(r.Bin_Number), note: String(r.Comment || ''),\n      by: String(r.CreatedBy || '').replace(/^PackingApp:/, '') };\n  }).sort(byTime);\n  const det = {};\n  table_(CFG.NCP_DETAIL).rows.forEach(function (r) { det[String(r.NCP_ID)] = String(r.NCP_Name); });\n  // NCP of this lot: rows tied to the FG lot, plus Packing rows typed in AppSheet against its production lot (no FGLotID).\n  const ncp = table_(CFG.NCP).rows.filter(function (r) {\n    return live(r) && (String(r.FGLotID) === lot.id || (!String(r.FGLotID) && String(r.Process) === 'Packing' && lot.productionId && String(r.ProductionID) === lot.productionId));\n  }).map(function (r) {\n    return { id: String(r.ID), at: dt_(r.DateTime), t: ms_(r.DateTime), kg: Number(r.Weight_Kg || r.Weight) || 0, what: det[String(r.NCP_Detail_ID)] || String(r.NCP_Type || r.Comment || 'NCP'),\n      note: String(r.Comment || ''), no: String(r.NCP_No || ''), auto: String(r.SourceModule) === 'Packing_Record' };\n  }).sort(byTime);\n  const pl = lot.productionId ? table_(CFG.PLOT).rows.find(function (r) { return String(r.ProductionID) === lot.productionId && !truthy_(r.Cancelled); }) : null;\n  return { lot: lot, runtime: runtime, bins: bins, ncp: ncp, exports: exports_(lot.id), shifts: shifts_(lot.id), old: oldUses_(lot.id), oldSemi: pl ? Number(pl.Old_Semi) || 0 : null, rtypes: rtypes_(), binList: CFG.BINS[lot.pack] || [],\n    ncpOpts: ncpOpts_(lot.productId), other: CFG.RT_OTHER, serverNow: Date.now() };\n}\n// กะที่มีพาเลท (ให้เลือก export ทีละกะ): 'yyyy-MM-dd|8' = วันผลิต + กะเริ่ม 08 / 16 / 00 · เรียงตามเวลา\nfunction shiftOf_(ms) { return prodDateKey_(ms) + '|' + [0, 8, 16][Math.floor(new Date(ms + 7 * HOUR).getUTCHours() / 8)]; }\nfunction shifts_(fgLotId) {\n  const n = {}, ord = { 8: 0, 16: 1, 0: 2 };\n  lotRows_(fgLotId).rows.forEach(function (r) {\n    if (truthy_(r.Cancelled) || !(r.DateTimeRecords instanceof Date) || rowType_(r) === 'Return') return;\n    const k = shiftOf_(r.DateTimeRecords.getTime()); n[k] = (n[k] || 0) + 1;\n  });\n  return Object.keys(n).sort(function (a, b) { return a.slice(0, 10).localeCompare(b.slice(0, 10)) || ord[a.slice(11)] - ord[b.slice(11)]; })\n    .map(function (k) { return { key: k, n: n[k] }; });\n}\nfunction exports_(fgLotId) {\n  return rowsWhere_(CFG.EXPORT, 'FGLotID', fgLotId).rows.map(function (r) {\n    return { id: String(r.ExportID), at: dt_(r.RequestedAt), t: ms_(r.RequestedAt), status: String(r.Status || 'รอ'), msg: String(r.Message || ''),\n      pdf: !!String(r.Export_File || ''), xlsx: !!String(r.Export_Excel || '') };\n  }).sort(function (a, b) { return b.t - a.t; }).slice(0, 5);\n}\n\n// Choices for a new FG lot: recent production lots + active FG_Detail.\nfunction lotOptions(token) {\n  session_(token, 'sup');\n  // fgLots = FG lots already made from the production lot: with none, its Qty_Plan is the new FG lot's Order.\n  const fgLots = {};\n  table_(CFG.FG_LOT).rows.forEach(function (r) {\n    if (!truthy_(r.Cancelled) && String(r.LotType).trim().toUpperCase() !== 'SEMI') fgLots[String(r.ProductionID)] = (fgLots[String(r.ProductionID)] || 0) + 1;\n  });\n  const plots = table_(CFG.PLOT).rows.filter(function (r) { return !truthy_(r.Cancelled) && String(r.ProductionID); }).slice(-400).reverse()\n    .map(function (r) { return { pid: String(r.ProductionID), lot: String(r.Lot_Number), product: String(r.ProductID), state: String(r.State || ''), ext: String(r.Extruder_Number || ''),\n      qty: Number(r.Qty_Plan) || 0, fgLots: fgLots[String(r.ProductionID)] || 0 }; });\n  return { plots: plots, fgd: fgDetails_(), packs: Object.keys(CFG.BINS) };\n}\nfunction fgDetails_(withOff) { // withOff: Admin's list also shows cancelled items (off: true), to bring one back or change its code\n  return table_(CFG.FG_DETAIL).rows.filter(function (r) { return (withOff || !truthy_(r.Cancelled)) && String(r.FGID).trim(); }).reverse().map(function (r) {\n    const o = { fgid: String(r.FGID).trim(), name: String(r.FG_Name), weight: Number(r.Weight) || 0, size: String(r.Size || ''), unit: String(r.Unit || ''),\n      lotType: String(r.LotType).trim().toUpperCase() === 'SEMI' ? 'SEMI' : 'FG', packType: String(r.PackType || ''),\n      form: String(r.Form_Type).trim().toUpperCase() === 'BFL-PC' ? 'BFL-PC' : 'BFL',\n      semiCode: String(r.SEMI_Code || '').trim(), defBags: Number(r.Default_Bags) || 0 };\n    if (withOff && truthy_(r.Cancelled)) o.off = true;\n    return o;\n  });\n}\nfunction fgdFor_(me) { return fgDetails_(me && me.Role === 'admin'); }\n\n// MFG / EXP printed on the bag (FG_Lot.Packaging_Detail), user 6 Nov 2026: \"MFG 2026 10 26\" or \"MFG 26 10 2026\" (year first or last,\n// spaces between). Rules: both or neither (Bigbag / SEMI have none) · a real date · EXP after MFG (not the same day, not before it) ·\n// EXP not already past (checked when the text is new or changed, so an old lot can still be edited). Returns { mfg, exp, days, err }.\n// The phone runs the same rules (stampCheck in Index.html) to show the dates while typing.\nfunction stampCheck_(txt, today, checkPast) {\n  const s = String(txt || ''), out = { mfg: '', exp: '', days: 0, err: [] };\n  const fmt = function (v) { return v.slice(8, 10) + '/' + v.slice(5, 7) + '/' + v.slice(0, 4); };\n  ['MFG', 'EXP'].forEach(function (k) {\n    const n = (s.match(new RegExp(k, 'gi')) || []).length;\n    if (!n) return;\n    if (n > 1) { out.err.push(k + ' มีมากกว่า 1 ครั้ง'); return; }\n    const m = new RegExp(k + '[ \\\\t:.]*(?:(\\\\d{4})[ \\\\t./-]+(\\\\d{1,2})[ \\\\t./-]+(\\\\d{1,2})|(\\\\d{1,2})[ \\\\t./-]+(\\\\d{1,2})[ \\\\t./-]+(\\\\d{4}))(?!\\\\d)', 'i').exec(s);\n    const y = m && (m[1] || m[6]), mo = m && (m[2] || m[5]), d = m && (m[3] || m[4]);\n    const dt = m ? new Date(Date.UTC(+y, +mo - 1, +d)) : null;\n    if (!m || dt.getUTCFullYear() !== +y || dt.getUTCMonth() !== +mo - 1 || dt.getUTCDate() !== +d) {\n      out.err.push('อ่านวันที่ ' + k + ' ไม่ได้ — พิมพ์แบบ ' + k + ' 2026 10 26 (ปี เดือน วัน เว้นวรรค)'); return;\n    }\n    out[k.toLowerCase()] = dt.toISOString().slice(0, 10);\n  });\n  if (!out.err.length && (out.mfg || out.exp)) {\n    if (!out.mfg) out.err.push('มี EXP แต่ไม่มี MFG');\n    else if (!out.exp) out.err.push('มี MFG แต่ไม่มี EXP');\n    else if (out.exp === out.mfg) out.err.push('MFG กับ EXP เป็นวันเดียวกัน (' + fmt(out.mfg) + ')');\n    else if (out.exp < out.mfg) out.err.push('EXP ' + fmt(out.exp) + ' ย้อนหลังก่อน MFG ' + fmt(out.mfg));\n    else if (checkPast && out.exp <= today) out.err.push('EXP ' + fmt(out.exp) + ' เป็นวันที่ผ่านมาแล้ว (ย้อนหลัง)');\n    if (out.mfg && out.exp) out.days = Math.round((Date.parse(out.exp) - Date.parse(out.mfg)) / 864e5);\n  }\n  return out;\n}\nfunction bkkDay_() { return new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 10); }\n\n// New FG lot, or edit of an existing one — every field can change. On edit, what other tables copied from the lot follows:\n// Lot_Number / Pack_Number / LotFGKey in Packing_Record, Packing_Runtime, Packing_BinReceive; ProductID / ProductionID / production\n// Lot_Number / Extruder in the lot's NCP rows; Lot_Number in Packing_Form_Export; weight of Bag rows when StdWeight changes; the open job.\n// d = {id?, productionId, lotNumber, lotType, fgid, pack, status, mode, semiPc, packaging, order}\nfunction saveLot(token, d) {\n  const me = session_(token, 'sup');\n  const status = d.status === 'FINISHED' ? 'FINISHED' : 'PACKING', mode = d.mode === 'Repack' ? 'Repack' : 'Direct';\n  const packaging = str_(d.packaging, 1000), order = d.order === '' || d.order == null ? '' : Number(d.order);\n  if (order !== '' && !(order > 0 && order <= CFG.MAX_ORDER_TON)) throw new Error('Order (ตัน) ต้องมากกว่า 0 และไม่เกิน ' + CFG.MAX_ORDER_TON);\n  return withLock_(function () {\n    const t = table_(CFG.FG_LOT), now = new Date();\n    const old = d.id ? t.rows.find(function (x) { return String(x.FGLotID) === String(d.id); }) : null;\n    if (d.id && (!old || truthy_(old.Cancelled))) throw new Error('ไม่พบ FG Lot นี้');\n    const pl = table_(CFG.PLOT).rows.find(function (x) { return String(x.ProductionID) === String(d.productionId) && !truthy_(x.Cancelled); });\n    if (!pl) throw new Error('เลือกล็อตผลิตก่อน');\n    const type = d.lotType === 'SEMI' ? 'SEMI' : 'FG', fgid = String(d.fgid || '').trim();\n    // an edit may keep a product that was cancelled in FG_Detail since\n    const fg = fgDetails_().find(function (x) { return x.fgid === fgid; }) || (old && fgid === String(old.FGID).trim()\n      ? { fgid: fgid, name: String(old.FG_Name), weight: Number(old.StdWeight) || 0, packType: String(old.PackType || ''), lotType: type } : null);\n    if (!fg) throw new Error('เลือกสินค้า FG ก่อน');\n    if (fg.lotType !== type) throw new Error('สินค้า ' + fg.fgid + ' เป็นประเภท ' + fg.lotType + ' — เลือกประเภทล็อตให้ตรง');\n    if (!CFG.BINS[d.pack]) throw new Error('เลือกเครื่องแพค');\n    const lotNo = str_(d.lotNumber || pl.Lot_Number, 40), packType = type === 'SEMI' ? '' : fg.packType;\n    if (!lotNo) throw new Error('ใส่ Lot_Number');\n    const changed = !old || packaging.replace(/\\s+/g, ' ') !== String(old.Packaging_Detail || '').trim().replace(/\\s+/g, ' ');\n    const sc = stampCheck_(packaging, bkkDay_(), changed);\n    if (sc.err.length) throw new Error('ลักษณะบรรจุภัณฑ์: ' + sc.err.join(' · '));\n    const key = [lotNo, type, fg.fgid, packType, d.pack].join('|');\n    if (t.rows.some(function (x) { return x !== old && !truthy_(x.Cancelled) && String(x.LotFGKey) === key; })) throw new Error('มี FG Lot นี้อยู่แล้ว (' + key + ')');\n    const v = { ProductionID: String(pl.ProductionID), Lot_Number: lotNo, ProductID: String(pl.ProductID), LotType: type, Pack_Number: d.pack,\n      PackType: packType, FGID: fg.fgid, FG_Name: fg.name, StdWeight: fg.weight || '', Status: status, LotFGKey: key, PackingMode: mode,\n      SEMI_TRANSFER: type === 'SEMI' && !!d.semiPc, Packaging_Detail: packaging, Order_Ton: order };\n    let r, updated = null;\n    if (!old) {\n      r = Object.assign({ FGLotID: id8_(), CreateTimestamp: now, UpdatedTimestamp: now, CreatedBy: 'PackingApp:' + me.Name, Cancelled: false, Visible: true }, v);\n      appendRows_(t.sh, t.h, [r]);\n    } else {\n      const before = Object.assign({}, old);\n      lotJobs_(old, v);\n      const diff = {};\n      Object.keys(v).forEach(function (k) { if (String(v[k]) !== String(old[k] == null ? '' : old[k])) diff[k] = v[k]; });\n      if (Object.keys(diff).length) setCells_(t, old, diff);\n      r = Object.assign(old, v);\n      updated = cascadeLot_(String(old.FGLotID), before, v, pl);\n    }\n    CacheService.getScriptCache().remove('lots');\n    return Object.assign(lotOut_(r), { updated: updated });\n  });\n}\n// The open job of an edited lot follows it; a job mid-pallet, or a machine change while a job is open, is refused.\nfunction lotJobs_(old, v) {\n  jobs_().forEach(function (job) {\n    const pack = job.pack;\n    if (job.fgLotId !== String(old.FGLotID)) return;\n    if (busy_(job)) throw new Error('ทีม ' + job.team + ' กำลังแพคล็อตนี้ที่ ' + pack + ' — รอกดหยุดก่อนแก้ล็อต');\n    if (v.Pack_Number !== pack) throw new Error('ล็อตนี้มีงานเปิดอยู่ที่ ' + pack + ' — ปิดงานก่อนเปลี่ยนเครื่อง');\n    job.lot = v.Lot_Number; job.name = v.FG_Name; job.key = v.LotFGKey;\n    if (job.unit !== 'Bigbag' && Number(v.StdWeight) > 0) job.weight = Number(v.StdWeight);\n    setJob_(job.slot, job);\n  });\n}\n// Writes only what changed, one RangeList call per column. Returns rows touched per table.\nfunction cascadeLot_(id, before, v, pl) {\n  const out = {}, ch = function (k) { return String(before[k] == null ? '' : before[k]) !== String(v[k]); };\n  const copy = {};\n  ['Lot_Number', 'Pack_Number', 'LotFGKey'].forEach(function (k) { if (ch(k)) copy[k] = v[k]; });\n  [CFG.REC, CFG.RUNTIME, CFG.BIN].forEach(function (name) {\n    if (!Object.keys(copy).length) return;\n    const lr = rowsWhere_(name, 'FGLotID', id);\n    setMany_(lr, lr.rows, Object.assign({}, copy));\n    out[name] = lr.rows.length;\n  });\n  // Bag rows that used the old StdWeight get the new one (Bigbag rows keep their weighed kg).\n  const w0 = Number(before.StdWeight) || 0, w1 = Number(v.StdWeight) || 0;\n  if (w1 > 0 && w0 > 0 && w0 !== w1) {\n    const lr = rowsWhere_(CFG.REC, 'FGLotID', id), byBags = {};\n    lr.rows.filter(function (r) { return Number(r.WeightInput) === w0; }).forEach(function (r) { (byBags[Number(r.Output_Bag) || 0] = byBags[Number(r.Output_Bag) || 0] || []).push(r); });\n    Object.keys(byBags).forEach(function (n) { setMany_(lr, byBags[n], { WeightInput: w1, Output_Kg: Number(n) * w1 }); });\n    out.weight = Object.keys(byBags).reduce(function (s, n) { return s + byBags[n].length; }, 0);\n  }\n  if (ch('FGID')) { // Pack_Item follows the new product (FG code, and its SEMI code)\n    const sc = function (f) { const x = fgDetails_().find(function (y) { return y.fgid === f; }); return x ? x.semiCode : ''; };\n    const map = {}, o = String(before.FGID).trim(), os = sc(o), ns = sc(v.FGID);\n    map[o] = v.FGID; if (os) map[os] = ns || os;\n    const lr = rowsWhere_(CFG.REC, 'FGLotID', id), by = {};\n    lr.rows.forEach(function (r) { const k = String(r.Pack_Item || '').trim(); if (map[k] && map[k] !== k) (by[map[k]] = by[map[k]] || []).push(r); });\n    Object.keys(by).forEach(function (n) { setMany_(lr, by[n], { Pack_Item: n }); });\n    out.item = Object.keys(by).reduce(function (s, n) { return s + by[n].length; }, 0);\n  }\n  if (ch('ProductionID') || ch('ProductID')) {\n    const lr = rowsWhere_(CFG.NCP, 'FGLotID', id);\n    setMany_(lr, lr.rows, { ProductID: v.ProductID, ProductionID: v.ProductionID, Lot_Number: String(pl.Lot_Number),\n      Extruder_Number: String(pl.Extruder_Number || ''), LotProductKey: String(pl.LotProductKey || '') });\n    out[CFG.NCP] = lr.rows.length;\n  }\n  if (ch('Lot_Number')) {\n    const lr = rowsWhere_(CFG.EXPORT, 'FGLotID', id);\n    setMany_(lr, lr.rows, { Lot_Number: v.Lot_Number });\n    out[CFG.EXPORT] = lr.rows.length;\n  }\n  // a Packing_Record row for the phone to recalc, so FG_Lot totals follow (e.g. new weight)\n  const recs = rowsWhere_(CFG.REC, 'FGLotID', id).rows.filter(function (r) { return !truthy_(r.Cancelled); });\n  out.recalcId = recs.length ? String(recs[recs.length - 1].RecordID) : '';\n  return out;\n}\n\n// Admin: cancel a lot and everything recorded under it (Cancelled = TRUE; nothing is deleted).\nfunction cancelLot(token, id, lotNumber) {\n  session_(token, 'admin');\n  return withLock_(function () {\n    const t = table_(CFG.FG_LOT), r = t.rows.find(function (x) { return String(x.FGLotID) === String(id); });\n    if (!r || truthy_(r.Cancelled)) throw new Error('ไม่พบ FG Lot นี้');\n    if (str_(lotNumber) !== String(r.Lot_Number).trim()) throw new Error('พิมพ์เลขล็อตให้ตรง ' + r.Lot_Number + ' เพื่อยืนยัน');\n    jobs_().forEach(function (job) {\n      if (job.fgLotId !== String(id)) return;\n      if (busy_(job)) throw new Error('ทีม ' + job.team + ' กำลังแพคล็อตนี้ที่ ' + job.pack + ' — รอกดหยุดก่อน');\n      setJob_(job.slot, null);\n    });\n    const counts = {};\n    [CFG.REC, CFG.RUNTIME, CFG.BIN, CFG.NCP].forEach(function (name) {\n      const lr = rowsWhere_(name, 'FGLotID', id), rows = lr.rows.filter(function (x) { return !truthy_(x.Cancelled); });\n      setMany_(lr, rows, { Cancelled: true });\n      counts[name] = rows.length;\n    });\n    setCells_(t, r, { Cancelled: true });\n    CacheService.getScriptCache().remove('lots');\n    return counts;\n  });\n}\n\n// d = {id (from the phone, re-send safe), fgLotId, process, at, comment, team, flush, contam}\nfunction addRuntime(token, d) {\n  const me = session_(token, 'sup'), lot = liveLot_(d.fgLotId), id = str_(d.id, 20);\n  const all = [].concat.apply([], rtypes_().map(function (g) { return g.items; })), proc = all.find(function (p) { return p === d.process; });\n  if (!id) throw new Error('ข้อมูลไม่ครบ');\n  if (!proc) throw new Error('เลือกกิจกรรมก่อน');\n  const note = str_(d.comment);\n  if (proc === CFG.RT_OTHER && !note) throw new Error('เลือก อื่นๆ ต้องใส่หมายเหตุว่าทำอะไร');\n  const at = when_(d.at), clear = /^PK-เคลียร์/.test(proc);\n  const flush = clear ? kg_(d.flush, 'FlushLine kg') : '', contam = clear ? kg_(d.contam, 'Contaminate kg') : '';\n  return withLock_(function () {\n    const lr = rowsWhere_(CFG.RUNTIME, 'FGLotID', lot.FGLotID);\n    if (lr.rows.some(function (r) { return String(r.ID) === id; })) return { id: id, dup: true };\n    const now = new Date();\n    appendRows_(lr.sh, lr.h, [{ ID: id, FGLotID: lot.FGLotID, Lot_Number: lot.Lot_Number, Pack_Number: lot.Pack_Number, DateTimeRecords: at,\n      Process: proc, Comment: note, Cancelled: false, CreateTimestamp: now, UpdatedTimestamp: now, CreatedBy: 'PackingApp:' + me.Name,\n      LotFGKey: lot.LotFGKey, Visible: true, FlushLine_kg: flush, Contaminate_kg: contam, Clearing_Team: clear ? str_(d.team, 60) : '' }]);\n    return { id: id };\n  });\n}\n\n// d = {id, fgLotId, bin, at, comment} — one bin per receive.\nfunction addBin(token, d) {\n  const me = session_(token, 'sup'), lot = liveLot_(d.fgLotId), id = str_(d.id, 20), bins = CFG.BINS[lot.Pack_Number] || [];\n  if (!id) throw new Error('ข้อมูลไม่ครบ');\n  if (bins.indexOf(d.bin) < 0) throw new Error('เลือกถังของ ' + lot.Pack_Number);\n  const at = when_(d.at);\n  return withLock_(function () {\n    const lr = rowsWhere_(CFG.BIN, 'FGLotID', lot.FGLotID);\n    if (lr.rows.some(function (r) { return String(r.ID) === id; })) return { id: id, dup: true };\n    const now = new Date();\n    appendRows_(lr.sh, lr.h, [{ ID: id, FGLotID: lot.FGLotID, Lot_Number: lot.Lot_Number, Pack_Number: lot.Pack_Number, DateTimeRecords: at,\n      Bin_Number: d.bin, Comment: str_(d.comment), Cancelled: false, CreateTimestamp: now, UpdatedTimestamp: now,\n      CreatedBy: 'PackingApp:' + me.Name, LotFGKey: lot.LotFGKey, Visible: false }]);\n    return { id: id };\n  });\n}\n\n// d = {id, fgLotId, ncpId, kg, at, comment} → NCP row, Process = Packing, filled from the FG lot + its production lot.\nfunction addNcp(token, d) {\n  const me = session_(token, 'sup'), lot = liveLot_(d.fgLotId), id = str_(d.id, 20);\n  if (!id) throw new Error('ข้อมูลไม่ครบ');\n  const opt = ncpOpts_(lot.ProductID).items.find(function (x) { return x.id === d.ncpId; });\n  if (!opt) throw new Error('เลือกรายการ NCP');\n  const kg = Number(d.kg);\n  if (!(kg > 0 && kg <= 50000)) throw new Error('ใส่น้ำหนัก (kg)');\n  const at = when_(d.at);\n  const pl = table_(CFG.PLOT).rows.find(function (x) { return String(x.ProductionID) === String(lot.ProductionID); }) || {};\n  return withLock_(function () {\n    const t = table_(CFG.NCP);\n    if (t.rows.some(function (r) { return String(r.ID) === id; })) return { id: id, dup: true };\n    const now = new Date(), prefix = 'NCP-' + Utilities.formatDate(now, 'Asia/Bangkok', 'yyyyMMdd') + '-';\n    const no = t.rows.reduce(function (m, r) { const s = String(r.NCP_No || ''); return s.indexOf(prefix) === 0 ? Math.max(m, Number(s.slice(prefix.length)) || 0) : m; }, 0) + 1;\n    appendRows_(t.sh, t.h, [{ ID: id, Extruder_Number: String(pl.Extruder_Number || ''), Lot_Number: String(pl.Lot_Number || lot.Lot_Number),\n      ProductID: String(lot.ProductID), DateTime: at, Process: 'Packing', Weight: kg, CreateTimestamp: now, UpdatedTimestamp: now, State: 'Active',\n      Comment: str_(d.comment), LotProductKey: String(pl.LotProductKey || ''), ProductionID: String(lot.ProductionID), Cancelled: false,\n      SourceModule: 'PackingApp', SourceRecordID: id, FGLotID: lot.FGLotID, NCP_Detail_ID: opt.id, NCP_Type: 'Packing', Weight_Kg: kg,\n      Status: 'Open', NCP_No: prefix + String(no).padStart(4, '0'), CreateMethod: 'PackingApp:' + me.Name, Visible: true }]);\n    return { id: id };\n  });\n}\n\n// Packing form (PDF + Excel) through the existing Production_Lot export: add a Packing_Form_Export row, then call it\n// directly (what the AppSheet bot does). Takes ~10–30 s; the row's Status / Message come back to the phone.\n// shift '' = ทั้งล็อต · 'yyyy-MM-dd|8' = กะเดียว (วันผลิต | เริ่ม 8 / 16 / 0) · merge = รวมทุกทีมในใบเดียว — ส่งไปกับ webhook ไม่ต้องเพิ่มคอลัมน์ในชีต\nfunction exportForm(token, fgLotId, shift, merge) {\n  const me = session_(token, 'view'), lot = liveLot_(fgLotId), id = id8_();\n  shift = String(shift || '');\n  if (shift && !/^\\d{4}-\\d{2}-\\d{2}\\|(0|8|16)$/.test(shift)) throw new Error('กะไม่ถูกต้อง');\n  if (dbOn_() && typeof __LR === 'undefined') pkFlush_(); // the export reads Packing_Record from the sheet (phone: the background job copies first)\n  withLock_(function () {\n    const sh = sheet_(CFG.EXPORT);\n    appendRows_(sh, headers_(sh), [{ ExportID: id, FGLotID: lot.FGLotID, RequestedAt: new Date(), RequestedBy: 'PackingApp:' + me.Name, Lot_Number: lot.Lot_Number }]);\n    SpreadsheetApp.flush();\n  });\n  hook_({ action: 'PACKING_FORM_EXPORT', rowID: id, source: 'PACKING_APP', shift: shift, merge: merge === true });\n  return exports_(lot.FGLotID);\n}\n// The lot's exports (the phone watches them when the long exportForm call drops).\nfunction lotExports(token, fgLotId) {\n  session_(token, 'view');\n  return exports_(String(fgLotId));\n}\n// The export's file, read here (the web app runs as the owner), so Sup phones need no Drive access.\nfunction exportFile(token, exportId, kind) {\n  session_(token, 'view');\n  const r = rowsWhere_(CFG.EXPORT, 'ExportID', exportId).rows[0];\n  const path = r && String(r[kind === 'xlsx' ? 'Export_Excel' : 'Export_File'] || '');\n  if (!path) throw new Error('ไฟล์ถูกลบแล้ว (เก็บไว้ 1 วัน) — กด Export ใหม่');\n  const parts = path.split('/'), name = parts.pop();\n  let folder = DriveApp.getFileById(CFG.SHEET_ID).getParents().next();\n  parts.forEach(function (p) { const it = folder.getFoldersByName(p); if (!it.hasNext()) throw new Error('ไม่พบโฟลเดอร์ ' + p); folder = it.next(); });\n  const files = folder.getFilesByName(name);\n  if (!files.hasNext()) throw new Error('ไฟล์ถูกลบแล้ว (เก็บไว้ 1 วัน) — กด Export ใหม่');\n  const b = files.next().getBlob();\n  return { name: name, mime: b.getContentType(), b64: Utilities.base64Encode(b.getBytes()) };\n}\n\nfunction fgDetails(token) {\n  return fgdFor_(session_(token, 'sup'));\n}\n// SEMI_Code = the ProductID (Product_Detail) whose ProductName is closest to the FG name. Words compared without\n// pack size \"(20 KG)\", \"-COA\", \"B&E\"; the first word (species + protein, e.g. \"dog18%\") must match.\nfunction nameWords_(s) {\n  return String(s || '').toLowerCase().replace(/\\([^)]*\\)/g, ' ').split(/[\\s\\-\\/,.]+/)\n    .filter(function (w) { return w && ['coa', 'b&e', 'kg', 'b', 'e'].indexOf(w) < 0; });\n}\n// Weighted by rarity (IDF over all ProductNames), so \"vitalamb\" outweighs \"adult dog food\". A word also matches inside a\n// longer one when no product has it as a word (\"pola802b\" ~ \"pola\" + \"802b\"). The first word (species + protein) and the second (brand) must match, else ×0.5.\nfunction semiMatches_(fgName, products) {\n  const a = nameWords_(fgName);\n  if (!a.length) return [];\n  const words = products.map(function (p) { return nameWords_(p.name); }), df = {};\n  words.forEach(function (ws) { ws.filter(function (w, i) { return ws.indexOf(w) === i; }).forEach(function (w) { df[w] = (df[w] || 0) + 1; }); });\n  const maxIdf = Math.log(1 + products.length), idf = function (w) { return df[w] ? Math.log(1 + products.length / df[w]) : maxIdf; };\n  const has = function (b, w) { return b.indexOf(w) >= 0 || (!df[w] && w.length >= 4 && b.some(function (p) { return p.length >= 3 && (w.indexOf(p) >= 0 || p.indexOf(w) >= 0); })); };\n  const total = a.reduce(function (s, w) { return s + idf(w); }, 0);\n  return products.map(function (p, i) {\n    const b = words[i], hit = a.filter(function (w) { return has(b, w); });\n    const key = (b[0] === a[0] ? 1 : 0.5) * (a.length < 2 || has(b, a[1]) ? 1 : 0.5);\n    const score = key * hit.reduce(function (s, w) { return s + idf(w); }, 0) / total - 0.01 * Math.max(0, b.length - hit.length);\n    return { id: p.id, name: p.name, score: Math.round(score * 100) / 100 };\n  }).filter(function (m) { return m.score > 0.3; }).sort(function (x, y) { return y.score - x.score; }).slice(0, 3);\n}\nfunction products_() {\n  return table_(CFG.PRODUCT).rows.filter(function (r) { return !truthy_(r.Cancelled) && String(r.ProductID).trim(); })\n    .map(function (r) { return { id: String(r.ProductID).trim(), name: String(r.ProductName || '') }; });\n}\n// Sup: SEMI_Code suggestions — for every FG item (bulk page), or for one name typed in the form.\nfunction semiSuggest(token, name) {\n  session_(token, 'sup');\n  const ps = products_();\n  if (name != null) return semiMatches_(name, ps);\n  return { products: ps, items: fgDetails_().filter(function (x) { return x.lotType === 'FG'; }).map(function (x) {\n    return { fgid: x.fgid, name: x.name, semiCode: x.semiCode, matches: semiMatches_(x.name, ps) };\n  }) };\n}\n// A SEMI_Code must be a SEMI item of FG_Detail; a ProductID not there yet is added as one (FGID = ProductID,\n// FG_Name = ProductName) so it can be packed, weighed and counted as SEMI. A code in neither (e.g. SFGLO… typed in\n// the FG form) is added with the SEMI name typed there (neu = {name, size}). Call inside the lock.\nfunction ensureSemiItem_(t, code, me, neu) {\n  const row = t.rows.find(function (r) { return String(r.FGID).trim() === code; });\n  if (row) {\n    if (String(row.LotType).trim().toUpperCase() !== 'SEMI') throw new Error(code + ' เป็นสินค้า FG ใช้เป็น SEMI_Code ไม่ได้');\n    return;\n  }\n  const p = products_().find(function (y) { return y.id === code; }) || (neu && neu.name ? { name: neu.name } : null);\n  if (!p) throw new Error(code + ' ยังไม่มีในสินค้า SEMI — ใส่ชื่อ SEMI แล้วกดบันทึก เพื่อสร้างสินค้า SEMI รหัสนี้');\n  if (!/^[A-Za-z0-9][A-Za-z0-9._\\-]{2,39}$/.test(code)) throw new Error('รหัส SEMI ใช้ได้เฉพาะ A–Z 0–9 . _ - (3–40 ตัว)');\n  const now = new Date(), r = { FGID: code, FG_Name: p.name, Weight: '', Size: (neu && neu.size) || '', Unit: '', LotType: 'SEMI', PackType: 'Bigbag', Form_Type: 'BFL',\n    Cancelled: false, CreateTimestamp: now, UpdatedTimestamp: now, CreatedBy: 'PackingApp:' + me.Name };\n  appendRows_(t.sh, t.h, [r]);\n  t.rows.push(r);\n  SEMI_ITEMS_ = null;\n}\n// Sup confirms SEMI codes in bulk: list = [{fgid, code}] ('' clears).\nfunction saveSemiCodes(token, list) {\n  const me = session_(token, 'sup');\n  return withLock_(function () {\n    const t = table_(CFG.FG_DETAIL);\n    (list || []).slice(0, 500).forEach(function (x) {\n      const fg = t.rows.find(function (r) { return String(r.FGID).trim() === String(x.fgid) && !truthy_(r.Cancelled); });\n      if (!fg || String(fg.LotType).trim().toUpperCase() === 'SEMI') return;\n      const code = str_(x.code, 40);\n      if (code) ensureSemiItem_(t, code, me);\n      if (String(fg.SEMI_Code || '').trim() !== code) setCells_(t, fg, { SEMI_Code: code });\n    });\n    return fgDetails_();\n  });\n}\n// d = {isNew, fgid, name, weight, size, unit, lotType, packType, form}. FGID is typed (from the daily plan / FG code) and never changes.\nfunction saveFgDetail(token, d) {\n  const me = session_(token, 'sup'), fgid = str_(d.fgid, 40), name = str_(d.name, 150);\n  const type = d.lotType === 'SEMI' ? 'SEMI' : 'FG', form = d.form === 'BFL-PC' ? 'BFL-PC' : 'BFL';\n  if (!/^[A-Za-z0-9][A-Za-z0-9._\\-]{2,39}$/.test(fgid)) throw new Error('FGID ใช้ได้เฉพาะ A–Z 0–9 . _ - (3–40 ตัว)');\n  if (!name) throw new Error('ใส่ชื่อสินค้า');\n  const w = Number(d.weight), bags = d.defBags === '' || d.defBags == null ? '' : intIn_(d.defBags, 1, CFG.MAX_BAGS, 'จำนวนถุง Default');\n  if (type === 'FG' && !(w > 0 && w <= 3000)) throw new Error('ใส่น้ำหนักต่อถุง (kg)');\n  if (type === 'SEMI' && d.weight !== '' && d.weight != null && !(w > 0 && w <= 3000)) throw new Error('น้ำหนักต่อถุง SEMI ไม่ถูกต้อง');\n  const semi = type === 'FG' ? str_(d.semiCode, 40) : '';\n  return withLock_(function () {\n    const t = table_(CFG.FG_DETAIL), now = new Date();\n    const ex = t.rows.find(function (r) { return String(r.FGID).trim().toUpperCase() === fgid.toUpperCase(); });\n    if (semi) ensureSemiItem_(t, semi, me, { name: str_(d.semiName, 150), size: str_(d.size, 30) });\n    const v = { FG_Name: name, Weight: w > 0 ? w : '', Size: str_(d.size, 30), Unit: str_(d.unit, 30), LotType: type,\n      PackType: str_(d.packType, 30), Form_Type: form, SEMI_Code: semi, Default_Bags: bags };\n    if (d.isNew) {\n      if (ex) throw new Error('FGID ' + fgid + ' มีอยู่แล้ว' + (truthy_(ex.Cancelled) ? ' (ถูกยกเลิก)' : ''));\n      appendRows_(t.sh, t.h, [Object.assign({ FGID: fgid, Cancelled: false, CreateTimestamp: now, CreatedBy: 'PackingApp:' + me.Name }, v, { UpdatedTimestamp: now })]);\n    } else {\n      if (!ex || truthy_(ex.Cancelled)) throw new Error('ไม่พบสินค้า ' + fgid);\n      setCells_(t, ex, v);\n    }\n    return fgdFor_(me);\n  });\n}\n// Admin: FG_Detail.Cancelled = TRUE — no longer offered for new lots; old lots keep it.\nfunction cancelFgDetail(token, fgid) {\n  const me = session_(token, 'admin');\n  return withLock_(function () {\n    const t = table_(CFG.FG_DETAIL), ex = t.rows.find(function (r) { return String(r.FGID).trim() === String(fgid).trim() && !truthy_(r.Cancelled); });\n    if (!ex) throw new Error('ไม่พบสินค้า ' + fgid);\n    setCells_(t, ex, { Cancelled: true });\n    return fgdFor_(me);\n  });\n}\n// Admin (user 12 Nov 2026 \"admin แก้รหัสได้ และ recal ใหม่ทั้งหมด\"): edit any FG_Detail item — cancelled ones too — incl. its FGID, then every\n// FG Lot of the old code follows (FGID, FG_Name, StdWeight, LotFGKey + cascadeLot_: records / runtime / bin keys, Bag kg at the new weight, Pack_Item).\n// d = saveFgDetail fields + {fgid: current code, newFgid, active}. newFgid = another existing code → merge: lots move to that code, this one is cancelled.\n// apply false = plan only (what would change). apply true = do it; returns lots for the phone to recalc one by one (recalc → totals, then 'pl' → Production_Lot KPI).\nfunction adminFgCode(token, d, apply) {\n  const me = session_(token, 'admin'), old = str_(d.fgid, 40), nf = str_(d.newFgid || d.fgid, 40), name = str_(d.name, 150);\n  const type = d.lotType === 'SEMI' ? 'SEMI' : 'FG', form = d.form === 'BFL-PC' ? 'BFL-PC' : 'BFL';\n  if (!/^[A-Za-z0-9][A-Za-z0-9._\\-]{2,39}$/.test(nf)) throw new Error('FGID ใช้ได้เฉพาะ A–Z 0–9 . _ - (3–40 ตัว)');\n  const w = Number(d.weight), bags = d.defBags === '' || d.defBags == null ? '' : intIn_(d.defBags, 1, CFG.MAX_BAGS, 'จำนวนถุง Default');\n  const semi = type === 'FG' ? str_(d.semiCode, 40).toUpperCase() : '';\n  const run = function () {\n    const t = table_(CFG.FG_DETAIL), same = function (a, b) { return String(a).trim().toUpperCase() === String(b).trim().toUpperCase(); };\n    const ex = t.rows.find(function (r) { return same(r.FGID, old); });\n    if (!ex) throw new Error('ไม่พบสินค้า ' + old);\n    const target = same(nf, old) ? null : t.rows.find(function (r) { return r !== ex && same(r.FGID, nf); });\n    if (target && truthy_(target.Cancelled)) throw new Error('รหัส ' + nf + ' ถูกยกเลิกอยู่ — เปิดใช้รหัสนั้นก่อน แล้วค่อยย้ายมา');\n    const active = target ? false : d.active !== false;\n    let dest;\n    if (target) dest = { fgid: String(target.FGID).trim(), name: String(target.FG_Name), weight: Number(target.Weight) || 0, packType: String(target.PackType || ''),\n      lotType: String(target.LotType).trim().toUpperCase() === 'SEMI' ? 'SEMI' : 'FG', semi: String(target.SEMI_Code || '').trim() };\n    else {\n      if (!name) throw new Error('ใส่ช
