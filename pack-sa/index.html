ื่อสินค้า');\n      if (type === 'FG' && !(w > 0 && w <= 3000)) throw new Error('ใส่น้ำหนักต่อถุง (kg)');\n      if (type === 'SEMI' && d.weight !== '' && d.weight != null && !(w > 0 && w <= 3000)) throw new Error('น้ำหนักต่อถุง SEMI ไม่ถูกต้อง');\n      dest = { fgid: nf, name: name, weight: w > 0 ? w : 0, packType: str_(d.packType, 30), lotType: type, semi: semi };\n    }\n    const oldSemi = String(ex.SEMI_Code || '').trim();\n    const lt = table_(CFG.FG_LOT), lots = lt.rows.filter(function (r) { return same(r.FGID, old) && !truthy_(r.Cancelled); });\n    const busy = {}; jobs_().forEach(function (j) { if (busy_(j)) busy[j.fgLotId] = j.team + ' @ ' + j.pack; });\n    const plan = [], clash = [], badType = [];\n    lots.forEach(function (r) {\n      const lType = String(r.LotType).trim().toUpperCase() === 'SEMI' ? 'SEMI' : 'FG';\n      if (lType !== dest.lotType) { badType.push(String(r.Lot_Number)); return; }\n      const pt = lType === 'SEMI' ? '' : dest.packType, key = [r.Lot_Number, lType, dest.fgid, pt, r.Pack_Number].join('|');\n      const v = { FGID: dest.fgid, FG_Name: dest.name, StdWeight: dest.weight || '', PackType: pt, LotFGKey: key };\n      if (!Object.keys(v).some(function (k) { return String(v[k]) !== String(r[k] == null ? '' : r[k]); }) && !(oldSemi && dest.semi && oldSemi !== dest.semi)) return; // nothing to change\n      if (lt.rows.some(function (x) { return x !== r && !truthy_(x.Cancelled) && String(x.LotFGKey) === key; })) { clash.push(String(r.Lot_Number) + ' ' + r.Pack_Number); return; }\n      const recs = lotRows_(String(r.FGLotID)).rows.filter(function (x) { return !truthy_(x.Cancelled); });\n      const w0 = Number(r.StdWeight) || 0, w1 = Number(v.StdWeight) || 0;\n      plan.push({ r: r, v: v, id: String(r.FGLotID), lot: String(r.Lot_Number), pack: String(r.Pack_Number), status: String(r.Status || ''), pid: String(r.ProductionID || ''),\n        recs: recs.length, kgRecs: w0 > 0 && w1 > 0 && w0 !== w1 ? recs.filter(function (x) { return Number(x.WeightInput) === w0; }).length : 0, busy: busy[String(r.FGLotID)] || '' });\n    });\n    const out = { merge: !!target, from: old, to: dest.fgid, name: dest.name, weight: dest.weight, active: active, badType: badType, clash: clash,\n      lots: plan.map(function (p) { return { id: p.id, lot: p.lot, pack: p.pack, status: p.status, recs: p.recs, kgRecs: p.kgRecs, busy: p.busy }; }) };\n    if (!apply) return out;\n    if (badType.length) throw new Error('ประเภทไม่ตรงกับล็อต ' + badType.join(', ') + ' — ล็อตเป็น ' + (dest.lotType === 'FG' ? 'SEMI' : 'FG'));\n    const b = plan.filter(function (p) { return p.busy; });\n    if (b.length) throw new Error('กำลังแพคอยู่: ' + b.map(function (p) { return p.lot + ' (' + p.busy + ')'; }).join(', ') + ' — รอกดหยุดก่อน');\n    const done = [];\n    plan.forEach(function (p) {\n      const r = p.r, before = Object.assign({}, r), diff = {};\n      lotJobs_(r, Object.assign({}, r, p.v));\n      Object.keys(p.v).forEach(function (k) { if (String(p.v[k]) !== String(r[k] == null ? '' : r[k])) diff[k] = p.v[k]; });\n      if (Object.keys(diff).length) setCells_(lt, r, diff);\n      Object.assign(r, p.v);\n      const u = cascadeLot_(p.id, before, Object.assign({}, before, p.v), {}); // full row: cascadeLot_ compares every key it copies\n      if (oldSemi && dest.semi && oldSemi !== dest.semi) { // SEMI pallets inside the lot follow the new SEMI code\n        const lr = rowsWhere_(CFG.REC, 'FGLotID', p.id), sr = lr.rows.filter(function (x) { return String(x.Pack_Item || '').trim() === oldSemi; });\n        setMany_(lr, sr, { Pack_Item: dest.semi });\n        u.semi = sr.length;\n      }\n      done.push({ id: p.id, lot: p.lot, pid: p.pid, recalcId: u.recalcId || '', updated: u });\n    });\n    // the item itself last (cascadeLot_ reads SEMI codes of the old item while it still exists)\n    if (target) setCells_(t, ex, { Cancelled: true });\n    else {\n      const v = { FG_Name: name, Weight: w > 0 ? w : '', Size: str_(d.size, 30), Unit: str_(d.unit, 30), LotType: type, PackType: str_(d.packType, 30), Form_Type: form,\n        SEMI_Code: semi, Default_Bags: bags, Cancelled: !active };\n      if (!same(ex.FGID, nf)) v.FGID = nf;\n      if (semi) ensureSemiItem_(t, semi, me, { name: str_(d.semiName, 150), size: str_(d.size, 30) });\n      setCells_(t, ex, v);\n    }\n    SEMI_ITEMS_ = null;\n    CacheService.getScriptCache().remove('lots');\n    console.log('adminFgCode ' + me.Name + ': ' + old + ' → ' + dest.fgid + (target ? ' (merge)' : '') + ' · ' + done.length + ' lots');\n    out.done = done; out.fgd = fgdFor_(me);\n    return out;\n  };\n  return apply ? withLock_(run) : run();\n}\n\n// Admin adds / edits / deactivates users. d = {id?, name, role, pin?, active}\nfunction saveUser(token, d) {\n  const me = session_(token, 'admin'), name = String(d.name || '').trim();\n  const role = CFG.ROLES.indexOf(d.role) >= 0 ? d.role : 'team';\n  const pin = String(d.pin || '');\n  if (!name) throw new Error('ใส่ชื่อก่อน');\n  if (pin && !/^\\d{4}$/.test(pin)) throw new Error('PIN ต้องเป็นตัวเลข 4 หลัก');\n  return withLock_(function () {\n    const sh = isDb_(CFG.USERS) ? null : usersSheet_(), all = users_(), id = String(d.id || '');\n    if (all.some(function (u) { return u.active && u.Name === name && u.id !== id; })) throw new Error('มีชื่อ ' + name + ' อยู่แล้ว');\n    if (!id) {\n      if (!pin) throw new Error('ผู้ใช้ใหม่ต้องตั้ง PIN');\n      addUser_(sh, name, role, pin, me.Name);\n    } else {\n      const u = all.find(function (x) { return x.id === id; });\n      if (!u) throw new Error('ไม่พบผู้ใช้');\n      const active = d.active !== false;\n      if (u.id === me.id && (!active || role !== 'admin')) throw new Error('ยกเลิกหรือลดสิทธิ์ตัวเองไม่ได้');\n      userSet_(u, { Name: name, Role: role, PIN_Hash: pin ? (u.id === me.id ? '' : '!') + hash_(u.id, pin) : u.PIN_Hash, Active: active, Updated_At: new Date(), Updated_By: me.Name });\n    }\n    return publicUsers_();\n  });\n}\n\n/* ---------- tab รายงาน (Sup/Admin): daily report, monthly lot summary, แจ้งยอด by lot — drawn on the phone ---------- */\n\n// Every FG lot with a packing row in month ym (production day, 08:00 rule), with the lot's whole history so running\n// totals are right. Row = [FGLotID, day, team, machine, type, bigbag, pallet, bags, kg, start, stop, comment, sup] with\n// start / stop in minutes from 08:00 of that production day. Return rows only lower the lot's Hold (ret).\n// Events = Packing_Runtime of those lots except PK-เดินเครื่อง and planned stops without a note; an event lasts\n// until the lot's next runtime row (as in the lot page).\nfunction reportData(token, ym) {\n  session_(token, 'view');\n  if (!/^\\d{4}-\\d\\d$/.test(String(ym))) throw new Error('เดือนไม่ถูกต้อง');\n  const key = pkKey_('R' + ym), hit = pkGet_(key); if (hit) return hit;\n  const out = reportRecent_(ym); pkPut_(key, out, PK.RD_TTL);\n  return out;\n}\n/* The report (also the overview screen) is recomputed at most every RD_MIN s (14 Nov 2026, UrlFetch quota): it reads the whole\n * Packing_Record and Packing_Runtime, and every pallet saved used to make it read them again. A report up to 3 min old is fine. */\nfunction reportRecent_(ym) {\n  const lk = 'pk_rdl_' + ym, last = pkGet_(lk);\n  if (last && last.at && Date.now() - last.at < PK.RD_MIN * 1000 && last.out) return last.out;\n  const out = reportData_(ym);\n  pkPut_(lk, { at: Date.now(), out: out }, PK.RD_MIN + 60);\n  return out;\n}\nfunction reportData_(ym) {\n  // v93: store mode reads only what this month needs — Supabase '@month' = every row of the FG lots with a row in this production month\n  // + rows sharing their Lot_Number (Reject kg per lot no.); then NCP / Production_Lot / Packing_Runtime of those lots only. Same report.\n  const part = isDb_(CFG.REC) && isDb_(CFG.NCP) && isDb_(CFG.PLOT) && isDb_(CFG.RUNTIME);\n  dbPrefetch_(part ? [[CFG.FG_LOT], [CFG.REC, '@month', [ym]], [CFG.NOTIFY]] : [[CFG.FG_LOT], [CFG.REC], [CFG.NCP], [CFG.PLOT], [CFG.NOTIFY], [CFG.RUNTIME]]);\n  const lots = {};\n  table_(CFG.FG_LOT).rows.forEach(function (r) { if (!truthy_(r.Cancelled) && String(r.FGLotID)) lots[String(r.FGLotID)] = r; });\n  const rec = (part ? dbTable_(CFG.REC, '@month', [ym]) : table_(CFG.REC)).rows.filter(function (r) {\n    return !truthy_(r.Cancelled) && r.DateTimeRecords instanceof Date && lots[String(r.FGLotID)] && String(r.Packing_Team) !== 'Tester' && !/^TEST/i.test(String(r.Lot_Number));\n  });\n  const keep = {};\n  rec.forEach(function (r) { if (prodDateKey_(r.DateTimeRecords.getTime()).slice(0, 7) === ym) keep[String(r.FGLotID)] = 1; });\n  const kIds = Object.keys(keep), uniq = function (a) { return a.filter(function (x, i) { return x && a.indexOf(x) === i; }); };\n  const kLots = uniq(kIds.map(function (id) { return String(lots[id].Lot_Number); })), kPids = uniq(kIds.map(function (id) { return String(lots[id].ProductionID); }));\n  if (part) dbPrefetch_([[CFG.NCP, 'Lot_Number', kLots], [CFG.PLOT, 'ProductionID', kPids], [CFG.RUNTIME, 'FGLotID', kIds]]);\n  const at = function (t) { const day = prodDateKey_(t); return { day: day, base: dayDate_(day).getTime() + 8 * HOUR }; };\n  const ret = {}, rows = [];\n  rec.forEach(function (r) {\n    const id = String(r.FGLotID), t = r.DateTimeRecords.getTime(), d = at(t), type = rowType_(r);\n    if (!keep[id]) return;\n    if (type === 'Return') { ret[id] = (ret[id] || 0) + (Number(r.Output_Kg) || 0); return; }\n    // Stop_Time typed in AppSheet may be a time only (a 1899 date): then stop = start\n    const s = r.Stop_Time instanceof Date ? r.Stop_Time.getTime() : 0, stop = s >= t && s - t < 12 * HOUR ? s : t;\n    rows.push([id, d.day, str_(r.Packing_Team, 40) || '-', String(r.Pack_Number).replace('PACK-', 'P'), type, unitOf_(r) === 'Bigbag' ? 1 : 0,\n      Number(r.Pallet_No) || 0, Number(r.Output_Bag) || 0, r2_(Number(r.Output_Kg) || 0), Math.round((t - d.base) / 60e3), Math.round((stop - d.base) / 60e3),\n      str_(tnNote_(r.Comment), 200), str_(r.Sup_Pack, 40)]);\n  });\n  rows.sort(function (a, b) { return a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : a[9] - b[9]; });\n  // Reject kg not yet in NCP, per production lot no.: Packing NCP rows not cancelled (auto from Reject, or typed in AppSheet) are subtracted.\n  const rej = {}, ncp = {};\n  rec.forEach(function (r) { if (rowType_(r) === 'Reject') { const k = String(r.Lot_Number); rej[k] = (rej[k] || 0) + (Number(r.Output_Kg) || 0); } });\n  (part ? dbTable_(CFG.NCP, 'Lot_Number', kLots) : table_(CFG.NCP)).rows.forEach(function (r) {\n    const k = String(r.Lot_Number);\n    if (rej[k] && String(r.Process) === 'Packing' && !truthy_(r.Cancelled)) ncp[k] = (ncp[k] || 0) + (Number(r.Weight) || Number(r.Weight_Kg) || 0);\n  });\n  const pl = {}, sent = notified_(), out = {};\n  (part ? dbTable_(CFG.PLOT, 'ProductionID', kPids) : table_(CFG.PLOT)).rows.forEach(function (r) { if (!truthy_(r.Cancelled)) pl[String(r.ProductionID)] = r; });\n  Object.keys(keep).forEach(function (id) {\n    const r = lots[id], p = pl[String(r.ProductionID)];\n    out[id] = { lot: String(r.Lot_Number), fg: String(r.FGID), name: String(r.FG_Name).trim(), kg: Number(r.StdWeight) || 0, order: orderTon_(r.Order_Ton),\n      status: String(r.Status).trim().toUpperCase(), old: p ? Number(p.Old_Semi) || 0 : 0, ret: r2_(ret[id] || 0), sent: sent[id] || null,\n      noNcp: r2_(Math.max(0, (rej[String(r.Lot_Number)] || 0) - (ncp[String(r.Lot_Number)] || 0))) };\n  });\n  const kind = {};\n  rtypes_().forEach(function (g) { g.items.forEach(function (p) { kind[p] = g.type; }); });\n  const rt = (part ? dbTable_(CFG.RUNTIME, 'FGLotID', kIds) : table_(CFG.RUNTIME)).rows.filter(function (r) { return keep[String(r.FGLotID)] && !truthy_(r.Cancelled) && r.DateTimeRecords instanceof Date; })\n    .sort(function (a, b) { return a.DateTimeRecords - b.DateTimeRecords; });\n  const next = {}, ev = [];\n  for (let i = rt.length - 1; i >= 0; i--) {\n    const r = rt[i], id = String(r.FGLotID), t = r.DateTimeRecords.getTime(), d = at(t), k = kind[String(r.Process)] || '', note = str_(r.Comment, 200);\n    const end = next[id] && next[id] - t < 12 * HOUR ? next[id] : t;\n    next[id] = t;\n    if (k === 'Runtime' || (k === 'Planned-Downtime' && !note)) continue;\n    ev.push([d.day, String(r.Pack_Number).replace('PACK-', 'P'), Math.round((t - d.base) / 60e3), Math.round((end - d.base) / 60e3),\n      String(r.Process).replace(/^PK-/, '') + (note ? ' — ' + note : ''), id]);\n  }\n  ev.reverse();\n  return { month: ym, lots: out, rows: rows, ev: ev, asof: Utilities.formatDate(new Date(), 'Asia/Bangkok', 'dd/MM/yyyy HH:mm') };\n}\nfunction notified_() {\n  const m = {};\n  if (!isDb_(CFG.NOTIFY) && !ss_().getSheetByName(CFG.NOTIFY)) return m;\n  table_(CFG.NOTIFY).rows.forEach(function (r) { if (truthy_(r.Notified)) m[String(r.FGLotID)] = { at: dt_(r.Notified_At), by: String(r.Notified_By || '') }; });\n  return m;\n}\n// Tick / untick \"แจ้งยอดแล้ว\" of a lot. One row per lot, kept when unticked (Notified = FALSE) so the last change shows who.\nfunction setNotified(token, fgLotId, on) {\n  const me = session_(token, 'sup'), lot = liveLot_(fgLotId);\n  return withLock_(function () {\n    if (!isDb_(CFG.NOTIFY) && !ss_().getSheetByName(CFG.NOTIFY)) ss_().insertSheet(CFG.NOTIFY, ss_().getNumSheets()).appendRow(CFG.NOTIFY_HEADERS);\n    const t = table_(CFG.NOTIFY), r = t.rows.find(function (x) { return String(x.FGLotID) === String(lot.FGLotID); });\n    const v = { Notified: !!on, Notified_At: new Date(), Notified_By: me.Name };\n    if (r) setCells_(t, r, v); else appendRows_(t.sh, t.h, [Object.assign({ FGLotID: String(lot.FGLotID), Lot_Number: String(lot.Lot_Number) }, v)]);\n    return on ? { at: dt_(v.Notified_At), by: me.Name } : null;\n  });\n}\n\n/* ---------- ป้ายบ่งชี้อาหารสำเร็จรูป F-SP-WHD01-03 + QR (phase 0 of BFL Stock) ----------\n   The phone writes the values onto the company's own form PDF (2 tags per A4 page) — same way as the Reject tag of Coating Control.\n   Form = newest PDF named F-SP-WHD01-03… in Drive BFL_FG_System/Form (CFG.TAG.FORM_FOLDER, user-set 16 Oct); Script Property TAG_FORM_ID overrides.\n   QR = this web app's /exec?p=<RecordID> (scan with any phone camera → palletPage_). Script Property TAG_QR = 'off' hides it\n   (the QR is not on form Rev.01 — keep it off until document control issues the revision, if they require one).\n   Pallet_Tag_Log (tab made on the first print, no AppSheet table): one row per printed tag; Snapshot tells when a pallet changed after printing. */\nCFG.TAG = {\n  LOG: 'Pallet_Tag_Log', HEADERS: ['RecordID', 'FGLotID', 'Lot_Number', 'Pallet_No', 'Type', 'Snapshot', 'PrintedAt', 'PrintedBy', 'RequestId'],\n  FONT_ID: '', FORM_FOLDER: '', FORM_PREFIX: 'F-SP-WHD01-03', TYPES: ['FG', 'WIP', 'SEMI', 'Hold'],\n  APP_URL: 'https://script.google.com/macros/s/AKfycbyaMPXcF0_yfspGQC466QWWYmh5gDcd8UA_-ElKkXFhWGRv8w3xCDi8aBxGcS08_vIU/exec',\n  LOG_ROWS: 6000, MAX: 200\n};\n// What the tag shows: printed again when any of these change (bags, kg, item, lot, type, pallet no).\nfunction tagSnap_(r) { return [r.Pallet_No, r.Output_Bag, r.Output_Kg, String(r.Pack_Item || ''), String(r.Lot_Number || ''), rowType_(r)].join('|'); }\nfunction tagDay_(r) {\n  const d = r.Production_Date instanceof Date ? Utilities.formatDate(r.Production_Date, 'Asia/Bangkok', 'yyyy-MM-dd') : '';\n  return d || prodDateKey_(new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime());\n}\nfunction nums_(v) { return (String(v || '').match(/\\d+/g) || []).join(','); } // 'PACK-3' → '3' · 'EXT-1' → '1'\n// RecordID → {snap, n, at} of its last print. ponytail: reads the last LOG_ROWS rows only (≈ 2 months); older reprints show \"ยังไม่พิมพ์\".\nfunction tagLog_() {\n  const m = {};\n  let vals;\n  if (isDb_(CFG.TAG.LOG)) vals = dbTable_(CFG.TAG.LOG, null, null, CFG.TAG.LOG_ROWS).rows.map(function (r) { return CFG.TAG.HEADERS.map(function (c) { return r[c]; }); });\n  else {\n    const sh = ss_().getSheetByName(CFG.TAG.LOG);\n    if (!sh || sh.getLastRow() < 2) return m;\n    const n = Math.min(CFG.TAG.LOG_ROWS, sh.getLastRow() - 1);\n    vals = sh.getRange(sh.getLastRow() - n + 1, 1, n, CFG.TAG.HEADERS.length).getValues();\n  }\n  vals.forEach(function (v) {\n    const id = String(v[0]), g = m[id] || (m[id] = { n: 0 });\n    if (String(v[4]) === 'PRE_VOID') { g.void = true; g.vat = dt_(v[6]); g.vby = String(v[7]); return; } // Sup cancelled a pre-printed tag (user 9 Nov)\n    g.n++; g.snap = String(v[5]); g.at = dt_(v[6]); g.by = String(v[7]); g.type = String(v[4]); g.void = false;\n  });\n  return m;\n}\nfunction tagFormFile_() {\n  const id = prop_('TAG_FORM_ID');\n  if (id) return DriveApp.getFileById(id);\n  const it = DriveApp.getFolderById(CFG.TAG.FORM_FOLDER).getFiles();\n  let best = null;\n  while (it.hasNext()) {\n    const f = it.next();\n    if (f.getName().indexOf(CFG.TAG.FORM_PREFIX) === 0 && /pdf/i.test(f.getMimeType()) && (!best || f.getLastUpdated() > best.getLastUpdated())) best = f;\n  }\n  if (!best) throw new Error('ยังไม่มีไฟล์ฟอร์ม ' + CFG.TAG.FORM_PREFIX + ' (PDF) ในโฟลเดอร์ BFL_FG_System/Form ของ Drive');\n  return best;\n}\n// Form + font for the phone (it keeps them for the session).\n// have = the version the phone already keeps → no files sent again (form id + last update + font id).\nfunction tagAssets(token, have) {\n  session_(token);\n  const f = tagFormFile_(), font = DriveApp.getFileById(prop_('FONT_FILE_ID') || CFG.TAG.FONT_ID);\n  const ver = [f.getId(), f.getLastUpdated().getTime(), font.getId()].join('|'), base = { ver: ver, formName: f.getName(), qr: prop_('TAG_QR') !== 'off', url: CFG.TAG.APP_URL };\n  if (have === ver) return base;\n  const b64 = function (file) { return Utilities.base64Encode(file.getBlob().getBytes()); };\n  return Object.assign(base, { form: b64(f), font: b64(font) });\n}\n// No lot: the lots to pick (Status Packing). A lot: its pallets that get a tag (FG / WIP / SEMI / Hold, not cancelled) + print state.\n// withLots: the lot list too, and (no lot asked) the first lot's pallets — the tag screen opens with one call.\nfunction tagList(token, fgLotId, withLots) {\n  session_(token);\n  const lots = !fgLotId || withLots ? tagLots_() : null;\n  if (!fgLotId && !withLots) return { lots: lots };\n  if (!fgLotId) fgLotId = lots.length ? lots[0].id : '';\n  if (!fgLotId) return { lots: lots, lot: '', pallets: [] };\n  const r = tagPallets_(fgLotId);\n  if (lots) { r.lots = lots; r.lot = fgLotId; }\n  return r;\n}\n// Lots on the tag screen: Status Packing + lots FINISHED in the last 7 days (user 12 Nov: a closed lot still needs tags, e.g. pallets moved into it).\nfunction tagLots_() {\n  const out = packingLots_().map(function (l) { return { id: l.id, lot: l.lot, name: l.name, pack: l.pack, lotType: l.lotType, weight: l.weight, semi: l.semi }; });\n  const have = {}, since = Date.now() - 7 * 24 * HOUR;\n  out.forEach(function (l) { have[l.id] = 1; });\n  table_(CFG.FG_LOT).rows.forEach(function (r) {\n    const id = String(r.FGLotID), t = r.Last_Record_At instanceof Date ? r.Last_Record_At.getTime() : r.UpdatedTimestamp instanceof Date ? r.UpdatedTimestamp.getTime() : 0;\n    if (!id || have[id] || truthy_(r.Cancelled) || String(r.Status).trim().toUpperCase() !== 'FINISHED' || t < since) return;\n    out.push({ id: id, lot: String(r.Lot_Number), name: '[ปิดแล้ว] ' + String(r.FG_Name), pack: String(r.Pack_Number), lotType: String(r.LotType).trim().toUpperCase() === 'SEMI' ? 'SEMI' : 'FG', weight: Number(r.StdWeight) || 0, semi: '' });\n  });\n  return out;\n}\nfunction tagPallets_(fgLotId) {\n  const log = tagLog_(), rows = lotRows_(fgLotId).rows;\n  const pallets = rows.filter(function (r) {\n    return !truthy_(r.Cancelled) && Number(r.Pallet_No) > 0 && CFG.TAG.TYPES.indexOf(rowType_(r)) >= 0;\n  }).map(function (r) {\n    const id = String(r.RecordID), x = tagOf_(log, r), g = x.g;\n    return { id: id, type: rowType_(r), no: Number(r.Pallet_No), bags: Number(r.Output_Bag) || 0, kg: Number(r.Output_Kg) || 0, unit: unitOf_(r),\n      day: tagDay_(r), t: new Date(r.DateTimeRecords || r.CreateTimestamp || 0).getTime(),\n      printed: g ? g.n : 0, at: g ? g.at : '', stale: x.stale, pre: !!x.pre };\n  }).sort(function (a, b) { return a.t - b.t; });\n  // pre-print form: next free numbers + today's production day\n  let pre = null;\n  try { const it = preJob_(lot_(fgLotId)); pre = { type: it.type, next: nextPallet_(usedPallets_(rows, it.type, Date.now())), bags: it.bags, w: it.w, big: it.big, team: it.team }; } catch (e) { /* lot no longer Packing */ }\n  return { pallets: pallets, today: prodDateKey_(Date.now()), pre: pre, preOpen: preOpen_(fgLotId, rows, log) };\n}\n// Pre-printed tags of a lot still waiting for a pallet: not cancelled, no live FG / WIP / SEMI row has the number, not moved to Hold.\nfunction preOpen_(fgLotId, rows, log) {\n  const re = new RegExp('^' + String(fgLotId).replace(/\\W/g, '\\\\$&') + '-(S?)(\\\\d+)$'), out = [];\n  Object.keys(log).forEach(function (k) {\n    const m = k.match(re), g = log[k];\n    if (!m || g.void || !g.n || g.type !== 'PRE') return;\n    const no = Number(m[2]), semi = !!m[1];\n    const taken = rows.some(function (x) {\n      if (truthy_(x.Cancelled)) return false;\n      const t = rowType_(x), mv = String(x.Comment || '').match(MOVED_TAG_);\n      if (['FG', 'WIP', 'SEMI'].indexOf(t) >= 0 && Number(x.Pallet_No) === no && (numGroup_(t) === 'SEMI') === semi) return true;\n      return !!mv && Number(mv[2]) === no && (mv[1] === 'SEMI') === semi; // number moved to Hold: its scan already says \"ดึงป้ายนี้ออก\"\n    });\n    if (!taken) out.push({ key: k, no: no, semi: semi, team: String(g.snap || '').split('|')[3] || '', at: g.at, by: g.by });\n  });\n  return out.sort(function (a, b) { return a.semi - b.semi || a.no - b.no; });\n}\n// Petcare lots print \"บริษัท บลูฟาโล่ เพ็ทแคร์ จำกัด\" on the tag (user 16 Oct): FG_Detail.Form_Type = BFL-PC (same rule as the packing form),\n// no Form_Type → a lot number ending in -PC.\nfunction tagPc_(fgid, lotNo, fgdRows) {\n  const r = (fgdRows || table_(CFG.FG_DETAIL).rows).find(function (x) { return String(x.FGID).trim() === String(fgid || '').trim(); });\n  const f = r ? String(r.Form_Type || '').trim().toUpperCase() : '';\n  return f ? f === 'BFL-PC' : /-PC$/i.test(String(lotNo || '').trim());\n}\n// The tag values of the chosen pallets, read fresh from the sheet (never from the phone).\nfunction tagData(token, fgLotId, ids) {\n  session_(token);\n  ids = (ids || []).map(String);\n  if (!ids.length || ids.length > CFG.TAG.MAX) throw new Error('เลือกพาเลท 1–' + CFG.TAG.MAX + ' พาเลท');\n  const rows = lotRows_(fgLotId).rows, lot = fgLotRow_(fgLotId), names = {}, fgd = table_(CFG.FG_DETAIL).rows;\n  fgd.forEach(function (r) { names[String(r.FGID).trim()] = String(r.FG_Name || ''); });\n  const pc = tagPc_(lot.FGID, lot.Lot_Number, fgd);\n  const pid = String(lot.ProductionID || '').trim();\n  const pl = pid ? rowsWhere_(CFG.PLOT, 'ProductionID', pid).rows.find(function (r) { return !truthy_(r.Cancelled); }) : null;\n  const ext = pl ? nums_(pl.Extruder_Number) : '';\n  return ids.map(function (id) {\n    const r = rows.find(function (x) { return String(x.RecordID) === id; });\n    if (!r || truthy_(r.Cancelled)) throw new Error('พาเลทที่เลือกถูกยกเลิกแล้ว — โหลดรายการใหม่');\n    const t = rowType_(r), item = String(r.Pack_Item || lot.FGID || '').trim();\n    if (CFG.TAG.TYPES.indexOf(t) < 0) throw new Error(t + ' ไม่ใช้ป้ายนี้');\n    return { id: id, type: t, no: Number(r.Pallet_No), item: item, name: names[item] || String(lot.FG_Name || ''), lot: String(r.Lot_Number || lot.Lot_Number),\n      bags: Number(r.Output_Bag) || 0, kg: Number(r.Output_Kg) || 0, w: Number(r.WeightInput) || 0, unit: unitOf_(r), day: tagDay_(r), team: String(r.Packing_Team || ''),\n      pack: nums_(r.Pack_Number || lot.Pack_Number), ext: ext, pc: pc };\n  });\n}\n/* Pre-printed tags (user 16 Oct: no printer at the packing line): Sup prints a range of pallet numbers before they are packed.\n   Key = '<FGLotID>-<no>' (FG / WIP share numbers) or '<FGLotID>-S<no>' (SEMI) — the QR carries it, so the scan finds whichever\n   row later takes that number. Bags = the job's bags (full pallet), team = the job's team (user 9 Nov; no job yet → blank, written by hand).\n   Leftover tags (lot ends short / job moves to another team): Sup cancels them → 'PRE_VOID' log row (tagPreCancel).\n   Log row: RecordID = key, Type 'PRE', Snapshot = bags|kg per bag|production day — a recorded pallet that differs gets \"พิมพ์ใหม่\". */\nfunction preKey_(lotId, type, no) { return String(lotId) + '-' + (numGroup_(type) === 'SEMI' ? 'S' : '') + Number(no); }\nfunction preSnap_(bags, w, day, team) { return [Number(bags) || 0, Number(w) || 0, day].concat(team ? [String(team)] : []).join('|'); }\n// bags|kg|day — tags printed before 9 Nov carry no team part; the stop warning (preCheck_) compares these only.\nfunction preCore_(snap) { return String(snap || '').split('|').slice(0, 3).join('|'); }\n// A recorded pallet differs from its pre-printed tag: bags / kg / day, or another team packed it.\nfunction preStale_(g, r) {\n  const team = String(g.snap || '').split('|')[3] || '';\n  return preCore_(g.snap) !== preSnap_(r.Output_Bag, r.WeightInput, tagDay_(r)) || (!!team && team !== String(r.Packing_Team || ''));\n}\n// The print record of a pallet: its own (printed after packing) or the pre-printed one of its number. Hold numbers its own way: own only.\nfunction tagOf_(log, r) {\n  const own = log[String(r.RecordID)], t = rowType_(r);\n  if (own) return { g: own, stale: own.snap !== tagSnap_(r) };\n  let pre = ['FG', 'WIP', 'SEMI'].indexOf(t) >= 0 ? log[preKey_(r.FGLotID, t, r.Pallet_No)] : null;\n  if (pre && (pre.void || !pre.n)) pre = null; // cancelled by Sup → as if never printed\n  return pre ? { g: pre, stale: preStale_(pre, r), pre: true } : { g: null, stale: false };\n}\n// What a pre-printed tag of this lot carries: the lot's open job (FG / WIP / SEMI) if Sup set one, else the lot's own item.\nfunction preJob_(lot) {\n  const job = jobs_().filter(function (j) { return j.fgLotId === lot.id && ['FG', 'WIP', 'SEMI'].indexOf(j.type) >= 0; })[0];\n  return job ? { type: job.type, item: job.item, name: job.name, w: job.weight, bags: job.bags, big: job.unit === 'Bigbag', team: String(job.team || '') }\n    : { type: lot.lotType === 'SEMI' ? 'SEMI' : 'FG', item: lot.fgid, name: lot.name, w: lot.weight, bags: lot.defBags, big: false, team: '' };\n}\nfunction tagPre(token, fgLotId, from, to, day) {\n  const me = session_(token, 'work'), a = Math.floor(Number(from)), b = Math.floor(Number(to || from));\n  if (!(a > 0) || !(b >= a) || b - a + 1 > CFG.TAG.MAX) throw new Error('ใส่ช่วงเลขพาเลท 1–' + CFG.TAG.MAX + ' พาเลท เช่น 13 ถึง 30');\n  day = String(day || prodDateKey_(Date.now()));\n  if (!/^\\d{4}-\\d\\d-\\d\\d$/.test(day)) throw new Error('วันที่ไม่ถูกต้อง');\n  const lot = lot_(fgLotId), it = preJob_(lot), type = it.type;\n  if (it.big) throw new Error('งาน Bigbag ชั่งน้ำหนักตอนหยุด — พิมพ์ป้ายล่วงหน้าไม่ได้');\n  if (!(it.w > 0) || !(it.bags > 0)) throw new Error('ยังไม่รู้ถุง/พาเลท หรือ kg/ถุง ของล็อตนี้ — ตั้งงานให้ล็อตนี้ก่อน');\n  const rows = lotRows_(lot.id).rows, used = usedPallets_(rows, type, Date.now());\n  const pid = String(lot.pid || '').trim(), pl = pid ? rowsWhere_(CFG.PLOT, 'ProductionID', pid).rows.find(function (r) { return !truthy_(r.Cancelled); }) : null;\n  const tags = [], pc = tagPc_(lot.fgid, lot.lot);\n  for (let n = a; n <= b; n++) if (!used.has(n)) tags.push({ id: preKey_(lot.id, type, n), type: type, no: n, item: it.item, name: it.name, lot: lot.lot,\n    bags: it.bags, w: it.w, unit: 'Bag', day: day, team: it.team, pack: nums_(lot.pack), ext: pl ? nums_(pl.Extruder_Number) : '', pc: pc });\n  if (!tags.length) throw new Error('พาเลท #' + a + '–' + b + ' บันทึกแล้วทั้งหมด — ใช้พิมพ์ป้ายปกติ');\n  withLock_(function () {\n    const now = new Date();\n    appendRows_(tagSheet_(), CFG.TAG.HEADERS, tags.map(function (t) {\n      return { RecordID: t.id, FGLotID: lot.id, Lot_Number: lot.lot, Pallet_No: t.no, Type: 'PRE', Snapshot: preSnap_(t.bags, t.w, day, it.team), PrintedAt: now, PrintedBy: me.Name, RequestId: '' };\n    }));\n  });\n  return { tags: tags, skipped: b - a + 1 - tags.length, next: nextPallet_(used) };\n}\n// Sup cancels leftover pre-printed tags (user 9 Nov): one 'PRE_VOID' log row per key → the scan says \"ยกเลิกแล้ว\", the number can be pre-printed again.\nfunction tagPreCancel(token, fgLotId, keys) {\n  const me = session_(token, 'sup');\n  keys = (keys || []).map(String).slice(0, CFG.TAG.MAX);\n  if (!keys.length) throw new Error('เลือกป้ายที่จะยกเลิก');\n  return withLock_(function () {\n    const rows = lotRows_(fgLotId).rows, ok = {};\n    preOpen_(fgLotId, rows, tagLog_()).forEach(function (o) { ok[o.key] = o; });\n    const out = keys.filter(function (k) { return ok[k]; });\n    if (!out.length) throw new Error('ป้ายที่เลือกถูกใช้หรือยกเลิกไปแล้ว — โหลดรายการใหม่');\n    let lotNo = '';\n    try { lotNo = String(fgLotRow_(fgLotId).Lot_Number || ''); } catch (e) { /* lot row gone: leave blank */ }\n    const now = new Date();\n    appendRows_(tagSheet_(), CFG.TAG.HEADERS, out.map(function (k) {\n      return { RecordID: k, FGLotID: String(fgLotId), Lot_Number: lotNo, Pallet_No: ok[k].no, Type: 'PRE_VOID', Snapshot: '', PrintedAt: now, PrintedBy: me.Name, RequestId: '' };\n    }));\n    return { n: out.length, skipped: keys.length - out.length };\n  });\n}\nfunction tagSheet_() {\n  if (isDb_(CFG.TAG.LOG)) return { db: CFG.TAG.LOG };\n  const sh = ss_().getSheetByName(CFG.TAG.LOG);\n  if (sh) return sh;\n  const n = ss_().insertSheet(CFG.TAG.LOG, ss_().getNumSheets());\n  n.appendRow(CFG.TAG.HEADERS);\n  return n;\n}\n// After the PDF is made: one log row per tag. reqId = the phone's id for this print, so a retry adds nothing.\nfunction markTagPrinted(token, fgLotId, ids, reqId) {\n  const me = session_(token, 'work');\n  ids = (ids || []).map(String).slice(0, CFG.TAG.MAX);\n  const rows = lotRows_(fgLotId).rows, req = str_(reqId, 20);\n  return withLock_(function () {\n    const sh = tagSheet_();\n    if (req && sh.db && dbTable_(CFG.TAG.LOG, null, null, 400).rows.some(function (r) { return String(r.RequestId) === req; })) return { dup: true };\n    const last = sh.db ? 0 : sh.getLastRow();\n    if (req && last > 1 && sh.getRange(Math.max(2, last - 400), 9, Math.min(401, last - 1), 1).getValues().some(function (v) { return String(v[0]) === req; })) return { dup: true };\n    const now = new Date(), out = ids.map(function (id) {\n      const r = rows.find(function (x) { return String(x.RecordID) === id; });\n      return r ? { RecordID: id, FGLotID: String(fgLotId), Lot_Number: String(r.Lot_Number || ''), Pallet_No: Number(r.Pallet_No) || '', Type: rowType_(r),\n        Snapshot: tagSnap_(r), PrintedAt: now, PrintedBy: me.Name, RequestId: req } : null;\n    }).filter(Boolean);\n    if (out.length) appendRows_(sh, CFG.TAG.HEADERS, out);\n    return { n: out.length };\n  });\n}\n// Page opened by scanning the QR with any phone: only what is printed on the tag already, plus whether the tag is still valid.\nfunction palletPage_(p) {\n  const id = String(p).replace(/[^\\w-]/g, '').slice(0, 20), h = function (s) { return String(s == null ? '' : s).replace(/[&<>\"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };\n  // pre-printed tag: '<FGLotID>-<no>' / '-S<no>' → the live row that took that number (a cancelled one only if nothing else has it)\n  const m = id.match(/^(\\w+)-(S?)(\\d+)$/);\n  const lr = m ? rowsWhere_(CFG.REC, 'FGLotID', m[1]).rows : null;\n  const r = !id ? null : !m ? rowsWhere_(CFG.REC, 'RecordID', id).rows[0] : lr.filter(function (x) {\n    const t = rowType_(x); return Number(x.Pallet_No) === Number(m[3]) && ['FG', 'WIP', 'SEMI'].indexOf(t) >= 0 && (numGroup_(t) === 'SEMI') === !!m[2];\n  }).sort(function (a, b) { return truthy_(a.Cancelled) - truthy_(b.Cancelled); })[0];\n  // the number moved to Hold (moveToHold leaves it as a gap and writes \"ย้ายจาก FG #n\" on the Hold row)\n  const moved = m && !r && lr.some(function (x) { const k = String(x.Comment || '').match(MOVED_TAG_); return !truthy_(x.Cancelled) && k && Number(k[2]) === Number(m[3]) && (k[1] === 'SEMI') === !!m[2]; });\n  const pv = m ? tagLog_()[id] : null; // a pre-printed tag Sup cancelled\n  let body;\n  if (pv && pv.void) body = '<div class=\"st bad\">ป้ายล่วงหน้านี้ถูกยกเลิกแล้ว (' + h(pv.vby) + ' ' + h(pv.vat) + ') — ดึงป้ายออก<\/div>';\n  else if (!r) body = moved ? '<div class=\"st bad\">พาเลท #' + h(m[3]) + ' ย้ายเป็น WIP แล้ว — ดึงป้ายนี้ออก<\/div>'\n    : m ? '<div class=\"st warn\">ป้ายพิมพ์ล่วงหน้า — พาเลท #' + h(m[3]) + ' ยังไม่ได้บันทึกการแพค<\/div>' : '<div class=\"st bad\">ไม่พบพาเลทนี้ในระบบ<\/div>';\n  else {\n    const log = tagLog_(), x = tagOf_(log, r), g = x.g, t = rowType_(r), dead = truthy_(r.Cancelled), big = unitOf_(r) === 'Bigbag';\n    const st = dead ? '<div class=\"st bad\">พาเลทนี้ถูกยกเลิกแล้ว — ดึงป้ายออก<\/div>'\n      : x.stale ? '<div class=\"st warn\">ข้อมูลเปลี่ยนหลังพิมพ์ป้าย — ' + (x.pre ? 'แก้จำนวนบนป้ายตามนี้ หรือ' : '') + 'ให้ Sup พิมพ์ป้ายใหม่<\/div>'\n      : '<div class=\"st ok\">ข้อมูลตรงกับระบบ<\/div>';\n    const d = tagDay_(r).split('-'), fmtN = function (n) { return Number(n || 0).toLocaleString('en-US'); };\n    let item = String(r.Pack_Item || '').trim();\n    if (!item) try { item = String(fgLotRow_(r.FGLotID).FGID || ''); } catch (e) { /* lot gone: leave blank */ }\n    const rows = [['ประเภท', TN_(t)], ['รหัสสินค้า', item], ['Lot/รุ่น', r.Lot_Number], ['เลขที่พาเลท', r.Pallet_No],\n      ['จำนวน', big ? fmtN(r.Output_Bag) + ' BB' : fmtN(r.Output_Bag)], ['น้ำหนักต่อหน่วย', fmtN(r.WeightInput) + ' kg'], ['น้ำหนักรวม', fmtN(r.Output_Kg) + ' kg'],\n      ['วันที่แพค (วันผลิต)', Number(d[2]) + '/' + Number(d[1]) + '/' + (Number(d[0]) + 543)], ['เครื่อง', r.Pack_Number], ['ทีมแพค', r.Packing_Team],\n      ['พิมพ์ป้ายล่าสุด', g ? g.at + ' · ' + g.by + (x.pre ? ' (ล่วงหน้า)' : '') + (g.n > 1 ? ' (' + g.n + ' ครั้ง)' : '') : 'ยังไม่มีบันทึกการพิมพ์']];\n    body = st + '<table>' + rows.map(function (x) { return '<tr><th>' + h(x[0]) + '<\/th><td>' + h(x[1]) + '<\/td><\/tr>'; }).join('') + '<\/table>';\n  }\n  return HtmlService.createHtmlOutput('<!doctype html><html lang=\"th\"><head><meta charset=\"utf-8\"><style>'\n    + 'body{margin:0;font-family:system-ui,sans-serif;background:#F3F4F1;color:#1A1D21}main{max-width:480px;margin:0 auto;padding:16px}'\n    + 'h1{font-size:20px;margin:0 0 12px}.st{padding:12px 14px;border-radius:10px;font-weight:700;margin-bottom:12px}.ok{background:#DCF0EA;color:#0B5B4D}'\n    + '.warn{background:#FFF1D6;color:#7A3A05}.bad{background:#FBE4E1;color:#97231A}table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px}'\n    + 'th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #E4E6E1;font-size:16px}th{color:#555B61;font-weight:500;width:42%}'\n    + '<\/style><\/head><body><main><h1>ป้ายพาเลท · BFL Packing<\/h1>' + body + '<\/main><\/body><\/html>')\n    .setTitle('ป้ายพาเลท').addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n/* ---------- ระดับอาหารในถัง (Sup) ----------\n   6 bins per machine (CFG.BINS), each 4 parts + hopper → Level 0–5, \"อาหารกำลังลง\" (display only), the feed in it\n   (default = the bin's latest Packing_BinReceive) and Density (g/L) → Kg = Density × Volume_L / 1000 once CFG.BIN_VOL is set. */\nfunction binKey_(d) { return d instanceof Date ? Utilities.formatDate(d, 'Asia/Bangkok', 'yyyy-MM-dd') : String(d || '').slice(0, 10); }\nfunction binVol_(level) {\n  const v = CFG.BIN_VOL;\n  if (!v || !(level > 0)) return null;\n  let s = 0;\n  for (let k = 0; k < level; k++) { if (!(Number(v[k]) > 0)) return null; s += Number(v[k]); }\n  return s;\n}\n// Slot cell → \"HH:MM\" (text \"08:00\", an old number 8, a time cell, or a leading-apostrophe text); '' when it is none of these.\nfunction binSlot_(v) {\n  if (v instanceof Date) return Utilities.formatDate(v, 'Asia/Bangkok', 'HH:mm');\n  if (typeof v === 'number') return v >= 0 && v < 24 && Math.floor(v) === v ? ('0' + v).slice(-2) + ':00' : '';\n  const m = /^'?\\s*(\\d{1,2}):(\\d{2})\\s*$/.exec(String(v == null ? '' : v));\n  return m && Number(m[1]) < 24 && Number(m[2]) < 60 ? ('0' + Number(m[1])).slice(-2) + ':' + m[2] : '';\n}\n// The round a save belongs to: that time of day nearest to the save time (yesterday, today or tomorrow — saves may be early or late).\nfunction binRound_(slot, t) {\n  const d0 = dayDate_(Utilities.formatDate(new Date(t), 'Asia/Bangkok', 'yyyy-MM-dd')).getTime(), mins = Number(slot.slice(0, 2)) * 60 + Number(slot.slice(3));\n  let best = null;\n  [-1, 0, 1].forEach(function (k) { const at = d0 + k * 24 * HOUR + mins * 60e3; if (best == null || Math.abs(at - t) < Math.abs(best - t)) best = at; });\n  return { at: best, day: prodDateKey_(best) };\n}\nfunction binLevels(token, day) {\n  session_(token, 'sup');\n  return binState_(day);\n}\n// No day asked and nothing saved yet this production day → history shows the latest day that has rounds (hday).\nfunction binState_(day) {\n  const asked = /^\\d{4}-\\d{2}-\\d{2}$/.test(String(day || '')), key = asked ? String(day) : prodDateKey_(Date.now());\n  const lots = packingLots_().map(function (l) { return { id: l.id, lot: l.lot, name: l.name, pack: l.pack }; });\n  const names = {};\n  table_(CFG.FG_LOT).rows.forEach(function (r) { names[String(r.FGLotID)] = { lot: String(r.Lot_Number), name: String(r.FG_Name) }; });\n  const recv = {};\n  table_(CFG.BIN).rows.forEach(function (r) {\n    if (truthy_(r.Cancelled) || !(r.DateTimeRecords instanceof Date)) return;\n    const b = String(r.Bin_Number).trim(), t = r.DateTimeRecords.getTime();\n    if (!recv[b] || t > recv[b].at) recv[b] = { id: String(r.FGLotID), at: t, time: dt_(r.DateTimeRecords) };\n  });\n  const last = {}, dens = {}, byDay = {};\n  let lastRk = '', lastDay = '';\n  const sh = isDb_(CFG.BIN_LOG) ? null : ss_().getSheetByName(CFG.BIN_LOG);\n  if (isDb_(CFG.BIN_LOG) || (sh && sh.getLastRow() > 1)) {\n    table_(CFG.BIN_LOG).rows.forEach(function (r) {\n      const at = r.Saved_At instanceof Date ? r.Saved_At.getTime() : 0, b = String(r.Bin_Number), id = String(r.FGLotID || '');\n      const dk = binKey_(r.Production_Date), sl = binSlot_(r.Slot), k = String(r.Pack_Number) + '|' + sl;\n      // newest = latest round (production day, then time from 08:00), not latest save — editing an old round keeps today's values on top\n      const mm = sl ? (Number(sl.slice(0, 2)) * 60 + Number(sl.slice(3)) + 960) % 1440 : 0, rk = dk + '|' + ('000' + mm).slice(-4);\n      const x = { lv: Number(r.Level) || 0, fill: truthy_(r.Filling), id: id, dens: Number(r.Density) || '', at: at, by: String(r.Saved_By || ''), time: dt_(r.Saved_At), slot: sl, day: dk, rk: rk };\n      if (!last[b] || rk > last[b].rk || (rk === last[b].rk && at >= last[b].at)) last[b] = x;\n      if (rk >= lastRk) { lastRk = rk; lastDay = dk; }\n      if (id && x.dens && (!dens[id] || at > dens[id].at)) dens[id] = { d: x.dens, at: at };\n      const hist = byDay[dk] || (byDay[dk] = {});\n      const g = hist[k] || (hist[k] = { pack: String(r.Pack_Number), slot: sl, at: 0, by: '', bins: {} });\n      g.bins[b] = { lv: x.lv, fill: x.fill, kg: r.Kg === '' ? '' : Number(r.Kg), lot: String(r.Lot_Number || ''), id: id, dens: x.dens };\n      if (at >= g.at) { g.at = at; g.by = x.by; g.time = Utilities.formatDate(new Date(at), 'Asia/Bangkok', 'HH:mm'); }\n    });\n  }\n  Object.keys(dens).forEach(function (k) { dens[k] = dens[k].d; });\n  const hday = asked || byDay[key] || !lastDay ? key : lastDay, hist = byDay[hday] || {};\n  return { day: key, hday: hday, today: prodDateKey_(Date.now()), slots: CFG.BIN_SLOTS, bins: CFG.BINS, vol: CFG.BIN_VOL, lots: lots, names: names,\n    recv: recv, last: last, dens: dens, hist: Object.keys(hist).map(function (k) { return hist[k]; }) };\n}\n// p = {pack, slot (\"HH:MM\"), bins: [{bin, lv, fill, id, dens}], day?} — the whole machine (6 bins) in one save.\n// day (\"yyyy-MM-dd\") = edit a round already saved on that production day; without it the round goes to the day the time falls in.\nfunction saveBinLevels(token, p) {\n  const me = session_(token, 'sup'), pack = String(p && p.pack || ''), bins = CFG.BINS[pack];\n  if (!bins) throw new Error('ไม่รู้จักเครื่อง ' + pack);\n  const slot = binSlot_(p.slot);\n  if (!slot) throw new Error('เวลารอบไม่ถูกต้อง (HH:MM)');\n  const list = (p.bins || []).filter(function (x) { return bins.indexOf(String(x.bin)) >= 0; });\n  if (list.length !== bins.length) throw new Error('ต้องส่งครบ ' + bins.length + ' ถังของ ' + pack);\n  const names = {};\n  table_(CFG.FG_LOT).rows.forEach(function (r) { names[String(r.FGLotID)] = { lot: String(r.Lot_Number), name: String(r.FG_Name) }; });\n  const eday = /^\\d{4}-\\d{2}-\\d{2}$/.test(String(p.day || '')) ? String(p.day) : '';\n  const now = Date.now(), rd = eday ? { day: eday } : binRound_(slot, now), saved = new Date(now);\n  const rows = list.map(function (x) {\n    const lv = Number(x.lv), d = x.dens === '' || x.dens == null ? '' : Number(x.dens), id = str_(x.id, 20), n = id ? names[id] : null;\n    if (!(lv >= 0 && lv <= 5 && Math.floor(lv) === lv)) throw new Error(x.bin + ': ระดับไม่ถูกต้อง');\n    if (d !== '' && !(d > 0 && d < 3000)) throw new Error(x.bin + ': Density ต้องอยู่ระหว่าง 1–2999 g/L');\n    if (id && !n) throw new Error(x.bin + ': ไม่พบ FG Lot ' + id);\n    const vol = binVol_(lv), kg = lv === 0 ? 0 : vol != null && d > 0 ? Math.round(d * vol / 1000 * 10) / 10 : '';\n    // ponytail: leading apostrophe keeps \"08:00\" as text (Sheets would turn it into a time value)\n    return { Production_Date: dayDate_(rd.day), Slot: \"'\" + slot, Saved_At: saved, Pack_Number: pack, Bin_Number: String(x.bin), Level: lv,\n      Filling: x.fill === true, FGLotID: id, Lot_Number: n ? n.lot : '', FG_Name: n ? n.name : '', Density: d,\n      Volume_L: lv === 0 ? 0 : vol == null ? '' : vol, Kg: kg, Saved_By: me.Name, UpdatedTimestamp: saved };\n  });\n  withLock_(function () {\n    const same = function (r) { return binKey_(r.Production_Date) === rd.day && binSlot_(r.Slot) === slot && String(r.Pack_Number) === pack; };\n    if (eday && !((isDb_(CFG.BIN_LOG) || ss_().getSheetByName(CFG.BIN_LOG)) && table_(CFG.BIN_LOG).rows.some(same))) throw new Error('ไม่พบรอบ ' + slot + ' ของ ' + pack + ' วันผลิต ' + eday + ' — แก้ได้เฉพาะรอบที่บันทึกแล้ว');\n    if (!isDb_(CFG.BIN_LOG) && !ss_().getSheetByName(CFG.BIN_LOG)) ss_().insertSheet(CFG.BIN_LOG, ss_().getNumSheets()).appendRow(CFG.BIN_LOG_HEADERS);\n    const t = table_(CFG.BIN_LOG), add = [];\n    rows.forEach(function (o) {\n      const ex = t.rows.find(function (r) { return same(r) && String(r.Bin_Number) === o.Bin_Number; });\n      if (!ex) { add.push(Object.assign({ LogID: id8_() }, o)); return; }\n      const v = Object.assign({}, ex, o);\n      if (t.sh.db) { const all = {}; t.h.forEach(function (c) { all[c] = c in v ? v[c] : ''; }); dbSet_(t.sh.db, t.h, [ex], all); return; }\n      t.sh.getRange(ex._row, 1, 1, t.h.length).setValues([t.h.map(function (c) { return c in v ? v[c] : ''; })]);\n    });\n    if (add.length) appendRows_(t.sh, t.h, add);\n  });\n  return binState_(rd.day);\n}\n\n\n/* ---------- ที่เก็บข้อมูล Supabase (user 12 Nov 2026) ----------\n * 8 แท็บของแอปแพค (Packing_Record, FG_Lot, Packing_Runtime, Packing_BinReceive, Old_Semi_Use, Lot_Notify, Bin_Level_Log, Pallet_Tag_Log)\n * เก็บใน Supabase bfl-production (ตาราง pkp_row: 1 แถว = 1 แถวของชีต ค่าเหมือนที่สคริปต์อ่านจากชีต) — ชีต BFL Production-Dep ได้สำเนา:\n * หลังบันทึก (withLock_ / recalc) สำเนาเฉพาะช่องที่เปลี่ยนลงชีตทันที แล้ว recalc เรียกสคริปต์คำนวณเดิม (Bluefalo Production_Lot) เหมือนเดิม\n * ยอดที่สคริปต์เดิมคำนวณใน FG_Lot (Total_* …) คัดกลับเข้า Supabase หลัง recalc · pkFlushJob ทุก 5 นาทีเก็บตก\n * สวิตช์ = Script Property DB_PRIMARY ('1' = Supabase) — ตั้งโดย pkCutover() เท่านั้น · ย้อนกลับ: pkRollback() (สำเนาลงชีตให้ครบก่อนแล้วปิดสวิตช์)\n * แท็บอื่น (FG_Detail, Production_Lot, NCP, Packing_Form_Export, Packing_App_Users …) ยังอยู่ในชีตเหมือนเดิม */\nconst DB = {\n  URL: 'https://kdytxuufvigwjccebrki.supabase.co/rest/v1/rpc/', KEY: 'sb_publishable_IYCMIaN7tJleWINprA42CQ_dX10sXFF', SOURCE: 'packing',\n  // tab → key column ('' = log without a key: Pallet_Tag_Log, append only)\n  TABS: { Packing_Record: 'RecordID', FG_Lot: 'FGLotID', Packing_Runtime: 'ID', Packing_BinReceive: 'ID', Old_Semi_Use: 'UseID', Lot_Notify: 'FGLotID',\n    Bin_Level_Log: 'LogID', Pallet_Tag_Log: '',\n    // v92: packing's masters + tabs other apps also write (refreshed from the sheet by pkRefSync_ until those apps move); '' = no key, read only\n    FG_Detail: 'FGID', Packing_App_Users: 'User_ID', Packing_Form_Export: 'ExportID', Production_Lot: 'ProductionID', NCP: 'ID',\n    Product_Detail: 'ProductID', NCP_Detail: 'NCP_ID', Production_NCP_Map: '', RuntimeType: '' },\n  // tabs other apps write in the sheet → Supabase every background run (rows this app changed and the sheet copy has not taken are kept)\n  REF: ['Production_Lot', 'NCP', 'Product_Detail', 'NCP_Detail', 'Production_NCP_Map', 'RuntimeType', 'Packing_Form_Export'],\n  // cells the main script computes in the sheet — the sheet copy never writes them (unless this app changed them itself)\n  CALC: {\n    Packing_Record: ['PrevDT', 'DeltaMinutes', 'Capacity_Bag_hr', 'Capacity_Kg_hr', 'RecalcAt', 'NCPID', 'NCP_RecalcAt', 'NCP_Error'],\n    Packing_Runtime: ['Duration_Min', 'Duration_Over_Lot', 'LastRuntimeRecalcAt'],\n    FG_Lot: ['SourceNote', 'SourceMode', 'SourceFGLotID', 'Total_Output_Bag', 'Total_Output_Kg', 'Total_Hold_Kg', 'Total_Return_Kg', 'Total_Reject_Kg',\n      'Current_Hold_Kg', 'Last_Record_At', 'Last_RecalcAt', 'Output_Record_Count', 'Total_SEMI_Kg']\n  },\n  BATCH: 800, FLUSH_MAX: 400\n};\nlet DB_ON_ = null, DB_DIRTY_ = false, DB_NOFLUSH_ = false, PREF_ = null;\nfunction dbOn_() { if (DB_ON_ == null) DB_ON_ = PropertiesService.getScriptProperties().getProperty('DB_PRIMARY') === '1'; return DB_ON_; }\nfunction isDb_(name) { return dbOn_() && Object.prototype.hasOwnProperty.call(DB.TABS, name); }\nfunction dbCall_(fn, body, key) {\n  key = key || prop_('PK_KEY');\n  if (!key) throw new Error('ฐานข้อมูล: ยังไม่ได้ตั้ง PK_KEY (รัน pkDbSetup)');\n  const r = UrlFetchApp.fetch(DB.URL + fn, { method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n    headers: { apikey: DB.KEY, Authorization: 'Bearer ' + DB.KEY }, payload: JSON.stringify(Object.assign({ p_source: DB.SOURCE, p_key: key }, body)) });\n  const code = r.getResponseCode(), txt = r.getContentText();\n  if (code >= 300) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch (e) { /* text */ } throw new Error('ฐานข้อมูล: ' + String(m).slice(0, 300)); }\n  if (DB_WRITES_[fn]) dbBump_(fn === 'pkp_put' ? (body.p_ops || []).map(function (o) { return o.tab; }) : fn === 'pkp_computed' ? [body.p_tab] : null);\n  return txt ? JSON.parse(txt) : null;\n}\n/* Read cache (14 Nov 2026 — UrlFetch quota shared by every BFL script): a pkp_get answer is kept 2 min under the store version;\n * every write through this app (pkp_put / pkp_computed / pkp_load) makes a new version, so nobody reads data older than its own write.\n * Phones that reload after the same write share one read instead of each fetching it. */\nconst DB_WRITES_ = { pkp_put: 1, pkp_computed: 1, pkp_load: 1, pkp_load_done: 1 }, DB_CACHE_S = 120, DB_PART = 30000;\n/* 14 Nov 2026 (v86): the version is kept per tab — saving a pallet (Packing_Record) no longer makes FG_Lot, Lot_Notify, Runtime … be\n * read again; pkp_load (whole reload) changes them all. Reads in one run are kept in memory (DB_MEMO_) and several tabs can be\n * fetched in one call (dbPrefetch_ → pkp_get_many). */\nlet DBV_N_ = 0, DB_MEMO_ = {}, DB_FRESH_ = false;   // DB_FRESH_: read Supabase, not the 120 s cache (phones save without Apps Script — v91)\nfunction localW_() { return dbOn_() && PropertiesService.getScriptProperties().getProperty('PK_LOCAL_W') === '1'; }\nfunction dbVer_(tab) {\n  try { const g = CacheService.getScriptCache().getAll(['pk_dbv', 'pk_dbv:' + tab]); return (g['pk_dbv'] || '0') + '/' + (g['pk_dbv:' + tab] || '0'); }\n  catch (e) { return 'x' + Date.now(); }\n}\nfunction dbBump_(tabs) {\n  DB_MEMO_ = {};\n  try {\n    const v = Date.now().toString(36) + '.' + (++DBV_N_) + '.' + String(Date.now() % 997), c = CacheService.getScriptCache();\n    const list = (tabs || []).filter(function (t) { return t; });\n    if (!tabs || !list.length) { c.put('pk_dbv', v, 21600); return; }\n    const o = {}; list.forEach(function (t) { o['pk_dbv:' + t] = v; }); c.putAll(o, 21600);\n  } catch (e) { /* next read misses anyway */ }\n}\nfunction dbCk_(ver, body) { return 'pkg' + Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, ver + '|' + JSON.stringify(body))); }\nfunction dbCacheGet_(c, ck) {\n  try {\n    const n = Number(c.get(ck) || 0);\n    if (n > 0) {\n      let txt = '';\n      for (let i = 0; i < n; i++) { const part = c.get(ck + ':' + i); if (part == null) { txt = null; break; } txt += part; }\n      if (txt != null) return JSON.parse(txt);\n    }\n  } catch (e) { /* read again */ }\n  return null;\n}\nfunction dbCachePut_(c, ck, ver, tab, res) {\n  try {\n    const txt = JSON.stringify(res), n = Math.ceil(txt.length / DB_PART);\n    if (n && n <= 30 && dbVer_(tab) === ver) { // a write landed meanwhile → do not keep it\n      const o = {};\n      for (let i = 0; i < n; i++) o[ck + ':' + i] = txt.slice(i * DB_PART, (i + 1) * DB_PART);\n      c.putAll(o, DB_CACHE_S);\n      c.put(ck, String(n), DB_CACHE_S);\n    }\n  } catch (e) { /* too big / cache full — fine */ }\n}\nfunction dbGetCached_(body) {\n  const mk = JSON.stringify(body);\n  if (DB_MEMO_[mk]) return DB_MEMO_[mk];\n  if (DB_FRESH_) return (DB_MEMO_[mk] = dbCall_('pkp_get', body));\n  const c = CacheService.getScriptCache(), ver = dbVer_(body.p_tab), ck = dbCk_(ver, body);\n  let res = dbCacheGet_(c, ck);\n  if (!res) { res = dbCall_('pkp_get', body); dbCachePut_(c, ck, ver, body.p_tab, res); }\n  DB_MEMO_[mk] = res;\n  return res;\n}\n// reqs = [[tab, col, vals, tail], …]: what this run will read — the ones not in memory / cache come in ONE call\nfunction dbPrefetch_(reqs) {\n  try {\n    if (!dbOn_()) return;\n    const c = CacheService.getScriptCache(), miss = [];\n    reqs.forEach(function (q) {\n      if (!isDb_(q[0])) return;\n      const body = dbBody_(q[0], q[1], q[2], q[3]), mk = JSON.stringify(body);\n      if (DB_MEMO_[mk]) return;\n      const ver = dbVer_(body.p_tab), ck = dbCk_(ver, body), hit = dbCacheGet_(c, ck);\n      if (hit) { DB_MEMO_[mk] = hit; return; }\n      miss.push({ body: body, mk: mk, ver: ver, ck: ck });\n    });\n    if (!miss.length) return;\n    if (miss.length === 1) { const m = miss[0], r1 = dbCall_('pkp_get', m.body); dbCachePut_(c, m.ck, m.ver, m.body.p_tab, r1); DB_MEMO_[m.mk] = r1; return; }\n    const res = dbCall_('pkp_get_many', { p_reqs: miss.map(function (m) { return { tab: m.body.p_tab, col: m.body.p_col, vals: m.body.p_vals, tail: m.body.p_tail }; }) });\n    miss.forEach(function (m, i) { if (res && res[i]) { dbCachePut_(c, m.ck, m.ver, m.body.p_tab, res[i]); DB_MEMO_[m.mk] = res[i]; } });\n  } catch (e) { console.warn('prefetch: ' + e.message); }   // the normal reads still work one by one\n}\n// cell ↔ store: Date = {$d: ms} (time-only cells too), '' = not kept\nfunction dbEnc_(v) {\n  if (v === '' || v == null) return null;\n  if (v instanceof Date) return isNaN(v.getTime()) ? null : { $d: v.getTime() };\n  if (typeof v === 'number') return isFinite(v) ? v : null;\n  if (typeof v === 'boolean') return v;\n  return String(v);\n}\nfunction dbDec_(v) { return v == null ? '' : typeof v === 'object' && v.$d != null ? new Date(v.$d) : v; }\n// rows as table_ gives them: every header present ('' when empty), _row = order, _k = key\nfunction dbBody_(name, col, vals, tail) { return { p_tab: name, p_col: col || null, p_vals: vals || null, p_tail: tail || null }; }\nfunction dbTable_(name, col, vals, tail) {\n  const res = dbGetCached_(dbBody_(name, col, vals, tail)), h = res.h.slice();\n  const rows = res.rows.map(function (d) { const o = {}; h.forEach(function (c) { o[c] = dbDec_(d[c]); }); o._k = d._k; o._row = d._s; return o; });\n  return { sh: { db: name }, h: h, rows: rows };\n}\nfunction dbKey_(name, o) {\n  const kc = DB.TABS[name];\n  return kc ? String(o[kc] == null ? '' : o[kc]) : 'L' + Date.now().toString(36) + Utilities.getUuid().replace(/-/g, '').slice(0, 8);\n}\nfunction dbAppend_(name, h, objs) {\n  if (!objs.length) return;\n  const rows = objs.map(function (o) {\n    const d = {};\n    h.forEach(function (c) { if (c in o) { const v = dbEnc_(o[c]); if (v !== null) d[c] = v; } });\n    return { k: dbKey_(name, o), d: d };\n  });\n  dbCall_('pkp_put', { p_ops: [{ tab: name, op: 'ins', rows: rows }] });\n  DB_DIRTY_ = true;\n}\n// a few cells of existing rows (columns not in the headers are skipped, as setCells_ does on the sheet)\nfunction dbSet_(name, h, rows, vals) {\n  if (!rows.length) return;\n  const set = {};\n  Object.keys(vals).forEach(function (c) { if (h.indexOf(c) >= 0) set[c] = dbEnc_(vals[c]); });\n  dbCall_('pkp_put', { p_ops: [{ tab: name, op: 'upd', rows: rows.map(function (r) { return { k: String(r._k), set: set }; }) }] });\n  DB_DIRTY_ = true;\n}\n// start screen: Packing_Record rows of all its lots in one read (read-only, cleared at the end of state_)\nfunction prefetch_(ids) {\n  PREF_ = null;\n  if (!dbOn_() || !ids.length) return;\n  const t = dbTable_(CFG.REC, 'FGLotID', ids), by = {};\n  ids.forEach(function (id) { by[String(id)] = { sh: t.sh, h: t.h, rows: [] }; });\n  t.rows.forEach(function (r) { const g = by[String(r.FGLotID)]; if (g) g.rows.push(r); });\n  PREF_ = by;\n}\n\n/* ---------- สำเนาลงชีต ---------- */\n// Waiting rows → the sheet: a new row is appended, an edited row gets only the cells that changed. One copy at a time (script lock;\n// held = the caller already holds it).\nfunction pkFlush_(held) {\n  if (!dbOn_()) return null;\n  const lock = held ? null : LockService.getScriptLock();\n  if (lock && !lock.tryLock(30000)) return { busy: true };\n  try {\n    let n = 0;\n    for (let round = 0; round < 6; round++) {\n      const r = dbCall_('pkp_flush_take', { p_max: DB.FLUSH_MAX });\n      if (!r.items.length) break;\n      const by = {};\n      r.items.forEach(function (it) { (by[it.tab] = by[it.tab] || []).push(it); });\n      Object.keys(by).forEach(function (tab) { flushTab_(tab, by[tab]); });\n      SpreadsheetApp.flush();\n      dbCall_('pkp_flush_done', { p_upto: r.upto });\n      n += r.items.length;\n      if (r.items.length < DB.FLUSH_MAX) break;\n    }\n    return { n: n };\n  } finally { if (lock) lock.releaseLock(); }\n}\nfunction flushSheet_(tab) {\n  let sh = ss_().getSheetByName(tab);\n  if (sh) return sh;\n  const heads = { Old_Semi_Use: CFG.OLD_HEADERS, Lot_Notify: CFG.NOTIFY_HEADERS, Bin_Level_Log: CFG.BIN_LOG_HEADERS, Pallet_Tag_Log: CFG.TAG.HEADERS }[tab];\n  if (!heads) throw new Error('ไม่พบแท็บ ' + tab);\n  sh = ss_().insertSheet(tab, ss_().getNumSheets());\n  sh.appendRow(heads);\n  return sh;\n}\nfunction flushTab_(tab, items) {\n  const sh = flushSheet_(tab), h = headers_(sh), kc = DB.TABS[tab], ki = kc ? h.indexOf(kc) : -1, last = sh.getLastRow(), calc = DB.CALC[tab] || [];\n  if (kc && ki < 0) throw new Error('แท็บ ' + tab + ' ไม่มีคอลัมน์ ' + kc);\n  const at = {}, add = [], cells = {};\n  if (kc && last > 1) sh.getRange(2, ki + 1, last - 1, 1).getValues().forEach(function (v, i) { const s = String(v[0]); if (!(s in at)) at[s] = i + 2; });\n  items.forEach(function (it) {\n    if (!it.d) return;\n    const row = kc ? at[it.k] : 0;\n    if (!row) { // new row: every cell the app wrote\n      add.push(h.map(function (c) { return c in it.d ? dbDec_(it.d[c]) : ''; }));\n      if (kc) at[it.k] = -1;\n      return;\n    }\n    if (row < 0) return;\n    // edited row: the cells changed (a re-sent new row: the app's own cells, never the main script's)\n    const cols = it.cols || Object.keys(it.d).filter(function (c) { return calc.indexOf(c) < 0; });\n    cols.forEach(function (c) {\n      const j = h.indexOf(c);\n      if (j < 0) return;\n      const v = c in it.d ? dbDec_(it.d[c]) : '', g = j + '|' + JSON.stringify(v instanceof Date ? { t: v.getTime() } : v);\n      (cells[g] = cells[g] || { c: j + 1, v: v, rows: [] }).rows.push(row);\n    });\n  });\n  Object.keys(cells).forEach(function (g) { // same value into many rows → one RangeList call\n    const x = cells[g];\n    if (x.rows.length === 1) sh.getRange(x.rows[0], x.c).setValue(x.v);\n    else sh.getRangeList(x.rows.map(function (r) { return sh.getRange(r, x.c).getA1Notation(); })).setValue(x.v);\n  });\n  if (add.length) sh.getRange(sh.getLastRow() + 1, 1, add.length, h.length).setValues(add);\n}\n// FG_Lot totals the main script just wrote in the sheet → Supabase (the data tab shows them)\nfunction pkCalcBack_(ids) {\n  if (!dbOn_() || !ids.length) return;\n  const set = [];\n  ids.forEach(function (id) {\n    const t = sheetWhere_(CFG.FG_LOT, 'FGLotID', id), r = t.rows[0];\n    if (!r) return;\n    const v = {};\n    DB.CALC.FG_Lot.forEach(function (c) { if (t.h.indexOf(c) >= 0) v[c] = dbEnc_(r[c]); });\n    set.push({ k: String(id), set: v });\n  });\n  if (set.length) dbCall_('pkp_computed', { p_tab: CFG.FG_LOT, p_rows: set });\n}\n// time trigger every 5 min: whatever is still waiting reaches the sheet\nfunction pkFlushJob() {\n  if (!dbOn_()) return 'off';\n  const r = pkFlush_();\n  if (r && !r.busy) { try { r.q = pkQueueRun_(); } catch (e) { r.q = 'queue: ' + e.message; } }\n  if (r && !r.busy) { try { r.h = pkHookRun_(); } catch (e) { r.h = 'hooks: ' + e.message; } }\n  if (r && !r.busy) { try { r.ref = pkRefSync_(); } catch (e) { r.ref = 'ref: ' + e.message; } }\n  console.log(JSON.stringify(r));\n  return r;\n}\n// v91: recalc calls the phones queued in Supabase (pkq_add) — the same work as recalc(), in order; the sheet copy was just done.\n// A call that fails stays queued (retried next run, up to 5 times); UrlFetch quota used up → stop, all the rest wait.\nfunction pkQueueRun_() {\n  const items = dbCall_('pkq_take', { p_max: 40 }) || [];\n  if (!items.length) return 0;\n  DB_FRESH_ = true; DB_MEMO_ = {};\n  const users = users_(), done = [], fail = [], lots = {};\n  for (let i = 0; i < items.length; i++) {\n    const it = items[i];\n    try {\n      const u = users.find(function (x) { return x.id === it.uid && x.active; });\n      if (!u || !roleOk_(u.Role, 'work')) throw new Error('ผู้ใช้ ' + it.uid + ' ไม่มีสิทธิ์');\n      const r = recalc_(u, 'PackingApp:' + u.Name, (it.ids || []).map(String), it.lot, it.kind || undefined);\n      if ((r.codes || []).some(function (c) { return c >= 300; })) console.warn('main script answered ' + JSON.stringify(r.codes) + ' for queue item ' + it.id);   // as recalc(): not retried\n      done.push(it.id);\n      if (!it.kind && it.lot) lots[it.lot] = 1;\n    } catch (e) {\n      fail.push({ id: it.id, err: String(e.message || e) });\n      if (/too many times|urlfetch|หลายครั้งเกินไป/i.test(String(e.message))) break;\n    }\n  }\n  const ids = Object.keys(lots);\n  if (ids.length) { try { pkCalcBack_(ids); } catch (e) { console.warn('totals back: ' + e.message); } }\n  dbCall_('pkq_done', { p_done: done, p_fail: fail });\n  return { done: done.length, failed: fail.length };\n}\n\n/* ---------- ตั้งค่า / สลับ (รันจาก editor เท่านั้น) ---------- */\n// once: a random key for this script, its sha256 registered in Supabase (pk_key, source 'packing'), the key kept in Script Properties\nfunction pkDbSetup() {\n  const p = PropertiesService.getScriptProperties();\n  if (p.getProperty('PK_KEY')) return 'PK_KEY already set';\n  const key = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');\n  dbCall_('pk_register', {}, key);\n  p.setProperty('PK_KEY', key);\n  return 'ok';\n}\n// Copy the 8 tabs into Supabase under the script lock (nobody can save meanwhile), then switch DB_PRIMARY on.\nfunction pkCutover() {\n  const p = PropertiesService.getScriptProperties();\n  if (!p.getProperty('PK_KEY')) throw new Error('รัน pkDbSetup ก่อน');\n  if (p.getProperty('DB_PRIMARY') === '1') throw new Error('ใช้ Supabase อยู่แล้ว');\n  const l = LockService.getScriptLock();\n  l.waitLock(30000);\n  try {\n    const out = {};\n    Object.keys(DB.TABS).forEach(function (tab) { out[tab] = pkLoadTab_(tab); });\n    out.done = dbCall_('pkp_load_done', { p_primary: true });\n    p.setProperty('DB_PRIMARY', '1');\n    DB_ON_ = true;\n    const c = CacheService.getScriptCache();\n    c.removeAll(['lots', 'pk_st', 'pk_st_at', 'pk_edm', 'rtypes']);\n    c.put('live_v', Date.now().toString(36), 21600);\n    console.log(JSON.stringify(out));\n    return out;\n  } finally { l.releaseLock(); }\n}\nfunction pkLoadTab_(tab) {\n  const sh = ss_().getSheetByName(tab);\n  const heads = { Old_Semi_Use: CFG.OLD_HEADERS, Lot_Notify: CFG.NOTIFY_HEADERS, Bin_Level_Log: CFG.BIN_LOG_HEADERS, Pallet_Tag_Log: CFG.TAG.HEADERS }[tab];\n  if (!sh && !heads) throw new Error('ไม่พบแท็บ ' + tab);\n  const h = sh ? headers_(sh) : heads, last = sh ? sh.getLastRow() : 0, kc = DB.TABS[tab], ki = kc ? h.indexOf(kc) : -1;\n  if (kc && ki < 0) throw new Error('แท็บ ' + tab + ' ไม่มีคอลัมน์ ' + kc);\n  const v = last > 1 ? sh.getRange(2, 1, last - 1, h.length).getValues() : [], rows = [], seen = {};\n  v.forEach(function (r, i) {\n    if (r.every(function (x) { return x === '' || x == null; })) return; // blank row\n    let k = kc ? String(r[ki] == null ? '' : r[ki]) : 'S' + (i + 2);\n    if (!k || seen[k]) k = '#row' + (i + 2); // no key / key twice: kept under its row number (never matches a real id)\n    seen[k] = 1;\n    const d = {};\n    h.forEach(function (c, j) { const e = dbEnc_(r[j]); if (e !== null) d[c] = e; });\n    rows.push({ k: k, s: i + 2, d: d });\n  });\n  for (let i = 0; i === 0 || i < rows.length; i += DB.BATCH) {\n    dbCall_('pkp_load', { p_tab: tab, p_keycol: kc, p_headers: h, p_rows: rows.slice(i, i + DB.BATCH), p_truncate: i === 0 });\n  }\n  return rows.length;\n}\n// Back to the sheet: copy what is still waiting, then the switch off (the sheet is then the store again).\nfunction pkRollback() {\n  const l = LockService.getScriptLock();\n  l.waitLock(30000);\n  try {\n    const r = pkFlush_(true);\n    dbCall_('pkp_load_done', { p_primary: false });\n    PropertiesService.getScriptProperties().setProperty('DB_PRIMARY', '0');\n    DB_ON_ = false;\n    CacheService.getScriptCache().removeAll(['lots', 'pk_st', 'pk_st_at', 'pk_edm']);\n    return { flushed: r, primary: false };\n  } finally { l.releaseLock(); }\n}\n// Check: every cell of the 8 tabs in Supabase = the sheet (run after the copy has caught up). Returns differences per tab (max 20 shown).\nfunction pkCompare() {\n  if (!dbOn_()) return 'off';\n  pkFlush_();\n  const out = {};\n  Object.keys(DB.TABS).forEach(function (tab) {\n    const sh = ss_().getSheetByName(tab);\n    const db = dbTable_(tab), kc = DB.TABS[tab];\n    if (!sh) { out[tab] = { sheet: 0, db: db.rows.length }; return; }\n    const h = headers_(sh), last = sh.getLastRow(), v = last > 1 ? sh.getRange(2, 1, last - 1, h.length).getValues() : [];\n    const sheetRows = v.filter(function (r) { return !r.every(function (x) { return x === '' || x == null; }); });\n    const calc = DB.CALC[tab] || [], diff = [];\n    if (kc) {\n      const ki = h.indexOf(kc), by = {};\n      sheetRows.forEach(function (r) { by[String(r[ki])] = r; });\n      db.rows.forEach(function (o) {\n        const r = by[o._k];\n        if (!r) { if (o._k.charAt(0) !== '#') diff.push(o._k + ' ไม่มีในชีต'); return; }\n        h.forEach(function (c, j) {\n          if (calc.indexOf(c) >= 0 || !(c in o)) return;\n          const a = JSON.stringify(dbEnc_(r[j])), b = JSON.stringify(dbEnc_(o[c]));\n          if (a !== b) diff.push(o._k + '.' + c + ': ชีต ' + a + ' / Supabase ' + b);\n        });\n      });\n    }\n    out[tab] = { sheet: sheetRows.length, db: db.rows.length, diff: diff.length, first: diff.slice(0, 20) };\n  });\n  console.log(JSON.stringify(out));\n  return out;\n}\n\n/* ---------- GitHub Pages (user 10 Nov 2026) ----------\n * หน้าแอปบน GitHub Pages (skaart19bfl.github.io/bfl-app-assets/<app>/) เรียกฟังก์ชันเดิมของสคริปต์นี้ผ่าน POST แทน google.script.run\n * __page = ส่ง Index.html ไปให้หน้า GitHub Pages (ส่ง hash มาตรงกัน = ไม่ส่งซ้ำ) · ลิงก์ /exec เดิมยังเปิดได้เหมือนเดิม\n * เรียกได้เฉพาะชื่อที่ google.script.run เรียกได้อยู่แล้ว และกันชื่องานหลังบ้าน (setup / store / sync / migrate / trigger …) ออกเพิ่ม */\nvar GLOBAL__ = this;\nfunction doPost(e) {\n  var out;\n  try {\n    var b = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    var fn = String(b.fn || '');\n    if (fn === '__warm') {   // the Hub opened: get the Sup start screen ready while nobody waits (user 10 Nov 2026)\n      out = { ok: true, v: pkWarm_(PK.WARM_MS) };\n    } else if (fn === '__page') {\n      var html = HtmlService.createHtmlOutputFromFile('Index').getContent();\n      var hsh = Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, html, Utilities.Charset.UTF_8));\n      out = { ok: true, v: b.hash === hsh ? { same: true, hash: hsh } : { html: html, hash: hsh } };\n    } else {\n      if (!/^[A-Za-z][A-Za-z0-9]*$/.test(fn) || /^(do|on)[A-Z]/.test(fn) ||\n          /^(setup|store|sync|install|migrate|debug|test|cron|seed|reset|purge|wipe|backfill|pk[A-Z]|db[A-Z])/i.test(fn) || /(Trigger|Now)$/.test(fn) ||\n          typeof GLOBAL__[fn] !== 'function' || !Object.prototype.propertyIsEnumerable.call(GLOBAL__, fn)) throw new Error('API: ไม่มีฟังก์ชัน ' + fn);\n      out = { ok: true, v: GLOBAL__[fn].apply(null, b.args || []) };\n    }\n  } catch (err) {\n    out = { ok: false, e: String((err && err.message) || err) };\n  }\n  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);\n}\n\n\n// Emergency (14 Nov 2026, UrlFetch quota used up — user approved \"สลับไปชีตตอนนี้\"): back to sheet mode WITHOUT the Supabase calls of\n// pkRollback. Run from the editor only after checking in Supabase that pkp_out has no open rows; pkp_cfg / pkp_tab primary are set to 0 by SQL.\n// Back to Supabase later: pkCutover (reloads every tab from the sheet).\nfunction pkSheetModeNow() {\n  const l = LockService.getScriptLock(); l.waitLock(30000);\n  try {\n    const P = PropertiesService.getScriptProperties();\n    if (P.getProperty('DB_JOBS') === '1') {   // v90: jobs are in Supabase → bring them back first (needs one UrlFetch; refuse if it fails)\n      const o = dbCall_('pkj_get', {}) || {}, all = P.getProperties();\n      Object.keys(all).forEach(function (k) { if (k.indexOf('JOB_') === 0) P.deleteProperty(k); });\n      Object.keys(o).forEach(function (k) { P.setProperty('JOB_' + k, o[k]); });\n      P.setProperty('DB_JOBS', '0'); JOBS_ = null;\n    }\n    P.setProperty('PK_LOCAL_W', '0');\n    P.setProperty('DB_PRIMARY', '0'); DB_ON_ = false;\n    const c = CacheService.getScriptCache(); c.removeAll(['lots', 'pk_st', 'pk_st_at', 'pk_edm']); c.put('live_v', Date.now().toString(36), 21600);\n    console.log('sheet mode at ' + new Date());\n    return 'sheet mode';\n  } finally { l.releaseLock(); }\n}\n\n/* ---------- บันทึกตรงจากมือถือ (v90, user 14 Nov 2026 \"ทำเลย แต่ต้องใช้งานได้ปกติตลอดการทำ\") ----------\n * The new page runs these saves itself (lr.js) and sends them to Supabase in one checked call (pkw_commit). While Script Property\n * PK_LOCAL_W = '1' (store and DB_JOBS on), the same calls from an old page are refused — its saves could race the phones' — and the\n * new page reaches them only through lwServer (when a save needs something only Apps Script has). */\nconst LW_FNS_ = ['saveLot', 'saveJob', 'clearJob', 'markStart', 'markCancel', 'record', 'setQty', 'setFloat', 'moveToHold', 'disposeHold', 'switchType',\n  'cancelRecord', 'cancelRecords', 'movePallets', 'addRuntime', 'addBin', 'setNotified', 'saveBinLevels', 'tagPre', 'markTagPrinted', 'tagPreCancel'];\nlet LW_PASS_ = false;\nfunction lwServer(token, fn, args) {\n  if (LW_FNS_.indexOf(String(fn)) < 0) throw new Error('API: ไม่มีฟังก์ชัน ' + fn);\n  LW_PASS_ = true;\n  try { return GLOBAL__[fn].apply(null, [token].concat(args || [])); } finally { LW_PASS_ = false; }\n}\nif (typeof __LR === 'undefined') LW_FNS_.forEach(function (n) {   // not in the phone's copy (lr.js passes __LR)\n  const f = GLOBAL__[n]; if (typeof f !== 'function') return;\n  GLOBAL__[n] = function () {\n    if (!LW_PASS_ && dbOn_() && PropertiesService.getScriptProperties().getProperty('PK_LOCAL_W') === '1') {\n      throw new Error('มีแอปเวอร์ชันใหม่ — ปิดแอปแพคแล้วเปิดใหม่จาก Hub (หรือแตะ \"มีแอปเวอร์ชันใหม่\") แล้วบันทึกอีกครั้ง');\n    }\n    return f.apply(this, arguments);\n  };\n});\n// editor: phones save straight to Supabase (needs the store on and jobs in Supabase — pkCutover, pkJobsToStore first) / back to Apps Script\nfunction pkLocalWritesOn() {\n  const P = PropertiesService.getScriptProperties();\n  if (!dbOn_() || P.getProperty('DB_JOBS') !== '1') throw new Error('ต้อง pkCutover และ pkJobsToStore ก่อน');\n  P.setProperty('PK_LOCAL_W', '1');\n  try { CacheService.getScriptCache().put('live_v', Date.now().toString(36), 21600); } catch (e) { /* phones reload anyway */ }\n  return 'phones save to Supabase';\n}\nfunction pkLocalWritesOff() { PropertiesService.getScriptProperties().setProperty('PK_LOCAL_W', '0'); return 'saves through Apps Script'; }\n\n/* ---------- v92: แพคไม่ผ่าน Apps Script ---------- */\n// main-script calls queued by the phones (pkw_commit p_hooks) → Bluefalo Production_Lot, in order; UrlFetch used up → stop, retried next run\nfunction pkHookRun_() {\n  const items = dbCall_('pkh_take', { p_max: 40 }) || [];\n  if (!items.length) return 0;\n  const done = [], fail = [];\n  for (let i = 0; i < items.length; i++) {\n    try { hook_(items[i].body); done.push(items[i].id); }\n    catch (e) { fail.push({ id: items[i].id, err: String(e.message || e) }); if (/too many times|urlfetch/i.test(String(e.message))) break; }\n  }\n  dbCall_('pkh_done', { p_done: done, p_fail: fail });\n  return { done: done.length, failed: fail.length };\n}\n// tabs other apps write in the sheet → Supabase, only when the tab changed since the last run (hash kept in Script Properties)\nfunction pkRefSync_() {\n  const P = PropertiesService.getScriptProperties(), out = {};\n  DB.REF.forEach(function (tab) {\n    const sh = ss_().getSheetByName(tab); if (!sh) { out[tab] = 'no tab'; return; }\n    const v = sh.getDataRange().getValues(), h = v.shift().map(String), kc = DB.TABS[tab], ki = kc ? h.indexOf(kc) : -1, rows = [], seen = {};\n    v.forEach(function (r, i) {\n      if (r.every(function (x) { return x === '' || x == null; })) return;\n      let k = kc ? String(r[ki] == null ? '' : r[ki]) : 'S' + (i + 2);\n      if (!k || seen[k]) k = '#row' + (i + 2);\n      seen[k] = 1;\n      const d = {}; h.forEach(function (c, j) { const e = dbEnc_(r[j]); if (e !== null) d[c] = e; });\n      rows.push({ k: k, d: d });\n    });\n    const body = JSON.stringify([h, rows]);\n    const hx = Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, body, Utilities.Charset.UTF_8));\n    if (P.getProperty('REF_' + tab) === hx) { out[tab] = 'same'; return; }\n    const res = dbCall_('pkp_ref_put', { p_tab: tab, p_keycol: kc, p_headers: h, p_rows: rows });\n    if (!res || !res.skip) P.setProperty('REF_' + tab, hx);\n    dbBump_([tab]);\n    out[tab] = res;\n  });\n  return out;\n}\n// editor (and when the tag form changes): tag form PDF + font → Supabase pk_asset, so phones get them without Apps Script\nfunction pkAssetsToStore() {\n  const f = tagFormFile_(), font = DriveApp.getFileById(prop_('FONT_FILE_ID') || CFG.TAG.FONT_ID);\n  const ver = [f.getId(), f.getLastUpdated().getTime(), font.getId()].join('|');\n  const b64 = function (file) { return Utilities.base64Encode(file.getBlob().getBytes()); };\n  return dbCall_('pk_asset_put', { p_ver: ver, p_meta: { formName: f.getName(), qr: prop_('TAG_QR') !== 'off', url: CFG.TAG.APP_URL }, p_form: b64(f), p_font: b64(font) });\n}\n// editor, once before the standalone page: the PIN salt and the temp PINs → Supabase (kept where the API cannot read them)\nfunction pkSecretsToStore() {\n  return dbCall_('pk_secret_put', { p_salt: prop_('SALT', true), p_temp: tempPins_() });\n}\n\n// editor (v92, 14 Nov 2026): load the v92 tabs that are not in Supabase yet (packing was cut over before v92) — under the script lock\nfunction pkLoadMissingTabs() {\n  const l = LockService.getScriptLock(); l.waitLock(30000);\n  try {\n    const out = {};\n    ['FG_Detail', 'Packing_App_Users', 'Packing_Form_Export', 'Production_NCP_Map', 'RuntimeType'].forEach(function (t) { out[t] = pkLoadTab_(t); });\n    dbBump_();\n    try { CacheService.getScriptCache().removeAll(['pk_users', 'rtypes', 'lots', 'pk_st', 'pk_st_at']); } catch (e) { /* cache only */ }\n    console.log(JSON.stringify(out));\n    return out;\n  } finally { l.releaseLock(); }\n}\n";

async function sbRpc(fn, body) {

    commit: async (ticket, fn, reads, ops, comp, jobs) => {

      catch (e) { if (isNet(e)) throw new Error('LR_NET'); throw e; }

async function api(fn, ...a) {

        try { return await call(fn, S.session.token, ...a); }

      catch (e) {

        if (/^LR_BUSY/.test(m)) throw new Error(m.replace(/^LR_BUSY\s*—?\s*/, ''));
        if (!lrFallback(e)) throw e;   // the app's own message (same as Apps Script would give)
        LRS.err = fn + ': ' + m; console.warn('phone → Apps Script', LRS.err);
        if (w && !/^LR_OFF/.test(m)) return await call('lwServer', S.session.token, fn, a);

async function refresh() {
  if (!S.session) return showLogin();
  try {
    const d = await api('getState');
    S.data = d;
    S.session.offset = d.serverNow - Date.now();
    S.session.me = d.me;
    LS.set('pk-session', S.session);
    if (d.me.role === 'viewer') {
      if (VIEWER_VIEWS.indexOf(S.view) < 0) S.view = 'home';
      if (S.view === 'rep') rpOpen().catch(fail);
      if (S.view === 'dLots' && !D.lots) dLoadLots().catch(fail);
    } else if (d.me.role === 'sup' || d.me.role === 'admin') {
      if (['home', 'setup', 'recent', 'returns', 'ready', 'packing', 'tags', 'bins'].concat(DVIEWS,d.me.role === 'admin' ? ['users'] : []).indexOf(S.view) < 0) S.view = Object.keys(acts()).length ? landing() : 'home';
      if (!S.draft || !d.lots.some((l) => l.id === S.draft.fgLotId)) S.draft = d.lots[0] ? makeDraft(d.lots[0]) : null;
    } else if (['ready', 'packing', 'tags'].indexOf(S.view) < 0) S.view = landing();
    if (S.view === 'packing' && !act()) S.view = landing();
    if (S.view === 'home') homeOpen().catch(fail);
  } catch (e) {
    if (/AUTH/.test(String(e && e.message))) return;
    fail(e);
    if (!S.data) S.view = Object.keys(acts()).length ? landing() : 'offline';

}

function makeDraft(lot) {
  const j = S.data.jobs.find((x) => x.fgLotId === lot.id), bins = S.data.bins[lot.pack] || [];

    bins: j.bins || [j.bin], store: j.store, team: j.team, weight: j.weight || '', ptype: j.ptype || lot.ptDef || '' };

// Records waiting to reach the sheet survive reloads and dead zones; the server ignores ids it already has.
async function flush() {
  if (S.flushing || !S.session || !S.session.me) return;
  S.flushing = true;
  let sent = false;
  try {
    for (let q = LS.get('pk-queue', []); q.length; q = LS.get('pk-queue', [])) {
      const p = q[0];
      try {
        const r = await api('record', p);
        LS.set('pk-queue', LS.get('pk-queue', []).filter((x) => x.ids[0] !== p.ids[0]));
        S.queueErr = '';
        sent = true;
        const total = [].concat(p.bags).length === r.pallets.length ? [].concat(p.bags).reduce((s, b) => s + b, 0) : p.bags * r.pallets.length;
        toast(r.dup ? 'รายการนี้บันทึกไว้แล้ว' : 'บันทึก ' + (r.type || '') + ' พาเลท ' + r.pallets.join(' + ') + ' แล้ว · ' + total + ' ถุง');
        if ((r.preBad || []).length) toast('ป้ายล่วงหน้าไม่ตรง: ' + r.preBad.map((x) => '#' + x.no + ' ป้าย ' + x.was + ' ถุง → จริง ' + x.bags).join(' · ') + ' — แก้บนป้ายหรือพิมพ์ใหม่', true);
        if (!r.dup) recalcQ(S.session.token, r.ids, p.fgLotId).catch(() => {});
      } catch (e) {
        S.queueErr = /AUTH/.test(String(e && e.message)) ? '' : (isNet(e) ? 'ยังไม่มีสัญญาณ' : e.message);
        break;
      }
    }
  } finally { S.flushing = false; }
  if (sent) await refresh(); else if (S.view === 'ready') render();
}
