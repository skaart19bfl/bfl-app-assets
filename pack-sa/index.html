      + (dr.team ? '<button class="primary" data-act="saveJob">' + (f.pack ? 'บันทึกการแก้ไข · ' : '') + 'ส่งงานให้ทีม ' + esc(dr.team) + '</button>'
        : '<button class="primary" disabled style="opacity:.45;cursor:not-allowed">ยังไม่มีทีมแพค</button>') + '</div>';
  },

  // Every pallet / bigbag of the lot, grouped by type (FG · WIP · SEMI · Hold · Reject) as small tiles, newest first;
  // tap a tile for its time / team / note and actions (ลอยน้ำ · แก้ยอด · ย้ายเป็น Hold · ยกเลิก).
  recent: () => {
    const lot = S.data.lots.find((l) => l.id === S.flLot) || S.data.lots[0];
    if (!lot) return supTop('recent') + '<div class="pad col g14"><h1>บันทึกล่าสุด</h1><div class="card"><b>ไม่มี FG Lot ที่ Status = Packing</b></div></div>';
    const detail = (r) => {
      const v = S.flEdit[r.id] == null ? r.float : S.flEdit[r.id], changed = v !== r.float;
      return '<div class="col g8">'
        + '<span class="muted" style="font-size:13px">' + esc(r.start) + (r.stop ? '–' + esc(r.stop) : '') + ' · ทีม ' + esc(r.team || '-') + (r.note ? ' · ' + esc(r.note) : '') + '</span>'
        + (!lot.floatOn ? '' : '<div class="row g10"><span class="muted" style="font-size:14px;width:56px">ลอยน้ำ</span>'
          + '<button class="step sm" data-act="flAdj" data-arg="' + esc(r.id) + ',-1" aria-label="ลดลอยน้ำ พาเลท ' + r.no + '">' + minus + '</button>'
          + '<span class="big" style="font-size:24px;min-width:70px;text-align:center' + (changed ? ';color:var(--blue)' : '') + '">' + v + '%</span>'
          + '<button class="step sm" data-act="flAdj" data-arg="' + esc(r.id) + ',1" aria-label="เพิ่มลอยน้ำ พาเลท ' + r.no + '">' + plus + '</button>'
          + (changed ? '<button class="primary" style="width:auto;flex:1;min-height:44px;font-size:16px;background:var(--blue)" data-act="flSave" data-arg="' + esc(r.id) + '">บันทึก</button>' : '')
          + '</div>' + (changed ? '<span class="muted" style="font-size:12px">เดิม ' + r.float + '%</span>' : ''))
        + (['FG', 'WIP', 'SEMI', 'Hold'].indexOf(r.type) < 0 ? ''
          : S.qx === r.id ? (() => {
            const big = r.unit === 'Bigbag', w = r.bags ? r.kg / r.bags : 0;
            return '<label class="col g6"><b>แก้ยอด ' + TN(r.type) + ' #' + r.no + (big ? ' (kg ของ bigbag)' : ' (จำนวนถุง)') + '</b>'
              + '<input id="qx-v" type="number" inputmode="' + (big ? 'decimal' : 'numeric') + '" min="1" step="' + (big ? '0.1' : '1') + '" value="' + (big ? r.kg : r.bags) + '" style="font-size:22px;min-height:52px;border-radius:12px;border:1.5px solid var(--line2);padding:0 12px;font-family:inherit;background:#fff;color:var(--ink)"></label>'
              + '<span class="muted" style="font-size:13px">เดิม ' + esc(qty(r)) + (big ? '' : ' · kg = ถุง × ' + fmt(w) + ' kg/ถุง') + '</span>'
              + '<label class="col g6"><span style="font-size:14px">เหตุผล (ถ้ามี)</span><textarea id="qx-reason" rows="2" maxlength="200" placeholder="เช่น นับถุงใหม่ได้ 55"></textarea></label>'
              + '<p class="note">เก็บยอดเดิม + ชื่อผู้แก้ไว้ในหมายเหตุ · ถ้าพิมพ์ป้ายพาเลทแล้ว ให้พิมพ์ใหม่</p>'
              + '<div class="grid2"><button class="secondary" data-act="qxOpen" data-arg="">ไม่แก้</button><button class="primary" style="min-height:50px;background:var(--blue)" data-act="qxDo" data-arg="' + esc(r.id) + '">บันทึกยอด</button></div>';
          })()
          : '<button class="link" style="align-self:flex-start;color:var(--blue);font-weight:600" data-act="qxOpen" data-arg="' + esc(r.id) + '">แก้ยอด' + (r.unit === 'Bigbag' ? ' (kg)' : ' (จำนวนถุง)') + '</button>')
        + (['FG', 'WIP', 'SEMI'].indexOf(r.type) < 0 ? ''
          : S.mv === r.id ? '<label class="col g6"><b>ย้าย ' + TN(r.type) + ' #' + r.no + ' เป็น WIP เพราะ</b><textarea id="mv-reason" rows="2" maxlength="200" placeholder="เช่น เช็คความชื้นเกิน"></textarea></label>'
            + '<p class="note">ได้เลข WIP ใหม่ของวันผลิตนั้น · เลข ' + TN(r.type) + ' #' + r.no + ' จะว่างไว้</p>'
            + '<div class="grid2"><button class="secondary" data-act="mvOpen" data-arg="">ยกเลิก</button><button class="primary" style="min-height:50px;background:' + TYPES.Hold.bg + '" data-act="mvDo" data-arg="' + esc(r.id) + '">ยืนยัน → WIP</button></div>'
          : '<button class="link" style="align-self:flex-start;color:' + TYPES.Hold.bg + ';font-weight:600" data-act="mvOpen" data-arg="' + esc(r.id) + '">ย้ายเป็น WIP</button>')
        + (r.type !== 'Reject' ? '<button class="secondary" style="min-height:46px" data-act="tagGo" data-arg="' + esc(lot.id + ',' + r.id) + '">พิมพ์ป้ายพาเลท #' + r.no + '</button>' : '')
        + (S.cx === r.id ? '<label class="col g6"><b style="color:#B91C1C">ยกเลิก ' + TN(r.type) + ' #' + r.no + ' เพราะ</b><textarea id="cx-reason" rows="2" maxlength="200" placeholder="เช่น กดหยุดผิด / บันทึกซ้ำ"></textarea></label>'
            + '<p class="note">แถวยังอยู่ (Cancelled = TRUE) · ถ้าเป็นพาเลทล่าสุด เลข #' + r.no + ' กลับมาใช้ได้</p>'
            + '<div class="grid2"><button class="secondary" data-act="cxOpen" data-arg="">ไม่ยกเลิก</button><button class="primary" style="min-height:50px;background:#B91C1C" data-act="cxDo" data-arg="' + esc(r.id) + '">ยืนยันยกเลิก</button></div>'
          : '<button class="link" style="align-self:flex-start;color:#B91C1C" data-act="cxOpen" data-arg="' + esc(r.id) + '">ยกเลิกพาเลทนี้ (บันทึกผิด)</button>')
        + '</div>';
    };
    const tile = (r) => '<button class="ptile' + (S.rx === r.id ? ' on' : '') + '" data-act="rxOpen" data-arg="' + esc(r.id) + '" aria-pressed="' + (S.rx === r.id) + '">'
      + '<b class="mono">#' + r.no + '</b><span>' + (r.unit === 'Bigbag' ? fmt(r.kg) + ' kg' : r.bags + ' ถุง') + '</span>'
      + (r.type === 'Hold' || r.type === 'Reject' ? '<span>' + esc(r.start.slice(0, 5)) + '</span>' : '') // their numbers restart each production day
      + (lot.floatOn && r.float < 100 ? '<i class="pfl">' + r.float + '%</i>' : r.note ? '<i class="pnote" aria-label="มีหมายเหตุ"></i>' : '') + '</button>';
    const sel = lot.recent.find((r) => r.id === S.rx);
    const groups = ['FG', 'WIP', 'SEMI', 'Hold', 'Reject'].map((t) => {
      const list = lot.recent.filter((r) => r.type === t);
      if (!list.length) return '';
      const bags = list.reduce((a, r) => a + (r.unit === 'Bigbag' ? 0 : r.bags), 0), bb = list.filter((r) => r.unit === 'Bigbag').length, kg = list.reduce((a, r) => a + r.kg, 0);
      return '<section class="pgroup" style="--gc:' + TYPES[t].bg + '"><div class="pgh"><span class="badge" style="background:' + TYPES[t].bg + '">' + TN(t) + '</span>'
        + '<b>' + list.length + ' พาเลท</b><span class="muted" style="margin-left:auto;font-size:13px;text-align:right">' + (bags ? fmt(bags) + ' ถุง' : '') + (bags && bb ? ' + ' : '') + (bb ? bb + ' BB' : '') + ' · ' + fmt(kg) + ' kg</span></div>'
        + '<div class="pgrid">' + list.map(tile).join('') + '</div>'
        + (sel && sel.type === t ? '<div class="pdet"><b style="font-size:15px">#' + sel.no + ' ' + TN(t) + ' · ' + qty(sel) + '</b>' + detail(sel) + '</div>' : '') + '</section>';
    }).join('') || '<p class="muted card">ยังไม่มีพาเลทที่บันทึกของล็อตนี้</p>';
    return supTop('recent') + '<div class="pad col g10"><h1>บันทึกล่าสุด</h1><p class="note">ทุกพาเลทของล็อต แยกตามประเภท ล่าสุดอยู่ซ้ายบน · แตะพาเลทเพื่อดูเวลา / ทีม / หมายเหตุ และ' + (lot.floatOn ? 'แก้ % ลอยน้ำ / ' : '') + 'ย้ายเป็น WIP / ยกเลิก</p>'
      + '<section class="card"><h2>ล็อต</h2>' + lotCards(lot.id, 'flLot') + '</section>' + groups + '</div>';
  },

  // QC decided a Hold pallet: Return (back to process) or Reject (→ NCP). Default = what is left on that pallet.
  returns: () => {
    const hs = S.holds, f = S.hd;
    const body = !hs ? '<div class="spin">กำลังโหลด…</div>' : !hs.length ? '<div class="card"><b>ไม่มีพาเลท WIP ที่รอตัดสิน</b></div>' : hs.map((h) => {
      const open = f && f.holdId === h.id, big = h.unit === 'Bigbag';
      return '<div class="card" style="gap:8px"><div class="row g8"><span class="big" style="font-size:22px">#' + h.no + '</span><span class="badge" style="background:' + TYPES.Hold.bg + '">WIP</span>'
        + '<b class="mono">' + esc(h.lot) + '</b><span class="tag ' + mc(h.pack) + '" style="margin-left:auto">' + esc(h.pack) + '</span></div>'
        + '<span class="muted" style="font-size:13px">' + esc(h.name) + ' · วันผลิต ' + esc(h.day) + ' · ทีม ' + esc(h.team) + (h.note ? ' · ' + esc(h.note) : '') + '</span>'
        + '<b style="font-size:15px">เหลือ ' + qty(h) + '</b>'
        + (!open ? '<button class="secondary" style="border-color:var(--blue);color:var(--blue)" data-act="hdOpen" data-arg="' + esc(h.id) + ',FG">กลับเป็น ' + esc(h.from || (h.semi ? 'SEMI' : 'FG')) + ' (คัด / redry / ร่อนเสร็จ)</button>'
            + '<div class="grid2"><button class="secondary" style="border-color:var(--go);color:var(--go)" data-act="hdOpen" data-arg="' + esc(h.id) + ',Return">Return</button>'
            + '<button class="secondary" style="border-color:' + TYPES.Reject.bg + ';color:' + TYPES.Reject.bg + '" data-act="hdOpen" data-arg="' + esc(h.id) + ',Reject">Reject</button></div>'
            + '<button class="secondary" style="border-color:' + USE_C + ';color:' + USE_C + '" data-act="hdOpen" data-arg="' + esc(h.id) + ',Use">ใช้ในล็อตใหม่ (Old_Semi)</button>'
          : '<div class="col g8" style="border-top:1px solid var(--soft);padding-top:8px"><b>' + (f.to === 'FG' ? 'กลับเป็น ' + esc(h.from || (h.semi ? 'SEMI' : 'FG')) + ' ในล็อตเดิม' + (h.from ? ' (เลขพาเลทเดิม)' : ' (เลขพาเลทถัดไป)') : f.to === 'Use' ? 'ใช้ในล็อตใหม่' : f.to + (f.to === 'Reject' ? ' (ของเสีย → NCP)' : ' (คืนเข้ากระบวนการ)')) + '</b>'
            + (f.to === 'Use' ? useTargets(h, f) : '')
            + (big ? '<label class="col g6">น้ำหนัก (kg) · ทั้งใบ = ' + fmt(h.kg) + '<input type="tel" inputmode="decimal" data-in="hdKg" value="' + esc(f.kg) + '"></label>'
              : '<div class="row g10"><button class="step" data-act="hdBags" data-arg="-1" aria-label="ลดจำนวนถุง">' + minus + '</button><div class="col" style="flex:1;align-items:center"><span class="big" style="font-size:34px">' + f.bags + '</span><span class="muted">ถุง = ' + fmt(f.bags * h.w) + ' kg</span></div>'
                + '<button class="step" data-act="hdBags" data-arg="1" aria-label="เพิ่มจำนวนถุง">' + plus + '</button></div>')
            + '<textarea rows="2" maxlength="300" data-in="hdNote" placeholder="หมายเหตุ เช่น ผล QC / ส่ง redry">' + esc(f.note) + '</textarea>'
            + '<div class="grid2"><button class="secondary" data-act="hdOpen" data-arg="">ยกเลิก</button><button class="primary" style="min-height:50px;background:' + (f.to === 'Reject' ? TYPES.Reject.bg : f.to === 'FG' ? 'var(--blue)' : f.to === 'Use' ? USE_C : 'var(--go)') + '" data-act="hdSave">บันทึก ' + (f.to === 'FG' ? 'กลับเป็น FG' : f.to === 'Use' ? 'ใช้ในล็อตใหม่' : f.to) + '</button></div></div>')
        + '</div>';
    }).join('');
    return supTop('returns') + '<div class="pad col g10"><h1>ตัดสิน WIP</h1><p class="note">ตัดสินพาเลท WIP (สินค้าระหว่างกระบวนการ) แล้ว → กลับเป็น FG (คัด / redry / ร่อนเสร็จ) · Return (คืนเข้ากระบวนการ) · Reject (ของเสีย สร้าง NCP ให้เอง) · ใช้ในล็อตใหม่ (Return ที่ล็อตนี้ + บวก Old_Semi ของล็อตที่ใช้) · ค่าเริ่มต้น = ทั้งพาเลท แบ่งบางส่วนได้</p>' + '<div class="wgrid">' + body + '</div></div>';
  },

  users: () => {
    const form = (u) => '<div class="card"><label class="col g6">ชื่อ<input type="text" id="uf-name" maxlength="40" value="' + esc(u.name || '') + '"></label>'
      + '<label class="col g6">บทบาท<select id="uf-role">' + Object.keys(ROLE).map((r) => '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + ROLE[r] + '</option>').join('') + '</select></label>'
      + '<label class="col g6">PIN 4 หลัก' + (u.id ? ' (เว้นว่าง = ใช้ PIN เดิม)' : '') + '<input type="tel" id="uf-pin" inputmode="numeric" maxlength="4" autocomplete="off"></label>'
      + (u.id ? '<label class="row g8"><input type="checkbox" id="uf-active" style="width:22px;height:22px"' + (u.active ? ' checked' : '') + '> ใช้งานอยู่ (เอาติ๊กออก = ยกเลิก)</label>' : '')
      + '<div class="grid2"><button class="secondary" data-act="editUser" data-arg="">ยกเลิก</button><button class="primary" style="min-height:50px" data-act="saveUser" data-arg="' + esc(u.id || '') + '">บันทึก</button></div></div>';
    const list = S.data.users.map((u) => S.edit === u.id ? form(u)
      : '<div class="user' + (u.active ? '' : ' off') + '"><span class="col" style="flex:1"><b>' + esc(u.name) + '</b><span class="muted" style="font-size:13px">'
        + ROLE[u.role] + (u.active ? '' : ' · ยกเลิกแล้ว') + '</span></span><button class="chip" data-act="editUser" data-arg="' + esc(u.id) + '">แก้ไข</button></div>').join('');
    return supTop('users') + '<div class="pad col g10"><h1>จัดการผู้ใช้</h1><p class="note">ทีมแพค = กดเริ่ม/หยุด · Sup-Pack = ตั้งงาน + Return · Admin = ทุกอย่างของ Sup + จัดการผู้ใช้</p>' + (S.edit === 'new' ? form({ role: 'team', active: true }) : '<button class="primary" data-act="editUser" data-arg="new">+ เพิ่มผู้ใช้</button>') + '<div class="wgrid">' + list + '</div></div>';
  },

  ready: () => {
    const d = S.data, jobs = screenJobs(), q = LS.get('pk-queue', []), sup = isSup();
    const top = '<div class="bar"><span class="col" style="flex:1"><span class="dim" style="font-size:12px">' + (sup ? 'บันทึกแทนทีม' : 'ทีมแพค') + '</span><b style="font-size:19px">' + esc(d.me.name) + '</b></span>'
      + (sup ? '<button class="ghost" data-act="go" data-arg="setup">‹ หน้า Sup</button>' : '')
      + '<button class="ghost" data-act="tagGo" data-arg="' + esc((jobs[0] || {}).fgLotId || '') + '">ป้าย</button><button class="ghost" data-act="help">วิธีใช้</button><button class="ghost" data-act="retry">รีเฟรช</button>' + (sup ? '' : '<button class="ghost" data-act="logout">ออก</button>') + '</div>';
    const pend = q.length ? '<div class="warn col g6"><b>รอส่ง ' + q.length + ' รายการ</b><span>' + esc(S.queueErr || 'จะส่งเองเมื่อมีสัญญาณ') + '</span>'
      + '<button class="secondary" data-act="flush">ส่งอีกครั้ง</button></div>' : '';
    if (!jobs.length) return top + '<div class="pad col g14">' + pend + '<div class="card" style="align-items:center;text-align:center">'
      + '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
      + '<h1 style="font-size:22px">' + (sup ? 'ยังไม่มีงานที่เปิดอยู่' : 'ยังไม่มีงานสำหรับทีม ' + esc(d.me.name)) + '</h1>'
      + (d.jobs.length ? d.jobs.map((x) => '<p class="muted">' + esc(jl(x)) + ' ล็อต ' + esc(x.lot) + ' ตั้งให้ทีม <b style="color:var(--ink)">' + esc(x.team) + '</b></p>').join('') : '<p class="muted">Sup ยังไม่ได้ตั้งงาน</p>')
      + (sup ? '' : '<p class="muted">บันทึกในชื่อทีมอื่นไม่ได้ — ถ้าทีมคุณต้องแพค ให้ Sup ตั้งงานให้</p>') + '</div></div>';
    const recs = (j) => ((d.recent || {})[sl(j)] || []).map((r) => '<div class="rec"><span class="big" style="font-size:18px;width:48px">#' + esc(r.no) + '</span>'
      + '<span class="col" style="flex:1;min-width:0"><b style="font-size:15px">' + qty(r) + '</b><span class="muted" style="font-size:13px">'
      + esc(r.start) + (r.stop ? ' – ' + esc(r.stop) : '') + (r.note ? ' · ' + esc(r.note) : '') + '</span></span>'
      + (r.id && j.type !== 'Reject' ? '<button class="chip" style="min-height:44px" data-act="tagGo" data-arg="' + esc(j.fgLotId + ',' + r.id) + '">พิมพ์ป้าย</button>' : '<span style="font-size:13px;color:#0E4F2B">บันทึกแล้ว</span>') + '</div>').join('')
      || '<p class="muted card">ยังไม่มีพาเลทที่บันทึกของล็อตนี้</p>';
    const many = jobs.length > 1;
    const one = (j) => '<div class="card ' + mc(j.pack) + '" style="gap:6px"><div class="row g8"><span class="badge" style="background:' + TYPES[j.type].bg + '">' + TN(j.type) + '</span><b class="mono" style="font-size:18px">' + esc(j.lot) + '</b>'
      + '<span class="tag ' + mc(j.pack) + '" style="margin-left:auto">' + esc(jl(j)) + ' · ' + esc((j.bins || [j.bin]).join(' + ')) + '</span></div><span class="muted" style="font-size:14px">' + esc(j.name) + (sup ? ' · ทีม <b style="color:var(--ink)">' + esc(j.team) + '</b>' : '') + '</span>'
      + '<div class="grid3" style="border-top:1px solid var(--soft);padding-top:8px"><span class="col"><span class="muted" style="font-size:12px">พาเลทถัดไป</span><b class="big" style="font-size:22px">' + pals(j) + '</b></span>'
      + (j.unit === 'Bigbag' ? '<span class="col"><span class="muted" style="font-size:12px">หน่วย</span><b>Bigbag · ชั่งรายใบ</b></span>' : '<span class="col"><span class="muted" style="font-size:12px">ถุง/พาเลท</span><b>' + j.bags + ' · ' + fmt(j.bags * j.weight) + 'kg</b></span>')
      + '<span class="col"><span class="muted" style="font-size:12px">' + (j.ptype ? 'พาเลท' + esc(j.ptype) + ' · ' : '') + 'Sup</span><b>' + esc(j.supName) + '</b></span></div></div>'
      + (act(sl(j)) ? '<button class="go" style="min-height:' + (many ? 90 : 150) + 'px;background:var(--ink)" data-act="toPack" data-arg="' + esc(sl(j)) + '"><b style="font-size:24px;color:#FDBA74">● กำลังแพค ' + esc(jl(j)) + '</b><span>แตะเพื่อเปิดจอแพค</span></button>'
        : '<button class="go" style="min-height:' + (many ? 110 : 150) + 'px" data-act="start" data-arg="' + esc(sl(j)) + '"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></svg>'
          + '<b>เริ่มแพค' + (many ? ' ' + esc(jl(j)) : '') + '</b><span>แตะเมื่อเริ่มวางถุงลงพาเลท</span></button>')
      + '<h2 class="muted" style="font-size:14px;margin-top:4px">บันทึกล่าสุด · ' + esc(jl(j)) + ' (' + TN(j.type) + ')</h2>' + recs(j);
    return top + '<div class="pad col g10" style="padding-top:12px">' + pend
      + (sup ? '<p class="note">หัวหน้าทีมลา: Sup กดเริ่ม / หยุดแทนได้ · ชื่อทีมในบันทึก = ทีมในงาน · Comment บอกว่าใครบันทึกแทน</p>' : '')
      + jobs.map(one).join('<div style="height:10px"></div>') + '</div>';

  packing: () => {
    const a = act();
    if (!a) { S.view = S.data ? 'ready' : 'offline'; return VIEWS[S.view](); }
    const others = S.proxy && isSup() ? [] : Array.from(new Set(screenJobs().map(sl).concat(Object.keys(acts())))).filter((p) => p !== sl(a)).sort();
    const j = jobOf(sl(a)), live = j && j.fgLotId === a.fgLotId && (j.ver === a.ver || (j.okVers || []).indexOf(a.ver) >= 0) ? j : null;
    const v = Object.assign({}, a, live ? { type: live.type, pallet: live.pallet, unit: live.unit || 'Bag' } : {});
    return '<div class="dark pad col g14 ' + mc(a.pack) + '">'
      + (v.type !== a.type ? '<div class="warn col g6"><b>Sup เปลี่ยนเป็น ' + TN(v.type) + ' แล้ว</b><span>แพคต่อได้เลย กดหยุดตามปกติ — พาเลทนี้จะบันทึกเป็น ' + TN(v.type) + ' #' + pals(v) + '</span>'
        + (live.reason ? '<span>เหตุผล: ' + esc(live.reason) + '</span>' : '') + '</div>' : '')
      + '<div class="row g10"><span style="width:12px;height:12px;border-radius:50%;background:#F97316"></span><b style="color:#FDBA74;font-size:18px">' + (a.pausedAt ? 'พักรออาหาร' : 'กำลังแพค') + '</b>'
      + '<span class="badge" style="background:' + TYPES[v.type].bg + '">' + TN(v.type) + '</span><span class="mono dim" style="margin-left:auto">' + esc(a.lot) + '</span></div>'
      + '<div class="col" style="flex:1;align-items:center;justify-content:center;text-align:center;gap:4px">'
      + '<span class="dim">พาเลท</span><span class="big" style="font-size:' + (a.mode === 2 ? 64 : 104) + 'px;line-height:1">' + pals(v) + '</span>'
      + '<span class="dim" style="font-size:15px;margin-top:6px">' + esc(a.team) + ' <span class="tag ' + mc(a.pack) + '">' + esc(jl(a)) + '</span> ' + esc(binsOf(a).join(' → ')) + '</span>'
      + '<div style="display:grid;grid-template-columns:repeat(' + a.mode + ',minmax(0,1fr));gap:8px;width:100%;margin-top:12px">'
      + pal(a).map((x, i) => palCard(v, x, i)).join('') + '</div>'
      + binPick(a)
      + '<span class="dim" style="font-size:14px;margin-top:14px">เวลาแพค ไม่นับช่วงรออาหาร (เริ่ม ' + hm(a.startAt) + ')</span><span class="big" id="timer" role="timer" style="font-size:44px;font-weight:500">00:00</span>'
      + '<span id="wait" style="font-size:14px;color:#FDBA74"></span></div>'
      + (a.pausedAt ? '<button class="go" style="min-height:96px" data-act="pause" data-arg="0"><b style="font-size:26px">แพคต่อ</b><span>อาหารมาแล้ว แตะเพื่อเดินเวลาต่อ</span></button>'
        : '<button class="secondary" style="color:#fff;border-color:#36506F;min-height:56px" data-act="pause" data-arg="1">พักรออาหาร (พาเลทยังไม่เต็ม)</button>')
      + (S.noteOpen ? '<label for="note" class="dim" style="font-size:14px">หมายเหตุพาเลทนี้</label><textarea id="note" rows="2" maxlength="500" data-in="note" placeholder="เช่น ถุงขาด 1 ใบ เปลี่ยนแล้ว">' + esc(a.note) + '</textarea>'
        + '<button class="ghost" style="align-self:flex-end" data-act="noteOpen" data-arg="0">เสร็จ</button>'
        : '<button style="min-height:48px;border:2px dashed #36506F;border-radius:12px;background:transparent;color:#DCE5F0" data-act="noteOpen" data-arg="1">' + (a.note ? 'หมายเหตุ: ' + esc(a.note) : 'เพิ่มหมายเหตุ (ถ้ามี)') + '</button>')
      + '<button class="stopbtn" data-act="stop"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>'
      + '<b>หยุดแพค</b><span>พาเลทเต็มแล้ว แตะเพื่อบันทึก</span></button>'
      + (others.length ? '<div class="wrap">' + others.map((p) => '<button class="ghost" style="flex:1" data-act="toPack" data-arg="' + esc(p) + '">' + esc(slotName(p)) + (act(p) ? ' · <span style="color:#FDBA74">กำลังแพค</span>' : ' · เริ่มแพค') + ' ›</button>').join('') + '</div>' : '')
      + (isSup() ? '<p class="dim" style="font-size:13px;text-align:center">บันทึกแทนทีม ' + esc(a.team) + ' โดย ' + esc(S.data.me.name) + '</p>' : '')
      + '<div class="row" style="justify-content:space-between"><button class="link dim" data-act="cancel">' + (S.cancelArm ? 'แตะอีกครั้งเพื่อยืนยันยกเลิก (ไม่บันทึก)' : 'กดเริ่มผิด? ยกเลิกรอบนี้') + '</button>'
      + (isSup() ? '<button class="link dim" data-act="go" data-arg="setup">‹ หน้า Sup</button>' : '') + '<button class="link dim" data-act="help">วิธีใช้</button></div></div>';
  }
};

function render() {
  if (S.data && S.view !== 'loading') LS.set('pk-view', { v: S.view, lot: T.lot, t: Date.now() });
  $('app').innerHTML = (VIEWS[S.view] || VIEWS.loading)();
  // PC: list pages use the screen (cards flow into columns), forms stay readable, team screens stay phone-sized. Phones are narrower than all three.
  const wide = ['home', 'bins', 'rep', 'recent', 'tags', 'returns', 'users', 'data', 'dLots', 'dLot', 'dFgs'].indexOf(S.view) >= 0 || (S.view === 'setup' && !S.jobForm);
  document.documentElement.style.setProperty('--appw', wide ? '1200px' : DVIEWS.indexOf(S.view) >= 0 || S.view === 'setup' || S.view === 'dOld' ? '760px' : '480px');
  clearInterval(render.iv);
  if (S.view === 'packing') { tick(); render.iv = setInterval(tick, 1000); }
  if (S.view === 'rep') rpFit();
}
function tick() {
  const a = act(), el = $('timer');
  if (!a || !el) return;
  const p = (n) => String(n).padStart(2, '0');
  const f = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + p(Math.floor(s / 60) % 60) + ':' + p(s % 60); };
  const w = waitMs(a);
  el.textContent = f(now() - a.startAt - w);
  $('wait').textContent = w > 0 ? 'รออาหารรวม ' + f(w) + (a.pausedAt ? ' · เวลาแพคหยุดอยู่' : '') : '';
}

/* ---------------- actions ---------------- */

const ACT = {
  help() { S.prevView = S.view; S.helpTab = (S.data && S.data.me.role) || 'team'; S.view = 'help'; render(); window.scrollTo(0, 0); },
  helpTab(k) { S.helpTab = k; render(); window.scrollTo(0, 0); },
  helpPart(k) { S.helpPart = k; render(); window.scrollTo(0, 0); },
  helpClose() { S.view = S.prevView || 'login'; render(); },
  pickUser(id) { S.pick = S.users.find((u) => u.id === id); S.pin = ''; S.view = 'pin'; render(); },
  toLogin() { S.view = 'login'; S.pin = ''; render(); },
  async key(k) {
    S.pin = k === 'C' ? '' : k === '<' ? S.pin.slice(0, -1) : (S.pin + k).slice(0, 4);
    render();
    if (S.pin.length < 4) return;
    try {
      const r = await call('login', S.pick.id, S.pin);
      S.session = { token: r.token, me: r.me, offset: r.serverNow - Date.now() };
      LS.set('pk-session', S.session);
      if (r.mustChange) { S.pin = ''; S.np = ''; S.view = 'newpin'; render(); return; }
      S.view = 'loading'; render();
      await refresh();
      flush();
    } catch (e) { S.pin = ''; render(); throw e; }
  },
  logout() { logout(); },
  async nkey(k) {
    S.pin = k === 'C' ? '' : k === '<' ? S.pin.slice(0, -1) : (S.pin + k).slice(0, 4);
    render();
    if (S.pin.length < 4) return;
    if (!S.np) { S.np = S.pin; S.pin = ''; render(); return; }
    const p = S.pin;
    S.pin = '';
    if (p !== S.np) { S.np = ''; render(); throw new Error('รหัส 2 ครั้งไม่ตรงกัน — ตั้งใหม่'); }
    try { await api('changePin', p); } catch (e) { S.np = ''; render(); throw e; }
    S.np = '';
    toast('ตั้งรหัสใหม่แล้ว — ครั้งหน้าใช้รหัสนี้');
    S.view = 'loading'; render();
    await refresh();
    flush();
  },
  // รีเฟรช: on the home page also reload the day's numbers (reportData is kept between visits otherwise)
  retry() { return S.session ? refresh().then(flush).then(() => S.view === 'home' ? homeOpen(true).then(() => toast('อัปเดตภาพรวมแล้ว')) : null) : showLogin(); },
  go(v) {
    if (v === 'tags') return ACT.tagGo('');
    if (v === 'bins') return ACT.binOpen();
    S.view = v; S.edit = null; if (v === 'setup') S.jobForm = null;
    if (v === 'returns') { S.hd = null; api('holdList').then((h) => { S.holds = h; if (S.view === 'returns') render(); }).catch(fail); }
    if ((v === 'data' || v === 'dLots') && !D.lots) dLoadLots().catch(fail);
    if (v === 'rep') rpOpen().catch(fail);
    if (v === 'home') homeOpen().catch(fail);
    render();
    if (DVIEWS.indexOf(v) >= 0) window.scrollTo(0, 0);
  },
  lot(id) { S.draft = makeDraft(S.data.lots.find((l) => l.id === id)); render(); },
  jobNew() { const l = S.data.lots.find((x) => !S.data.jobs.some((j) => j.fgLotId === x.id) && S.data.jobs.filter((j) => j.pack === x.pack).length < 2); S.jobForm = { pack: '' }; S.draft = makeDraft(l); render(); window.scrollTo(0, 0); },
  jobEdit(pack) {
    const j = jobOf(pack), l = j && S.data.lots.find((x) => x.id === j.fgLotId);
    if (!l) throw new Error('ล็อตของงานนี้ไม่อยู่ในสถานะ Packing แล้ว — ปิดงานแล้วสร้างใหม่');
    S.jobForm = { pack: pack }; S.draft = makeDraft(l); render(); window.scrollTo(0, 0);
  },
  jobBack() { S.jobForm = null; render(); window.scrollTo(0, 0); },
  type(t) {
    const l = curLot(), was = semiIn(l, S.draft);
    Object.assign(S.draft, { type: t, store: TYPES[t].store, pallet: l.next[t], palletSet: false });
    if (UNIT_TYPES.indexOf(t) < 0) S.draft.unit = 'Bag';
    if (semiIn(l, S.draft) !== was) S.draft.bags = (semiIn(l, S.draft) ? l.semiBags : l.defBags || l.lastBags) || S.draft.bags; // FG ⇄ SEMI item
    S.draft.weight = t === 'SEMI' ? String(semiStd(l)) : '';
    render();
  },
  unit(u) { S.draft.unit = u; if (u === 'Bigbag') Object.assign(S.draft, { mode: 1, pallet: curLot().next[S.draft.type], palletSet: false }); render(); },
  // 1 bin normally; "ผสมถัง" = 2 bins (tap 2). Back to 1 keeps the first.
  mix(n) { S.draft.mix = n === '2'; if (!S.draft.mix) S.draft.bins = S.draft.bins.slice(0, 1); render(); },
  mode(m) { S.draft.mode = Number(m); render(); },
  semiKg(k) { S.draft.weight = String(k); render(); },
  pallet(dx) { S.draft.pallet = Math.max(1, S.draft.pallet + Number(dx)); S.draft.palletSet = true; render(); },
  bags(dx) { S.draft.bags = clamp(S.draft.bags + Number(dx), 1, 500); render(); },
  float(dx) { S.draft.float = clamp(S.draft.float + Number(dx), 0, 100); render(); },
  floatReset() { S.draft.float = 100; render(); },
  bin(v) {
    const d = S.draft, mix = d.mix || d.bins.length > 1;
    d.bins = !mix ? [v] : d.bins.indexOf(v) >= 0 ? (d.bins.length > 1 ? d.bins.filter((x) => x !== v) : d.bins) : d.bins.concat(v).slice(-2);
    render();
  },
  store(v) { S.draft.store = v; render(); },
  team(v) { S.draft.team = v; render(); },
  async saveJob() {
    if (S.draft.mix && S.draft.bins.length < 2) throw new Error('ผสมถัง: แตะเลือกให้ครบ 2 ถัง');
    const j = await api('saveJob', Object.assign({}, S.draft, { slot: (S.jobForm && S.jobForm.pack) || '', palletAuto: !S.draft.palletSet }));
    toast((S.jobForm && S.jobForm.pack ? 'แก้ไขงาน ' + jl(j) + ' แล้ว · ' : 'ส่งงาน ' + jl(j) + ' · ') + 'ล็อต ' + j.lot + ' (' + TN(j.type) + ') ให้ทีม ' + j.team + ' · เริ่มพาเลท #' + j.pallet + (j.palletMoved ? ' (เลขเดิมมีบันทึกแล้ว ข้ามให้)' : ''));
    if (j.ptype) LS.set('pk-ptype', Object.assign(LS.get('pk-ptype', {}), { [j.pack]: j.ptype })); // next new job on this machine starts with it
    S.jobForm = null; window.scrollTo(0, 0);
    await refresh();
  },
  async clearJob(slot) { await api('clearJob', slot); toast('ปิดงาน ' + slotName(slot) + ' แล้ว'); await refresh(); },
  // Hold / WIP ask Bag or Bigbag (+ reason for Hold); FG / SEMI switch straight away with the bag setup restored.
  async swOpen(arg) {
    const [pack, to] = String(arg || '').split(',');
    S.sw = pack ? { pack: pack, to: to } : null; S.swUnit = 'Bag'; S.swNote = '';
    if (S.sw && UNIT_TYPES.indexOf(to) < 0) return ACT.swDo(pack);
    render(); if ($('sw-reason')) $('sw-reason').focus();
  },
  swUnit(u) { if ($('sw-reason')) S.swNote = $('sw-reason').value; S.swUnit = u; render(); },
  async swDo(pack) {
    const to = S.sw.to, j = await api('switchType', pack, to, $('sw-reason') ? $('sw-reason').value : '', UNIT_TYPES.indexOf(to) >= 0 ? S.swUnit || 'Bag' : 'Bag');
    S.sw = null;
    toast(slotName(pack) + ' เป็น ' + TN(j.type) + ' แล้ว · ' + (j.unit === 'Bigbag' ? 'Bigbag' : j.bags + ' ถุง') + ' · พาเลทถัดไป #' + j.pallet);
    await refresh();
  },
  cxOpen(id) { S.cx = id || null; S.mv = null; S.qx = null; render(); if (S.cx) $('cx-reason').focus(); },
  qxOpen(id) { S.qx = id || null; S.mv = null; S.cx = null; render(); if (S.qx) $('qx-v').focus(); },
  async qxDo(id) {
    const lot = S.data.lots.find((l) => l.id === S.flLot) || S.data.lots[0];
    const r = await api('setQty', lot.id, id, $('qx-v').value, $('qx-reason').value);
    recalcQ(S.session.token, [id], lot.id).catch(() => {}); // FG_Lot totals follow
    S.qx = null; toast(r.label + ' ' + r.note + ' แล้ว');
    await refresh();
  },
  async cxDo(id) {
    const lot = S.data.lots.find((l) => l.id === S.flLot) || S.data.lots[0];
    const r = await api('cancelRecord', lot.id, id, $('cx-reason').value);
    recalcQ(S.session.token, [id], lot.id).catch(() => {}); // FG_Lot totals; a cancelled Reject also cancels its NCP
    S.cx = null; toast('ยกเลิก ' + r.label + ' แล้ว');
    await refresh();
  },
  mvOpen(id) { S.mv = id || null; S.cx = null; S.qx = null; render(); if (S.mv) $('mv-reason').focus(); },
  async mvDo(id) {
    const lot = S.data.lots.find((l) => l.id === S.flLot) || S.data.lots[0];
    const r = await api('moveToHold', lot.id, id, $('mv-reason').value);
    S.mv = null;
    recalcQ(S.session.token, [id], lot.id).catch(() => {});
    toast('ย้าย ' + r.from + ' → WIP #' + r.pallet + ' แล้ว');
    await refresh();
  },
  flLot(id) { S.flLot = id; S.flEdit = {}; S.rx = null; render(); },
  rxOpen(id) { S.rx = S.rx === id ? null : id; S.mv = null; S.cx = null; S.qx = null; render(); },
  flAdj(arg) {
    const [id, dx] = arg.split(','), lot = S.data.lots.find((l) => l.id === S.flLot) || S.data.lots[0], r = lot.recent.find((x) => x.id === id);
    S.flEdit[id] = clamp((S.flEdit[id] == null ? r.float : S.flEdit[id]) + Number(dx), 0, 100);
    render();
  },
  async flSave(id) {
    const lot = S.data.lots.find((l) => l.id === S.flLot) || S.data.lots[0], r = lot.recent.find((x) => x.id === id);
    const res = await api('setFloat', lot.id, id, S.flEdit[id]);
    r.float = res.float; delete S.flEdit[id];
    recalcQ(S.session.token, [id], lot.id).catch(() => {});
    toast('พาเลท #' + r.no + ' ลอยน้ำ ' + res.float + '% บันทึกแล้ว');
    render();
  },
  hdOpen(arg) {
    const [id, to] = (arg || '').split(','), h = id && S.holds.find((x) => x.id === id);
    S.hd = h ? { holdId: id, to: to, bags: h.bags, kg: h.unit === 'Bigbag' ? h.kg : '', note: '', id: rid() } : null;
    render();
  },
  hdTarget(id) { S.hd.target = id; render(); },
  hdBags(dx) { const h = S.holds.find((x) => x.id === S.hd.holdId); S.hd.bags = clamp(S.hd.bags + Number(dx), 1, h.bags); render(); },
  async hdSave() {
    const f = S.hd, h = S.holds.find((x) => x.id === f.holdId);
    if (f.to === 'Use') {
      if (!f.target) throw new Error('เลือกล็อตที่ใช้ก่อน');
      const u = await api('useOldSemi', { id: f.id, fgLotId: f.target, src: 'Hold', srcId: h.id, bags: f.bags, kg: f.kg, note: f.note });
      afterOld(u);
      toast('WIP #' + h.no + ' → ใช้ในล็อต ' + (u.lot || '') + ' · ' + fmt(u.kg || 0) + ' kg · Old_Semi รวม ' + fmt(u.oldSemi || 0) + ' kg');
      S.hd = null; S.holds = await api('holdList'); render();
      return;
    }
    const r = await api('disposeHold', { id: f.id, holdId: f.holdId, to: f.to, bags: f.bags, kg: f.kg, note: f.note });
    if (!r.dup) recalcQ(S.session.token, r.ids, h.fgLotId).catch(() => {}); // Reject → NCP happens here
    toast('WIP #' + h.no + ' → ' + TN(r.to) + (r.pallet ? ' #' + r.pallet : '') + ' · ' + fmt(r.kg) + ' kg บันทึกแล้ว');
    S.hd = null; S.holds = await api('holdList'); render();
    refresh().catch(() => {}); // next pallet numbers in ตั้งงาน
  },
  editUser(id) { S.edit = id || null; render(); },
  async saveUser(id) {
    const act = $('uf-active');
    S.data.users = await api('saveUser', { id: id, name: $('uf-name').value, role: $('uf-role').value, pin: $('uf-pin').value, active: act ? act.checked : true });
    S.edit = null;
    toast('บันทึกผู้ใช้แล้ว');
    render();
  },
  proxy(pack) { S.proxy = pack; S.cur = pack; S.view = act(pack) ? 'packing' : 'ready'; render(); window.scrollTo(0, 0); },
  toPack(pack) { S.cur = pack; S.noteOpen = false; S.cancelArm = false; S.view = act(pack) ? 'packing' : 'ready'; render(); window.scrollTo(0, 0); },
  async start(pack) {
    const j = jobOf(pack);
    if (!j) return;
    try { await api('markStart', sl(j), j.ver); }
    catch (e) { if (!isNet(e)) { refresh(); throw e; } } // no signal: start anyway, the stop is queued
    S.cur = sl(j);

async function dLoadLots() { D.lots = await api('dataLots'); if (['data', 'dLots'].indexOf(S.view) >= 0) render(); }
async function dOpenLot(id) {
  D.det = null; D.more = {}; D.shift = ''; S.view = 'dLot'; render(); window.scrollTo(0, 0);
  try { D.det = await api('lotDetail', id); } catch (e) { S.view = 'dLots'; render(); throw e; }
  if (S.view === 'dLot') render();
}
// Recalc after an Old_Semi change: the Hold's lot (its Return row), then the Production Lot that uses it.
const afterOld = (r) => {
  if (r.dup) return;
  const t = S.session.token;
  (r.ids.length ? recalcQ(t, r.ids, r.srcFgLotId) : Promise.resolve()).catch(() => {}).then(() => recalcQ(t, [rid()], r.pid, 'pl')).catch(() => {});
};
const dBack = async (msg) => { toast(msg); await dOpenLot(D.det.lot.id); };

  dMore(k) { D.more[k] = !D.more[k]; render(); },

  async dCxOpen() {

  async cxGo() {
    const c = D.cx;
    if (!c.ids.length) return;
    if (!String(c.why || '').trim()) throw new Error('ใส่เหตุผลที่ยกเลิก');
    if (!c.arm) { c.arm = true; render(); return; } // tap again to confirm
    c.arm = false;
    toast('กำลังยกเลิก…');
    const ids = c.ids.slice(), r = await api('cancelRecords', c.lot, ids, c.why);
    recalcQ(S.session.token, ids, c.lot).catch(() => {}); // FG_Lot totals; a cancelled Reject also cancels its NCP
    toast('ยกเลิก ' + r.labels.join(', ') + ' แล้ว');
    c.done = r; c.ids = []; c.why = ''; D.lots = null;
    c.data = await api('cancelList', c.lot); if (S.view === 'dCx') render();
  },
  async dMoveOpen() {
    D.mv = { from: D.det.lot.id, ids: [], to: '', dayMode: '', day: '', why: '', arm: false, data: null, done: null, req: null }; D.q.mv = '';
    S.view = 'dMove'; render(); window.scrollTo(0, 0);
    const [lots, data] = await Promise.all([D.lots ? Promise.resolve(D.lots) : api('dataLots'), api('moveList', D.mv.from)]);
    D.lots = lots; D.mv.data = data; if (S.view === 'dMove') render();
  },
  mvPick(id) { const s = D.mv.ids, i = s.indexOf(id); if (i >= 0) s.splice(i, 1); else s.push(id); D.mv.arm = false; render(); },
  mvAll() { const live = D.mv.data.pallets.filter((p) => !p.moved && !p.held).map((p) => p.id); D.mv.ids = D.mv.ids.length === live.length ? [] : live; D.mv.arm = false; render(); },
  mvTo(id) { D.mv.to = id || ''; D.mv.arm = false; D.q.mv = ''; render(); },
  mvDayMode(k) { D.mv.dayMode = k; if (k && !D.mv.day) D.mv.day = D.mv.data.today; D.mv.arm = false; render(); },
  async mvGo() {
    const m = D.mv;
    if (!m.ids.length || !m.to) return;
    if (!String(m.why || '').trim()) throw new Error('ใส่เหตุผล เช่น เลือก lot ผิด');
    if (m.dayMode && !m.day) throw new Error('เลือกวันแพค');
    if (!m.arm) { m.arm = true; render(); return; } // tap again to confirm
    m.arm = false;
    toast('กำลังย้าย…');
    const r = await api('movePallets', { from: m.from, to: m.to, ids: m.ids, day: m.dayMode ? m.day : '', reason: m.why });
    if (r.ids.length) { const t = S.session.token; recalcQ(t, r.srcIds, r.from).catch(() => {}).then(() => recalcQ(t, r.ids, r.to)).catch(() => {}); } // FG_Lot totals of both lots
    toast(r.dup ? 'พาเลทที่เลือกย้ายไปแล้ว' : 'ย้าย ' + r.moved.length + ' พาเลท → ล็อต ' + r.toLot + ' แล้ว');

const rpBase = () => (R.page === 'mon' ? 1123 : 794); // .rp-sheet widths

  const show = (z) => {

  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  sc.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { d0 = dist(e.touches); z0 = z = rpZ(); } }, { passive: true });

    if (kind === 'png') return new Promise((ok) => c.toBlob((b) => { rpSave(b, name + '.png'); ok(); }, 'image/png'));

    const [day, pk, slot] = key.split('|'), h = B.h.hist.find((x) => x.pack === pk && x.slot === slot);
    if (!h) return;
    if (B.edit) ACT.binEditCancel();
    B.edit = { pack: pk, day: day, slot: slot, prevEd: B.ed[pk], prevSlot: B.slot, prevDirty: binDirty(pk) };
    B.ed[pk] = B.d.bins[pk].map((b) => { const x = h.bins[b]; return x ? { lv: x.lv, fill: x.fill, id: x.id || '', dens: x.dens || '' } : { lv: 0, fill: false, id: '', dens: '' }; });
    B.slot = slot; B.open = ''; render(); window.scrollTo(0, 0);
  },
  binEditCancel() { const E = B.edit; if (!E) return; B.ed[E.pack] = E.prevEd; B.slot = E.prevSlot; B.edit = null; render(); },
  binRow(k) { B.open = B.open === k ? '' : k; render(); },
  async binDay(v) {
    const H = B.h, d = v === '0' ? H.today : typeof v === 'string' && v.length === 10 ? v : new Date(Date.parse(H.day + 'T00:00:00Z') + Number(v) * 864e5).toISOString().slice(0, 10);
    if (!d || d > H.today) return;
    B.h = { day: d, today: H.today, hist: [], loading: true }; B.open = ''; render();
    try { const r = await api('binLevels', d); B.h = { day: r.day, today: r.today, hist: r.hist }; } finally { B.h.loading = false; }
    if (S.view === 'bins') render();
  },
  binSlot(h) { B.slot = String(h); render(); },
  binLv(arg) { const [i, v] = arg.split(',').map(Number); B.ed[B.pack][i].lv = v; render(); },
  binFill(i) { const e = B.ed[B.pack][Number(i)]; e.fill = !e.fill; render(); },
  binFood(i, id) { const e = B.ed[B.pack][i]; e.id = id; e.dens = (id && B.d.dens[id]) || ''; render(); },
  async binPic() { if (binDirty(B.pack)) await ACT.binSave(); await binPic(); render(); const el = $('bin-pic'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  binPicClose() { B.pic = null; render(); },
  binDl() { rpSave(B.pic.blob, B.pic.name); },
  // share() must start inside the tap (no await before it), or the phone blocks it; no share sheet → save the file instead
  binShare() {
    const f = B.pic.file;
    if (navigator.canShare && navigator.canShare({ files: [f] })) return navigator.share({ files: [f] }).catch((e) => { if (e.name !== 'AbortError') { rpSave(B.pic.blob, B.pic.name); toast('แชร์ไม่ได้ — บันทึกรูปให้แล้ว ส่งรูปจากอัลบั้มใน LINE'); } });
    rpSave(B.pic.blob, B.pic.name); toast('เครื่องนี้แชร์ตรงไม่ได้ — บันทึกรูปให้แล้ว ส่งรูปจากอัลบั้มใน LINE');
  },
  async binSave() {
    const pk = B.pack, slot = B.slot, E = binEditing(pk) ? B.edit : null;
    const r = await api('saveBinLevels', { pack: pk, slot: slot, day: E ? E.day : '', bins: B.d.bins[pk].map((b, i) => { const e = B.ed[pk][i]; return { bin: b, lv: e.lv, fill: e.fill, id: e.id, dens: e.dens }; }) });
    B.d = r; B.h = { day: r.day, today: r.today, hist: r.hist }; B.open = '';
    if (E) { B.edit = null; B.slot = E.prevSlot; B.ed[pk] = E.prevDirty ? E.prevEd : r.bins[pk].map((b) => binDef(r, b)); } // back to the newest values (or the unsaved ones from before)
    toast((E ? 'แก้ไข ' : 'บันทึก ') + pk + ' รอบ ' + binHH(slot) + ' แล้ว · 6 ถัง');
    if (S.view === 'bins') render();
  }
});
</script>
</body>
</html>
