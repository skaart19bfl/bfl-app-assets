    const r = await api('millSave', { pid: M.info.pid, code: M.code, unit: M.unit, rows: rows, line: M.line, plate: M.plate, note: M.note, at: M.at });
    toast('บันทึกแล้ว ' + (M.unit === 'truck' ? '1 คันรถ' : r.n + ' BB') + ' · ' + num(r.kg) + ' kg → NCP System (PD-RW)');
    S.M = { unit: M.unit, rows: [''], line: M.line, list: M.list };
    millLoad();
  } catch (e) { M.busy = false; render(); }
};
ACT.millAskCancel = (b) => { millRead(); S.M.cx = b; S.M.why = ''; render(); };
ACT.millNoCancel = () => { millRead(); S.M.cx = ''; render(); };
ACT.millCancel = async () => {
  millRead(); const M = S.M;
  if ((M.why || '').trim().length < 3) return toast('ใส่เหตุผลอย่างน้อย 3 ตัวอักษร', true);
  try { await api('millCancel', M.cx, M.why.trim()); toast('ยกเลิกแล้ว — NCP System จะลบรายการใน PD-RW ให้'); M.cx = ''; millLoad(); } catch (e) {}
};
ACT.millReload = () => { millRead(); millLoad(); };
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'INPUT') return;
  const f = ACT[el.dataset.act];
  if (f) Promise.resolve(f(el.dataset.arg)).catch(() => {});
});
document.addEventListener('change', (e) => {
  if (e.target.dataset && e.target.dataset.act === 'writeAlong') ACT.writeAlong(e.target.checked).catch(() => {});
  if (e.target.id === 'exDate' && e.target.value) { S.E.cal = e.target.value; exLoad().catch(() => {}); }
  if (e.target.id === 'coDate' && e.target.value) { S.C.cal = e.target.value; coLoad().catch(() => {}); }
});
async function exLoad() {
  const E = S.E, key = shiftKey(E.cal, E.s);
  E.key = key; E.loading = true; E.rows = []; if (S.view === 'export') render();
  const r = await api('shiftRows', key);
  if (E.key !== key) return; // a newer pick won
  Object.assign(E, { rows: r.rows, by: r.by, loading: false }); if (S.view === 'export') render();
}
async function coLoad() {
  const C = S.C, key = C.cal + '|' + C.s;
  C.key = key; C.loading = true; if (S.view === 'coater') render();
  try { const r = await api('coaterView', key); if (C.key === key) C.data = r; }
  finally { if (C.key === key) { C.loading = false; if (S.view === 'coater') render(); } }
}
document.addEventListener('input', (e) => {
  if (e.target.id === 'rq') S.rq = e.target.value;
  if (!S.d) return;
  if (e.target.id === 'tot' || e.target.id === 'pa') {
    S.d[e.target.id === 'tot' ? 'total' : 'a'] = e.target.value.replace(/[^\d.]/g, '');
    const t = Number(S.d.total) || 0, a = Math.min(Number(S.d.a) || 0, t), pb = $('pb'); if (pb) pb.textContent = num(Math.max(t - a, 0));
  }
});

async function toLogin() {
  S.pin = ''; go('login');
  try { S.users = await call('listLogin'); render(); } catch (e) { toast(e && e.message === CSA.OFF ? CSA.OFF : 'โหลดรายชื่อไม่ได้ ลองใหม่', true); }
}
async function start() {
  const r = await api('boot');
  S.me = r.me; S.lots = r.lots; S.settings = r.settings;
  loadFont();
  go('home');
}
// BFL Hub (user 9 Nov 2026): ?hub=<one-time ticket> from the Hub → sign in as the account the Hub names. Opened directly → as before.
const hubTicket = () => { let t = ''; try { t = new URLSearchParams(location.search).get('hub') || ''; if (t) history.replaceState(null, '', location.pathname); } catch (e) { /* keep */ } return Promise.resolve(t); };
// Realtime (user 9 Nov 2026): ask every 5 s whether NCP / lots / Coater changed; reload the open screen only when it did.
// Only on list screens (home, lot, coater, export) — never in the middle of adding a bag, or while typing.
let liveV = '', liveBusy = false;
const liveTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && a.type !== 'checkbox' && a.type !== 'radio')); };
async function liveReload() {
  if (S.view === 'home') { S.lots = await api('getLots'); if (S.view === 'home') render(); }
  else if (S.view === 'lot' && S.L && S.L.pid) { const L = await api('lotDetail', S.L.pid); if (document.body.classList.contains('wide')) S.lots = await api('getLots'); if (S.view === 'lot' && S.L && S.L.pid === L.pid) { S.L = L; S.settings = L.settings; render(); } }
  else if (S.view === 'coater' && S.C && S.C.key) await coLoad();
  else if (S.view === 'export' && S.E && S.E.key) await exLoad();
}
setInterval(() => {
  if (!S.token || S.busy || document.hidden || liveBusy || liveTyping() || ['home', 'lot', 'coater', 'export'].indexOf(S.view) < 0) return;
  liveBusy = true;
  call('liveStamp', S.token).then((st) => {
    const changed = liveV && st !== liveV; liveV = st;
    if (changed && !S.busy && !liveTyping()) return liveReload();
  }).catch(() => {}).finally(() => { liveBusy = false; });
}, 5000);
(async function init() {
  const hub = await hubTicket();
  if (hub) {
    try {
      const r = await call('hubLogin', hub);
      S.token = r.token; S.me = r.me; try { localStorage.setItem('coat_token', r.token); } catch (e) {}
      if (r.mustChange) return go('newpin');
      await start(); return;
    } catch (e) { S.token = ''; try { localStorage.removeItem('coat_token'); } catch (x) {} toLogin(); // shared device: never fall back to the previous user
      toast('เข้าจาก Hub ไม่สำเร็จ: ' + String(e && e.message || e).replace(/^Error:\s*/, ''), true); return; }
  }
  try { S.token = localStorage.getItem('coat_token') || ''; } catch (e) {}
  if (S.token) { try { await start(); return; } catch (e) { S.token = ''; } }
  toLogin();
})();
</script>
<script>
/* ---------- V14: แท็บ "สัดส่วน" — NCP Dyer : Sieve แยกเบอร์อาหาร > lot + สาเหตุ Dyer / Comment ในเดือน (เฉพาะ sup/admin) ---------- */
const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const raMonthTh = (ym) => TH_MON[Number(ym.slice(5, 7)) - 1] + ' ' + (Number(ym.slice(0, 4)) + 543);
const raPct = (a, t) => (t ? Math.round(a / t * 1000) / 10 : 0);
const raTot = (o) => o.dyer + o.sieve;
// NCP (Dyer+Sieve) เทียบจำนวนสั่งผลิต (Qty_Plan เป็นตัน)
// นับเฉพาะ lot ที่มี Qty_Plan (o.pk = kg NCP ของ lot ที่มีแผน)
const raOfPlan = (o) => (o.plan ? ' · ' + raPct(o.pk != null ? o.pk : raTot(o), o.plan * 1000) + '% ของสั่งผลิต' : '');
function raBar(d, s, h) {
  const t = d + s, p = t ? d / t * 100 : 0, seg = 'display:flex;align-items:center;white-space:nowrap;overflow:hidden;';
  return '<div class="bar" style="height:' + (h || 24) + 'px;border-radius:8px;font-size:13px;font-weight:700;color:#fff">'
    + (d ? '<span style="' + seg + 'width:' + p + '%;background:var(--dyer);padding-left:6px">' + Math.round(p) + '%</span>' : '')
    + (s ? '<span style="' + seg + 'width:' + (100 - p) + '%;background:var(--sieve);justify-content:flex-end;padding-right:6px">' + Math.round(100 - p) + '%</span>' : '')
    + '</div>';
}
const raKg = (o) => '<div style="display:flex;justify-content:space-between;gap:6px;font-size:14px;padding-top:6px"><span>Dyer <b>' + num(o.dyer) + '</b></span><span>รวม <b>' + num(raTot(o)) + '</b> kg</span><span>Sieve <b>' + num(o.sieve) + '</b></span></div>';
function raLotRow(o) {
  const d1 = dmy(o.first - 8 * H), d2 = dmy(o.last - 8 * H);
  return '<div style="padding:10px 0 4px;border-top:1px solid var(--soft);margin-top:8px">'
    + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-size:17px;letter-spacing:1px">' + esc(o.lot) + '</b><span style="font-size:14px;color:var(--mute)">' + esc(o.ext) + ' · ' + d1 + (d2 !== d1 ? '–' + d2 : '') + '</span></div>'
    + '<div style="font-size:14px;color:var(--mute);padding-bottom:6px">สั่งผลิต <b style="color:var(--ink)">' + (o.plan ? num(o.plan) + ' ตัน' : '—') + '</b>' + raOfPlan(o) + '</div>'
    + raBar(o.dyer, o.sieve, 20) + raKg(o) + raWhy(o) + '</div>';
}
// สาเหตุ Dyer (เหตุการณ์ Extruder_Runtime ที่ผูกไว้) + Comment ของแถว NCP
function raWhy(o) {
  const line = (dot, html) => '<div style="display:flex;gap:8px;align-items:flex-start;font-size:14px;padding-top:6px"><span style="flex:none;width:10px;height:10px;border-radius:5px;margin-top:6px;background:' + dot + '"></span><span style="flex:1;min-width:0">' + html + '</span></div>';
  return (o.causes || []).map((c) => line('var(--dyer)', '<b>' + (c.at ? hm(c.at) + ' ' : '') + esc(c.process) + '</b>' + (c.reason ? ' — ' + esc(c.reason) : '') + ' <span style="color:var(--mute)">· Dyer ' + num(c.kg) + ' kg</span>')).join('')
    + (o.noCause ? line('var(--line2)', '<span style="color:var(--mute)">Dyer ไม่ระบุสาเหตุ ' + num(o.noCause) + ' kg</span>') : '')
    + (o.notes || []).map((n) => line(n.process === 'Dyer' ? 'var(--dyer-t)' : 'var(--sieve)', '<span style="color:var(--mute)">Comment ' + esc(n.process) + ':</span> ' + esc(n.text))).join('')
    + (o.sieve && !(o.notes || []).some((n) => n.process === 'Sieve') ? line('var(--line2)', '<span style="color:var(--mute)">Sieve ไม่มี Comment</span>') : '');
}
function raCauses(d) {
  const list = d.causes || [];
  if (!list.length) return '';
  const top = list[0].kg || 1;
  return '<div class="card" style="border:0"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>สาเหตุ NCP Dyer</b><span style="font-size:14px;color:var(--mute)">เรียงตาม kg</span></div>'
    + list.map((c) => '<div style="padding-top:8px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px"><span style="min-width:0">' + esc(c.process) + '</span><span style="flex:none"><b>' + num(c.kg) + '</b> kg · ' + raPct(c.kg, d.dyer) + '% · ' + c.lots + ' lot</span></div>'
      + '<div class="bar" style="height:8px;margin-top:3px"><span style="width:' + (c.kg / top * 100) + '%;background:' + (c.process === 'ไม่ระบุสาเหตุ' ? 'var(--line2)' : 'var(--dyer)') + '"></span></div></div>').join('')
    + '</div>';
}
V.ratio = () => {
  const R = S.R || {}, d = R.data && R.data.ym === R.ym ? R.data : null, open = R.open || {};
  const head = '<div style="display:flex;align-items:center;gap:10px">'
    + '<button class="st" data-act="raStep" data-arg="-1" aria-label="เดือนก่อน">‹</button>'
    + '<div style="flex:1;text-align:center;font-size:22px;font-weight:700">' + raMonthTh(R.ym || '2026-01') + '</div>'
    + '<button class="st" data-act="raStep" data-arg="1" aria-label="เดือนถัดไป">›</button></div>'
    + '<div style="font-size:14px;color:var(--mute);text-align:center">นับตามวันที่บันทึก NCP (วันผลิต 08:00–07:59) · Dyer ÷ (Dyer + Sieve)</div>';
  let body;
  if (R.loading) body = '<div class="spin">กำลังโหลด…</div>';
  else if (!d) body = '<div class="card">โหลดข้อมูลไม่ได้ กด "โหลดใหม่"</div>';
  else if (!d.lots.length) body = '<div class="card">เดือนนี้ไม่มี NCP Dyer / Sieve</div>';
  else {
    const t = d.dyer + d.sieve, by = {};
    d.lots.forEach((o) => {
      const g = by[o.productId] = by[o.productId] || { productId: o.productId, name: o.name, lots: [], dyer: 0, sieve: 0, plan: 0, pk: 0, first: o.first };
      g.lots.push(o); g.dyer += o.dyer; g.sieve += o.sieve; g.plan += o.plan || 0; if (o.plan) g.pk += raTot(o); g.first = Math.min(g.first, o.first);
    });
    const cmp = R.sort === 'pct' ? (a, b) => raPct(b.dyer, raTot(b)) - raPct(a.dyer, raTot(a)) || raTot(b) - raTot(a)
      : R.sort === 'kg' ? (a, b) => raTot(b) - raTot(a) : (a, b) => a.first - b.first;
    const groups = Object.keys(by).map((k) => by[k]).sort(cmp);
    const planAll = groups.reduce((s, g) => s + g.plan, 0), pkAll = groups.reduce((s, g) => s + g.pk, 0);
    body = '<div class="card" style="border:0"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>รวมทั้งเดือน</b><b style="font-size:24px">' + num(t) + ' kg</b></div>'
      + '<div style="font-size:14px;color:var(--mute);padding-bottom:8px">' + groups.length + ' เบอร์ · ' + d.lots.length + ' lot · สั่งผลิตรวม ' + num(planAll) + ' ตัน' + raOfPlan({ plan: planAll, pk: pkAll }) + '</div>'
      + raBar(d.dyer, d.sieve, 30)
      + '<div style="display:flex;justify-content:space-between;gap:8px;padding-top:8px;font-size:15px">'
      + '<span><span class="tag" style="background:var(--dyer-t)">Dyer</span> <b>' + num(d.dyer) + '</b> kg · <b>' + raPct(d.dyer, t) + '%</b></span>'
      + '<span><b>' + raPct(d.sieve, t) + '%</b> · <b>' + num(d.sieve) + '</b> kg <span class="tag" style="background:var(--sieve-t)">Sieve</span></span></div>'
      + d.lines.map((l) => '<div style="padding-top:10px;border-top:1px solid var(--soft);margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:15px;padding-bottom:4px"><b>' + esc(l.ext) + '</b><span>' + num(l.dyer + l.sieve) + ' kg</span></div>' + raBar(l.dyer, l.sieve, 20) + '</div>').join('')
      + '</div>'
      + raCauses(d)
      + '<div style="display:flex;gap:6px">' + [['date', 'ตามวัน'], ['pct', 'Dyer % สูงสุด'], ['kg', 'kg มากสุด']].map(([s, l]) => '<button class="chip' + ((R.sort || 'date') === s ? ' on' : '') + '" style="flex:1;min-height:44px;font-weight:600;padding:0 4px;font-size:15px" data-act="raSort" data-arg="' + s + '" aria-pressed="' + ((R.sort || 'date') === s) + '">' + l + '</button>').join('') + '</div>'
      + '<div style="font-size:14px;color:var(--mute)">แตะเบอร์อาหารเพื่อดูแต่ละ lot</div>'
      + groups.map((g) => {
        const on = !!open[g.productId];
        return '<div class="card" style="' + (on ? 'border-color:var(--ink)' : '') + '">'
          + '<div role="button" tabindex="0" aria-expanded="' + on + '" data-act="raOpen" data-arg="' + esc(g.productId) + '" style="cursor:pointer">'
          + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b style="font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(g.name) + '</b><span style="flex:none;font-size:14px;color:var(--mute)">' + g.lots.length + ' lot ' + (on ? '▲' : '▼') + '</span></div>'
          + '<div style="font-size:14px;color:var(--mute);padding-bottom:6px">' + esc(g.productId) + ' · สั่งผลิต <b style="color:var(--ink)">' + (g.plan ? num(g.plan) + ' ตัน' : '—') + '</b>' + raOfPlan(g) + '</div>'
          + raBar(g.dyer, g.sieve) + raKg(g) + '</div>'
          + (on ? g.lots.slice().sort((a, b) => a.first - b.first).map(raLotRow).join('') : '')
          + '</div>';
      }).join('');
  }
  return topBar('สัดส่วน Dyer : Sieve', esc(S.me.name)) + '<div class="pad">' + head + body
    + '<button class="link" data-act="raReload">โหลดใหม่</button></div>' + nav('ratio');
};
async function raLoad() {
  const R = S.R, ym = R.ym;
  R.loading = true; if (S.view === 'ratio') render();
  try { const r = await api('dyerSieve', ym); if (R.ym === ym) R.data = r; }
  finally { if (R.ym === ym) { R.loading = false; if (S.view === 'ratio') render(); } }
}
ACT.raStep = (n) => {
  const p = S.R.ym.split('-').map(Number), dt = new Date(Date.UTC(p[0], p[1] - 1 + Number(n), 1));
  S.R.ym = dt.toISOString().slice(0, 7); S.R.data = null; S.R.open = {};
  return raLoad();
};
ACT.raSort = (s) => { S.R.sort = s; render(); };
ACT.raOpen = (pid) => { const o = S.R.open = S.R.open || {}; o[pid] = !o[pid]; render(); };
ACT.raReload = () => raLoad();
const raNavOld = ACT.nav;
ACT.nav = function (v) {
  if (v === 'ratio' && !S.R) { S.R = { ym: bkk(Date.now() - 8 * H).slice(0, 7), sort: 'date', open: {} }; raLoad().catch(() => {}); }
  return raNavOld(v);
};
</script>
