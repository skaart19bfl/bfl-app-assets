<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2744">
<title>BFL Coating Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* BFL theme = Packing app (user 9 Nov 2026): grey-blue page, navy top bar, blue for actions / selected */
:root{--bg:#EEF2F7;--ink:#0F2744;--ink2:#1F3A5C;--mute:#566779;--line:#D5DEE8;--line2:#BCC9D7;--soft:#E2E9F1;--blue:#1E5BD8;--blue2:#E7EFFC;--ok:#157A43;--red:#C0392B;
  --ext:#34449C;--ext-t:#E3E6F6;--dyer:#C9661A;--dyer-t:#FCE6CF;--sieve:#0F7A6D;--sieve-t:#D5EEEA;--pack:#4E5D6E;--pack-t:#DFE5EC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--ink);color:#fff}
.top .sub{font-size:14px;color:#B6C3D1}
.top .t{font-size:20px;font-weight:700;line-height:26px}
.back{width:44px;height:44px;border-radius:22px;background:var(--ink2);border:0;display:flex;align-items:center;justify-content:center;flex:none}
.pill{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:9px;font-weight:700;font-size:17px}
.pad{padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
h1{font-size:26px;line-height:32px;margin:4px 0 0}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.lot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.line{display:inline-flex;align-items:center;justify-content:center;width:62px;height:34px;border-radius:9px;font-size:17px;font-weight:700;color:#fff;flex:none}
.grp{display:flex;align-items:center;gap:8px;font-weight:700;padding-top:6px}
.dot{width:12px;height:12px;border-radius:6px;display:inline-block}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:66px;border-radius:18px;border:0;background:var(--blue);color:#fff;font-size:23px;font-weight:700;text-decoration:none}
.big:disabled{background:#C0CAD5;color:var(--mute)}
.big.alt{background:#fff;border:2px solid var(--ink);color:var(--ink);font-size:20px;min-height:58px}
.foot{padding:12px 18px 22px;display:flex;flex-direction:column;gap:10px;position:sticky;bottom:0;background:var(--bg)}
.link{background:none;border:0;color:var(--blue);font-size:17px;padding:8px;text-decoration:underline}
.nav{display:flex;background:#fff;border-top:1px solid var(--line);position:sticky;bottom:0}
.nav button{flex:1;border:0;background:none;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--mute)}
.nav button.on{color:var(--blue)}
.steps{display:flex;gap:6px}
.steps div{flex:1;display:flex;flex-direction:column;gap:4px;font-size:14px;color:#697686}
.steps span{height:6px;border-radius:3px;background:#C0CAD5}
.steps .on{color:var(--blue);font-weight:700}.steps .on span,.steps .done span{background:var(--blue)}.steps .done{color:var(--blue)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:160px;border-radius:22px;background:#fff;border:2px solid var(--line);padding:8px}
.tile b{font-size:23px}.tile small{font-size:15px;color:var(--mute)}
.tile .ic{display:flex;width:62px;height:62px;border-radius:31px;align-items:center;justify-content:center}
.tile .n{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:15px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.kgbox{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;height:84px;border-radius:18px;background:#fff;border:3px solid var(--blue);padding:0 18px}
.kgbox b{font-size:52px;line-height:80px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:54px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:26px;font-weight:600}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line2);font-size:16px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ev{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line2)}
.ev.on{border:3px solid var(--dyer);background:var(--dyer-t)}
.ev small{color:var(--mute);font-size:14px}
input.f,select.f,textarea.f{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line2);padding:0 14px;background:#fff;font-size:17px}
textarea.f{padding:10px 14px;min-height:64px}
.st{width:56px;height:56px;border-radius:16px;background:#fff;border:1px solid var(--line2);font-size:30px;font-weight:600;flex:none}
.part{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:18px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#D5DCE4}
.bag{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.hole{width:14px;height:14px;border-radius:7px;border:3px solid var(--line);flex:none}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:8px;font-size:14px;font-weight:600}
.pinwho{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:14px;font-weight:500;padding:4px 0}
.av{width:60px;height:60px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#fff;border:2px solid var(--line)}
.who.on .av{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 0 4px #A9C4F5}
.dots{display:flex;gap:18px;justify-content:center}
.dots span{width:22px;height:22px;border-radius:11px;border:3px solid #8794A3}.dots span.on{background:var(--ink);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;max-width:92vw;z-index:50;text-align:center}
.toast.err{background:var(--red)}
.sheet{position:fixed;inset:0;background:rgba(30,43,58,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet>div{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:12px}
.spin{text-align:center;color:var(--mute);padding:40px 0}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input{width:52px;height:30px;accent-color:var(--ok)}
:focus-visible{outline:3px solid #F2A33A;outline-offset:2px}
.lot.on{border-color:var(--blue);background:var(--blue2)}
/* PC (user 9 Nov 2026): wide screens get 2 columns — Lot list left, the Lot / add NCP right. Phones unchanged. */
body.wide #app{max-width:none}
.wcols{display:grid;grid-template-columns:minmax(360px,420px) minmax(0,1fr);height:100vh;height:100dvh}
.wl,.wr{height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column}
.wl{border-right:1px solid var(--line);background:var(--bg)}
.wr .pad,.wr .foot{width:100%;max-width:880px;margin:0 auto}
.wr .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.wr .kgbox,.wr .keys{width:100%;max-width:460px;align-self:center}
.wempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute);font-size:18px;text-align:center;padding:40px}
.wfull{min-height:100vh;display:flex;flex-direction:column}
.wfull .pad{width:100%;max-width:1180px;margin:0 auto}
.wfull .nav,.wl .nav{justify-content:center}.wfull .nav button{flex:0 1 140px}
.cgrid{display:flex;flex-direction:column;gap:12px}
body.wide .cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (min-width:900px){.sheet{align-items:center}.sheet>div{max-width:600px;border-radius:22px}}
/* forms printed to PDF (TH Sarabun PSK when the font file is set, else Sarabun) */
.form{font-family:'TH Sarabun PSK','Sarabun',sans-serif;font-size:15px;color:#000}
.psk .form{font-size:20px}
.rj{width:560px;min-height:397px;background:#fff;color:#000;padding:16px 26px;display:flex;flex-direction:column;gap:.55em}
.rj .f{display:flex;align-items:baseline;gap:8px}
.rj .v{flex:1;border-bottom:1.5px dotted #000;padding:0 6px;font-size:1.13em;color:#000;min-height:1.4em}
.rj .cb{display:inline-flex;width:.75em;height:.75em;border:1.2px solid #000;margin-right:6px;align-items:center;justify-content:center;font-size:.8em;color:#000;font-weight:700}
</style>
</head>

<script>/*CS-SRC Code.gs v30*/const CS_SRC = "/**\n * BFL Coating Control — mobile web app (standalone Apps Script project).\n * The Coating team records NCP one Bigbag at a time into tab NCP of BFL Production-Dep:\n * one row per Process; a bag holding two processes = two rows sharing one NCP_No (COA-yyyyMMdd-nnnn).\n * Never deletes rows (cancel = Cancelled TRUE). Adds one tab: Coating_App_Users. Settings live in Script Properties.\n * PDFs (ป้าย Reject F-SP-QAS06-05, แบบรับเข้า Rework F-SP-PRD04-01) are drawn on the phone and saved to Drive.\n */\nconst CFG = {\n  SHEET_ID: '1jDn7AWFrLgwDXzPr5Lju8BU_PYgtMs_Z7BamDldSr3Q', // BFL Production-Dep\n  NCP: 'NCP', PLOT: 'Production_Lot', PRODUCT: 'Product_Detail', NCP_DETAIL: 'NCP_Detail', NCP_MAP: 'Production_NCP_Map',\n  RUNTIME: 'Extruder_Runtime', USERS: 'Coating_App_Users', COATER: 'Coater_Records',\n  COATER_GAP_MIN: 180, // a record longer than this after the previous one = the line stopped: its kg counts, its time is left out of kg/hr\n  USER_HEADERS: ['User_ID', 'Name', 'Role', 'PIN_Hash', 'Active', 'Updated_At', 'Updated_By'],\n  ROLES: ['coat', 'sup', 'admin'], // coat = record bags · sup = + edit any bag, export Rework form, settings · admin = + users\n  SEED_USERS: [['Admin', 'admin', '9999']],\n  START_PINS: ['0000', '1234', '9999'], // a PIN still equal to one of these must be changed at login\n  LOT_STATES: ['Extruder', 'Packing'], // Production_Lot.State shown in the app (user, 15 Oct 2026)\n  PROCESSES: ['Extruder', 'Dyer', 'Sieve', 'Packing'], // = NCP.Process values\n  CAUSE_PROCESS: 'Dyer', // only Dyer carries a cause (ExtruderRuntimeID) + comment\n  MAX_KG: 2000, // per row\n  TOKEN_HOURS: 14,\n  OUT_FOLDER: '15gngnzvTB-srdWRX95zzAQmR9C7-9Qmv', // PDFs go to sub-folders made on first save\n  REJECT_SUB: 'Reject_PDF', REWORK_SUB: 'Rework_PDF',\n  REJECT_KEEP_HOURS: 24, // Reject PDFs are trashed after a day (cleanupRejectPdf, daily trigger made by setup)\n  HOOK_URL: 'https://script.google.com/macros/s/AKfycbwVXGDr7xCs5fSCrot8Dm1Ictg5glYOEdurMgnxbLBkT3BsGaFhh98bVOJNt1OteMhQEA/exec',\n  NO_PREFIX: 'COA-', SOURCE: 'CoatingApp',\n  REJECT_FORM_ID: '1xwohw1AIAGT7qHn7y32Ea2_HljhF-lB2', // Form/F-SP-QAS06-05 R.03 ป้ายบ่งชี้การ Reject สินค้า.pdf\n  REWORK_FORM_ID: '1EInLYEMUpmblaQjTq-V4O_9ZEF6i_qJl', // Form/F-SP-PRD04-01 R.03 แบบบันทึกการรับเข้า Rework.pdf\n  FONT_ID: '10ZfUaoD3IDxDi0bVQ2sEZJR6lFhQRvg1', // Form/THSarabun.ttf\n  RUNTIME_LIST: 40,\n  REQUIRED: ['ID', 'Extruder_Number', 'Lot_Number', 'ProductID', 'DateTime', 'Process', 'Weight', 'CreateTimestamp', 'UpdatedTimestamp',\n    'State', 'Comment', 'LotProductKey', 'ProductionID', 'Cancelled', 'SourceModule', 'SourceRecordID', 'NCP_Detail_ID', 'Weight_Kg',\n    'Status', 'NCP_No', 'CreateMethod', 'Visible', 'ExtruderRuntimeID']\n};\nconst HOUR = 3600e3, TZ = 'Asia/Bangkok';\n\n/* ---------- pure helpers ---------- */\n\nfunction truthy_(v) { return v === true || /^(true|y|yes|1)$/i.test(String(v == null ? '' : v).trim()); }\nfunction toObjs_(h, values) { return values.map(function (v) { const o = {}; h.forEach(function (k, i) { o[k] = v[i]; }); return o; }); }\nfunction str_(v, max) { return String(v == null ? '' : v).trim().slice(0, max || 500); }\nfunction ms_(v) { return v instanceof Date ? v.getTime() : (v ? new Date(v).getTime() || 0 : 0); }\nfunction roleOk_(have, need) { return !need || have === need || have === 'admin' || (need === 'coat' && have === 'sup'); }\n// Production day starts 08:00 (UTC+7, no DST). Shift = 08–16 / 16–24 / 00–08 of that production day.\nfunction prodDateKey_(ms) { return new Date(ms + 7 * HOUR - 8 * HOUR).toISOString().slice(0, 10); }\nfunction shiftOf_(ms) {\n  const h = new Date(ms + 7 * HOUR).getUTCHours(), start = h >= 16 ? 16 : h >= 8 ? 8 : 0;\n  return prodDateKey_(ms) + '|' + start;\n}\nfunction shiftRange_(key) { // 'yyyy-MM-dd|8' → [from, to) ms\n  const p = String(key).split('|'), d = new Date(p[0] + 'T08:00:00+07:00').getTime(), s = Number(p[1]);\n  if (isNaN(d) || [0, 8, 16].indexOf(s) < 0) throw new Error('กะไม่ถูกต้อง');\n  const from = d + ((s === 0 ? 24 : s) - 8) * HOUR;\n  return [from, from + 8 * HOUR];\n}\nfunction live_(r) { return !truthy_(r.Cancelled) && String(r.State || '').toLowerCase() !== 'cancel'; }\nfunction bagKey_(r) { return str_(r.NCP_No) || 'ID:' + str_(r.ID); }\nfunction shortNcp_(id) { return String(id || '').replace(/000$/, ''); }\n// Rows of one lot → bags (one bag = rows sharing NCP_No; old rows without NCP_No = one bag each), numbered by time.\n// Rows of one lot → BBs (one BB = rows sharing NCP_No; old rows without NCP_No = one BB each), numbered by first time.\n// A BB can be filled over time (e.g. Dyer 08:44, then Sieve 11:31), so every part keeps its own time.\nfunction bags_(rows) {\n  const by = {}, list = [];\n  rows.forEach(function (r) {\n    const k = bagKey_(r), at = ms_(r.DateTime) || ms_(r.CreateTimestamp), cm = String(r.CreateMethod || '');\n    if (!by[k]) { by[k] = { key: k, parts: [] }; list.push(by[k]); }\n    by[k].parts.push({ rowId: str_(r.ID), process: str_(r.Process), kg: Number(r.Weight) || 0, at: at, created: ms_(r.CreateTimestamp) || at,\n      by: cm.indexOf(CFG.SOURCE + ':') === 0 ? cm.slice(CFG.SOURCE.length + 1) : '', app: String(r.SourceModule) === CFG.SOURCE,\n      runtimeId: str_(r.ExtruderRuntimeID), comment: str_(r.Comment), ncpId: str_(r.NCP_Detail_ID) });\n  });\n  list.forEach(function (b) {\n    b.parts.sort(function (x, y) { return x.at - y.at || x.created - y.created; });\n    b.at = b.parts[0].at; b.last = b.parts[b.parts.length - 1].at; b.by = b.parts[0].by;\n    b.total = b.parts.reduce(function (s, p) { return s + p.kg; }, 0);\n    b.comment = b.parts.map(function (p) { return p.comment; }).filter(String).join(' / ');\n    b.ncpId = (b.parts.find(function (p) { return p.ncpId; }) || {}).ncpId || '';\n  });\n  list.sort(function (a, b) { return a.at - b.at; });\n  list.forEach(function (b, i) { b.no = i + 1; });\n  return list;\n}\nfunction nextNo_(rows, now) {\n  const prefix = CFG.NO_PREFIX + Utilities.formatDate(now, TZ, 'yyyyMMdd') + '-';\n  const n = rows.reduce(function (m, r) { const s = String(r.NCP_No || ''); return s.indexOf(prefix) === 0 ? Math.max(m, Number(s.slice(prefix.length)) || 0) : m; }, 0);\n  return prefix + String(n + 1).padStart(4, '0');\n}\n// d.parts = [{process, kg}] — 1 or 2 different processes.\nfunction parts_(parts) {\n  if (!Array.isArray(parts) || parts.length < 1 || parts.length > 2) throw new Error('เลือกที่มา 1 หรือ 2 Process');\n  const seen = {};\n  return parts.map(function (p) {\n    const pr = String(p && p.process), kg = Number(p && p.kg);\n    if (CFG.PROCESSES.indexOf(pr) < 0) throw new Error('Process ไม่ถูกต้อง');\n    if (seen[pr]) throw new Error('เลือก Process ซ้ำ');\n    seen[pr] = true;\n    if (!(kg > 0 && kg <= CFG.MAX_KG)) throw new Error('น้ำหนัก ' + pr + ' ต้องมากกว่า 0 และไม่เกิน ' + CFG.MAX_KG + ' kg');\n    return { process: pr, kg: Math.round(kg * 10) / 10 };\n  });\n}\n\n/* ---------- sheet access ---------- */\n\nlet SS_;\nfunction ss_() { return SS_ || (SS_ = SpreadsheetApp.openById(CFG.SHEET_ID)); }\nfunction sheet_(name) { const sh = ss_().getSheetByName(name); if (!sh) throw new Error('ไม่พบแท็บ ' + name); return sh; }\nfunction table_(name) {\n  if (csOn_() && CS.TABS[name]) return csTable_(name);   // v30 (step E)\n  const v = tcValues_(name), h = v[0].map(String), rows = toObjs_(h, v.slice(1));\n  rows.forEach(function (r, i) { r._row = i + 2; });\n  return { get sh() { return sheet_(name); }, h: h, rows: rows };\n}\n\n/* ---------- read cache (user 13 Nov 2026 \"coating ยังโหลดช้า\" — same scheme as the Production App v47) ---------- */\n// LIVE tabs: a cached copy is used only while its stamp = the sheet's stamp now (row count : newest UpdatedTimestamp in the last\n// 400 rows # this app's write mark). AGE tabs (small masters) by age, users by USERS_TTL. Inside withLock_ (every write) and after\n// it in the same call everything is read from the sheet, as in v28.\nconst TC = { TTL: 300, LIVE_TTL: 900, USERS_TTL: 60, REFRESH_AGE: 150e3, FRESH_LS: 20e3, STAMP_EVERY: 4e3, POLL_MS: 2500, CH: 90000, P: 'ctc1_' };\nconst LIVE = { TABS: [CFG.NCP, CFG.PLOT, CFG.COATER, CFG.RUNTIME], PAGE: 3 };   // PAGE = how many go into the stamp the page sees (v28: 3)\nconst TC_AGE = [CFG.PRODUCT, CFG.NCP_DETAIL, CFG.NCP_MAP];\nlet NOCACHE_ = false, TC_ST_ = null, TC_DIRTY_ = {}, TC_MEMO_ = {};\nfunction tcLive_(n) { return LIVE.TABS.indexOf(n) >= 0; }\nfunction tcDel_(n) { try { CacheService.getScriptCache().remove(TC.P + n); } catch (e) { } }\n// values of a tab (header row first): this call's copy → cache (stamp / age) → sheet (then cached)\nfunction tcValues_(name) {\n  const cached = !NOCACHE_ && (tcLive_(name) || TC_AGE.indexOf(name) >= 0 || name === CFG.USERS);\n  if (!cached) return (name === CFG.USERS ? usersSheet_() : sheet_(name)).getDataRange().getValues();\n  if (TC_MEMO_[name]) return TC_MEMO_[name];\n  let v = tcGet_(name);\n  if (!v) {\n    const st = tcLive_(name) ? tcStamps_(false)[name] : '';   // taken before the read, so a copy made now is never newer than its stamp\n    v = (name === CFG.USERS ? usersSheet_() : sheet_(name)).getDataRange().getValues();\n    tcPut_(name, v, st);\n  }\n  return (TC_MEMO_[name] = v);\n}\nfunction tcGet_(n) {\n  try {\n    const st = tcLive_(n) ? tcStamps_(false)[n] : null;\n    const c = CacheService.getScriptCache(), head = c.get(TC.P + n); if (!head) return null;\n    const hp = head.split('|');   // pieces | id | stamp | saved at\n    if (st != null && hp[2] !== st) return null;   // the sheet changed since → read it\n    const k = Number(hp[0]), keys = []; for (let i = 0; i < k; i++) keys.push(TC.P + n + '_' + hp[1] + '_' + i);\n    const got = c.getAll(keys); let b = '';\n    for (let i = 0; i < k; i++) { if (got[keys[i]] == null) return null; b += got[keys[i]]; }\n    const txt = Utilities.ungzip(Utilities.newBlob(Utilities.base64Decode(b), 'application/x-gzip')).getDataAsString('UTF-8');\n    return JSON.parse(txt, function (key, v) { return v && typeof v === 'object' && v.$d != null && Object.keys(v).length === 1 ? new Date(v.$d) : v; });\n  } catch (e) { console.warn('cache read ' + n + ': ' + e); return null; }\n}\nfunction tcPut_(n, v, stamp) {\n  try {\n    const live = tcLive_(n);\n    const txt = JSON.stringify(v, function (key, x) { return this[key] instanceof Date ? { $d: this[key].getTime() } : x; });\n    const b = Utilities.base64Encode(Utilities.gzip(Utilities.newBlob(txt, 'application/json')).getBytes());\n    if (b.length > TC.CH * 40) return;   // > 3.6 MB: not worth it\n    const id = Date.now().toString(36), o = {}; let k = 0;\n    for (let i = 0; i < b.length; i += TC.CH) o[TC.P + n + '_' + id + '_' + (k++)] = b.slice(i, i + TC.CH);\n    const c = CacheService.getScriptCache(), ttl = live ? TC.LIVE_TTL : n === CFG.USERS ? TC.USERS_TTL : TC.TTL;\n    c.putAll(o, ttl + 30); c.put(TC.P + n, k + '|' + id + '|' + (live ? stamp : '') + '|' + Date.now(), ttl);\n  } catch (e) { console.warn('cache write ' + n + ': ' + e); }\n}\n// stamps of the LIVE tabs, once per call: from the last worked-out stamp (any phone) when newer than FRESH_LS, else now\nfunction tcStamps_(fresh) {\n  if (TC_ST_ && !fresh) return TC_ST_;\n  const c = CacheService.getScriptCache(), keys = LIVE.TABS.map(function (t) { return 'cls_' + t; });\n  if (!fresh && Date.now() - Number(c.get('cls_at') || 0) < TC.FRESH_LS) {\n    const g = c.getAll(keys);\n    if (keys.every(function (k) { return g[k] != null; })) return tcSetStamps_(keys.map(function (k) { return g[k]; }));\n  }\n  const ed = edMarks_(LIVE.TABS, ss_), put = {};\n  const v = LIVE.TABS.map(function (t, i) { const sh = ss_().getSheetByName(t); return (put['cls_' + t] = String(sh ? sh.getLastRow() : 0) + ':' + (ed[i] || '0')); });\n  put.cls_at = String(Date.now()); c.putAll(put, 21600);\n  return tcSetStamps_(v);\n}\nfunction tcSetStamps_(v) {\n  const wv = CacheService.getScriptCache().getAll(LIVE.TABS.map(function (t) { return 'cwv_' + t; })), o = { rows: v };\n  LIVE.TABS.forEach(function (t, i) { o[t] = v[i] + '#' + (wv['cwv_' + t] || '0'); });\n  return (TC_ST_ = o);\n}\n// end of withLock_: the sheet is committed, then the written tabs' copies stop matching (an edit that keeps the row count and\n// UpdatedTimestamp still counts) · users: dropped after any write (PIN / user changes happen inside the lock)\nfunction tcMarkWrites_() {\n  const tabs = Object.keys(TC_DIRTY_); TC_DIRTY_ = {}; TC_ST_ = null; TC_MEMO_ = {};\n  try {\n    SpreadsheetApp.flush();\n    const c = CacheService.getScriptCache(), o = {}, v = Date.now().toString(36);\n    tabs.forEach(function (t) { if (tcLive_(t)) o['cwv_' + t] = v; else c.remove(TC.P + t); });\n    if (Object.keys(o).length) c.putAll(o, 21600);\n    c.remove(TC.P + CFG.USERS);\n  } catch (e) { console.warn('cache mark: ' + e.message); }\n}\n// put changed / old tabs into the cache (one phone at a time; stops after `budget` ms, the rest next time)\nfunction tcRefresh_(budget) {\n  // one refresher at a time: the user lock (web app runs as the owner → shared by every phone; separate from the write lock)\n  const t0 = Date.now(), c = CacheService.getScriptCache(), l = LockService.getUserLock(), out = [];\n  if (!l.tryLock(0)) return 'busy';\n  try {\n    const st = tcStamps_(false), tabs = LIVE.TABS.concat(TC_AGE), heads = c.getAll(tabs.map(function (t) { return TC.P + t; })), now = Date.now();\n    const need = tabs.map(function (t) {\n      const h = heads[TC.P + t], p = (h || '').split('|'), live = tcLive_(t);\n      return { t: t, pri: !h || (live && p[2] !== st[t]) ? 2 : now - Number(p[3] || 0) > TC.REFRESH_AGE ? 1 : 0 };\n    }).filter(function (x) { return x.pri; }).sort(function (a, b) { return b.pri - a.pri; });\n    for (let i = 0; i < need.length; i++) {\n      if (Date.now() - t0 > budget) { out.push('+' + (need.length - i)); break; }\n      const t = need[i].t, sh = ss_().getSheetByName(t); if (!sh) continue;\n      tcPut_(t, sh.getDataRange().getValues(), tcLive_(t) ? st[t] : '');\n      out.push(t);\n    }\n  } finally { l.releaseLock(); }\n  return out.join(',');\n}\nfunction appendRows_(sh, h, objs) {\n  if (sh.cs) return csAppend_(sh.cs, objs);   // v30\n  const out = objs.map(function (o) { return h.map(function (c) { return c in o ? o[c] : ''; }); }), at = sh.getLastRow() + 1;\n  sh.getRange(at, 1, out.length, h.length).setValues(out); TC_DIRTY_[sh.getName()] = 1;\n  if (sh.getName() === CFG.NCP) for (let i = 0; i < out.length; i++) NCP_TOUCHED_.push(at + i);   // → Supabase when the lock ends\n}\nfunction setCells_(t, r, vals) {\n  if (t.cs) return csSet_(t, r, vals);   // v30\n  Object.keys(vals).forEach(function (k) { const c = t.h.indexOf(k) + 1; if (c) t.sh.getRange(r._row, c).setValue(vals[k]); });\n  TC_DIRTY_[t.sh.getName()] = 1;\n  if (t.sh.getName() === CFG.NCP) NCP_TOUCHED_.push(r._row);\n}\nfunction withLock_(fn) {\n  const l = LockService.getScriptLock(); l.waitLock(20000);\n  NOCACHE_ = true; TC_MEMO_ = {};   // writes (and the rest of this call) read the sheet, as in v28\n  CS_T_ = {}; CS_OPS_ = [];   // v30: Supabase rows read again inside the lock\n  try { const out = fn(); csFlush_(); ncpFlush_(); return out; } finally { NCP_TOUCHED_ = []; CS_OPS_ = []; tcMarkWrites_(); l.releaseLock(); try { CacheService.getScriptCache().put('live_v', Date.now().toString(36), 21600); } catch (e) { } } // a write here → other phones reload (liveStamp)\n}\n// Realtime (user 9 Nov 2026): every phone asks every 5 s. Reads only sheet sizes + the write mark above (no rows) — cheap.\n// AppSheet แก้แถวเดิม (user 10 Nov 2026): จำนวนแถวไม่เปลี่ยน แต่ UpdatedTimestamp เปลี่ยน → ค่าใหม่สุดของ UpdatedTimestamp ใน TAIL แถวท้าย\n// ของแต่ละแท็บเป็นส่วนหนึ่งของ stamp · คำนวณครั้งเดียวต่อ EVERY วิ ใช้ร่วมทุกเครื่อง (CacheService) ไม่อ่านซ้ำทุกคน\nconst EDMARK = { TAIL: 400, EVERY: 5, COLS: ['UpdatedTimestamp', 'Updated_At', 'UpdatedAt'] };\nfunction edMarks_(tabs, ssFn) {\n  const c = CacheService.getScriptCache(), key = 'edm_' + tabs.join(',').length + '_' + tabs.length, hit = c.get(key);\n  if (hit) return hit.split('.');\n  const out = tabs.map(function (t) {\n    try {\n      const sh = ssFn().getSheetByName(t); if (!sh) return '0';\n      const last = sh.getLastRow(); if (last < 2) return '0';\n      let col = Number(c.get('edc_' + t) || 0);\n      if (!col) {\n        const h = sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(function (x) { return String(x).trim(); });\n        col = -1; EDMARK.COLS.some(function (k) { const i = h.indexOf(k); if (i >= 0) { col = i + 1; return true; } return false; });\n        c.put('edc_' + t, String(col), 21600);\n      }\n      if (col < 1) return '0';\n      const n = Math.min(EDMARK.TAIL, last - 1); let m = 0;\n      sh.getRange(last - n + 1, col, n, 1).getValues().forEach(function (r) { const d = r[0] instanceof Date ? r[0].getTime() : 0; if (d > m) m = d; });\n      return m.toString(36);\n    } catch (e) { return '0'; }\n  });\n  c.put(key, out.join('.'), EDMARK.EVERY);\n  return out;\n}\nfunction liveStamp(token) {\n  session_(token);\n  // v29: worked out at most once per STAMP_EVERY for all phones (row counts + edit marks of the LIVE tabs), then one phone at a time\n  // refreshes the cached copies that changed or got old. Same value to the page as v28 (NCP, Production_Lot, Coater_Records).\n  const c = CacheService.getScriptCache(), fresh = Date.now() - Number(c.get('cls_at') || 0) >= TC.STAMP_EVERY, st = tcStamps_(fresh);\n  try { tcRefresh_(TC.POLL_MS); } catch (e) { console.warn('cache refresh: ' + e.message); }\n  return st.rows.slice(0, LIVE.PAGE).join('.') + '|' + (c.get('live_v') || '');\n}\n\n/* ---------- users & sessions (same scheme as the Packing app) ---------- */\n\nfunction prop_(k, make) {\n  const p = PropertiesService.getScriptProperties();\n  let v = p.getProperty(k);\n  if (!v && make) { v = Utilities.getUuid() + Utilities.getUuid(); p.setProperty(k, v); }\n  return v;\n}\nlet SALT_;\nfunction hash_(id, pin) {\n  SALT_ = SALT_ || prop_('SALT', true);\n  return Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, SALT_ + '|' + id + '|' + pin, Utilities.Charset.UTF_8));\n}\nfunction pinOk_(u, pin) { return String(u.PIN_Hash).replace(/^!/, '') === hash_(u.id, String(pin)); }\nfunction mustChange_(u) { return String(u.PIN_Hash).charAt(0) === '!' || CFG.START_PINS.some(function (p) { return pinOk_(u, p); }); }\nfunction sign_(s) { return Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(s, prop_('SECRET', true))); }\nfunction usersSheet_() {\n  let sh = ss_().getSheetByName(CFG.USERS);\n  if (!sh) { sh = ss_().insertSheet(CFG.USERS, ss_().getNumSheets()); sh.appendRow(CFG.USER_HEADERS); }\n  return sh;\n}\nfunction users_() {\n  const all = tcValues_(CFG.USERS), h = all[0].map(String), v = all.slice(1);\n  return toObjs_(h, v).map(function (u, i) { u.row = i + 2; u.id = String(u.User_ID); u.active = truthy_(u.Active); return u; });\n}\nfunction publicUsers_() { return users_().map(function (u) { return { id: u.id, name: String(u.Name), role: u.Role, active: u.active }; }); }\nfunction addUser_(sh, name, role, pin, by) {\n  const id = 'C' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);\n  sh.appendRow([id, name, role, '!' + hash_(id, pin), true, new Date(), by]);\n}\nfunction session_(token, role, pinChange) {\n  const p = String(token || '').split('|');\n  if (p.length !== 3 || p[2] !== sign_(p[0] + '|' + p[1]) || Date.now() > Number(p[1])) throw new Error('AUTH');\n  const u = users_().find(function (x) { return x.id === p[0] && x.active; });\n  if (!u) throw new Error('AUTH');\n  if (!roleOk_(u.Role, role)) throw new Error('สิทธิ์ไม่พอสำหรับรายการนี้');\n  if (!pinChange && mustChange_(u)) throw new Error('PIN_CHANGE');\n  return u;\n}\n\n/* ---------- entry & setup ---------- */\n\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('Index').setTitle('BFL Coating Control')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1, viewport-fit=cover')\n    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL); // BFL Hub shows this app inside its page (user 9 Nov 2026)\n}\n\n/* ---------- BFL Hub single login (user 9 Nov 2026) ----------\n * The Hub opens this app with ?hub=<one-time ticket>. Supabase (bfl-production · hub_redeem) accepts the ticket once and names the\n * Coating_App_Users account this Hub user is mapped to; we then issue our normal token. PIN login here works exactly as before. */\nconst HUB = { URL: 'https://kdytxuufvigwjccebrki.supabase.co/rest/v1/rpc/hub_redeem', KEY: 'sb_publishable_IYCMIaN7tJleWINprA42CQ_dX10sXFF', APP: 'coat' };\nfunction hubRedeem_(ticket) {\n  const t = String(ticket || ''); if (!/^[0-9a-f]{48}$/.test(t)) throw new Error('ลิงก์จาก Hub ไม่ถูกต้อง — เปิดจาก Hub ใหม่');\n  const res = UrlFetchApp.fetch(HUB.URL, { method: 'post', contentType: 'application/json', headers: { apikey: HUB.KEY, Authorization: 'Bearer ' + HUB.KEY },\n    payload: JSON.stringify({ p_ticket: t, p_app: HUB.APP }), muteHttpExceptions: true });\n  const r = res.getResponseCode() === 200 ? JSON.parse(res.getContentText()) : null;\n  if (!r || !r.ok) throw new Error('Hub ยืนยันตัวตนไม่ได้ — กลับไปที่ Hub แล้วเปิดใหม่');\n  return r;\n}\nfunction hubLogin(ticket) {\n  const r = hubRedeem_(ticket);\n  const u = users_().find(function (x) { return x.id === String(r.account) && x.active; });\n  if (!u) throw new Error('บัญชีที่ Hub ผูกไว้ไม่มีหรือปิดใช้งานในแอปนี้ — แจ้ง Admin');\n  const exp = Math.min(Number(r.exp) || 0, Date.now() + CFG.TOKEN_HOURS * HOUR);\n  if (!(exp > Date.now())) throw new Error('เซสชัน Hub หมดอายุ — login ที่ Hub ใหม่');\n  const s = u.id + '|' + exp;\n  return { token: s + '|' + sign_(s), me: { id: u.id, name: String(u.Name), role: u.Role }, mustChange: mustChange_(u) };\n}\n\n/* ---------- v30 — step E (user 14 Nov 2026 \"E2,e3\"): NCP + Production_Lot kept in Supabase ----------\n * With the Production App, Extruder Log, packing and prod-calc (claude/Step_E_Production_Lot_NCP_plan.md). Switch = Script Property\n * E_NCP_DB ('1' = Supabase), set by coatCutoverNcp at step E4 after the Supabase SQL step. Off = v29. Rows are read whole once per call\n * (fresh inside withLock_) and every change of the call goes in ONE pkp_put just before the lock is let go (all or nothing). */\nconst CS = { URL: 'https://kdytxuufvigwjccebrki.supabase.co/rest/v1/rpc/', KEY: 'sb_publishable_IYCMIaN7tJleWINprA42CQ_dX10sXFF', SOURCE: 'coating',\n  FN: 'https://kdytxuufvigwjccebrki.supabase.co/functions/v1/prod-calc', TABS: { NCP: 'ID', Production_Lot: 'ProductionID' } };\nlet CS_ON_ = null, CS_T_ = {}, CS_OPS_ = [];\nfunction csOn_() { if (CS_ON_ == null) CS_ON_ = PropertiesService.getScriptProperties().getProperty('E_NCP_DB') === '1'; return CS_ON_; }\nfunction csCall_(fn, body) {\n  const key = PropertiesService.getScriptProperties().getProperty('CS_KEY');\n  if (!key) throw new Error('ฐานข้อมูล: ยังไม่ได้ตั้ง CS_KEY (รัน coatStoreSetup)');\n  const r = UrlFetchApp.fetch(CS.URL + fn, { method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n    headers: { apikey: CS.KEY, Authorization: 'Bearer ' + CS.KEY }, payload: JSON.stringify(Object.assign({ p_source: CS.SOURCE, p_key: key }, body)) });\n  const code = r.getResponseCode(), txt = r.getContentText();\n  if (code >= 300) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch (e) { /* text */ } throw new Error('ฐานข้อมูล: ' + String(m).slice(0, 300)); }\n  return txt ? JSON.parse(txt) : null;\n}\nfunction csEnc_(v) {\n  if (v === '' || v == null) return null;\n  if (v instanceof Date) return isNaN(v.getTime()) ? null : { $d: v.getTime() };\n  if (typeof v === 'number') return isFinite(v) ? v : null;\n  if (typeof v === 'boolean') return v;\n  return String(v);\n}\nfunction csDec_(v) { return v == null ? '' : typeof v === 'object' && v.$d != null ? new Date(v.$d) : v; }\n// a tab as table_ gives it, from Supabase (rows in Supabase order; _row = position, never a sheet row)\nfunction csTable_(name) {\n  if (CS_T_[name]) return CS_T_[name];\n  const res = csCall_('pkp_get', { p_tab: name, p_col: null, p_vals: null, p_tail: null }), h = res.h.map(String);\n  const rows = res.rows.map(function (d, i) { const o = {}; h.forEach(function (c) { o[c] = csDec_(d[c]); }); o._row = i + 2; o._k = String(d._k); return o; });\n  const sh = { cs: name, getName: function () { return name; } };\n  return (CS_T_[name] = { cs: name, sh: sh, h: h, rows: rows });\n}\nfunction csAppend_(name, objs) {\n  const t = CS_T_[name], kc = CS.TABS[name];\n  objs.forEach(function (o) {\n    const k = String(o[kc] == null ? '' : o[kc]).trim();\n    if (!k) throw new Error('ฐานข้อมูล: แถวใหม่ไม่มีรหัส (' + kc + ')');\n    const d = {}; Object.keys(o).forEach(function (c) { if (t.h.indexOf(c) < 0) return; const e = csEnc_(o[c]); if (e !== null) d[c] = e; });\n    CS_OPS_.push({ tab: name, op: 'ins', rows: [{ k: k, d: d }] });\n    const r = {}; t.h.forEach(function (c) { r[c] = c in o ? o[c] : ''; }); r._row = t.rows.length + 2; r._k = k; t.rows.push(r);\n  });\n}\nfunction csSet_(t, r, vals) {\n  const set = {};\n  Object.keys(vals).forEach(function (c) { if (t.h.indexOf(c) < 0) return; set[c] = csEnc_(vals[c]); r[c] = vals[c]; });\n  if (Object.keys(set).length) CS_OPS_.push({ tab: t.cs, op: 'upd', rows: [{ k: r._k, set: set }] });\n}\nfunction csFlush_() {\n  if (!CS_OPS_.length) return 0;\n  const ops = CS_OPS_; CS_OPS_ = [];\n  csCall_('pkp_put', { p_ops: ops });\n  CS_T_ = {};\n  return ops.length;\n}\n// the Lot KPI by prod-calc (the main script's own code in Supabase) — same answer as before for the page (a response code)\nfunction csKpi_(body) {\n  try {\n    const r = UrlFetchApp.fetch(CS.FN, { method: 'post', contentType: 'application/json', muteHttpExceptions: true, headers: { apikey: CS.KEY },\n      payload: JSON.stringify({ mode: 'run', source: CS.SOURCE, srckey: PropertiesService.getScriptProperties().getProperty('CS_KEY'), jobs: [body], apply: true }) });\n    let j = {}; try { j = JSON.parse(r.getContentText()); } catch (e) { /* text */ }\n    if (r.getResponseCode() !== 200 || !j.e || !j.e.saved) { console.warn('prod-calc KPI ' + body.productionID + ': ' + r.getContentText().slice(0, 300)); return 500; }\n    return 200;\n  } catch (e) { console.warn('prod-calc KPI: ' + e); return 0; }\n}\n// editor, once: this app's own Supabase key (kept in Script Properties, registered hashed — never shown)\nfunction coatStoreSetup() {\n  const p = PropertiesService.getScriptProperties();\n  if (p.getProperty('CS_KEY')) return 'CS_KEY already set';\n  const key = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');\n  const r = UrlFetchApp.fetch(CS.URL + 'pk_register', { method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n    headers: { apikey: CS.KEY, Authorization: 'Bearer ' + CS.KEY }, payload: JSON.stringify({ p_source: CS.SOURCE, p_key: key }) });\n  if (r.getResponseCode() >= 300) throw new Error('pk_register: ' + r.getContentText().slice(0, 300));\n  p.setProperty('CS_KEY', key);\n  return 'CS_KEY set';\n}\n// step E4 (after the Supabase SQL step gives 'coating' NCP + Production_Lot): read check, then the switch\nfunction coatCutoverNcp() {\n  const n = csCall_('pkp_get', { p_tab: 'NCP', p_col: '_none_', p_vals: [] }).h.length, m = csCall_('pkp_get', { p_tab: 'Production_Lot', p_col: '_none_', p_vals: [] }).h.length;\n  const p = PropertiesService.getScriptProperties(); p.setProperty('E_NCP_DB', '1'); CS_ON_ = null;\n  try { CacheService.getScriptCache().put('live_v', Date.now().toString(36), 21600); } catch (e) { /* phones reload anyway */ }\n  const out = { NCP: n + ' cols', Production_Lot: m + ' cols', store: 'Supabase' }; console.log(JSON.stringify(out)); return out;\n}\nfunction coatRollbackNcp() {\n  PropertiesService.getScriptProperties().setProperty('E_NCP_DB', '0'); CS_ON_ = null;\n  try { CacheService.getScriptCache().put('live_v', Date.now().toString(36), 21600); } catch (e) { /* phones reload anyway */ }\n  return 'sheet (สิ่งที่บันทึกใน Supabase ระหว่างเปิด ลงชีตโดยงานสำเนาของแอปอื่น — ตรวจ pkp_out ค้าง 0 ก่อน)';\n}\n\n/* ---------- NCP → Supabase (user 9 Nov 2026) ----------\n * Every NCP row this app writes in the Sheet goes to Supabase (bfl-production · table ncp, same sheet row number) at the same moment,\n * so NCP System and the Raw material system see it at once. Supabase is what the apps read; the Sheet stays the copy AppSheet and the\n * reports use. A failed send never stops the user: the hourly Sheet → Supabase sync brings the row anyway.\n * The key is made here on the first send, kept in Script Properties (NCP_PUSH_KEY) and registered once in Supabase (stored hashed). */\nconst NCP_SB = { URL: 'https://kdytxuufvigwjccebrki.supabase.co/rest/v1/rpc/', KEY: HUB.KEY, SOURCE: 'coating' };\nlet NCP_TOUCHED_ = [];\nfunction sbRpc_(fn, body) {\n  const res = UrlFetchApp.fetch(NCP_SB.URL + fn, { method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n    headers: { apikey: NCP_SB.KEY, Authorization: 'Bearer ' + NCP_SB.KEY }, payload: JSON.stringify(body) });\n  const txt = res.getContentText();\n  if (res.getResponseCode() !== 200) throw new Error(txt.slice(0, 300));\n  return JSON.parse(txt);\n}\nfunction ncpKey_() {\n  const p = PropertiesService.getScriptProperties(); let k = p.getProperty('NCP_PUSH_KEY');\n  if (k || p.getProperty('NCP_PUSH_OFF')) return k || '';\n  k = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '');\n  try { sbRpc_('ncp_push_register', { p_source: NCP_SB.SOURCE, p_key: k }); p.setProperty('NCP_PUSH_KEY', k); return k; }\n  catch (e) { if (/NCP_KEY_EXISTS/.test(e.message)) p.setProperty('NCP_PUSH_OFF', 'key already registered — ask the Supabase admin to reset ' + NCP_SB.SOURCE); console.warn('NCP key: ' + e.message); return ''; }\n}\nfunction ncpFlush_() {\n  const rows = NCP_TOUCHED_.filter(function (r, i, a) { return r > 1 && a.indexOf(r) === i; }); NCP_TOUCHED_ = [];\n  if (!rows.length) return 0;\n  try {\n    const key = ncpKey_(); if (!key) return 0;\n    SpreadsheetApp.flush();\n    const sh = sheet_(CFG.NCP), w = sh.getLastColumn(), h = sh.getRange(1, 1, 1, w).getValues()[0].map(String);\n    const out = rows.map(function (r) {\n      const v = sh.getRange(r, 1, 1, w).getValues()[0], o = { _row: r };\n      h.forEach(function (k, i) { if (k) o[k] = v[i] instanceof Date ? v[i].toISOString() : v[i]; });\n      return o;\n    });\n    return sbRpc_('ncp_push', { p_source: NCP_SB.SOURCE, p_key: key, p_rows: out }).rows;\n  } catch (e) { console.warn('NCP → Supabase (coating): ' + e.message); return 0; }\n}\n\n// Run once from the editor: users tab + Admin (PIN 9999, must change), daily Reject-PDF cleanup, NCP header check.\nfunction setup() {\n  const sh = usersSheet_(), have = users_().map(function (u) { return String(u.Name); });\n  CFG.SEED_USERS.forEach(function (s) { if (have.indexOf(s[0]) < 0) addUser_(sh, s[0], s[1], s[2], 'setup'); });\n  if (!ScriptApp.getProjectTriggers().some(function (t) { return t.getHandlerFunction() === 'cleanupRejectPdf'; })) {\n    ScriptApp.newTrigger('cleanupRejectPdf').timeBased().everyDays(1).atHour(3).create();\n  }\n  const h = table_(CFG.NCP).h, missing = CFG.REQUIRED.filter(function (c) { return h.indexOf(c) < 0; });\n  Logger.log(missing.length ? 'NCP ขาดคอลัมน์: ' + missing.join(', ') : 'NCP มีครบทุกคอลัมน์');\n}\n\n/* ---------- login ---------- */\n\nfunction listLogin() { return publicUsers_().filter(function (u) { return u.active; }); }\n\nfunction login(id, pin) {\n  const cache = CacheService.getScriptCache(), k = 'fail_' + id, fails = Number(cache.get(k) || 0);\n  if (fails >= 5) throw new Error('ใส่รหัสผิดหลายครั้ง รอ 5 นาทีแล้วลองใหม่');\n  const u = users_().find(function (x) { return x.id === String(id) && x.active; });\n  if (!u || !pinOk_(u, pin)) { cache.put(k, String(fails + 1), 300); throw new Error('รหัสไม่ถูกต้อง'); }\n  cache.remove(k);\n  const s = u.id + '|' + (Date.now() + CFG.TOKEN_HOURS * HOUR);\n  return { token: s + '|' + sign_(s), me: { id: u.id, name: String(u.Name), role: u.Role }, mustChange: mustChange_(u) };\n}\n\nfunction changePin(token, pin) {\n  const me = session_(token, null, true), p = String(pin || '');\n  if (!/^\\d{4}$/.test(p)) throw new Error('รหัสต้องเป็นตัวเลข 4 ตัว');\n  if (CFG.START_PINS.indexOf(p) >= 0) throw new Error('ห้ามใช้ ' + CFG.START_PINS.join(' / ') + ' ตั้งรหัสอื่น');\n  if (pinOk_(me, p)) throw new Error('ใช้รหัสเดิมไม่ได้ ตั้งรหัสใหม่');\n  return withLock_(function () { usersSheet_().getRange(me.row, 4, 1, 4).setValues([[hash_(me.id, p), true, new Date(), String(me.Name)]]); return true; });\n}\n\n/* ---------- lots ---------- */\n\nfunction names_() {\n  const m = {};\n  table_(CFG.PRODUCT).rows.forEach(function (r) { m[str_(r.ProductID)] = str_(r.ProductName).replace(/\\s*-[A-Z0-9.&\\s]*-?\\s*COA\\s*$/i, '').replace(/\\s*-\\s*COA\\s*$/i, ''); });\n  return m;\n}\nfunction plRows_() {\n  return table_(CFG.PLOT).rows.filter(function (r) {\n    return CFG.LOT_STATES.indexOf(str_(r.State)) >= 0 && !truthy_(r.Cancelled) && str_(r.ProductID).toUpperCase() !== 'TEST';\n  });\n}\nfunction lots_() {\n  const pls = plRows_(), names = names_(), sum = {};\n  bagsByLot_().forEach(function (bs, pid) { sum[pid] = { bags: bs.length, kg: bs.reduce(function (s, b) { return s + b.total; }, 0) }; });\n  return pls.map(function (r) {\n    const pid = str_(r.ProductionID), s = sum[pid] || { bags: 0, kg: 0 };\n    return { pid: pid, lot: str_(r.Lot_Number), productId: str_(r.ProductID), name: names[str_(r.ProductID)] || str_(r.ProductID),\n      ext: str_(r.Extruder_Number), state: str_(r.State), bags: s.bags, kg: s.kg };\n  }).sort(function (a, b) { return CFG.LOT_STATES.indexOf(a.state) - CFG.LOT_STATES.indexOf(b.state) || (a.lot < b.lot ? 1 : -1); });\n}\nfunction bagsByLot_(ncpRows) {\n  const by = new Map();\n  (ncpRows || table_(CFG.NCP).rows).forEach(function (r) {\n    if (!live_(r) || str_(r.SourceModule) === MILL.SRC) return;   // แถว NCP Milling ไม่ใช่ BB ของหน้านี้ (ดูที่หน้า Milling)\n    const pid = str_(r.ProductionID);\n    if (!by.has(pid)) by.set(pid, []);\n    by.get(pid).push(r);\n  });\n  by.forEach(function (rows, pid) {\n    const bs = bags_(rows), first = {};\n    rows.forEach(function (r) { const k = bagKey_(r); if (!first[k]) first[k] = { Lot_Number: str_(r.Lot_Number), Extruder_Number: str_(r.Extruder_Number), ProductID: str_(r.ProductID) }; });\n    bs.forEach(function (b) { b.r0 = first[b.key]; });\n    by.set(pid, bs);\n  });\n  return by;\n}\nfunction settings_() { return { writeAlong: prop_('WRITE_ALONG') !== 'off' }; }\n\nfunction boot(token) {\n  const me = session_(token);\n  return { me: { id: me.id, name: String(me.Name), role: me.Role }, lots: lots_(), settings: settings_(), now: Date.now() };\n}\nfunction getLots(token) { session_(token); return lots_(); }\n\nfunction ncpCode_(productId) {\n  const detail = {};\n  table_(CFG.NCP_DETAIL).rows.forEach(function (r) { detail[str_(r.NCP_ID)] = r; });\n  const m = table_(CFG.NCP_MAP).rows.filter(function (r) { return str_(r.ProductID) === productId && truthy_(r.Active) && detail[str_(r.NCP_ID)]; })\n    .sort(function (a, b) { return (truthy_(b.Default_Flag) - truthy_(a.Default_Flag)) || (Number(a.Priority || 9999) - Number(b.Priority || 9999)); })[0];\n  return { detail: detail, id: m ? str_(m.NCP_ID) : '' };\n}\n// all = every runtime event of the lot (Sup / Admin choosing a cause for an old BB, and checking a chosen cause)\nfunction events_(pid, all) {\n  const list = table_(CFG.RUNTIME).rows.filter(function (r) { return str_(r.ProductionID) === pid && !truthy_(r.Cancelled) && ms_(r.DateTime); })\n    .sort(function (a, b) { return ms_(b.DateTime) - ms_(a.DateTime); });\n  return (all ? list : list.slice(0, CFG.RUNTIME_LIST))\n    .map(function (r) { return { id: str_(r.ID), at: ms_(r.DateTime), process: str_(r.Process), reason: str_(r.Reason, 120) }; });\n}\nfunction plRow_(pid) {\n  const r = table_(CFG.PLOT).rows.find(function (x) { return str_(x.ProductionID) === String(pid) && !truthy_(x.Cancelled); });\n  if (!r) throw new Error('ไม่พบล็อตนี้');\n  return r;\n}\n// A part (row) can be changed by Sup/Admin, or by the worker who recorded it during the same shift. AppSheet rows: in AppSheet.\nfunction partEdit_(me, p, now) {\n  if (!p.app) return false;\n  if (me.Role === 'sup' || me.Role === 'admin') return true;\n  return p.by === String(me.Name) && shiftOf_(p.created) === shiftOf_(now);\n}\n\nfunction lotDetail(token, pid) {\n  const me = session_(token), r = plRow_(pid), productId = str_(r.ProductID), code = ncpCode_(productId), now = Date.now();\n  const sup = me.Role === 'sup' || me.Role === 'admin';\n  const bags = (bagsByLot_().get(String(pid)) || []).map(function (b) {\n    b.parts.forEach(function (p) { p.canEdit = partEdit_(me, p, now); p.canCause = sup && p.process === CFG.CAUSE_PROCESS; });\n    b.canEdit = b.parts.some(function (p) { return p.canEdit; }); b.canMerge = sup;\n    return b;\n  }).reverse();\n  const d = code.detail[code.id] || {};\n  return { pid: String(pid), lot: str_(r.Lot_Number), productId: productId, name: names_()[productId] || productId, ext: str_(r.Extruder_Number),\n    state: str_(r.State), ncpId: code.id, ncpName: str_(d.NCP_Name), sieve: sieve_(r.Sieve_Detail), bags: bags, events: events_(String(pid), sup), settings: settings_(), now: now,\n    retro: CFG.LOT_STATES.indexOf(str_(r.State)) < 0 };\n}\n\n/* ---------- ย้อนหลัง (user 10 Nov 2026): Sup / Admin แก้สาเหตุ NCP ของ Lot ที่จบไปแล้ว รวมแถวเก่าจาก AppSheet ----------\n * findLots: ค้นเลข Lot ทุกสถานะ ยกเว้น Batching (ไม่รวมที่ยกเลิก / TEST) · q ว่าง = 20 Lot ล่าสุดที่ไม่อยู่ในหน้าแรก\n * editCause: แก้เฉพาะสาเหตุ (ExtruderRuntimeID) + Comment ของแถว Dyer — น้ำหนักยังแก้ตามกติกาเดิม */\nfunction findLots(token, q) {\n  session_(token, 'sup');\n  q = str_(q, 20).replace(/\\s+/g, '');\n  const names = names_(), sum = {};\n  const pls = table_(CFG.PLOT).rows.filter(function (r) {\n    return !truthy_(r.Cancelled) && str_(r.ProductID).toUpperCase() !== 'TEST' && str_(r.Lot_Number) && str_(r.State) !== 'Batching' &&   // Batching ยังไม่มี NCP (user 10 Nov)\n      (q ? str_(r.Lot_Number).indexOf(q) >= 0 : CFG.LOT_STATES.indexOf(str_(r.State)) < 0);\n  }).sort(function (a, b) { return str_(a.Lot_Number) < str_(b.Lot_Number) ? 1 : -1; }).slice(0, q ? 40 : 20);\n  if (!pls.length) return [];\n  bagsByLot_().forEach(function (bs, pid) { sum[pid] = { bags: bs.length, kg: bs.reduce(function (s, b) { return s + b.total; }, 0) }; });\n  return pls.map(function (r) {\n    const pid = str_(r.ProductionID), s = sum[pid] || { bags: 0, kg: 0 };\n    return { pid: pid, lot: str_(r.Lot_Number), productId: str_(r.ProductID), name: names[str_(r.ProductID)] || str_(r.ProductID),\n      ext: str_(r.Extruder_Number), state: str_(r.State), bags: s.bags, kg: s.kg };\n  });\n}\nfunction editCause(token, pid, rowId, runtimeId, comment) {\n  const me = session_(token, 'sup');\n  return withLock_(function () {\n    const t = table_(CFG.NCP), r = rowOf_(t, pid, rowId);\n    if (str_(r.Process) !== CFG.CAUSE_PROCESS) throw new Error('สาเหตุใส่ได้เฉพาะรายการ ' + CFG.CAUSE_PROCESS);\n    const rid = str_(runtimeId, 40);\n    if (rid && !events_(String(pid), true).some(function (e) { return e.id === rid; })) throw new Error('สาเหตุที่เลือกไม่ใช่ของล็อตนี้');\n    const vals = { ExtruderRuntimeID: rid, Comment: str_(comment, 300), UpdatedTimestamp: new Date() };\n    if (str_(r.ExtruderRuntimeID) === vals.ExtruderRuntimeID && str_(r.Comment) === vals.Comment) return { unchanged: true };\n    setCells_(t, r, vals);\n    console.log('editCause ' + me.Name + ' row ' + rowId + ' lot ' + pid);\n    return { ok: true };\n  });\n}\n/* ---------- ตะแกรงร่อน (user 7 Nov 2026): Production_Lot.Sieve_Detail, same text layout as the AppSheet field; the Control web app shows it ---------- */\nconst SIEVE_KEYS = ['bigOS', 'bigUS', 'smallOS', 'smallUS'];\nfunction sieve_(txt) {\n  const v = [], re = /OS:\\s*([\\d.]*)\\s*ตา\\/นิ้ว\\s*US:\\s*([\\d.]*)/g; let m;\n  while ((m = re.exec(String(txt || ''))) && v.length < 2) v.push([m[1], m[2]]);\n  return { bigOS: (v[0] || [])[0] || '', bigUS: (v[0] || [])[1] || '', smallOS: (v[1] || [])[0] || '', smallUS: (v[1] || [])[1] || '' };\n}\nfunction sieveText_(s) {\n  const f = function (x) { return '   ' + (x || ' ') + '   '; };\n  return 'ร่อนใหญ่ \\nOS:' + f(s.bigOS) + 'ตา/นิ้ว  US:' + f(s.bigUS) + 'ตา/นิ้ว  \\nร่อนเล็ก \\nOS:' + f(s.smallOS) + 'ตา/นิ้ว  US:' + f(s.smallUS) + 'ตา/นิ้ว';\n}\n// s = {bigOS, bigUS, smallOS, smallUS} = mesh per inch (ตา/นิ้ว), blank = not used\nfunction saveSieve(token, pid, s) {\n  session_(token, 'coat');\n  const v = {};\n  SIEVE_KEYS.forEach(function (k) { const x = str_(s && s[k], 10); if (x && !(/^\\d+(\\.\\d+)?$/.test(x) && Number(x) > 0 && Number(x) <= 100)) throw new Error('ตา/นิ้ว ต้องเป็นตัวเลข 1–100'); v[k] = x; });\n  if (!SIEVE_KEYS.some(function (k) { return v[k]; })) throw new Error('ใส่ขนาดตะแกรงอย่างน้อย 1 ช่อง');\n  return withLock_(function () {\n    const t = table_(CFG.PLOT), r = t.rows.find(function (x) { return str_(x.ProductionID) === String(pid) && !truthy_(x.Cancelled); });\n    if (!r) throw new Error('ไม่พบล็อตนี้');\n    setCells_(t, r, { Sieve_Detail: sieveText_(v), UpdatedTimestamp: new Date() });\n    return sieve_(sieveText_(v));\n  });\n}\n/* ---------- record / edit / cancel / merge ---------- */\n\n// Giving a row its BB number (NCP_No). An old AppSheet row also gets the lot's NCP code if it had none, so the daily\n// NCP export never falls back to reading NCP_No as a code. NCP-… numbers belong to Packing rejects (main script): never moved.\nfunction fillNo_(r, no, ncpId, now) {\n  const v = { NCP_No: no, UpdatedTimestamp: now };\n  if (!str_(r.NCP_Detail_ID) && ncpId) v.NCP_Detail_ID = ncpId;\n  return v;\n}\nfunction packNo_(r) { return /^NCP-/.test(str_(r.NCP_No)); }\n\n// d = {id: client uuid (retry-safe), pid, bb: '' = new BB | key of a BB of this lot to add to, parts: [{process, kg}], runtimeId, comment}\nfunction saveBag(token, d) {\n  const me = session_(token, 'coat'), id = str_(d && d.id, 40), parts = parts_(d && d.parts);\n  if (!id) throw new Error('ข้อมูลไม่ครบ');\n  const pl = plRow_(d.pid), pid = str_(pl.ProductionID), productId = str_(pl.ProductID);\n  if (CFG.LOT_STATES.indexOf(str_(pl.State)) < 0) throw new Error('ล็อตนี้ไม่ได้อยู่ในสถานะ Extruder / Packing แล้ว');\n  const dyer = parts.some(function (p) { return p.process === CFG.CAUSE_PROCESS; });\n  const ev = events_(pid), runtimeId = dyer ? str_(d.runtimeId, 40) : '';\n  if (dyer && ev.length && !runtimeId) throw new Error('เลือกสาเหตุของ Dyer');\n  if (runtimeId && !ev.some(function (e) { return e.id === runtimeId; })) throw new Error('สาเหตุที่เลือกไม่ใช่ของล็อตนี้ — โหลดใหม่แล้วเลือกอีกครั้ง');\n  const comment = dyer ? str_(d.comment, 300) : '', ncpId = ncpCode_(productId).id;\n  return withLock_(function () {\n    const t = table_(CFG.NCP), dup = t.rows.find(function (r) { return str_(r.SourceRecordID) === id; });\n    if (dup) return { no: str_(dup.NCP_No), dup: true };\n    const now = new Date();\n    let no;\n    if (d.bb) {\n      const old = bagRows_(t, pid, String(d.bb));\n      no = str_(old[0].NCP_No) || nextNo_(t.rows, now);\n      old.forEach(function (r) { if (!str_(r.NCP_No)) setCells_(t, r, fillNo_(r, no, ncpId, now)); });\n    } else no = nextNo_(t.rows, now);\n    appendRows_(t.sh, t.h, parts.map(function (p) {\n      const isDyer = p.process === CFG.CAUSE_PROCESS;\n      return { ID: Utilities.getUuid().replace(/-/g, '').slice(0, 8), Extruder_Number: str_(pl.Extruder_Number), Lot_Number: str_(pl.Lot_Number),\n        ProductID: productId, DateTime: now, Process: p.process, Weight: p.kg, CreateTimestamp: now, UpdatedTimestamp: now, State: 'Active',\n        Comment: isDyer ? comment : '', LotProductKey: str_(pl.LotProductKey), ProductionID: pid, Cancelled: false, SourceModule: CFG.SOURCE,\n        SourceRecordID: id, NCP_Detail_ID: ncpId, Weight_Kg: p.kg, Status: 'Open', NCP_No: no, CreateMethod: CFG.SOURCE + ':' + me.Name,\n        Visible: true, ExtruderRuntimeID: isDyer ? runtimeId : '' };\n    }));\n    return { no: no };\n  });\n}\n\nfunction bagRows_(t, pid, key) {\n  const rows = t.rows.filter(function (r) { return str_(r.ProductionID) === String(pid) && live_(r) && bagKey_(r) === key; });\n  if (!rows.length) throw new Error('ไม่พบ BB นี้ (อาจถูกยกเลิกไปแล้ว)');\n  return rows;\n}\nfunction rowOf_(t, pid, rowId) {\n  const r = t.rows.find(function (x) { return str_(x.ID) === String(rowId) && str_(x.ProductionID) === String(pid) && live_(x); });\n  if (!r) throw new Error('ไม่พบรายการนี้ (อาจถูกยกเลิกไปแล้ว)');\n  return r;\n}\n// d = {pid, rows: [{rowId, kg, runtimeId, comment}]} — kg of each part; cause + comment on Dyer parts.\nfunction editBag(token, d) {\n  const me = session_(token, 'coat');\n  return withLock_(function () {\n    const t = table_(CFG.NCP), now = Date.now(), ev = events_(String(d.pid), true);\n    const todo = (d.rows || []).map(function (x) {\n      const r = rowOf_(t, d.pid, x.rowId), p = bags_([r])[0].parts[0], kg = Number(x.kg);\n      if (!partEdit_(me, p, now)) throw new Error('แก้รายการนี้ไม่ได้ (แก้ได้เฉพาะของตัวเองในกะนี้ — นอกนั้นให้หัวหน้ากะแก้)');\n      if (!(kg > 0 && kg <= CFG.MAX_KG)) throw new Error('น้ำหนัก ' + p.process + ' ต้องมากกว่า 0 และไม่เกิน ' + CFG.MAX_KG + ' kg');\n      const vals = { Weight: kg, Weight_Kg: kg, UpdatedTimestamp: new Date() };\n      if (p.process === CFG.CAUSE_PROCESS) {\n        const rid = str_(x.runtimeId, 40);\n        if (rid && !ev.some(function (e) { return e.id === rid; })) throw new Error('สาเหตุที่เลือกไม่ใช่ของล็อตนี้');\n        vals.ExtruderRuntimeID = rid; vals.Comment = str_(x.comment, 300);\n      }\n      return [r, vals];\n    });\n    todo.forEach(function (x) { setCells_(t, x[0], x[1]); });\n    return true;\n  });\n}\nfunction cancelRow(token, pid, rowId) {\n  const me = session_(token, 'coat');\n  return withLock_(function () {\n    const t = table_(CFG.NCP), r = rowOf_(t, pid, rowId);\n    if (!partEdit_(me, bags_([r])[0].parts[0], Date.now())) throw new Error('ยกเลิกรายการนี้ไม่ได้ (ได้เฉพาะของตัวเองในกะนี้)');\n    setCells_(t, r, { Cancelled: true, State: 'Cancel', UpdatedTimestamp: new Date() });\n    return true;\n  });\n}\n// Sup: two records that went into the same physical BB (e.g. typed separately in AppSheet) → one BB number.\nfunction mergeBags(token, pid, fromKey, toKey) {\n  session_(token, 'sup');\n  if (String(fromKey) === String(toKey)) throw new Error('เลือก BB อื่น');\n  return withLock_(function () {\n    const t = table_(CFG.NCP), a = bagRows_(t, pid, String(fromKey)), b = bagRows_(t, pid, String(toKey)), now = new Date();\n    if (a.some(packNo_) && b.some(packNo_)) throw new Error('BB จาก Reject ของแอปแพคทั้งคู่ รวมกันไม่ได้');\n    const keep = b.concat(a).find(packNo_) || b.concat(a).find(function (r) { return str_(r.NCP_No); });\n    const no = keep ? str_(keep.NCP_No) : nextNo_(t.rows, now), ncpId = ncpCode_(str_(plRow_(pid).ProductID)).id;\n    a.concat(b).forEach(function (r) { if (str_(r.NCP_No) !== no) setCells_(t, r, fillNo_(r, no, ncpId, now)); });\n    return { no: no };\n  });\n}\n// Sup: take one part out of a BB into a BB of its own (undo a wrong merge / wrong \"add to BB\").\nfunction splitRow(token, pid, rowId) {\n  session_(token, 'sup');\n  return withLock_(function () {\n    const t = table_(CFG.NCP), r = rowOf_(t, pid, rowId), now = new Date();\n    if (packNo_(r)) throw new Error('รายการ Reject จากแอปแพค แยกไม่ได้');\n    if (bagRows_(t, pid, bagKey_(r)).length < 2) throw new Error('BB นี้มีรายการเดียวอยู่แล้ว');\n    const no = nextNo_(t.rows, now);\n    setCells_(t, r, fillNo_(r, no, ncpCode_(str_(r.ProductID)).id, now));\n    return { no: no };\n  });\n}\n\n// Total_NCP of Production_Lot is written by the main script's KPI recalc, not a formula: ask it after every change.\nfunction recalc(token, pid) {\n  const me = session_(token);\n  if (csOn_()) return csKpi_({ action: 'PRODUCTION_LOT_FINISHED', module: 'PRODUCTION_LOT_KPI', productionID: String(pid), rowID: String(pid), requestedBy: CFG.SOURCE + ':' + me.Name });   // v30\n  const r = UrlFetchApp.fetch(prop_('RECALC_URL') || CFG.HOOK_URL, { method: 'post', contentType: 'application/json', muteHttpExceptions: true,\n    payload: JSON.stringify({ action: 'PRODUCTION_LOT_FINISHED', module: 'PRODUCTION_LOT_KPI', productionID: String(pid), rowID: String(pid),\n      requestID: String(pid) + '-' + Date.now(), requestedBy: CFG.SOURCE + ':' + me.Name }) });\n  return r.getResponseCode();\n}\n\n/* ---------- Sup: แบบรับเข้า Rework — every live BB (any source) whose last part falls in the shift ---------- */\n\nfunction shiftRows(token, key) {\n  const me = session_(token, 'sup'), range = shiftRange_(key), detail = ncpCode_('').detail, names = names_(), mapCache = {}, out = [];\n  bagsByLot_().forEach(function (bs) {\n    bs.forEach(function (b) {\n      if (b.last < range[0] || b.last >= range[1]) return;\n      const r0 = b.r0, product = r0.ProductID;\n      if (mapCache[product] == null) mapCache[product] = ncpCode_(product).id;\n      const nid = b.ncpId || mapCache[product], dd = detail[nid] || {};\n      const sum = {}; b.parts.forEach(function (p) { sum[p.process] = (sum[p.process] || 0) + p.kg; });\n      const ps = Object.keys(sum).sort(function (x, y) { return CFG.PROCESSES.indexOf(x) - CFG.PROCESSES.indexOf(y); });\n      out.push({ at: b.last, code: nid, name: names[product] || product, color: str_(dd.Color), lot: r0.Lot_Number, line: r0.Extruder_Number.replace(/\\D/g, ''),\n        kg: b.total, loc: str_(dd.Storage), why: ps.map(function (p) { return ps.length > 1 ? p + ' ' + sum[p] : p; }).join(' + ') + (b.comment ? ': ' + b.comment : '') });\n    });\n  });\n  out.sort(function (a, b) { return a.at - b.at; });\n  return { key: key, rows: out, by: String(me.Name) };\n}\n/* ---------- Coater: kg coated per hour per line (read-only, tab Coater_Records) ---------- */\n// Total_Weight is the lot's running total at DateTimeRecords, so a record's kg = its total − the lot's previous total,\n// and it covers the time since that previous record (the record time is the END of the interval: 09:00 = 08:00–09:00).\n// key = 'yyyy-MM-dd|8|16|0' for a shift or 'yyyy-MM-dd|all' for the whole production day.\nfunction coaterView(token, key) {\n  session_(token);\n  const p = String(key).split('|'), all = p[1] === 'all', range = shiftRange_(p[0] + '|' + (all ? 8 : p[1]));\n  if (all) range[1] = range[0] + 24 * HOUR;\n  // MTD = from the 1st of the production month 08:00 to the end of the picked production day\n  const mFrom = shiftRange_(p[0].slice(0, 8) + '01|8')[0], mTo = shiftRange_(p[0] + '|8')[0] + 24 * HOUR, coatM = {};\n  const n = Math.round((range[1] - range[0]) / HOUR), names = names_(), std = {};\n  table_(CFG.PRODUCT).rows.forEach(function (r) { std[str_(r.ProductID)] = Number(r['Std Cap/hr']) || 0; });\n  const byLot = {};\n  table_(CFG.COATER).rows.forEach(function (r) {\n    const t = ms_(r.DateTimeRecords), w = Number(r.Total_Weight);\n    if (!t || isNaN(w) || truthy_(r.Cancelled) || /^false$/i.test(str_(r.Visible))) return;\n    const k = str_(r.ProductionID) || str_(r.LotProductKey);\n    (byLot[k] = byLot[k] || []).push({ t: t, w: w, r: r });\n  });\n  const lines = {};\n  Object.keys(byLot).forEach(function (k) {\n    const rs = byLot[k].sort(function (a, b) { return a.t - b.t || a.w - b.w; });\n    rs.forEach(function (x, i) {\n      const prev = rs[i - 1], kg = Math.max(0, x.w - (prev ? prev.w : 0)), mins = prev ? (x.t - prev.t) / 60000 : 0;\n      if (x.t > mFrom && x.t <= mTo) { const e = str_(x.r.Extruder_Number) || '—'; coatM[e] = (coatM[e] || 0) + kg; }\n      if (x.t <= range[0] || x.t > range[1]) return;\n      const ext = str_(x.r.Extruder_Number) || '—', product = str_(x.r.ProductID), lot = str_(x.r.Lot_Number);\n      const L = lines[ext] = lines[ext] || { ext: ext, hours: [], lots: {} };\n      // ponytail: a record after a long gap puts all its kg in the record's hour; spread over the gap if that misleads\n      const h = Math.min(n - 1, Math.floor((x.t - 1 - range[0]) / HOUR));\n      const b = L.hours[h] = L.hours[h] || { kg: 0, mix: {} };\n      b.kg += kg; b.mix[product] = (b.mix[product] || 0) + kg;\n      if (str_(x.r.Memo)) (L.notes = L.notes || []).push({ h: h, t: x.t, lot: lot, text: str_(x.r.Memo, 300) }); // Control's comment on the record\n      const o = L.lots[k] = L.lots[k] || { lot: lot, productId: product, name: names[product] || product, std: std[product] || 0, first: prev && mins <= CFG.COATER_GAP_MIN ? prev.t : x.t, last: x.t, kg: 0, rateKg: 0, mins: 0, recs: 0, end: false };\n      o.last = x.t; o.cum = x.w; o.kg += kg; o.recs++; if (mins > 0 && mins <= CFG.COATER_GAP_MIN) { o.rateKg += kg; o.mins += mins; } if (truthy_(x.r.Last_Coat)) o.end = true;\n    });\n  });\n  const out = Object.keys(lines).sort().map(function (ext) {\n    const L = lines[ext], lots = Object.keys(L.lots).map(function (k) { return L.lots[k]; }).sort(function (a, b) { return a.first - b.first; });\n    const hours = [];\n    for (let i = 0; i < n; i++) {\n      const b = L.hours[i];\n      if (!b) { hours.push({ kg: 0, std: 0 }); continue; }\n      const top = Object.keys(b.mix).sort(function (x, y) { return b.mix[y] - b.mix[x]; })[0];\n      hours.push({ kg: b.kg, std: std[top] || 0 });\n    }\n    const rateKg = lots.reduce(function (s, o) { return s + o.rateKg; }, 0), mins = lots.reduce(function (s, o) { return s + o.mins; }, 0);\n    return { ext: ext, hours: hours, notes: (L.notes || []).sort(function (a, b) { return a.t - b.t; }), lots: lots.map(function (o) { return { lot: o.lot, productId: o.productId, name: o.name, std: o.std, first: o.first, last: o.last, kg: o.kg, cum: o.cum, rate: o.mins ? o.rateKg / o.mins * 60 : 0, recs: o.recs, end: o.end }; }),\n      kg: lots.reduce(function (s, o) { return s + o.kg; }, 0), rate: mins ? rateKg / mins * 60 : 0, runH: mins / 60, recs: lots.reduce(function (s, o) { return s + o.recs; }, 0) };\n  });\n  return { key: key, from: range[0], to: range[1], lines: out, mtd: ncpMtd_(mFrom, mTo, coatM) };\n}\n// NCP that happened (row DateTime, production-day basis) in [from, to): kg + rows + BBs by process and by line, with Coat kg per line.\nfunction ncpMtd_(from, to, coatM) {\n  const proc = {}, line = {}, bbs = {};\n  let kg = 0, rows = 0;\n  table_(CFG.NCP).rows.forEach(function (r) {\n    const t = ms_(r.DateTime) || ms_(r.CreateTimestamp), w = Number(r.Weight) || 0;\n    if (!live_(r) || t < from || t >= to || !w) return;\n    const pr = str_(r.Process) || '—', ext = str_(r.Extruder_Number) || '—';\n    kg += w; rows++; bbs[str_(r.ProductionID) + '|' + bagKey_(r)] = 1;\n    proc[pr] = (proc[pr] || 0) + w;\n    (line[ext] = line[ext] || { ext: ext, ncp: 0, coat: 0 }).ncp += w;\n  });\n  Object.keys(coatM).forEach(function (e) { (line[e] = line[e] || { ext: e, ncp: 0, coat: 0 }).coat = coatM[e]; });\n  return { from: from, to: to, kg: kg, rows: rows, bbs: Object.keys(bbs).length,\n    proc: Object.keys(proc).map(function (k) { return { process: k, kg: proc[k] }; }).sort(function (a, b) { return b.kg - a.kg; }),\n    lines: Object.keys(line).sort().map(function (k) { return line[k]; }) };\n}\n\n/* ---------- PDFs to Drive, settings, font ---------- */\n\nfunction folder_(sub) {\n  const root = DriveApp.getFolderById(CFG.OUT_FOLDER), it = root.getFoldersByName(sub);\n  return it.hasNext() ? it.next() : root.createFolder(sub);\n}\n// kind 'reject' (anyone) | 'rework' (Sup). b64 = PDF made on the phone.\nfunction savePdf(token, kind, name, b64) {\n  const me = session_(token, kind === 'rework' ? 'sup' : 'coat');\n  if (kind !== 'reject' && kind !== 'rework') throw new Error('ชนิดไฟล์ไม่ถูกต้อง');\n  const bytes = Utilities.base64Decode(String(b64 || '').replace(/^data:[^,]*,/, ''));\n  if (!bytes.length || bytes.length > 15e6) throw new Error('ไฟล์ไม่ถูกต้อง');\n  const safe = String(name || kind).replace(/[^\\w.\\-ก-๙]/g, '_').slice(0, 120) + '.pdf';\n  const f = folder_(kind === 'reject' ? CFG.REJECT_SUB : CFG.REWORK_SUB).createFile(Utilities.newBlob(bytes, 'application/pdf', safe));\n  f.setDescription('BFL Coating Control · ' + me.Name);\n  return { name: safe, url: f.getUrl() };\n}\nfunction cleanupRejectPdf() {\n  const cut = Date.now() - CFG.REJECT_KEEP_HOURS * HOUR;\n  let n = 0;\n  [CFG.REJECT_SUB, CFG.REWORK_SUB].forEach(function (sub) {\n    const it = folder_(sub).getFiles();\n    while (it.hasNext()) { const f = it.next(); if (f.getDateCreated().getTime() < cut) { f.setTrashed(true); n++; } }\n  });\n  return n;\n}\nfunction setWriteAlong(token, on) {\n  session_(token, 'sup');\n  PropertiesService.getScriptProperties().setProperty('WRITE_ALONG', on ? 'on' : 'off');\n  return settings_();\n}\n// TH Sarabun PSK for the forms: put the .ttf in Drive and set Script Property FONT_FILE_ID. Empty = phone uses Sarabun.\n// TH Sarabun PSK (.ttf in Drive; Script Property FONT_FILE_ID overrides CFG.FONT_ID) for the forms drawn on the phone.\nfunction fontData(token) {\n  session_(token);\n  return Utilities.base64Encode(DriveApp.getFileById(prop_('FONT_FILE_ID') || CFG.FONT_ID).getBlob().getBytes());\n}\n// The official form PDFs (Form folder) — the phone writes the values onto these exact files.\nfunction formPdf(token, kind) {\n  session_(token, kind === 'rework' ? 'sup' : 'coat');\n  const id = kind === 'rework' ? CFG.REWORK_FORM_ID : kind === 'reject' ? CFG.REJECT_FORM_ID : '';\n  if (!id) throw new Error('ไม่มีฟอร์มนี้');\n  return Utilities.base64Encode(DriveApp.getFileById(id).getBlob().getBytes());\n}\n/* ---------- Admin: users ---------- */\n\nfunction listUsers(token) { session_(token, 'admin'); return publicUsers_(); }\nfunction saveUser(token, d) {\n  const me = session_(token, 'admin'), name = str_(d.name, 60), role = CFG.ROLES.indexOf(d.role) >= 0 ? d.role : 'coat', pin = String(d.pin || '');\n  if (!name) throw new Error('ใส่ชื่อก่อน');\n  if (pin && !/^\\d{4}$/.test(pin)) throw new Error('รหัสต้องเป็นตัวเลข 4 ตัว');\n  return withLock_(function () {\n    const sh = usersSheet_(), all = users_(), id = String(d.id || '');\n    if (all.some(function (u) { return u.active && String(u.Name) === name && u.id !== id; })) throw new Error('มีชื่อ ' + name + ' อยู่แล้ว');\n    if (!id) { if (!pin) throw new Error('ผู้ใช้ใหม่ต้องตั้งรหัส'); addUser_(sh, name, role, pin, String(me.Name)); }\n    else {\n      const u = all.find(function (x) { return x.id === id; });\n      if (!u) throw new Error('ไม่พบผู้ใช้');\n      const active = d.active !== false;\n      if (u.id === me.id && (!active || role !== 'admin')) throw new Error('ปิดหรือลดสิทธิ์ตัวเองไม่ได้');\n      sh.getRange(u.row, 1, 1, CFG.USER_HEADERS.length).setValues([[u.id, name, role, pin ? '!' + hash_(u.id, pin) : u.PIN_Hash, active, new Date(), String(me.Name)]]);\n    }\n    return publicUsers_();\n  });\n}\n\n/* ---------- Sup/Admin: สัดส่วน NCP Dyer : Sieve ต่อ lot ในเดือนที่เลือก (V14) ----------\n * เดือน = นับตามวันที่บันทึก NCP (DateTime ของแถว, วันผลิตเริ่ม 08:00) เหมือนการ์ด NCP เดือนนี้ในหน้า Coater\n * อ่านอย่างเดียว · รวมทุกแถวที่ยังไม่ยกเลิก (ทั้งจากแอปนี้และ AppSheet) · ไม่นับ ProductID = TEST\n * plan = Production_Lot.Qty_Plan (ตัน) ของ lot · สาเหตุ Dyer = เหตุการณ์ Extruder_Runtime (Process + Reason) ที่ผูกไว้ · ym = 'yyyy-MM'\n */\nfunction dyerSieve(token, ym) {\n  session_(token, 'sup');\n  ym = String(ym || '');\n  if (!/^\\d{4}-(0[1-9]|1[0-2])$/.test(ym)) throw new Error('เดือนไม่ถูกต้อง');\n  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));\n  const nx = m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0');\n  const from = shiftRange_(ym + '-01|8')[0], to = shiftRange_(nx + '-01|8')[0];\n  const names = names_(), by = {}, lines = {}, plan = {};\n  table_(CFG.PLOT).rows.forEach(function (r) { plan[str_(r.ProductionID)] = Number(r.Qty_Plan) || 0; });\n  let dyer = 0, sieve = 0;\n  const need = {};\n  table_(CFG.NCP).rows.forEach(function (r) {\n    const t = ms_(r.DateTime) || ms_(r.CreateTimestamp), w = Number(r.Weight) || 0, pr = str_(r.Process);\n    if (!live_(r) || !w || t < from || t >= to) return;\n    if (pr !== 'Dyer' && pr !== 'Sieve') return;\n    if (str_(r.ProductID).toUpperCase() === 'TEST') return;\n    const pid = str_(r.ProductionID), k = pid || str_(r.LotProductKey) || str_(r.Lot_Number), ext = str_(r.Extruder_Number) || '—';\n    const o = by[k] = by[k] || { lot: str_(r.Lot_Number), productId: str_(r.ProductID), ext: ext, plan: plan[pid] || 0, dyer: 0, sieve: 0, first: t, last: t, rt: {}, noCause: 0, notes: [] };\n    const L = lines[ext] = lines[ext] || { ext: ext, dyer: 0, sieve: 0 };\n    if (pr === 'Dyer') {\n      o.dyer += w; L.dyer += w; dyer += w;\n      const rid = str_(r.ExtruderRuntimeID);\n      if (rid) { o.rt[rid] = (o.rt[rid] || 0) + w; need[rid] = 1; } else o.noCause += w;\n    } else { o.sieve += w; L.sieve += w; sieve += w; }\n    const cm = str_(r.Comment, 200);\n    if (cm && !o.notes.some(function (n) { return n.process === pr && n.text === cm; })) o.notes.push({ process: pr, text: cm });\n    o.first = Math.min(o.first, t); o.last = Math.max(o.last, t);\n  });\n  const ev = {}, causes = {};\n  if (Object.keys(need).length) table_(CFG.RUNTIME).rows.forEach(function (r) {\n    const id = str_(r.ID);\n    if (need[id]) ev[id] = { at: ms_(r.DateTime), process: str_(r.Process).replace(/^EX-/, ''), reason: str_(r.Reason, 200) };\n  });\n  const lots = Object.keys(by).map(function (k) {\n    const o = by[k]; o.name = names[o.productId] || o.productId;\n    o.causes = Object.keys(o.rt).map(function (id) {\n      const e = ev[id] || { at: 0, process: 'ไม่พบเหตุการณ์ (' + id + ')', ี่)\n * 1 ครั้งที่กดบันทึก = 1 batch: ทีละ Bigbag หรือทั้งคันรถเป็นน้ำหนัก · รหัส NCP ตามสูตร/สินค้า (Production_NCP_Map) */\nfunction millFind(token, q) {\n  session_(token, 'coat');\n  q = str_(q, 20).replace(/\\s+/g, '');\n  if (q.length < 3) return [];\n  const names = names_();\n  return table_(CFG.PLOT).rows.filter(function (r) { return !truthy_(r.Cancelled) && str_(r.ProductID).toUpperCase() !== 'TEST' && str_(r.Lot_Number).indexOf(q) >= 0; })\n    .sort(function (a, b) { return str_(a.Lot_Number) < str_(b.Lot_Number) ? 1 : -1; }).slice(0, 15)\n    .map(function (r) { return { pid: str_(r.ProductionID), lot: str_(r.Lot_Number), productId: str_(r.ProductID), name: names[str_(r.ProductID)] || '' }; });\n}\nfunction millPl_(pid) {\n  const pl = table_(CFG.PLOT).rows.filter(function (r) { return str_(r.ProductionID) === str_(pid) && !truthy_(r.Cancelled); })[0];\n  if (!pl) throw new Error('ไม่พบ Lot ผลิต');\n  return pl;\n}\nfunction millInfo(token, pid) {\n  session_(token, 'coat');\n  const pl = millPl_(pid), n = ncpCode_(str_(pl.ProductID));\n  const codes = Object.keys(n.detail).filter(function (id) { const a = str_(n.detail[id].Active); return id && (a === '' || truthy_(n.detail[id].Active) || id === n.id); })\n    .sort().map(function (id) { return { id: id, name: str_(n.detail[id].NCP_Name) }; });\n  return { pid: str_(pl.ProductionID), lot: str_(pl.Lot_Number), productId: str_(pl.ProductID), name: names_()[str_(pl.ProductID)] || '', code: n.id, codes: codes };\n}\nconst MILL = { PROC: 'Milling', SRC: 'CoatingMill' };\nfunction millSid_(m) { return 'MILL:' + m.batch + '-' + m.seq; }\n// ncp_mill rows → แท็บ NCP: สร้างแถวที่ยังไม่มี, ยกเลิกแถวของ batch ที่ยกเลิกแล้ว · คืนจำนวนแถวที่เปลี่ยน\nfunction millSheet_(list) {\n  list = (list || []).filter(function (m) { return m && m.batch && m.seq; });\n  if (!list.length) return 0;\n  return withLock_(function () {\n    const t = table_(CFG.NCP), have = {}, pls = {}, add = [], now = new Date();\n    let n = 0;\n // Coater: kg coated per hour, one chart per line (bars = kg in that hour, orange tick = Std Cap/hr of the product)

function coChart(hours, from, notes) {
  notes = notes || [];
  const W = 440, Ht = 180, L = 36, B = 22, T = notes.length ? 28 : 16, n = hours.length, slot = (W - L - 4) / n, bw = Math.max(4, slot * 0.68);
  const top = Math.max(1000, ...hours.map((h) => Math.max(h.kg, h.std))), step = top > 4000 ? 2000 : 1000, ymax = Math.ceil(top / step) * step;
  const y = (v) => T + (Ht - T - B) * (1 - v / ymax);

  for (let v = 0; v <= ymax; v += step) s += '<line x1="' + L + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#DFE5EC"/><text x="' + (L - 5) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#4E5D6E">' + kfmt(v) + '</text>';
  hours.forEach((h, i) => {
    const x = L + 2 + i * slot + (slot - bw) / 2, cx = x + bw / 2;
    if (h.kg > 0) s += '<rect x="' + x + '" y="' + y(h.kg) + '" width="' + bw + '" height="' + (y(0) - y(h.kg)) + '" rx="2" fill="#1B5FA8"><title>' + hm(from + i * H) + ' ' + num(h.kg) + ' kg</title></rect>'
    if (h.std > 0) s += '<line x1="' + (x - 2) + '" x2="' + (x + bw + 2) + '" y1="' + y(h.std) + '" y2="' + y(h.std) + '" stroke="#C9661A" stroke-width="3"/>';
    // value inside the bar top (white) when it fits, else just above it
    if (n <= 8 && h.kg > 0) { const inBar = y(0) - y(h.kg) > 22; s += '<text x="' + cx + '" y="' + (inBar ? y(h.kg) + 14 : y(h.kg) - 4) + '" text-anchor="middle" font-size="11" font-weight="600" fill="' + (inBar ? '#fff' : '#1E2B3A') + '">' + kfmt(h.kg) + '</text>'; }
    if (n <= 8 || i % 3 === 0) s += '<text x="' + cx + '" y="' + (Ht - 6) + '" text-anchor="middle" font-size="11" fill="#4E5D6E">' + hm(from + i * H).slice(0, 2) + '</text>';
  });

  notes.forEach((m, k) => { const cx = L + 2 + m.h * slot + slot / 2; s += '<line x1="' + cx + '" x2="' + cx + '" y1="20" y2="' + y(0) + '" stroke="#F2A33A" stroke-dasharray="3 3"/><circle cx="' + cx + '" cy="11" r="9" fill="#F2A33A"><title>' + esc(m.text) + '</title></circle><text x="' + cx + '" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#1E2B3A">' + (k + 1) + '</text>'; });
  return '<svg viewBox="0 0 ' + W + ' ' + Ht + '" width="100%" role="img" aria-label="kg ต่อชั่วโมง">' + s + '</svg>';
}

  ASSET[kind] = ASSET[kind] || api('formPdf', kind); ASSET.font = ASSET.font || api('fontData');
  try { const [form, font] = await Promise.all([ASSET[kind], ASSET.font]); return { form: b64bytes(form), font: b64bytes(font) }; }
  catch (e) { ASSET[kind] = ASSET.font = null; throw e; }
}

// แบบบันทึกการรับเข้า Rework F-SP-PRD04-01 R.03 (A4). The header (down to the column titles) and the footer (total row +
// signatures) are cut from the original page; the body is redrawn on the same column lines and row height, and a row whose
// text does not fit grows by whole rows, so long names / causes are shown in full. Pages continue the numbering.
const RW = { cols: [37.5, 62.8, 168.2, 228.7, 248.0, 363.4, 382.7, 397.6, 432.3, 544.7, 579.9], top: 130.4, bottom: 684.8, row: 17.9, size: 13, lh: 13.6 };
function wrapText(f, s, width, size) {

  const wd = (t) => f.widthOfTextAtSize(t, size), lines = [];
  let cur = '';
  seg.forEach((t) => {
    if (wd(cur + t) <= width) { cur += t; return; }
    if (cur.trim()) { lines.push(cur.trim()); cur = ''; }
    if (wd(t) <= width) { cur = t.replace(/^\s+/, ''); return; }
    Array.from(new Intl.Segmenter('th', { granularity: 'grapheme' }).segment(t), (x) => x.segment).forEach((ch) => { if (wd(cur + ch) > width && cur) { lines.push(cur); cur = ''; } cur += ch; });
  });
  if (cur.trim() || !lines.length) lines.push(cur.trim());

}
