<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<title>BFL QC App</title>
<style>
:root{--blue:#268AFA;--navy:#162C9A;--ink:#2E2E2E;--mute:#7A8597;--line:#E3E9F2;--bg:#F6F8FB;--card:#fff;--soft:#F3F7FD;--soft2:#EAF2FF;--amber:#FAAA20;--green:#1FA971;--red:#E5484D;--inbg:#fff}
body.dark{--ink:#E6EBF3;--mute:#93A0B5;--line:#2A3550;--bg:#0E1526;--card:#151F35;--soft:#1A2540;--soft2:#1C2C52;--inbg:#111A2E;--navy:#8FB8FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Leelawadee UI","Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
/* layout */
#app{display:flex;height:100%}
.side{width:220px;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand img{height:42px}.brand b{display:block;color:var(--navy);font-size:15px}.brand small{color:var(--mute);font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--mute);cursor:pointer;white-space:nowrap;border:0;background:none;text-align:left;width:100%}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;flex:0 0 auto}
.nav:hover{background:var(--soft)}.nav.on{background:var(--soft2);color:var(--blue);font-weight:600}
.navh{font-size:10px;color:var(--mute);letter-spacing:.12em;padding:12px 10px 4px;opacity:.8}
.me{margin-top:auto;display:flex;align-items:center;gap:9px;padding:10px;border-radius:10px;background:var(--soft)}
.av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:0 0 auto}
.me b{font-size:12.5px;display:block}.me small{font-size:11px;color:var(--mute)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--card);flex:0 0 auto}
.top h1{font-size:18px;color:var(--navy)}
.top .sp{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);font-size:12px;background:var(--card);white-space:nowrap}
.pill.b{background:var(--soft2);border-color:transparent;color:var(--blue)}
.view{flex:1;overflow:auto;padding:18px 20px 90px}
.grid{display:grid;gap:12px}.grid>*{min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.h3{font-size:13.5px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:8px}
.h3 .r{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--mute)}
.lab{display:block;font-size:11px;color:var(--mute);margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;height:38px;border:1px solid #D9E1EC;border-radius:8px;padding:0 10px;background:var(--inbg);outline:none}
body.dark .inp{border-color:var(--line)}
textarea.inp{height:64px;padding:8px 10px;resize:vertical}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(38,138,250,.18)}
.inp.num{font-family:Consolas,monospace;font-size:15px}
.unit{position:relative}.unit .inp{padding-right:42px}.unit i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--mute);pointer-events:none}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--blue);font-weight:600;box-shadow:0 1px 2px rgba(22,44,154,.15)}
.seg.ok button.on{color:var(--green)}.seg.bad button.on{color:var(--red)}
.btn{height:38px;border-radius:9px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--blue);color:#fff;box-shadow:0 6px 14px -8px rgba(38,138,250,.8)}
.btn.s{background:var(--card);color:var(--navy);border-color:#D2DCEA}
.btn.g{background:none;color:var(--mute)}
.btn.d{background:none;color:var(--red);border-color:#F3C6C7}
.btn:disabled{opacity:.5;cursor:default}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft2);color:var(--blue);font-weight:500;white-space:nowrap}
.tag.g{background:#E5F6EE;color:var(--green)}.tag.a{background:#FFF4DF;color:#B97700}.tag.r{background:#FDECEC;color:var(--red)}.tag.n{background:var(--soft);color:var(--mute)}
.big{font-family:Consolas,monospace;font-size:44px;color:var(--navy);line-height:1;width:150px;border:0;border-bottom:2px solid var(--line);background:none;outline:none}
.big:focus{border-color:var(--blue)}
.note{font-size:11.5px;color:var(--mute);line-height:1.5}
.band{position:relative;height:30px;margin-top:8px}
.band .tr{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,#FDECEC 0 12%,#FFF4DF 12% 22%,#E5F6EE 22% 78%,#FFF4DF 78% 88%,#FDECEC 88%)}
.band .tk{position:absolute;top:8px;width:1px;height:14px;background:#9AA6B8}
.band .tl{position:absolute;top:22px;font-size:10px;color:var(--mute);transform:translateX(-50%);font-family:Consolas,monospace}
.band .mk{position:absolute;top:2px;width:14px;height:24px;transform:translateX(-50%);transition:left .2s}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.cols2>*{min-width:0}
.cols2.c330{grid-template-columns:330px minmax(0,1fr)}.cols2.c250{grid-template-columns:250px minmax(0,1fr)}
.ztool{display:flex;align-items:center;gap:6px;margin:0 0 10px 2px;flex-wrap:wrap}.ztool .note{flex:1 1 220px}.ztool .zb{display:flex;gap:6px;margin-left:auto}
.ztool button{height:30px;min-width:34px;padding:0 10px;border-radius:8px;border:1px solid #CFDAE8;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer}
.help details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.help summary{cursor:pointer;padding:13px 16px;font-weight:600;color:var(--navy);list-style:none;display:flex;align-items:center;gap:10px}
.help summary::-webkit-details-marker{display:none}.help summary:after{content:'＋';margin-left:auto;color:var(--mute)}.help details[open] summary:after{content:'－'}
.help .hb{padding:0 16px 14px;font-size:13.5px;line-height:1.75}.help ol,.help ul{padding-left:20px;margin:6px 0}.help li{margin:3px 0}
.help .num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--soft2);color:var(--blue);align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
.help table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}.help td,.help th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.help th{background:var(--soft);font-weight:600}
.help .tip{background:var(--soft);border-left:3px solid var(--blue);padding:8px 12px;border-radius:6px;margin:8px 0}
.help .warn{background:#FFF4DF;border-left:3px solid var(--amber);padding:8px 12px;border-radius:6px;margin:8px 0;color:#5B4300}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.li:last-child{border-bottom:0}.li .v{margin-left:auto;font-family:Consolas,monospace}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dOK{background:var(--green)}.dNEAR{background:var(--amber)}.dOUT{background:var(--red)}.dNOSPEC,.d{background:#B8C2D2}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-weight:500;font-size:11px;color:var(--mute);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sv{display:flex;height:24px;border-radius:7px;overflow:hidden;font-size:11px;color:#fff;font-family:Consolas,monospace;background:var(--soft)}
.sv div{display:flex;align-items:center;justify-content:center;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:15px;border:1px solid #D9E1EC;font-size:12.5px;background:var(--card);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--soft2);border-color:#9CC6FD;color:var(--blue);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--mute)}
.tg{width:34px;height:19px;border-radius:10px;background:#CBD5E3;position:relative;display:inline-block;cursor:pointer;flex:0 0 auto;border:0}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--green)}.tg.on:after{left:17px}
/* modal / toast / loader */
.mask{position:fixed;inset:0;background:rgba(14,21,38,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal h2{font-size:16px;color:var(--navy);margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#162C9A;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;display:none;z-index:60;max-width:90vw}
#toast.err{background:var(--red)}
#loader{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:70;background:rgba(246,248,251,.35)}
#loader.show{display:flex}
#loader i{width:44px;height:44px;border-radius:50%;border:4px solid #D6E6FE;border-top-color:var(--blue);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* login */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:40}
#login .card{width:min(380px,92vw);padding:28px 26px;text-align:center}
#login img{height:110px;margin-bottom:6px}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin input{width:52px;height:56px;text-align:center;font-size:24px;border:1px solid #D2DCEA;border-radius:10px;background:var(--inbg);outline:none}
.pin input:focus{border-color:var(--blue)}
/* mobile */
.bnav{display:none}
@media (max-width:860px){
 .side{display:none}.cols2,.cols2.c330,.cols2.c250{grid-template-columns:1fr}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);justify-content:space-around;align-items:center;z-index:30}
 .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mute)}
 .bnav button.on{color:var(--blue);font-weight:600}
 .bnav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
 .top{padding:0 14px}.top .hide-m{display:none}.view{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
 .paperwrap{padding:10px}
 .top h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
 .big{font-size:38px}
}
/* ---------- document (TH SarabunPSK only) ---------- */
.paperwrap{background:#E9EEF5;border-radius:12px;padding:18px;overflow:auto}
body.dark .paperwrap{background:#0B1120}
.paper{background:#fff;color:#000;width:1080px;min-height:760px;margin:0 auto 18px;padding:26px 30px 22px;position:relative;box-shadow:0 20px 40px -24px rgba(22,44,154,.35)}
.doc{font-family:"TH SarabunPSK";font-size:16px;color:#000}
.doc table{border-collapse:collapse;width:100%;table-layout:fixed}
.doc td{border:.6pt solid #000;text-align:center;vertical-align:middle;padding:0 2px;line-height:1.05;overflow:hidden;white-space:nowrap;height:20px}
.doc td.nb{border:none}.doc td.l{text-align:left;padding-left:5px}.doc td.wrap{white-space:normal}
.doc .hb td{font-weight:700;white-space:normal}
.doc .fill{color:#0D2A9A}
.doc .code{position:absolute;right:30px;bottom:12px;font-size:15px}
@media print{
 @page{size:A4 landscape;margin:6mm}
 body *{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{position:absolute;left:0;top:0;width:100%}
 .paperwrap{background:none;padding:0}
 .paper{box-shadow:none;margin:0;width:100%;min-height:0;page-break-after:always;padding:0 4mm}
 .paper:last-child{page-break-after:auto}
 .doc .fill{color:#000}
}
</style>
</head>

/* เวอร์ชันเว็บ: ตรรกะเดิมรันใน Web Worker (worker.js) แล้วคุยกับ Supabase ตรง — ไม่ผ่าน Apps Script */
const W=new Worker('worker.js?v=202611110213');let _wid=0;const _wp={};
W.onmessage=e=>{const m=e.data,p=_wp[m.id];if(p){delete _wp[m.id];p(m)}};
W.onerror=e=>{toast('โหลดตัวประมวลผลไม่สำเร็จ — กดรีเฟรช',1)};
function call(fn,...args){
  return new Promise((res,rej)=>{loading(true);const id=++_wid;
    _wp[id]=m=>{loading(false);if(m.ok)return res(m.r);const msg=String(m.e||'ผิดพลาด');
      if(msg.indexOf('SESSION')>=0){toast(msg.replace('SESSION: ',''),1);logout(true)}rej(new Error(msg))};
    const ss=S.token?{token:S.token,user:S.user,offset:S.offset||0}:(LS.get('qc_session',null)||{});
    W.postMessage({id,fn,args,session:ss})})}

const HUB_TICKET=(()=>{const t=new URLSearchParams(location.search).get('hub')||'';if(t)try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}return /^[A-Za-z0-9_.\-]+$/.test(t)?t:''})();
async function boot(){
  // มี session อยู่แล้ว → ขอข้อมูลเริ่มต้น (api_init) พร้อมกับ api_bootstrap ไม่ต้องรอกัน
  const sess0=LS.get('qc_session',null),pre=!HUB_TICKET&&sess0&&sess0.token&&sess0.exp>Date.now();
  if(pre)S.initP=call('api_init',sess0.token,{view:LS.get('qc_view','home')}).catch(e=>e);
  try{S.boot=await call('api_bootstrap')}catch(e){toast(e.message,1);return}
  if(HUB_TICKET){   // เปิดจาก BFL Hub → เข้าระบบอัตโนมัติ (ตั๋วใช้ได้ครั้งเดียว)
    try{const r=await call('api_hubLogin',HUB_TICKET);S.token=r.token;S.user=r.user;S.offset=r.offset||0;LS.set('qc_session',{token:r.token,user:r.user,exp:r.exp,offset:S.offset,hub:1});return startApp()}
    catch(e){toast(e.message,1)}

/* ลูกศร ↑ ↓ เลื่อนไปช่องกรอกด้านบน/ล่าง (เลือกช่องที่อยู่แนวเดียวกันก่อน) */
document.addEventListener('keydown',e=>{
  if((e.key!=='ArrowDown'&&e.key!=='ArrowUp')||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  const a=document.activeElement;if(!a||a.tagName!=='INPUT')return;
  if(['date','time','datetime-local','number','range','checkbox','radio','file','color'].includes(a.type))return;
  const root=a.closest('.modal,#modal,#view')||document;
  // ปลายทางเฉพาะช่องพิมพ์ (ข้าม select/วันที่ เพราะลูกศรในช่องพวกนั้นใช้เปลี่ยนค่า)
  const ok=el=>el!==a&&!el.disabled&&!el.readOnly&&el.offsetParent!==null&&el.tagName==='INPUT'&&!['hidden','checkbox','radio','file','button','submit','date','time','datetime-local','number','range','color'].includes(el.type);
  const ra=a.getBoundingClientRect(),down=e.key==='ArrowDown',cx=(ra.left+ra.right)/2;let best=null,bs=1e9;
  root.querySelectorAll('input').forEach(el=>{if(!ok(el))return;const r=el.getBoundingClientRect();
    const dy=down?r.top-ra.top:ra.top-r.top;if(dy<6)return;
    const gap=r.right<ra.left?ra.left-r.right:r.left>ra.right?r.left-ra.right:0;const sc=dy+gap*3+Math.abs((r.left+r.right)/2-cx)*0.05;
    if(sc<bs){bs=sc;best=el}});
  if(!best)return;e.preventDefault();best.focus();best.select();best.scrollIntoView({block:'nearest'});
});

/* spec band */
function band(spec,v){
  const l=spec.MC_LCL,c=spec.MC_CL,u=spec.MC_UCL;
  if(l===''||u===''||l===undefined||u===undefined)return '<div class="note">ยังไม่มีสเปก %MC ของสินค้านี้</div>';
  const pos=x=>{const span=u-l;return Math.max(1,Math.min(99,22+(x-l)/span*56))};
  return `<div class="band"><div class="tr"></div><div class="tk" style="left:22%"></div>${c!==''?`<div class="tk" style="left:${pos(c)}%;background:var(--navy)"></div><div class="tl" style="left:${pos(c)}%;color:var(--navy)">${fmtNum(c)}</div>`:''}<div class="tk" style="left:78%"></div>
   <div class="tl" style="left:22%">${fmtNum(l)}</div><div class="tl" style="left:78%">${fmtNum(u)}</div>
   ${v!==''&&v!==undefined&&!isNaN(v)?`<svg class="mk" style="left:${pos(Number(v))}%" viewBox="0 0 14 24"><path d="M7 23L1 13V2h12v11z" fill="#162C9A"/></svg>`:''}</div>`;
}
function mcStatus(v,spec,point){
  if(v===''||isNaN(v))return '';v=Number(v);
  if(point==='COOLER'&&spec.C_MC_MAX!==''&&spec.C_MC_MAX!==undefined&&v>spec.C_MC_MAX)return 'OUT';
  const l=spec.MC_LCL,c=spec.MC_CL,u=spec.MC_UCL;if(l===''||u===''||l===undefined)return 'NOSPEC';
  if(v<l||v>u)return 'OUT';if(c!==''&&((v>c&&v-c>0.8*(u-c))||(v<c&&c-v>0.8*(c-l))))return 'NEAR';return 'OK';
}

function renderMoistRail(list){
  const l=curLot(),EX=S.point==='EXTRUDER',spec=EX?extSpec(l.spec):l.spec;
  if(!shMem(l.productionId)){const h=list.slice().reverse().find(x=>x.shs&&x.shs.length>1);if(h){shSave(l.productionId,h.shs.length,h.shs);
    if(!S.mEdit&&document.getElementById('mDieN')&&Number(segVal('mDieN')||1)===1)setShapes('m',h.shs.length,h.shs,{})}}
  const pts={DRYER:EX?[]:list.filter(x=>x.point==='DRYER'),COOLER:EX?[]:list.filter(x=>x.point==='COOLER'),EXTRUDER:EX?list.filter(x=>x.point==='EXTRUDER'):[]};
  const all=pts.DRYER.concat(pts.COOLER,pts.EXTRUDER).filter(x=>x.mc!=='');
  let chart='<div class="note">ยังไม่มีค่า</div>';
  if(all.length){
    const vs=all.map(x=>x.mc).concat([spec.MC_LCL,spec.MC_UCL].filter(x=>x!==''&&x!==undefined));
    let lo=Math.min(...vs),hi=Math.max(...vs);if(hi-lo<0.5){hi+=0.25;lo-=0.25}const pad=(hi-lo)*.15;lo-=pad;hi+=pad;
    const W=280,H=130,t0=Math.min(...all.map(x=>x.ts)),t1=Math.max(...all.map(x=>x.ts))||t0+1;
    const X=t=>8+(t1===t0?W/2:(t-t0)/(t1-t0)*(W-16)),Y=v=>H-8-(v-lo)/(hi-lo)*(H-16);
    const line=(arr,c)=>arr.length?`<polyline fill="none" stroke="${c}" stroke-width="1.6" points="${arr.map(x=>X(x.ts)+','+Y(x.mc)).join(' ')}"/>`+arr.map(x=>`<circle cx="${X(x.ts)}" cy="${Y(x.mc)}" r="2.8" fill="${x.status==='OUT'?'#E5484D':x.status==='NEAR'?'#FAAA20':'#fff'}" stroke="${c}" stroke-width="1.3"/>`).join(''):'';
    const lim=(v,c,t)=>v!==''&&v!==undefined?`<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="3 3" stroke-width=".8"/><text x="${W-2}" y="${Y(v)-3}" font-size="9" fill="${c}" text-anchor="end">${t} ${fmtNum(v)}</text>`:'';
    chart=`<svg viewBox="0 0 ${W} ${H}" width="100%">${lim(spec.MC_UCL,'#E5484D','UCL')}${lim(spec.MC_LCL,'#E5484D','LCL')}${lim(spec.MC_CL,'#8FA0C8','CL')}${line(pts.DRYER.filter(x=>x.mc!==''),'#268AFA')}${line(pts.COOLER.filter(x=>x.mc!==''),'#162C9A')}${line(pts.EXTRUDER.filter(x=>x.mc!==''),'#0E9F6E')}</svg>
     <div class="row note">${EX?'<span><span class="dot" style="background:#0E9F6E"></span> Extruder</span>':'<span><span class="dot" style="background:#268AFA"></span> Dryer</span><span><span class="dot" style="background:#162C9A"></span> Cooler</span>'}</div>`;
  }
  const rows=list.slice().reverse().slice(0,40).map(x=>`<div class="li"><span class="mono note" style="width:76px">${x.time}</span><span class="dot d${x.status}"></span><span>${x.process==='Dyer'?'Dryer':x.process}</span>${x.shs&&x.shs.length>1?`<span class="tag n" title="Die ${x.shs.length} in 1">${esc(x.shs.join('/'))}</span>`:''}${x.src==='AppSheet'?'<span class="tag n">AppSheet</span>':x.inspector?`<span class="note">${esc(x.inspector)}</span>`:''}<span class="v">${x.mc===''?'<span class="note">ไม่มี %MC</span>':fmtNum(x.mc)}</span>${canWrite()?`<button class="btn g" style="height:24px;padding:0 5px${S.mEdit&&S.mEdit.id===x.id?';background:#FFE7B8':''}" title="แก้ไข" onclick="editMoist('${x.id}')">✎</button>`:''}${isLead()?`<button class="btn g" style="height:24px;padding:0 4px" title="ยกเลิก" onclick="cancelMoist('${x.id}')">✕</button>`:''}</div>`).join('');

function renderPreview(){
  const F=S.docForm,h=DOC.header||{},s=DOC.spec||{},rows=DOC.rows||[],RPP=ROWS_PER_PAGE[F];
  const pages=[];for(let i=0;i<Math.max(1,rows.length);i+=RPP)pages.push(rows.slice(i,i+RPP));
  const blank={};const pad=arr=>arr.concat(Array(RPP-arr.length).fill(blank));
  const fn={DRYER:pageDryer,COOLER:pageCooler,MILLING:pageMilling,EXTRUDER:pageExtruder,PACKING:pagePacking,PACKING_PC:(r,h,s)=>pagePacking(r,h,s,'PACKING_PC'),FLAVOR_PC:pageFlavorPC,EXTRUDER_PC:pageExtruderPC,DRYER_PC:pageDryerPC,COOLER_PC:pageCoolerPC}[F];
  $('#preview').innerHTML=`<div class="ztool"><span class="note">ตัวอย่าง ${pages.length} หน้า · ${rows.length} แถว · ตัวสีน้ำเงิน = ค่าที่ระบบเติม (พิมพ์เป็นสีดำ)</span><span class="zb"><button onclick="zoomBy(-0.1)" title="ย่อ">−</button><button id="zLab" onclick="zoomFit()" title="พอดีจอ">พอดีจอ</button><button onclick="zoomBy(0.1)" title="ขยาย">＋</button></span></div>`+
    pages.map(p=>`<div class="paper doc">${fn(pad(p),h,s)}<div class="code">${S.boot.forms[F].code}</div></div>`).join('');

}
function fitBase(){const w=$('#preview');return w?Math.min(1,(w.clientWidth-(innerWidth<=860?20:36))/1080):1}
function fitZoom(){if(!$('#preview'))return;const z=S.pz||fitBase();$$('#preview .paper').forEach(p=>p.style.zoom=z);const zl=$('#zLab');if(zl)zl.textContent=S.pz?Math.round(z*100)+'%':'พอดีจอ'}
function zoomBy(d){S.pz=Math.max(0.25,Math.min(1.2,Math.round(((S.pz||fitBase())+d)*10)/10));fitZoom()}

function packShapes(r,withVals){   // ค่าตั้งต้น Die หลาย Shape ของฟอร์มพาเลท (จากพาเลทนี้ หรือพาเลทก่อนหน้า)
  const names=[];for(let k=1;k<=SHAPE_MAX;k++)if(r['Shape'+k+'_Name'])names.push(String(r['Shape'+k+'_Name']));
  const vals={};if(withVals)for(let k=2;k<=SHAPE_MAX;k++)[['Den','Density'],['Dim','Dimension'],['Len','Length'],['Thick','Thickness']].forEach(([a,b])=>{const v=r[b+k];if(v!==''&&v!==undefined&&v!==null)vals[a+k]=v});
  return{n:names.length>1?names.length:1,names,vals};
}
async function savePack(){
  const f=curFg();if(!f)return;
  const req={fgLotId:f.id,pallet:S.palSel,time:val('pkDate')&&val('pkTime')?val('pkDate')+' '+val('pkTime'):'',bin:val('pkBin'),total:val('pkTotal'),float:val('pkFloat'),
    density:val('pkDensity'),dim:val('pkDim'),len:val('pkLen'),thick:val('pkThick'),odor:segVal('pkOdor'),mix:val('pkMix'),net:val('pkNet'),atemp:val('pkAT'),ptemp:val('pkPT'),
    seal1:segVal('pkSeal1'),seal2:segVal('pkSeal2'),broken:val('pkBroken'),dust:val('pkDust'),over:val('pkOver'),under:val('pkUnder'),misshape:val('pkMis'),foreign:val('pkForeign'),stuck:val('pkStuck'),
    metal:segVal('pkMetal'),inspector:val('pkInsp'),comment:val('pkComment'),...shapesReq('pk')};
  const shErr=shapesCheck(req);if(shErr)return toast(shErr,1);
  try{S.packCtx=PK=await call('api_savePackQC',S.token,req);toast('บันทึกพาเลท '+req.pallet+' แล้ว'+(req.metal==='ไม่ผ่าน'?' · Metal Detector ไม่ผ่าน!':''),req.metal==='ไม่ผ่าน');
    const nx=PK.pallets.find(p=>!p.qc);S.palSel=nx?nx.pallet:req.pallet;renderPack()}catch(e){toast(e.message,1)}
}

<li>ต้นกะ: เข้าระบบ → กด ↻ → ตรวจ Lot ที่กำลังผลิตในหน้าหลัก</li>
<li>ทุกรอบเก็บ: บันทึก Moisture Extruder / Dryer / Cooler ตามรอบ</li>
<li>ทุกรอบเก็บ Fineness: บันทึกผลบด + Re-Grinding ถ้าไม่ผ่าน</li>
<li>เริ่ม Lot ใหม่: บันทึกหัวกระดาษ (รหัสเครื่อง / ตุ้ม / น้ำหนักที่ชั่งได้)</li>
<li>จบ Lot: QC-Lead ตรวจตัวอย่างเอกสาร → Review → ส่งออก .xlsx / พิมพ์</li>
</ol>`)}
<div class="note" style="text-align:center;margin:14px 0 4px">ติดปัญหาหรือพบค่าผิดปกติ แจ้ง QC-Lead / Admin</div>
</div>`;
}

/* ===================== USERS ===================== */
async function flushNow(){const b=document.getElementById('flushBtn');if(b)b.disabled=true;
  try{const r=await call('api_flushNow',S.token);toast('ลง Sheet แล้ว · แท็บหลัก '+r.main+' · แท็บ QC '+r.qc+(r.err&&r.err.length?' · ผิดพลาด '+r.err.length:''),r.err&&r.err.length?1:0);vUsers()}
  catch(e){toast(e.message,1);if(b)b.disabled=false}}
async function vUsers(){
  if(S.user.role!=='Admin'){$('#view').innerHTML='<div class="card empty">เฉพาะ Admin</div>';return}
  try{const list=await call('api_users',S.token);
    $('#view').innerHTML=`<div class="card"><div class="row"><div class="h3">ผู้ใช้ QC App</div><span style="margin-left:auto"></span><button class="btn p" onclick="userForm()">＋ เพิ่มผู้ใช้</button></div>
     <table class="t" style="margin-top:8px"><tr><th>ชื่อ</th><th>Role</th><th>สถานะ</th><th></th></tr>${list.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${u.active?'<span class="tag g">ใช้งาน</span>':'<span class="tag n">ปิด</span>'}${u.mustChange?' <span class="tag a">รอตั้ง PIN ใหม่</span>':''}</td><td><button class="btn g" style="height:28px" onclick='userForm(${JSON.stringify(u).replace(/'/g,"&#39;")})'>แก้ / รีเซ็ต PIN</button></td></tr>`).join('')}</table>
     <div class="note" style="margin-top:10px">QC = บันทึก + สเปก %MC/ขนาดเม็ด + ข้อมูลหลัก · QC-Lead = + Review + ปรับสเปกทุกรายการ · Admin = ทั้งหมด + ผู้ใช้ · Viewer = ดูอย่างเดียว</div></div>
     <div class="card" style="margin-top:12px"><div class="row"><div class="h3">ข้อมูลลง Google Sheet</div><span style="margin-left:auto"></span><button class="btn s" id="flushBtn" onclick="flushNow()">ส่งลง Sheet ตอนนี้</button></div>
      <div class="note" style="margin-top:6px">แอปบันทึกลง Supabase ทันที · คัดลอกลง Sheet (Moisture / Kibble / Grinding_Fineness / Product_Detail / แท็บ QC_*) อัตโนมัติทุก 1 ชม. · <span id="obCount">กำลังนับรายการที่รอ…</span></div></div>`;
    call('api_outboxCount',S.token).then(n=>{const e=document.getElementById('obCount');if(e)e.textContent=n<0?'นับรายการที่รอไม่ได้':'รอลง Sheet '+n+' รายการ (แท็บหลัก)'}).catch(()=>{});
  }catch(e){toast(e.message,1)}
}
function userForm(u){
  u=u||{id:'',name:'',role:'QC',active:true};
  modal(`<h2>${u.id?'แก้ผู้ใช้':'เพิ่มผู้ใช้'}</h2><div class="grid" style="gap:10px">
   <div><span class="lab">ชื่อ</span><input class="inp" id="ufName" value="${esc(u.name)}"></div>
   <div><span class="lab">Role</span><div class="seg" id="ufRole">${['QC','QC-Lead','Admin','Viewer'].map(r=>`<button data-v="${r}" class="${r===u.role?'on':''}">${r}</button>`).join('')}</div></div>
   <div><span class="lab">PIN 4 หลัก ${u.id?'(ว่าง = ไม่เปลี่ยน)':''}</span><input class="inp num" id="ufPin" maxlength="4" inputmode="numeric"><div class="note" style="margin-top:4px">PIN ที่ Admin ตั้ง = PIN ชั่วคราว · ผู้ใช้จะถูกให้ตั้ง PIN ของตัวเองตอนเข้าระบบครั้งแรก</div></div>
   ${u.id?`<div class="row" style="padding:10px 12px;border-radius:9px;background:var(--soft)"><span>ใช้งาน</span><button class="tg ${u.active?'on':''}" id="ufAct" style="margin-left:auto"></button></div>`:''}
   <div class="row" style="justify-content:flex-end"><button class="btn g" onclick="closeModal()">ยกเลิก</button><button class="btn p" id="ufSave">บันทึก</button></div></div>`);
  bindSeg($('#modal'));if($('#ufAct'))$('#ufAct').onclick=e=>e.target.classList.toggle('on');
  $('#ufSave').onclick=async()=>{try{await call('api_saveUser',S.token,{id:u.id,name:val('ufName'),role:segVal('ufRole'),pin:val('ufPin'),active:u.id?$('#ufAct').classList.contains('on'):true});closeModal();toast('บันทึกแล้ว');vUsers()}catch(e){toast(e.message,1)}};
}

/* เปลี่ยน PIN ของตัวเอง · force = ผู้ใช้ใหม่ / ถูกรีเซ็ต PIN (ต้องตั้งก่อนใช้งาน · PIN เดิม = ที่เพิ่งใส่ตอนเข้าระบบ) */
function pinForm(oldPin,force){
  S.modalLock=!!force;
  modal(`<h2>🔑 ${force?'ตั้ง PIN ของคุณ':'เปลี่ยน PIN'}</h2>
   ${force?`<div class="note" style="margin-bottom:10px">PIN นี้ Admin ตั้งให้ชั่วคราว — ตั้ง PIN 4 หลักของคุณเองก่อนเริ่มใช้งาน (คนอื่นจะไม่รู้ PIN ของคุณ)</div>`:''}
   <div class="grid" style="gap:10px">
    ${force?'':`<div><span class="lab">PIN เดิม</span><input class="inp num" id="pnOld" type="password" maxlength="4" inputmode="numeric" autocomplete="current-password"></div>`}
    <div><span class="lab">PIN ใหม่ 4 หลัก</span><input class="inp num" id="pnNew" type="password" maxlength="4" inputmode="numeric" autocomplete="new-password"></div>
    <div><span class="lab">ยืนยัน PIN ใหม่</span><input class="inp num" id="pnNew2" type="password" maxlength="4" inputmode="numeric" autocomplete="new-password"></div>
    <div class="note">ห้ามใช้เลขซ้ำ / เรียง เช่น 0000, 1111, 1234</div>
    <div class="row" style="justify-content:flex-end">${force?'<button class="btn g" onclick="S.modalLock=false;closeModal();logout()">ออกจากระบบ</button>':'<button class="btn g" onclick="closeModal()">ยกเลิก</button>'}<button class="btn p" id="pnSave">บันทึก PIN</button></div></div>`);
  ['pnOld','pnNew','pnNew2'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('input',()=>e.value=e.value.replace(/\D/g,''))});
  setTimeout(()=>{const e=document.getElementById(force?'pnNew':'pnOld');if(e)e.focus()},50);
  $('#pnSave').onclick=async()=>{
    const o=force?String(oldPin):val('pnOld'),n=val('pnNew'),n2=val('pnNew2');
    if(!/^\d{4}$/.test(o))return toast('ใส่ PIN เดิมให้ครบ 4 หลัก',1);
    if(!/^\d{4}$/.test(n))return toast('PIN ใหม่ต้องเป็นตัวเลข 4 หลัก',1);
    if(n!==n2)return toast('ยืนยัน PIN ใหม่ไม่ตรงกัน',1);
    try{await call('api_changePin',S.token,o,n);S.modalLock=false;closeModal();toast('เปลี่ยน PIN แล้ว · ครั้งหน้าใช้ PIN ใหม่')}catch(e){toast(e.message,1)}
  };
}

boot();
</script>
