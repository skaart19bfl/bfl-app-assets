/* ---------- poll guard (20 Nov 2026): apps kept alive in hidden frames (or with the screen off) don't poll for changes ----------
 * Same origin → the Hub wraps each app frame's fetch. Only "anything new?" checks are held: Supabase RPCs named *stamp and Apps Script
 * liveStamp / getStamp. They wait (one per kind per frame) until the frame is shown again, then run, so the app refreshes at once.
 * Reads, saves and logins always go straight through. */
const HUB_WAIT = [];
function hubHidden(f) { return document.hidden || !f.isConnected || f.style.display === 'none'; }
function hubRelease() {
  for (let i = HUB_WAIT.length - 1; i >= 0; i--) { const w = HUB_WAIT[i]; if (!w.f.isConnected || !hubHidden(w.f)) { HUB_WAIT.splice(i, 1); w.go(); } }
}
function hubGuard(f) {
  try {
    const w = f.contentWindow; if (!w || !w.fetch || w.__hubGuard) return;
    const real = w.fetch.bind(w), park = new Map();
    const pollKey = (u, o) => {
      const url = String((u && u.url) || u || ''), body = o && typeof o.body === 'string' ? o.body : '';
      if (/\/rest\/v1\/rpc\/[a-z0-9_]*stamp(\?|$)/i.test(url)) return url;
      if (/script\.google(usercontent)?\.com/.test(url) && /"fn":"(liveStamp|getStamp)"/.test(body)) return url + '|' + body.slice(0, 300);
      return null;
    };
    w.fetch = function (u, o) {
      const k = pollKey(u, o);
      if (!k || !hubHidden(f)) return real(u, o);
      let p = park.get(k);
      if (!p) { p = new Promise((go) => HUB_WAIT.push({ f, go })).then(() => { park.delete(k); return real(u, o); }); park.set(k, p); }
      return p.then((r) => r.clone());
    };
    w.__hubGuard = 1;
  } catch (e) { /* not same origin or not ready: the app polls as before */ }
}
document.addEventListener('visibilitychange', hubRelease);

/* ---------- render: the shell keeps app iframes alive, so switching tabs never reloads an app ---------- */
function render() {
  const root = document.getElementById('root');
  if (S.view !== 'app') { root.innerHTML = V[S.view](); return; }
  if (!document.getElementById('shell')) root.innerHTML = V.app();
  else { const tmp = document.createElement('div'); tmp.innerHTML = V.app(); const sh = document.getElementById('shell');
    sh.replaceChild(tmp.querySelector('.top'), sh.querySelector('.top')); sh.replaceChild(tmp.querySelector('.tabs'), sh.querySelector('.tabs')); }
  const st = document.getElementById('stage');
  let pg = st.querySelector('.page'); if (pg) pg.remove();
  st.querySelectorAll('iframe, .loading').forEach((f) => { f.style.display = f.dataset.app === S.tab ? '' : 'none'; });
  hubRelease();
  const tabApp = S.apps.find((x) => x.key === S.tab && x.frame === false);
  if (tabApp) st.insertAdjacentHTML('beforeend', '<div class="page"><div class="wrap col" style="max-width:460px;text-align:center;padding-top:48px">'
    + '<h2>' + esc(tabApp.name) + '</h2><span class="muted small">แอปนี้ต้อง login บัญชี Google จึงเปิดในหน้า Hub ไม่ได้ — เปิดเป็นแท็บใหม่' + (tabApp.sso ? ' และเข้าให้อัตโนมัติ' : '') + '</span>'
    + '<button class="primary" data-act="popout" style="min-height:56px;font-size:18px">เปิด ' + esc(tabApp.name) + ' ↗</button></div></div>');
  if (S.tab === 'home') { st.insertAdjacentHTML('beforeend', homeHtml()); loadSum(); }
  else if (S.tab === 'admin') st.insertAdjacentHTML('beforeend', adminHtml());
  else if (S.tab === 'md') st.insertAdjacentHTML('beforeend', mdHtml());
}
async function openApp(key, force) {
  const a = S.apps.find((x) => x.key === key); if (!a) return;
  if (a.frame === false) return; // opens in a new tab from its page (button → popout)
  const st = document.getElementById('stage'); let f = st.querySelector('iframe[data-app="' + key + '"]');
  if (f && !force) return;
  if (!a.url) { toast('ยังไม่ได้ตั้ง URL ของ ' + a.name + ' — แจ้ง Admin', true); return; }
  let url = a.url;
  if (a.sso) {
    const r = await rpc('hub_ticket', { p_token: tok(), p_app: key });
    if (!r.ok) { if (r.error === 'AUTH') return expired(); toast(r.error, true); return; }
    url += (url.indexOf('?') >= 0 ? '&' : '?') + 'hub=' + r.ticket;
  }
  if (f) f.remove();
  const ld = st.querySelector('.loading[data-app="' + key + '"]'); if (ld) ld.remove();
  st.insertAdjacentHTML('beforeend', '<div class="loading" data-app="' + key + '">กำลังเปิด ' + esc(a.name) + '…</div>');
  f = document.createElement('iframe'); f.dataset.app = key; f.src = url; f.allow = 'camera; microphone; clipboard-read; clipboard-write; fullscreen';
  f.addEventListener('load', () => { hubGuard(f); const l = st.querySelector('.loading[data-app="' + key + '"]'); if (l) l.remove(); });
  st.appendChild(f); render();
}

    const r = await rpc('hub_app_save', { p_token: tok(), p: { key: k, url: document.getElementById('url_' + k).value.trim() } });
    if (!r.ok) return toast(r.error, true);
    toast('บันทึกลิงก์แล้ว'); await loadApps(); await loadAdmin();
  },
};
async function loadAdmin() { const r = await rpc('hub_user_list', { p_token: tok() }); if (!r.ok) { if (r.error === 'AUTH') return expired(); return toast(r.error, true); } S.admin = r; render(); }
async function mdLoadList() {
  try { const r = await rpc('md_list', { p_token: tok() }); S.md.list = r.tabs; if (!S.md.tab && r.tabs.length) S.md.tab = (r.tabs.find((t) => t.ready) || r.tabs[0]).tab; render(); if (S.md.tab) await mdLoad(); }
  catch (e) { if (e.message === 'AUTH') return expired(); toast(e.message, true); }
}
async function mdLoad() {
  const t = S.md.tab;
  try { const r = await rpc('md_get', { p_token: tok(), p_tab: t }); if (S.md.tab !== t) return; S.md.data = r;
    const L = S.md.list && S.md.list.find((x) => x.tab === t); if (L && r.ok) { L.n = r.rows.length; L.ready = true; } render(); }
  catch (e) { if (e.message === 'AUTH') return expired(); S.md.data = { ok: false, error: e.message }; render(); }
}
async function loadApps() { const r = await rpc('hub_apps', { p_token: tok() }); if (!r.ok) return expired(); S.apps = r.apps; }
async function enter() { await loadApps(); S.tab = 'home'; go('app'); setTimeout(warmApps, 1500); }
/* GitHub Pages apps (user 10 Nov 2026): after login, quietly fetch each app's page into this browser (same store gas/boot.js reads,
 * gasp-page-<app>) and wake its Apps Script, so the first tap on an app does not wait ~2 s for the page or a cold script.
 * One app at a time; an app whose page has not changed costs one small request. */
let warming = false;
async function warmApps() {
  if (warming) return; warming = true;
  const base = new URL('../', location.href).href;
  try {
    for (const a of S.apps) {
      if (!a.url || a.url.indexOf(base) !== 0) continue;
      try {
        const html = await (await fetch(a.url.split('?')[0], { cache: 'no-cache' })).text();
        const key = (/data-key="([^"]+)"/.exec(html) || [])[1], exec = (/data-exec="([^"]+)"/.exec(html) || [])[1];
        if (!key || !exec) continue;
        const lsk = 'gasp-page-' + key; let old = null; try { old = JSON.parse(localStorage.getItem(lsk) || 'null'); } catch (e) {}
        const r = await fetch(exec, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: '__page', hash: old && old.hash }) });
        const j = await r.json();
        if (j.ok && j.v && j.v.html) { try { localStorage.setItem(lsk, JSON.stringify({ hash: j.v.hash, html: j.v.html, at: Date.now() })); } catch (e) {} }
        // apps with a read cache (Production) fill it now, while nobody waits; the others answer "no such function"
        fetch(exec, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: '__warm' }) }).catch(() => {});
      } catch (e) { /* the app still loads its page itself when opened */ }
    }
  } finally { warming = false; }
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  const f = ACT[el.dataset.act]; if (f) Promise.resolve(f(el.dataset.arg)).catch((e) => toast(e.message, true));
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset.act === 'shared') return ACT.shared(el);
  if (el.dataset.md && S.md.edit) { const c = S.md.data.cfg;
    if (el.dataset.md === '__flag') S.md.edit.d[c.flag] = c.flagYN ? (el.checked ? 'Y' : 'N') : el.checked; else S.md.edit.d[el.dataset.md] = el.value; return; }
  if (el.dataset.in && S.edit) { const k = el.dataset.in, v = el.type === 'checkbox' ? el.checked : el.value;
    if (k.indexOf('app_') === 0) { S.edit.apps = S.edit.apps || {}; S.edit.apps[k.slice(4)] = v; } else S.edit[k] = v; }
});
document.addEventListener('input', (ev) => { const el = ev.target;
  if (el.id === 'mdq') { const q = el.value.trim().toLowerCase(); document.querySelectorAll('.md tr[data-q]').forEach((tr) => { tr.style.display = !q || tr.dataset.q.indexOf(q) >= 0 ? '' : 'none'; }); return; }
  if (el.dataset.md && S.md.edit && el.type !== 'checkbox') { S.md.edit.d[el.dataset.md] = el.value; return; } if (el.dataset.in && S.edit && el.type !== 'checkbox' && el.tagName !== 'SELECT') { const k = el.dataset.in; if (k.indexOf('app_') === 0) { S.edit.apps[k.slice(4)] = el.value; } else S.edit[k] = el.value; } });
document.addEventListener('keydown', (ev) => { const padView = S.view === 'pin' || S.view === 'newpin' || (S.view === 'setup' && S.setupName); if (!padView) return; if (/^\d$/.test(ev.key)) ACT.key(ev.key); else if (ev.key === 'Backspace') ACT.del(); });
// shared device: end of shift → back to the login screen (checked every 30 s)
setInterval(() => { if (S.session && S.session.exp && Date.now() > S.session.exp) expired(); }, 30000);

async function start() {
  S.view = 'loading'; render();
  try {
    if (S.session && S.session.token) {
      const r = await rpc('hub_me', { p_token: S.session.token });
      if (r.ok) { S.session.me = r.me; S.session.exp = r.exp; LS.set('hub-session', S.session); if (r.me.must_change) { S.oldPin = ''; S.pin1 = ''; return go('newpin'); } return enter(); }
      clearSession();
    }
    const st = await rpc('hub_status');
    if (!st.has_admin) return go('setup');
    S.names = await rpc('hub_login_list'); go('login');
  } catch (e) { S.view = 'login'; S.names = []; S.err = e.message; render(); }
}
start();
</script>
