<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1A1D21;--muted:#3D4650;--line:#D9DCD6;--line2:#EEF0EC;--bg:#F3F4F1;--navy:#1F3A5F;--navy2:#2E5682;--sky:#E3EAF5;--go:#0B6B5A;--go-bg:#DCF0EA;--amber:#B45309;--amber-bg:#FBEFD5;--red:#A8261B;--red-bg:#FBE4E1;--soft:#FFF7E6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono',monospace}
#app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:3px 6px;display:flex;align-items:center}
.logo img{height:34px;display:block}
.top .who{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:140px}
.top .who b{font-size:17px}
.top .who span{font-size:12px;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.c-fg{background:var(--go-bg);color:#0B5B4D}.c-wip,.c-semi{background:var(--amber-bg);color:#7A4900}.c-hold{background:var(--red-bg);color:#97231A}.c-navy{background:var(--navy2);color:#fff}.c-sky{background:var(--sky);color:var(--navy)}.c-warn{background:var(--soft);color:#7A3A05;border:1px solid #E7C27A}
.ghost{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #6F8DB3;background:transparent;color:#fff}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{min-height:40px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:#DCE4EE}
.nav button.on{background:var(--navy2);color:#fff;font-weight:600}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.sum3 .card{display:flex;flex-direction:column;gap:2px;padding:12px;text-align:left;min-width:0}
.sum3 .big{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--navy);line-height:1.15}.sum3 .sub{font-size:12px;color:var(--muted)}
.mon .li{gap:10px}.mon .dot{width:10px;height:10px;border-radius:5px;flex:none}
.job{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:88px;text-align:left;width:100%}
.job.main{border:2px solid var(--navy)}
.job .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.job .t{flex:1;display:flex;flex-direction:column;gap:2px}
.job .t b{font-size:17px}.job .t span{font-size:13px;color:var(--muted)}
.job .n{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600}
.job.off{background:#EEF0EC;border-style:dashed;min-height:64px}
h1{margin:0;font-size:22px}
h2{margin:0;font-size:17px}
.muted{color:var(--muted);font-size:13px}
.btn{min-height:52px;border-radius:14px;border:0;background:var(--navy);color:#fff;font-size:16px;font-weight:700;padding:0 18px}
.btn.go{background:var(--go)}.btn.red{background:var(--red)}.btn.line{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{background:#8FA3B8}
.sm{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid #B9BEB6;background:#fff;font-size:14px}
.pill{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid #B9BEB6;background:#fff;font-size:14px}
.pill.on{border:2px solid var(--navy);background:var(--sky);color:var(--navy);font-weight:700}
.pill.hold.on{border-color:var(--red);background:var(--red-bg);color:#97231A}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2);min-height:52px}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}
.li.warn{background:var(--soft)}
.cb{width:24px;height:24px;accent-color:var(--navy);flex:none}
.qty{width:72px;min-height:40px;border-radius:8px;border:1px solid #B9BEB6;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:16px}
.qty.off{border-color:var(--amber);color:#7A3A05;background:var(--soft)}
.lcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.lc{background:#fff;border:1px solid var(--line);border-left:6px solid var(--go);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:stretch;transition:box-shadow .15s}
.lc:hover{box-shadow:0 2px 10px rgba(31,58,95,.12)}.lc.t-hold{border-left-color:var(--red)}.lc.t-wip,.lc.t-semi{border-left-color:var(--amber)}
.lc-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.lc-n{font-size:14px;line-height:1.3}
.lc-c{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px;padding-left:12px;border-left:1px dashed var(--line);font-size:12px;text-align:center}
.lc-c b{font-family:'IBM Plex Mono',monospace;font-size:30px;line-height:1;color:var(--navy)}
.rgs{display:flex;flex-wrap:wrap;gap:4px}.rg{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--sky);color:var(--navy);border-radius:6px;padding:2px 7px}.rg.more{background:var(--line2);color:var(--muted)}
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line2)}.tbar .on{background:var(--navy);color:#fff}
.tday{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0;font-size:13px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;padding:10px 12px 12px}
.tile{min-height:60px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:'IBM Plex Mono',monospace;padding:4px;cursor:pointer}
.tile b{font-size:16px}.tile span{font-size:11px;opacity:.8}.tile.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tile.bad{border-color:var(--amber);background:var(--soft);color:#7A3A05}.tile.on.bad{background:var(--amber);border-color:var(--amber);color:#fff}
.tile .qty{width:62px;min-height:32px;font-size:15px;color:var(--ink)}
.hs{border-bottom:1px solid var(--line2)}.hs:last-child{border-bottom:0}.hh{width:100%;border:0;background:none;font:inherit;color:inherit}.hb{padding:4px 12px 14px}
.hstep{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line2)}.hstep:first-child{border-top:0}.hstep p{margin:4px 0 8px;font-size:16px;line-height:1.5}
.hn{flex:none;width:30px;height:30px;border-radius:15px;background:#E0241B;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.himg{display:block;width:100%;max-width:360px;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}div.himg{height:120px}
.mapw{padding:8px;overflow:auto}.map{width:100%;min-width:640px;height:auto;display:block;font-family:'IBM Plex Sans Thai',sans-serif}
.map .ms{cursor:pointer}.map .mb{fill:transparent;stroke:transparent;stroke-width:4}.map .ms:hover .mb{stroke:#9DB3D3}.map .pk .mb{stroke:var(--navy);fill:rgba(31,58,95,.06)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px}
input.txt,select.txt{min-height:44px;border-radius:10px;border:1px solid #B9BEB6;padding:0 10px;background:#fff;width:100%;font-size:15px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.bar{position:sticky;bottom:var(--bn,0px);z-index:3;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .btn{flex:1}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:4;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#555B61;min-height:54px;border:0;background:transparent}
.bnav button.on{color:var(--navy);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td.r,th.r{text-align:right;font-family:'IBM Plex Mono',monospace}
.scroll{overflow-x:auto}.rep th,.rep td{white-space:nowrap}.rep td.w{white-space:normal;min-width:200px}
.ropt{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start}.ropt>b{padding-top:8px;font-size:14px}@media(max-width:560px){.ropt{grid-template-columns:1fr;gap:4px}.ropt>b{padding-top:0}}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{min-height:60px;border-radius:14px;border:1px solid var(--line);background:#fff;font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid #8A9099}
.dots span.on{background:var(--navy);border-color:var(--navy)}
.who-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.who-b{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left}
.who-b.on{border:2px solid var(--navy);background:var(--sky)}
.av{width:32px;height:32px;border-radius:50%;background:#D9DCD6;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:9;max-width:92vw;text-align:center}
.toast.err{background:#97231A}
.spin{padding:40px;text-align:center;color:var(--muted)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi .card b{font-family:'IBM Plex Mono',monospace;font-size:24px;display:block}
.lotg{border-bottom:1px solid var(--line2)}.lotg:last-child{border-bottom:0}.lotg .li{border-bottom:0}.lotg .sub{background:#FAFBF9;padding:0 0 6px 34px}
input.date{min-height:44px;border-radius:10px;border:1px solid #B9BEB6;padding:0 8px;background:#fff;font-size:15px}
.neg{color:var(--red)}
@media (min-width:900px){.bnav{display:none}.only-m{display:none}}
@media (max-width:899px){:root{--bn:64px}#app{padding-bottom:calc(64px + env(safe-area-inset-bottom))}.top .nav{display:none}.top{gap:8px}.top .ghost{padding:0 10px}.only-d{display:none}td,th{padding:7px 6px}table{font-size:13px}}
</style>
</head>
<body>
<div id="app"><div class="spin">กำลังโหลด…</div></div>
<script>
// a page error goes to the server log (Executions → clientLog) so a blank page on someone's phone can be diagnosed
function stockLog(m) { fetch('https://kdytxuufvigwjccebrki.supabase.co/rest/v1/rpc/stock_client_log', { method: 'POST', headers: { apikey: 'sb_publishable_IYCMIaN7tJleWINprA42CQ_dX10sXFF', 'Content-Type': 'application/json' }, body: JSON.stringify({ p_msg: String(m).slice(0, 500) }) }).catch(() => {}); }
window.addEventListener('error', function (e) { try { stockLog(String(e.message) + ' @' + e.lineno + ':' + e.colno + ' ' + navigator.userAgent); } catch (x) {} });
window.addEventListener('unhandledrejection', function (e) { try { stockLog('rejection ' + String(e.reason && (e.reason.stack || e.reason.message) || e.reason).slice(0, 300) + ' ' + navigator.userAgent); } catch (x) {} });
</script>

// Home monitor: the day's receive / issue / load totals, then what needs follow-up. Tiles open the report for that day.
const RC_TH = { 'RC-PK': 'รับจาก PD', 'RC-PD': 'รับคืนจาก PD', 'RC-PC': 'รับจาก PC', 'RC-RP': 'รับงานรีแพค', 'RC-RT': 'รับคืนจากลูกค้า', 'RC-OT': 'รับเข้าอื่นๆ' };
const sumOf = (a, k) => a.reduce((t, x) => t + (x[k] || 0), 0);
const hgo = (v, f) => `data-act="hgo" data-arg="${esc(JSON.stringify({ v, f: f || {} }))}"`;
function homeSum(d) {
  if (!d.rc) return '';
  const day = d.day, yd = new Date(new Date(d.today + 'T12:00:00Z').getTime() - 864e5).toISOString().slice(0, 10), rf = (k) => ({ rk: k, rsrc: 'app', from: day, to: day });
  const isLd = d.loaded, trucks = new Set(isLd.map((x) => x.veh).filter(Boolean)).size;
  const rcBy = {}; d.rc.forEach((r) => { rcBy[r.st] = (rcBy[r.st] || 0) + r.qty; });
  const line = (arr, lab) => arr.map((r) => `<span>${esc(lab(r))} <b class="mono">${fmt(r.qty)}</b></span>`).join(' · ');
  const tile = (go, title, big, unit, sub, detail) => `<button class="card tap" ${go}><span class="muted" style="font-size:13px">${title}</span><span class="big">${big}</span><span class="sub">${unit}</span><span class="sub">${sub}</span>${detail ? `<span class="sub" style="margin-top:4px">${detail}</span>` : ''}</button>`;
  const m = d.mon, hrs = m.wait.oldest ? Math.floor((Date.now() - m.wait.oldest) / 36e5) : 0, dup = isLd.filter((x) => x.dup).length;
  const row = (lvl, title, sub, go) => `<div class="li ${go ? 'tap' : ''}" ${go || ''}><span class="dot" style="background:${lvl === 'red' ? 'var(--red)' : lvl === 'amber' ? 'var(--amber)' : 'var(--navy2)'}"></span><span style="flex:1;display:flex;flex-direction:column;min-width:0"><b>${title}</b><span class="muted" style="font-size:12px">${sub}</span></span>${go ? '<span class="muted">›</span>' : ''}</div>`;
  const c = S.me.caps, alerts = [
    d.pending.pallets && row('navy', `รอรับจาก PD ${fmt(d.pending.pallets)} พาเลท`, `${d.pending.lots} ล็อต ที่ทีมแพคกดหยุดแล้ว`, (c.Recv_PD || c.Master) && hgo('recv')),
    m.ret && m.ret.n && row('red', `WIP ที่แอปแพคทำ Return แล้ว ${m.ret.n} พาเลท · ${fmt(m.ret.kg)} kg`, 'รอรับ + จ่ายออกให้ PD (หน้า รับจาก PD)', (c.Recv_PD || c.Master) && hgo('recv')),
    m.wait.docs && row(hrs >= 24 ? 'red' : 'amber', `รอโหลดขึ้นรถ ${m.wait.docs} ใบ · ${fmt(m.wait.qty)} หน่วย`, `ใบเก่าสุดจ่ายมาแล้ว ${hrs >= 1 ? hrs + ' ชม.' : 'ไม่ถึง 1 ชม.'}${hrs >= 24 ? ' — ค้างเกิน 1 วัน' : ''}`, hgo('load')),
    m.open && row('navy', `ใบจ่ายที่เปิดไว้ ยังไม่จัดพาเลท ${m.open} ใบ`, 'สร้างหัวใบแล้ว รอเลือกพาเลท', hgo('issue')),
    d.mismatch && row('amber', `ยอดไม่ตรง ${d.mismatch} พาเลท`, 'นับรับเข้าไม่ตรง PD — รอ PD ยืนยัน', ''),
    m.notag.length && row('amber', `ใบที่ยังไม่มีเลขพาเลท ${m.notag.length} ใบ`, `แตะเลขใบเพื่อเติมเลข: ${m.notag.slice(0, 8).map((n) => `<a href="#" data-act="docv" data-arg="${esc(n)}" class="mono">${esc(n)}</a>`).join(' ')}${m.notag.length > 8 ? ' …' : ''}`, ''),
    dup && row('amber', `รถคันเดียวกันมีหลายใบโหลด ${dup} ใบ`, 'ดูรายการรถด้านล่าง แล้วรวมเป็นใบเดียวที่หน้าใบ (admin)', ''),
    m.editUntil && c.Master && row('amber', `เปิดสิทธิ์แก้ข้อมูลย้อนหลังถึง ${dtm(m.editUntil)}`, `โดย ${esc(m.editBy || 'admin')} · แก้รายการเก่ากว่า 7 วันได้ชั่วคราว · ปิดได้ที่หน้า ผู้ใช้และสิทธิ์`, null),
    m.semiTemp && c.Master && row('amber', 'คลัง SEMI (WH-SEMI) ยังใช้ช่องเก็บชั่วคราว', 'ใส่ช่องเก็บจริงในแท็บ Location ของไฟล์ BFL Stock (Warehouse = WH-SEMI) · ช่องชั่วคราวมีหมายเหตุ "ชั่วคราว" ลบหรือแก้ได้', null),
    m.exp.n && row(m.exp.gone ? 'red' : 'amber', `ใกล้หมดอายุ ${fmt(m.exp.n)} พาเลท · ${fmt(m.exp.kg)} kg`, (m.exp.gone ? `หมดอายุแล้ว ${m.exp.gone} พาเลท · ` : '') + 'อายุเหลือไม่ถึง 1/3 ของอายุสินค้า (ไม่มีวันผลิต: เหลือไม่ถึง ' + m.days.EXP_DAYS + ' วัน)', hgo('report', { rk: 'bal', rsrc: 'app', from: d.today, to: d.today })),
    m.old.n && row('navy', `FG ค้างคลังเกิน ${m.days.OLD_DAYS} วัน ${fmt(m.old.n)} พาเลท · ${fmt(m.old.kg)} kg`, 'นับจากวันผลิต — ดูรายงานคงเหลือ (อายุเกิน)', hgo('report', { rk: 'bal', rsrc: 'app', from: d.today, to: d.today, rage: String(m.days.OLD_DAYS) }))].filter(Boolean);
  return `<div class="row" style="gap:6px;flex-wrap:wrap"><button class="pill ${day === d.today ? 'on' : ''}" data-act="hday" data-arg="">วันนี้</button><button class="pill ${day === yd ? 'on' : ''}" data-act="hday" data-arg="${yd}">เมื่อวาน</button><input type="date" class="date" data-date="hday" value="${esc(day)}" max="${esc(d.today)}" aria-label="เลือกวันผลิต"></div>
  <div class="sum3">
  ${tile(hgo('report', rf('in')), 'รับเข้า', fmt(sumOf(d.rc, 'n')), 'พาเลท', `${fmt(sumOf(d.rc, 'qty'))} หน่วย · ${fmt(sumOf(d.rc, 'kg'))} kg`, Object.keys(rcBy).map((k) => `${esc(TL[k] || k)} ${fmt(rcBy[k])}`).join(' · '))}
  ${tile(hgo('report', rf('out')), 'จ่ายออก (ตัดยอด)', fmt(sumOf(d.iss, 'qty')), 'หน่วย', `${fmt(sumOf(d.iss, 'kg'))} kg · ${sumOf(d.iss, 'docs')} ใบ`, line(d.iss, (r) => TYPE_TH[r.t] || r.t))}
  ${tile(hgo('load'), 'โหลดขึ้นรถ', String(isLd.length), 'ใบ', `${trucks} คัน · ${fmt(sumOf(isLd, 'qty'))} หน่วย`, `${fmt(sumOf(isLd, 'kg'))} kg`)}
  </div>
  ${d.rc.length ? `<span class="muted" style="font-size:12px">รับเข้าตามประเภท: ${line(Object.values(d.rc.reduce((g, r) => { (g[r.t] = g[r.t] || { t: r.t, qty: 0 }).qty += r.qty; return g; }, {})), (r) => RC_TH[r.t] || r.t)}</span>` : ''}
  <div class="card mon" style="padding:0"><div class="tbar"><b style="flex:1">ต้องติดตาม</b><span class="muted" style="font-size:12px">ณ ตอนนี้</span></div>
  <div class="list" style="border:0">${alerts.join('') || row('navy', 'ไม่มีเรื่องค้าง', 'ไม่มีของรอรับ รอโหลด ยอดไม่ตรง หรือใบที่ขาดเลขพาเลท', '')}</div></div>`;
}

function printDoc(title, pages, land, css) {

    ['บนสุดของหน้าแรก = <b>สรุปประจำวันผลิต</b> (08:00 → 07:59) · เลือกวันนี้ / เมื่อวาน / วันอื่น (เลข 1) · ยอด<b>รับเข้า</b> · <b>จ่ายออก</b> · <b>โหลดขึ้นรถ</b> (เลข 2) แตะกล่องเพื่อเปิดรายงานของวันนั้น · <b>ต้องติดตาม</b> (เลข 3) = ของรอรับ รอโหลด ยอดไม่ตรง ใบที่ยังไม่มีเลขพาเลท รถคันเดียวหลายใบ ของใกล้หมดอายุ FG ค้างนาน — แตะเพื่อไปทำต่อ · ด้านล่างมีรายการรถที่โหลดแล้วของวันนั้น', '04b-home-sum'],
    ['มุมขวาบนทุกหน้า: <b>↻</b> = โหลดข้อมูลหน้านี้ใหม่ (คอมพิวเตอร์แสดงเวลาที่โหลดล่าสุดข้างปุ่ม) · <b>?</b> = คู่มือนี้ · <b>ออก</b> = ออกจากระบบ · แอปดึงข้อมูลใหม่ทุกครั้งที่เปิดหน้า เปิดค้างไว้นานให้กด ↻']]],
  ['3. รับของจาก PD', [
    ['กดปุ่มชนิดของ เช่น <b>FG</b> (เลข 1) แล้วแตะการ์ด Lot ที่จะรับ (เลข 2) · ไม่เห็นของใหม่ กด <b>↻ โหลดใหม่</b>', '05-recv-list'],
    ['กล่อง<b>สีน้ำเงินเข้ม</b> = เลือกแล้ว · แตะกล่อง = เปลี่ยน (เลข 1) · <b>ทั้งหมด</b> = เลือกทุกพาเลท (เลข 2) · เลือกบางเลข พิมพ์ เช่น 1-5 แล้วกด <b>เลือกช่วง</b> (เลข 3) · ใต้เลขพาเลทมี <b>▤ ไม้ / ▣ เหล็ก</b> = ประเภทพาเลทที่ทีมแพคบันทึก (ไม่ได้บันทึก = ตามเอกสาร BFL เหล็ก · BFL-PC ไม้)', '06-recv-tiles'],
    ['นับไม่ตรงกับ PD เท่านั้น: กด <b>แก้จำนวนที่นับ</b> (เลข 1) พิมพ์จำนวนที่นับได้ (เลข 2) กล่องจะเป็น<b>สีส้ม</b> แล้วกด <b>✓ เสร็จ</b>', '07-recv-count'],
    ['เลือกช่องเก็บ (เลข 1) แล้วกดปุ่มสีเขียว <b>รับเข้า</b> (เลข 2) · ช่องเก็บขึ้นตามคลังของของ: FG = WH-FG · WIP / Hold = WH-WIP · SEMI = WH-SEMI · ของ Hold ต้องเลือกเหตุผล · WIP เลือกกลุ่ม ด้านคุณภาพ / ด้านกายภาพ', '08-recv-loc'],
    ['<b>วันที่-เวลารับ</b> (เลข 1): ปกติ<b>ไม่ต้องแก้</b> = เวลาที่กดรับ · รับจริงตอนอื่น (เช่น รับตอนตี 3 แต่มาบันทึกตอน 8 โมง) แก้เป็นเวลาจริงได้ ย้อนหลังไม่เกิน 7 วัน และ<b>ต้องไม่ก่อนเวลาที่แพคเสร็จ</b> · ดู <b>เข้ายอดวันผลิต</b> (เลข 2) ก่อนกดทุกครั้ง · วันผลิต = 08:00 ถึง 07:59 ของวันถัดไป เช่น 20/10 06:30 = วันผลิต 19/10 · แก้แล้วอยากกลับเป็นตอนนี้ กด <b>ใช้เวลาตอนนี้</b>', '08b-recv-at'],
    ['เสร็จแล้วจะมีกล่องดำบอก "รับเข้า … พาเลท" และ Lot นั้นหายจากรายการรอรับ', '09-recv-done'],
    ['<b>WIP ที่แอปแพคทำ Return แล้ว</b> (PD เอากลับไปทำใหม่ เช่น เทรีดาย ร่อนอาหาร): ขึ้นกล่องกรอบแดงบนสุดของหน้ารับจาก PD และไม่อยู่ในรายการรับปกติ · กด <b>รับ + จ่ายออกให้ PD ทั้งหมด</b> ครั้งเดียว ระบบรับเข้า WIP แล้วจ่ายให้ PD ทันที ได้ใบ PD… · WIP ที่รับไว้แล้วแต่ Pack ทำ Return ทีหลังก็ขึ้นในกล่องนี้ด้วย']]],
  ['4. เตรียมโหลด: สร้างใบจ่าย + เลือกพาเลท', [
    ['ที่หน้า <b>จ่าย</b> กด <b>+ ใบใหม่</b> (เลข 1) แล้วเลือก <b>ขาย</b> (เลข 2) · แถวบน (ขาย / โอนไป PC) = ไปรอที่ Loading ยอดยังไม่ตัด · แถวล่าง (เช่น จ่ายไป Repack) = ตัดยอดทันที ไม่ต้องโหลด (ดูข้อ 7)', '10-issue-type'],
    ['กรอกหัวใบ<b>ครั้งเดียว</b>: ลูกค้า (เลข 1) · เลขที่ใบสั่งขาย SO (เลข 2) · ทะเบียนรถ (เลข 3) ยังไม่รู้คันใส่ทีหลังได้ · เลื่อนลงใส่<b>วันที่ส่ง</b> · ช่องที่มี * ต้องใส่', '13-issue-form'],
    ['พิมพ์หา Lot หรือชื่อสินค้า (เลข 1) แล้วแตะ Lot (เลข 2) · Lot ที่ผลิตก่อนอยู่บนสุด', '11-issue-lot'],
    ['ติ๊กพาเลทที่จะส่ง (เลข 1) · ส่งไม่หมดพาเลท แก้ตัวเลขในกล่อง (เลข 2) · กดปุ่ม <b>สร้างใบ + จ่ายไป Loading</b> (เลข 3) · พาเลทที่รับจาก PD มีเลขพาเลทอยู่แล้ว ไม่ต้องใส่', '12-issue-pick'],
    ['<b>พาเลท OP… = ของยกมาจากนับ 17/10 ยังไม่มีเลขพาเลท</b> ติ๊กแล้วมีกล่องสีเหลือง: ใส่<b>เลขพาเลทจริง</b> (เลข 1) + <b>จำนวน</b> (เลข 2) · หลายพาเลท กด <b>+ เพิ่มพาเลท</b> (เลข 3) · รวมไม่เกินที่มี · ไม่ใส่กดจ่ายไม่ได้ · เลขนี้ขึ้นในใบจ่ายและรายงาน LOAD', '12b-issue-tag'],
    ['ใบจะเปิดค้างไว้ อยากเพิ่มของเข้าใบเดิม: ติ๊กพาเลทเพิ่ม (เลข 1) แล้วกด <b>เพิ่ม … เข้า LD…</b> (เลข 2) · ทำกี่รอบก็ได้ <b>ไม่ต้องพิมพ์ลูกค้า / ทะเบียนซ้ำ</b>', '13c-order-add'],
    ['ใบที่ยังไม่โหลดอยู่ด้านบนหน้าจ่ายเสมอ แตะใบ (เลข 1) เพื่อเปิด · เห็นรายการพาเลทในใบ (เลข 2) · รู้ทะเบียนรถทีหลัง หรือเปลี่ยนวันส่ง กด <b>แก้ไขหัวใบ</b> (เลข 3)', '13b-order'],
    ['พิมพ์<b>ใบโหลดสินค้า</b>ให้คนยก: หน้าแรก → <b>เอกสาร / ฟอร์ม</b> → ปุ่มใบโหลด (LD…) แล้วยกพาเลทจริงไปวางที่ลาน Loading ตามใบ', '23-forms'],
    ['<b>1 ใบ = รถ 1 คัน / พ่วง</b> · ลูกค้าเดียวมา 2 คัน ให้สร้าง 2 ใบ · รถคันเดียวเผลอเปิดหลายใบ รวมเป็นใบเดียวได้หลังโหลด (ข้อ 6) · ใบที่ยังไม่มีพาเลท กด <b>ยกเลิกใบนี้</b> ได้']]],
  ['5. รถมาแล้ว: Load ขึ้นรถ', [
    ['ที่ปุ่ม <b>Load</b> ด้านล่าง แตะใบจ่ายที่จะโหลด (เลข 1) · ด้านล่างมีใบที่สร้างไว้แต่ยังไม่จัดพาเลท และใบที่โหลดแล้ว 3 วันล่าสุด', '14-load-list'],
    ['เช็กพาเลทที่ขึ้นรถจริง (เลข 1) ไม่ได้ขึ้น เอาเครื่องหมายออก ระบบคืนช่องเดิมให้เอง · ทะเบียนขึ้นจากใบให้แล้ว เปลี่ยนคันแก้ได้ (เลข 2) · กดปุ่มสีเขียว <b>ยืนยันโหลดขึ้นรถ</b> (เลข 3) ยอดตัดทันที', '15-load-doc'],
    ['ใบที่จ่ายไว้ก่อนมีระบบเลขพาเลท: แถวที่ยังไม่มีเลขมี<b>กล่องสีเหลือง</b> ใส่เลขพาเลท (เลข 1) + จำนวน (เลข 2) กด + เพิ่มพาเลท ได้ · <b>รวมต้องเท่ากับยอดที่ Loading</b> ก่อนกดยืนยัน (เลข 3)', '15b-load-tag'],
    ['โหลดแล้วเพิ่มของเข้าใบนั้นไม่ได้ · ต้องส่งเพิ่ม สร้างใบใหม่ · พิมพ์ใบจ่าย / ใบส่งของจาก <b>เอกสาร / ฟอร์ม</b> หรือจากหน้ารายละเอียดใบ (ข้อ 6) ให้รถถือไป']]],
  ['6. รายละเอียดใบจ่าย · เติมเลขพาเลท · รวมใบ · แก้ข้อมูลผิด', [
    ['แตะใบจาก <b>ใบจ่ายล่าสุด</b> (หน้าจ่าย) หรือ <b>โหลดแล้ว</b> (หน้า Load) · เห็นหัวใบ ลูกค้า SO ทะเบียน ใครจ่าย ใครโหลด (เลข 1) · รายการพาเลทพร้อมเลขพาเลท (เลข 2) · ใต้รายการมีปุ่มพิมพ์ <b>รายงาน LOAD</b> / <b>ใบจ่ายออก</b>', '25-doc'],
    ['ใบที่จ่าย / โหลดไปแล้วแต่ไม่มีเลขพาเลท (เช่น ใบ 17/10): กด <b>✎ ใส่ / แก้เลขพาเลท</b> ใส่เลข (เลข 1) + จำนวน (เลข 2) · 1 แถวแยกเป็นหลายพาเลทได้ กด + เพิ่มพาเลท (เลข 3) · กด <b>บันทึกเลขพาเลท</b> (เลข 4) · <b>ยอดรวมต้องเท่าเดิม</b> ยอดคงคลังไม่เปลี่ยน · เลขจากการรับเข้า PD แก้ไม่ได้', '25b-doc-tag'],
    ['admin: รถคันเดียวกันมีหลายใบที่โหลดแล้ว (ภายใน 24 ชม.) จะมีกล่อง <b>รวมเป็นใบเดียว</b> · ติ๊กใบที่จะรวม (เลข 1) กด <b>รวมใบที่เลือก</b> (เลข 2) · รวมได้เฉพาะทะเบียน ประเภท และลูกค้าเดียวกัน · ใบอื่นขึ้นว่า "รวมเข้า …"', '25c-doc-merge'],
    ['<b>ใส่ข้อมูลผิด แก้ได้</b> (admin / WH-admin): กด <b>✎ แก้ไขข้อมูลใบ</b> แก้ <b>เลขที่ใบแจ้งรับสินค้า / SO</b> (เลข 1) <b>ทะเบียนรถ</b> (เลข 2) ลูกค้า ผู้รับ วันที่ส่ง <b>วัน-เวลาจ่าย / วัน-เวลาโหลด</b> · ใส่<b>เหตุผลที่แก้</b> (เลข 3) แล้วเลื่อนลงกด <b>บันทึก</b> · ใช้ได้ทั้งใบที่รอโหลด จ่ายแล้ว และโหลดแล้ว · ประวัติการแก้ขึ้นในหมายเหตุของใบ', '25d-doc-edit'],
    ['<b>จำนวนผิด</b>: กด <b>✎</b> ท้ายแถว (เลข 1) ใส่จำนวนที่ถูก (เลข 2) + เหตุผล (เลข 3) กด <b>บันทึกการแก้</b> (เลข 4) · แก้ที่รายการเดิม ยอดของวันนั้นเปลี่ยนตาม คงคลังพาเลทปรับให้เอง (จ่ายน้อยลง ของที่เหลือกลับเข้าช่องเดิม) · <b>รับเข้าผิด</b> แก้ที่ Stock card ของ Lot นั้น (กด ✎ ท้ายแถวรับ) · ย้อนหลังได้ <b>7 วัน</b> เกินนั้นให้ admin เปิดสิทธิ์ชั่วคราวที่หน้า <b>ผู้ใช้และสิทธิ์</b>', '25e-doc-qty'],
    ['<b>ลบรายการโหลด</b> (admin / WH-admin · ใบที่โหลดแล้ว): พาเลทที่ไม่ได้ขึ้นรถจริง กด <b>🗑</b> ท้ายแถว · ไม่ได้โหลดทั้งใบ กด <b>🗑 ลบใบโหลดนี้</b> · ใส่เหตุผล กด <b>ยืนยันลบ</b> · พาเลทกลับเข้าช่องเดิมก่อนไป Loading ยอดจ่ายวันนั้นลดลง · ลบหมดทุกพาเลท ใบเป็น <b>ยกเลิก</b> · ประวัติว่าใครลบขึ้นในหมายเหตุของใบ · ใบที่ยังรอโหลด ใช้ <b>ยกเลิกใบ</b> ที่หน้า Load']]],
  ['7. จ่ายอื่นๆ: Repack · ตัวอย่าง · ชำรุด · NCP', [
    ['ที่หน้า <b>จ่าย</b> กด + ใบใหม่ เลือกประเภทแถวล่าง เช่น <b>จ่ายไป Repack</b> (เลข 1) = ส่ง FG ให้ PD ไปรีแพค · ช่องที่มี * ต้องใส่ เช่น ผู้รับ / เหตุผล (เลข 2) · ติ๊กพาเลท แล้วกด <b>สร้างใบ + ยืนยันจ่าย</b> (เลข 3) <b>ยอดตัดทันที</b> ไม่ผ่าน Loading', '26-issue-rp'],
    ['งาน Repack เสร็จกลับเข้าคลัง: หน้าแรก → <b>รับคืน / รับเข้าอื่น</b> เลือก <b>รับเข้างานรีแพค</b> (เลข 1) ใส่สินค้า Lot จำนวน ช่องเก็บ แล้วกดรับเข้า · ของเป็น FG', '26b-recv-rp'],
    ['<b>จ่ายให้ PD (เบิกเข้า Process)</b> จ่ายได้เฉพาะ WIP / SEMI / HOLD · ส่ง FG ไปรีแพคใช้ <b>จ่ายไป Repack</b> · <b>จ่ายไป NCP</b> เฉพาะ admin / WH-admin']]],
  ['8. สถานะของ: HOLD · WIP · SEMI · เปลี่ยนสถานะ', [
    ['<b>FG</b> = ของสำเร็จรูป พร้อมขาย (คลัง WH-FG) · <b>HOLD</b> = <b>FG ที่รอผลตรวจคุณภาพ</b> ห้ามจ่าย / ขาย เช่น โปรตีนต่ำ / fat ต่ำ รอผล Wet Lab (คลัง WH-WIP) · <b>WIP</b> = <b>สินค้าระหว่างกระบวนการ</b> ไม่ใช่ของขาย เช่น รอคัด · รอ redry · รอร่อน · รอเทละลาย · กระสอบชำรุด (คลัง WH-WIP เดียวกับ HOLD) · <b>SEMI</b> = สินค้ากึ่งสำเร็จรูป มีคลังของตัวเอง (WH-SEMI) · จากแอปแพค (3 พ.ย.): HOLD ของแพค → HOLD · WIP ของแพค → WIP · Excel ทีม: ชีต WIP_* = WIP · SEMI_* = SEMI'],
    ['หน้าแรก → <b>เปลี่ยนสถานะ</b> (admin) มี 3 แบบ (เลข 1): <b>QC ปล่อย Hold</b> = HOLD → FG (ผล QC ผ่าน) / WIP / SEMI · <b>ย้ายเป็น Hold</b> = ส่งตรวจคุณภาพ · <b>เปลี่ยน FG ⇄ WIP/SEMI</b> เช่น FG กระสอบชำรุด → WIP หรือ WIP คัดเสร็จ → FG · เลือกสถานะใหม่ (เลข 2) · เป็น WIP ต้องเลือกกลุ่ม (เลข 3)', '27-status-ch'],
    ['เลือกช่องเก็บใหม่ (เลข 1): <b>ย้ายคลัง</b> (ไป / ออกจาก FG หรือ SEMI) ต้องเลือก · Hold ⇄ WIP คลังเดียวกัน ไม่เลือก = อยู่ช่องเดิม · แตะเหตุผล หรือพิมพ์เอง (เลข 2) <b>ทุกแบบต้องมีเหตุผล</b>', '27b-status-go'],

  ['9. รหัสสินค้า (ใช้ร่วมกับแอปแพค)', [

    ['แก้ชื่อ / น้ำหนักมีผลกับพาเลทที่รับใหม่ ของเดิมในคลังไม่เปลี่ยน · <b>ยกเลิกรหัสนี้</b> ทำได้เมื่อไม่มีของรหัสนั้นในคลังแล้ว (เปิดใช้อีกครั้งได้) · รหัสที่ทีมแพคเพิ่มในแอปแพค ขึ้นในหน้านี้เอง · <b>WIP ไม่มีรหัสแยก</b> ใช้รหัส FG / SEMI แล้วสถานะพาเลทเป็น WIP']]],
  ['10. ดูของในคลัง + Stock card', [

  ['12. รายงาน (แบบ Access) Excel / PDF', [

    ['<b>รูปสรุปส่ง LINE</b> (หน้าแรก → ปุ่ม รูปสรุปส่ง LINE): เลือกวัน ระบบทำรูป 3 รูป = 1 คงคลังแยกคลัง / PET-FISH / Domestic-Export-Hold · 2 รับ-จ่าย-โหลดประจำวัน + รถที่โหลด · 3 Hold ตามเหตุผล อายุสินค้า ใกล้หมดอายุ 10 อันดับ และเรื่องที่ต้องติดตาม · มือถือกด <b>แชร์</b> → LINE หรือกดค้างที่รูปแล้วบันทึก · <b>คัดลอกข้อความสรุป</b> ไว้วางคู่กับรูป'],

  ['13. เอกสาร / ฟอร์ม ISO', [

    ['จะเปิดหน้า A4 ตามฟอร์ม ISO พร้อมช่องเซ็นชื่อ · สั่งพิมพ์ หรือเลือก "บันทึกเป็น PDF"', '24-form-paper']]],
  ['14. ติดปัญหา ทำแบบนี้', [
    ['<b>ค้าง "กำลังโหลด" นาน</b> → ปิดแท็บ แล้วเปิดลิงก์ใหม่ ยังค้างอยู่ บอกแอดมิน'],
    ['<b>กด PIN ผิด 5 ครั้ง</b> → รอ 5 นาที แล้วลองใหม่ · <b>ลืม PIN</b> → บอกแอดมินกด รีเซ็ต PIN แล้วเข้าด้วย 0000'],
    ['<b>เด้ง "หมดเวลาเข้าใช้"</b> → แตะชื่อ ใส่ PIN เข้าใหม่'],
    ['<b>ไม่เห็นปุ่มงานที่ต้องทำ</b> → ยังไม่มีสิทธิ์ บอกแอดมินติ๊กให้ แล้วเข้าแอปใหม่'],
    ['<b>ข้อมูลไม่อัปเดต</b> → แอปดึงข้อมูลใหม่ทุกครั้งที่เปิดหน้า · กดปุ่ม <b>↻</b> มุมขวาบนเพื่อโหลดหน้าที่เปิดอยู่ใหม่ (เวลาข้างปุ่ม = โหลดล่าสุด) · ไม่ต้องปิดเปิดแอป'],
    ['<b>ไม่เห็นพาเลทที่จะรับ</b> → กด ↻ โหลดใหม่ ถ้ายังไม่มี แปลว่าทีมแพคยังไม่กดหยุดพาเลท'],
    ['<b>กดผิด รับผิด จ่ายผิด</b> → ห้ามกดซ้ำ · ใส่เลขที่ใบแจ้งรับ / ทะเบียน / ลูกค้า / จำนวนผิด admin หรือ WH-admin แก้ได้ (ข้อ 6) · ใบที่ยังรอโหลด ยกเลิกได้ที่หน้า Load'],
    ['<b>"รายการเกิน 7 วัน — ให้ admin เปิดสิทธิ์"</b> → admin เข้า ผู้ใช้และสิทธิ์ กด เปิด 1 / 8 / 24 ชม. แล้วแก้ · แก้เสร็จกด ปิดเลย'],
    ['<b>"ใส่เลขพาเลท + จำนวน … ก่อน"</b> → เป็นของที่ยังไม่มีเลขพาเลท ใส่เลขพาเลทจริงกับจำนวนในกล่องสีเหลืองให้ครบ · <b>"รวม … ไม่เท่ากับ"</b> → จำนวนที่ใส่รวมกันยังไม่ตรงยอด'],
    ['<b>"เวลารับต้องไม่ก่อนเวลาแพค"</b> → เลือกวันที่-เวลารับผิดวัน แก้เป็นเวลาหลังแพคเสร็จ หรือกด ใช้เวลาตอนนี้ · <b>"ย้อนหลังได้ไม่เกิน 7 วัน"</b> → เก่ากว่านั้นบอกแอดมิน'],
    ['<b>"ย้ายคลังไป … — เลือกช่องเก็บใหม่"</b> → เปลี่ยนสถานะข้ามคลัง (เช่น Hold → FG, WIP → SEMI) ต้องแตะช่องเก็บใหม่ · <b>"เลือกกลุ่ม WIP"</b> → แตะ ด้านคุณภาพ หรือ ด้านกายภาพ'],
    ['<b>หน้าแรกขึ้น "คลัง SEMI ยังใช้ช่องเก็บชั่วคราว"</b> (admin) → ใส่ช่องเก็บจริงของคลัง SEMI ในแท็บ Location ของไฟล์ BFL Stock (Warehouse = WH-SEMI) แล้วข้อความจะหายเอง'],
    ['<b>กล่องสีแดงเด้งขึ้นมา</b> = แอปบอกว่ายังทำไม่ได้ อ่านข้อความแล้วทำตาม เช่น "ใส่ทะเบียนรถ"']]],
  ['15. ถาม-ตอบ (Q&A)', [
    ['<b>ถาม: HOLD กับ WIP ต่างกันอย่างไร</b><br>ตอบ: HOLD = FG ที่รอผลตรวจคุณภาพ เช่น โปรตีนต่ำ / fat ต่ำ รอผล ห้ามจ่าย / ขาย (ต้องมีเหตุผล) · WIP = สินค้าระหว่างกระบวนการ เช่น รอคัด รอ redry รอร่อน รอเทละลาย เอาไปผลิต / แพคต่อ · ทั้งคู่อยู่คลัง WH-WIP · ยังรอผล Lab อยู่ = HOLD'],
    ['<b>ถาม: SEMI คืออะไร อยู่ที่ไหน</b><br>ตอบ: สินค้ากึ่งสำเร็จรูป (รหัสที่ตั้งเป็น SEMI) อยู่คลังของตัวเอง WH-SEMI แยกจาก WIP / Hold · เปลี่ยน WIP / Hold เป็น SEMI ต้องเลือกช่องใน WH-SEMI'],
    ['<b>ถาม: HOLD ตรวจโปรตีนผ่านแล้ว จะเป็น FG ทำอย่างไร</b><br>ตอบ: หน้าแรก → เปลี่ยนสถานะ → QC ปล่อย Hold → ปล่อยเป็น FG → เลือกช่องใน WH-FG → เหตุผล "ตรวจโปรตีนผ่าน" → ติ๊กพาเลท → กดเปลี่ยน (ข้อ 8) · พาเลทที่รับเป็น WIP ก่อน 3 พ.ย. แต่รอผลโปรตีน: ใช้ ย้ายเป็น Hold ก่อน'],
    ['<b>ถาม: FG กระสอบชำรุด จะเก็บเป็น WIP ทำอย่างไร</b><br>ตอบ: เปลี่ยนสถานะ → เปลี่ยน FG ⇄ WIP/SEMI → เปลี่ยนเป็น WIP → กลุ่ม ด้านกายภาพ → ช่องใน WH-WIP → เหตุผล "กระสอบชำรุด" → ติ๊กพาเลท → กดเปลี่ยน · ถ้าจะส่ง PD รีแพคเลย ใช้ จ่ายไป Repack (ข้อ 7)'],
    ['<b>ถาม: WIP ที่ทีมแพคทำ Return ไปแล้ว ต้องทำอะไร</b><br>ตอบ: หน้ารับจาก PD มีกล่องแดงด้านบน กด รับ + จ่ายออกให้ PD ทั้งหมด ครั้งเดียว ระบบรับเข้าและจ่ายให้ PD ทันที ไม่ค้างในคลัง'],
    ['<b>ถาม: ลืมกดรับ มาบันทึกทีหลัง เวลาจะผิดไหม</b><br>ตอบ: แก้ วันที่-เวลารับ เป็นเวลาที่รับจริง (ย้อนได้ 7 วัน ไม่ก่อนเวลาแพค) แล้วดู "เข้ายอดวันผลิต" ให้ถูกก่อนกด · ไม่ได้รับย้อนหลังจริง <b>ไม่ต้องแก้</b>'],
    ['<b>ถาม: วันผลิตนับอย่างไร</b><br>ตอบ: 08:00 ถึง 07:59 ของวันถัดไป · ของที่รับ 20/10 เวลา 06:30 = ยอดของวันผลิต 19/10 · รายงาน หน้าแรก และรูปสรุป LINE ใช้วันผลิตนี้'],
    ['<b>ถาม: ทีมแพคบอกว่าแพคแล้ว แต่ไม่เห็นในหน้ารับ</b><br>ตอบ: กด ↻ (ระบบเก็บรายการแพคไว้ 2 นาที ↻ ดึงใหม่ทันที) · ยังไม่ขึ้น = ทีมแพคยังไม่กดหยุดพาเลท · หรือมีคนรับไปแล้ว ดูที่ คงคลัง / Stock card ของ Lot นั้น'],
    ['<b>ถาม: ของยกมาจากนับ 17/10 (พาเลท OP…) ไม่มีเลขพาเลท</b><br>ตอบ: ตอนจ่าย / โหลด ใส่เลขพาเลทจริง + จำนวนในกล่องสีเหลือง · ใบที่จ่ายไปแล้วเติมทีหลังได้ที่หน้ารายละเอียดใบ (ข้อ 6)'],
    ['<b>ถาม: ส่ง FG ให้ PD ไปรีแพคใช้เมนูไหน</b><br>ตอบ: จ่ายออก → จ่ายไป Repack (ตัดยอดทันที) · กลับมาแล้วรับที่ รับคืน / รับเข้าอื่น → รับเข้างานรีแพค (ข้อ 7)'],

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // handled on change
  ev.preventDefault();
  try { (ACT[el.dataset.act] || (() => {}))(el.dataset.arg, el); } catch (e) { if (!/^need:/.test(e.message)) fail(e); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.matches('input[type=checkbox][data-act]')) (ACT[el.dataset.act] || (() => {}))(el.dataset.arg, el);
  if (el.dataset.in === 'uRole') { S.f.edit.role = el.value; render(); }
  if (el.dataset.in === 'rcu') { S.f.rcu = el.value; render(); }
  if (el.dataset.date) { S.f[el.dataset.date] = el.value; if (el.dataset.date === 'from' && (!S.f.to || S.f.to < el.value)) S.f.to = el.value; load(S.view === 'lot' ? 'stock' : S.view); }
});
document.addEventListener('input', (ev) => {
  const el = ev.target, k = el.dataset.in;
  if (!k) return;
  if (k === 'cnt') { S.cnt[el.dataset.id] = el.value.replace(/[^\d.]/g, ''); return; }
  if (k === 'uName') { S.f.edit.name = el.value; return; }
  if (k === 'note') { S.f.note = el.value; return; }
  if (k === 'pq') { S.pick[el.dataset.id] = el.value.replace(/[^\d.]/g, ''); return; }
  if (k === 'tgn' || k === 'tgq') { S.tag[el.dataset.id][+el.dataset.i][k === 'tgn' ? 'no' : 'q'] = el.value.replace(k === 'tgn' ? /[^\d]/g : /[^\d.]/g, ''); return; }
  if (k === 'rat' || k === 'iat' || k === 'sat') { S.f[k] = el.value; const e = document.getElementById(k + 'Day'); if (e) e.textContent = atDay(k); return; }
  if (el.dataset.quiet) { S.f[k] = el.value; return; }
  S.f[k] = el.value; render();
});
// re-render after a count edit, but late enough that a tap on the button underneath still lands
document.addEventListener('focusout', (ev) => { const k = ev.target.dataset && ev.target.dataset.in; if (k === 'cnt' || k === 'pq' || k === 'tgn' || k === 'tgq') setTimeout(render, 200); });

(async function boot() {
  const hub = new URLSearchParams(location.search).get('hub');
  if (hub) {
    try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* ignore */ }
    try {
      const r = await rpc('stock_hub_login', { p_ticket: hub });
      if (!r || !r.ok) throw new Error((r && r.error) || 'Hub');
      S.token = r.token; S.me = r.me; store.set('bfl-stock', { token: r.token, me: r.me }); go('home'); return;
    } catch (e) { S.hubErr = 'เข้าจาก Hub ไม่สำเร็จ: ' + e.message; }
  }
  const s = store.get('bfl-stock');
  if (s && s.token) { S.token = s.token; S.me = s.me; go('home'); } else loadLogin();
})();
